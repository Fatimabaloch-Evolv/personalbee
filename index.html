        }
      }
    }

    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var told = it.source === 'told';
      var text = norm(it.text);
      var subj = norm(it.subject || '');
      var tags = norm((isArr(it.tags) ? it.tags : []).join(' '));
      var ev = norm((it.evidence || []).join(' '));
      var s = 0;

      if (!toks.length) {
        s = told ? 1.4 : 0.35;              // "what do you know about me"
      } else {
        for (var t = 0; t < toks.length; t++) {
          var tok = toks[t], hitAny = 0;
          if (subj) {
            if (subj === tok) { s += 3.4; hitAny = 1; }
            else if (tokenHit(subj, tok)) { s += 2.4; hitAny = 1; }
          }
          var th = tokenHit(text, tok);
          if (th) { s += 1.5 * th; hitAny = 1; }
          else if (text.indexOf(tok) !== -1) { s += 0.7; hitAny = 1; }
          if (tags && tokenHit(tags, tok)) { s += 1.2; hitAny = 1; }
          if (it.relation && norm(it.relation) === tok) { s += 2.6; hitAny = 1; }
          if (KIND_WORDS[tok] && KIND_WORDS[tok] === it.kind) { s += 1.0; hitAny = 1; }
          if (!hitAny) {
            var grp = synGroup(stemWord(tok)) || synGroup(tok);
            if (grp) {
              for (var g = 0; g < grp.length; g++) {
                var gw = grp[g];
                if (subj === gw) { s += 1.9; break; }
                if (tokenHit(text, gw) || (tags && tokenHit(tags, gw)) || (it.relation && norm(it.relation) === gw)) { s += 1.1; break; }
              }
            }
          }
          if (ev && tokenHit(ev, tok)) s += 0.25;
        }
        if (nq.length > 5 && text.indexOf(nq) !== -1) s += 1.6;
      }

      if (s <= 0) continue;
      if (toks.length && !namesPerson && it.kind !== 'person') s += 0.45;
      s += (told ? 1.3 : 0) + (it.confidence || 0) * 0.5;
      s += clamp(1 - (((+now()) - ts(it.statedAt || it.lastSeen)) / (14 * DAY)), 0, 1) * 0.3;
      results.push({ it: it, s: s });
    }

    results.sort(function (a, b) { return b.s - a.s; });
    var limit = opts.limit || 8;
    var out = [];
    for (var r = 0; r < results.length && out.length < limit; r++) {
      var c = clone(results[r].it);
      c.score = Math.round(results[r].s * 100) / 100;
      c.said = results[r].it.source === 'told';
      out.push(c);
    }
    return out;
  }

  /* --- about() / subjects() / forgetAbout() -------------------------------- */

  function subjectMatches(it, want) {
    if (!it) return false;
    var s = norm(it.subject || '');
    if (!s && !it.relation) return false;
    if (s === want) return true;
    if (it.relation && norm(it.relation) === want) return true;
    if (isArr(it.tags) && it.tags.indexOf(want) !== -1) return true;
    if (s && want.length > 2 && (s.indexOf(want) === 0 || want.indexOf(s) === 0)) return true;
    return false;
  }

  function about(subject) {
    expireUnsaved();
    var want = normSubject(subject);
    if (!want) return [];
    var out = [];
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var hit = subjectMatches(it, want);
      if (!hit && want !== 'you' && want.length > 2 && norm(it.text).indexOf(want) !== -1) hit = true;
      if (hit) out.push(it);
    }
    out.sort(function (a, b) {
      var w = function (x) { return (x.source === 'told' ? 2 : 0) + (x.confidence || 0); };
      return w(b) - w(a);
    });
    var res = [];
    for (var j = 0; j < out.length; j++) res.push(clone(out[j]));
    return res;
  }

  function subjectsApi() {
    expireUnsaved();
    var map = {}, order = [];
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.source !== 'told' || !it.subject) continue;
      var k = it.subject;
      if (!map[k]) {
        map[k] = { subject: k, label: subjectLabel(it), relation: it.relation || null,
                   kinds: [], count: 0, lastAt: it.statedAt || it.lastSeen };
        order.push(k);
      }
      map[k].count++;
      if (map[k].kinds.indexOf(it.kind) === -1) map[k].kinds.push(it.kind);
      if (!map[k].relation && it.relation) {
        map[k].relation = it.relation;
        map[k].label = subjectLabel(it);
      }
      if (ts(it.statedAt || it.lastSeen) > ts(map[k].lastAt)) map[k].lastAt = it.statedAt || it.lastSeen;
    }
    var out = [];
    for (var j = 0; j < order.length; j++) out.push(map[order[j]]);
    // Her first, then the people in her life, then everything else.
    var tier = function (s) {
      if (s.subject === 'you') return 0;
      if (s.relation || s.kinds.indexOf('person') !== -1) return 1;
      return 2;
    };
    out.sort(function (a, b) {
      return tier(a) - tier(b) || b.count - a.count || ts(b.lastAt) - ts(a.lastAt);
    });
    return out;
  }

  function subjectLabel(it) {
    var s = it && it.subject ? it.subject : '';
    if (!s || s === 'you') return 'You';
    var base = (it && it.label) ? it.label : (labelFor(s) || titleName(s));
    if (it && it.relation && norm(it.relation) !== s) return base + ' — your ' + it.relation;
    return base;
  }

  function forgetAbout(subject) {
    var want = normSubject(subject);
    if (!want) return 0;
    var n = 0;
    for (var i = items.length - 1; i >= 0; i--) {
      var it = items[i];
      var hit = subjectMatches(it, want);
      if (!hit && want.length > 2 && norm(it.text).indexOf(want) !== -1) hit = true;
      if (!hit) continue;
      meta.suppressed[it.id] = iso(new Date((+now()) + SUPPRESS_MS));
      delete meta.announced[it.id];
      meta.forgetLog.push({ at: iso(now()), kind: it.kind, by: 'you' });
      items.splice(i, 1);
      n++;
    }
    if (n) {
      meta.expiredCount += n;
      if (meta.forgetLog.length > 60) meta.forgetLog = meta.forgetLog.slice(-60);
      persistNow();
      safe(function () { bus().emit('memory:forgotten', { count: n, reason: 'user' }); });
      repaint();
    }
    return n;
  }

  /* ---------------------------------------------------------------------- *
   * 6. observe() — subscribe to everything, learn from everything.
   * ---------------------------------------------------------------------- */

  function observe(event, payload) {
    if (!event) return;
    payload = payload || {};
    if (meta && meta.erased && event !== 'data:erased') { /* still learn — she came back */ }

    var at = safe(function () {
      var a = payload.at || payload.createdAt;
      var d = a ? new Date(a) : now();
      return isNaN(+d) ? now() : d;
    }, now());
    var h = at.getHours();

    switch (event) {
      case 'chat:user': onUserMessage(payload, at, h); markActivity(at, h); break;
      case 'chat:bee': sig.reply.lastBeeAt = iso(at); break;
      case 'reminder:created': onReminderCreated(payload, at, h); markActivity(at, h); break;
      case 'reminder:completed': onReminderCompleted(payload, at); markActivity(at, h); break;
      case 'reminder:fired': onReminderFired(payload, at); break;
      case 'photo:added': onPhoto(payload, at, h); markActivity(at, h); break;
      case 'screen:changed': bump(sig.screens, payload.id || 'unknown'); break;
      case 'permission:granted': sig.perms.granted++; break;
      case 'permission:denied': sig.perms.denied++; break;
      case 'airplane:changed': if (payload.on) sig.airplane++; break;
      case 'data:erased': hardErase(); return;
      default: break;
    }

    checkStaleFired();
    derive();
    persist();
    repaint();
  }

  function markActivity(at, h) {
    bump(sig.hours, h);
    bump(sig.days, dayKey(at));
    sig.total++;
    if (!sig.firstAt) sig.firstAt = iso(at);
    sig.lastAt = iso(at);
    if (h >= 23 || h < 4) {
      sig.lateNights.push(iso(at));
      if (sig.lateNights.length > 24) sig.lateNights = sig.lateNights.slice(-24);
    }
  }

  function onUserMessage(p, at, h) {
    var text = String(p.text || '');
    if (!text.trim()) return;
    var m = sig.msg;
    var len = text.length;
    var late = (h >= 23 || h < 4);

    m.n++; m.totalLen += len;
    if (/!/.test(text)) m.bangs++;
    if (/\?/.test(text)) m.questions++;
    if (/\.\.\.|…/.test(text)) m.ellipses++;
    if (text === text.toLowerCase() && /[a-z]/.test(text)) m.lower++;
    if (/[\uD800-\uDBFF]/.test(text)) m.emoji++;
    if (/\b(thanks|thank you|ty|appreciate)\b/i.test(text)) m.thanks++;
    if (late) { m.lateN++; m.lateLen += len; }

    m.recent.push({ len: len, at: iso(at), hour: h, bang: /!/.test(text), q: /\?/.test(text), dots: /\.\.\.|…/.test(text) });
    if (m.recent.length > 24) m.recent = m.recent.slice(-24);

    // reply latency to BEE
    if (sig.reply.lastBeeAt) {
      var d = +at - ts(sig.reply.lastBeeAt);
      if (d > 0 && d < 15 * MIN) { sig.reply.n++; sig.reply.totalMs += d; }
      sig.reply.lastBeeAt = null;
    }

    harvestWords(text);
    harvestPeople(text);

    // The difference between a usage tracker and an assistant: listen to the
    // words, not just the timestamps.
    safe(function () { learn(text, { at: at, via: 'chat' }); });
  }

  // People and brands are counted separately — don't let them also masquerade
  // as "topics", or BEE tells her that "priya" is an interest of hers.
  var _nameSet = null;
  function nameTokens() {
    if (_nameSet) return _nameSet;
    var K = kb();
    if (!K) return {};              // don't cache until kb is really there
    _nameSet = {};
    safe(function () {
      var push = function (s) {
        String(s || '').toLowerCase().split(/\s+/).forEach(function (p) { if (p.length > 2) _nameSet[p] = true; });
      };
      (isArr(K.contacts) ? K.contacts : []).forEach(function (c) { if (c) { push(c.name); push(c.nickname); } });
      (isArr(K.brands) ? K.brands : []).forEach(function (b) { if (b) push(b.name); });
      (isArr(K.places) ? K.places : []).forEach(function (p) { if (p) push(p.name); });
    });
    return _nameSet;
  }

  function harvestWords(text) {
    var toks = String(text).toLowerCase().replace(/[^a-z' ]/g, ' ').split(/\s+/);
    var names = nameTokens();
    var seen = {};
    for (var i = 0; i < toks.length; i++) {
      var w = toks[i].replace(/'s$/, '');
      if (w.length < 4 || STOPSET[w] || seen[w] || names[w]) continue;
      seen[w] = true;
      var label = LEXICON[w] || w;
      bump(sig.words, label);
    }
    // keep the ledger small and honest — drop the long tail
    if (countKeys(sig.words) > 70) {
      var keep = topEntries(sig.words, 1, 40), next = {};
      for (var j = 0; j < keep.length; j++) next[keep[j][0]] = keep[j][1];
      sig.words = next;
    }
  }

  function harvestPeople(text) {
    var K = kb(); if (!K) return;
    var low = ' ' + String(text).toLowerCase() + ' ';
    safe(function () {
      var cs = isArr(K.contacts) ? K.contacts : [];
      for (var i = 0; i < cs.length; i++) {
        var c = cs[i]; if (!c) continue;
        var names = [c.name, c.nickname];
        for (var j = 0; j < names.length; j++) {
          var n = names[j]; if (!n || String(n).length < 3) continue;
          var first = String(n).split(/\s+/)[0].toLowerCase();
          if (low.indexOf(' ' + first) !== -1) { bump(sig.people, c.name || first); break; }
        }
      }
      var bs = isArr(K.brands) ? K.brands : [];
      for (var b = 0; b < bs.length; b++) {
        var br = bs[b]; if (!br || !br.name) continue;
        if (low.indexOf(String(br.name).toLowerCase()) !== -1) bump(sig.brands, br.name);
      }
    });
  }

  function onReminderCreated(r, at, h) {
    sig.rem.created++;
    bump(sig.createHours, h);
    if (r && r.text) harvestWords(r.text);
    if (r && r.text) harvestPeople(r.text);
  }

  function onReminderFired(r, at) {
    sig.rem.fired++;
    if (r && r.id) sig.rem.pendingFired[r.id] = iso(at);
  }

  function onReminderCompleted(r, at) {
    sig.rem.completed++;
    if (r && r.id && sig.rem.pendingFired[r.id]) {
      var d = +at - ts(sig.rem.pendingFired[r.id]);
      if (d >= 0) {
        sig.rem.completionMs.push(d);
        if (sig.rem.completionMs.length > 20) sig.rem.completionMs = sig.rem.completionMs.slice(-20);
      }
      delete sig.rem.pendingFired[r.id];
    }
  }

  function onPhoto(p, at, h) {
    sig.photos.n++;
    bump(sig.photoHours, h);
    if (p && p.userNote) { sig.photos.withNote++; harvestWords(p.userNote); harvestPeople(p.userNote); }
  }

  // A reminder that fired and was never answered = it slid past her.
  function checkStaleFired() {
    var t = +now(), changed = false;
    for (var id in sig.rem.pendingFired) {
      if (!sig.rem.pendingFired.hasOwnProperty(id)) continue;
      if (t - ts(sig.rem.pendingFired[id]) > IGNORE_AFTER) {
        sig.rem.ignored++;
        delete sig.rem.pendingFired[id];
        changed = true;
      }
    }
    return changed;
  }

  // Reads the shared reminder store read-only for backlog. Never writes.
  function backlog() {
    return safe(function () {
      var rs = store().get('reminders', []);
      if (!isArr(rs)) return 0;
      var t = +now(), n = 0;
      for (var i = 0; i < rs.length; i++) {
        var r = rs[i];
        if (!r || r.completedAt) continue;
        if (r.due && ts(r.due) < t) n++;
      }
      return n;
    }, 0);
  }

  function daysObserved() {
    var n = countKeys(sig.days);
    return n || (sig.firstAt ? 1 : 0);
  }

  /* ---------------------------------------------------------------------- *
   * 7. derive() — turn raw signals into honest, human patterns.
   * ---------------------------------------------------------------------- */

  function derive() {
    if (!sig) return;
    var days = daysObserved();

    /* --- rhythm: late nights ------------------------------------------- */
    var late = sig.lateNights.length;
    if (late >= 2) {
      upsert('late-night', {
        kind: 'pattern',
        text: "You're often still going after midnight.",
        ask: "Are you usually up this late, or is this just a stretch?",
        confidence: confFor(late, 0.86),
        hits: late,
        evidence: sig.lateNights.slice(-4).map(function (s) {
          var d = new Date(s); return dowLabel(d) + ' ' + clockLabel(d) + ' — you were still up';
        })
      });
    }

    /* --- rhythm: early starts ------------------------------------------ */
    var early = 0, eh;
    for (eh = 5; eh <= 8; eh++) early += (sig.hours[eh] || 0);
    if (early >= 3) {
      upsert('early-start', {
        kind: 'pattern',
        text: "You're moving before 9 most mornings.",
        ask: "Do your mornings usually start this early?",
        confidence: confFor(early - 1, 0.8),
        hits: early
      });
    }

    /* --- rhythm: the window where she actually lives -------------------- */
    if (sig.total >= 8) {
      var w = activeWindow();
      if (w) {
        upsert('active-window', {
          kind: 'pattern',
          text: 'Most of your day with me happens between ' + hourLabel(w.start) + ' and ' + hourLabel(w.end) + '.',
          ask: 'Is ' + hourLabel(w.start) + ' to ' + hourLabel(w.end) + ' when you actually have hands free?',
          confidence: clamp(confFor(days, 0.78) * w.share + 0.15, 0, 0.78),
          hits: sig.total
        });
      }
    }

    /* --- reminder habits ------------------------------------------------ */
    var ch = topEntries(sig.createHours, 2, 1)[0];
    if (ch) {
      upsert('reminder-hour', {
        kind: 'pattern',
        text: 'You do your remembering around ' + hourLabel(+ch[0]) + ' — end-of-day brain dump.',
        ask: 'Is ' + hourLabel(+ch[0]) + ' when you dump everything out of your head?',
        confidence: confFor(ch[1], 0.8),
        hits: ch[1]
      });
    }

    if (sig.rem.ignored >= 2) {
      upsert('reminders-slide', {
        kind: 'pattern',
        text: 'Reminders that land mid-task tend to slide past you.',
        ask: 'Do reminders catch you at bad moments? I can move them later instead of repeating.',
        confidence: confFor(sig.rem.ignored, 0.75),
        hits: sig.rem.ignored,
        evidence: [sig.rem.ignored + ' reminders fired without an answer']
      });
    }

    if (sig.rem.completionMs.length >= 3) {
      var med = median(sig.rem.completionMs);
      if (med < 15 * MIN) {
        upsert('acts-fast', {
          kind: 'pattern',
          text: 'When something actually matters, you do it within minutes.',
          confidence: confFor(sig.rem.completionMs.length, 0.8),
          hits: sig.rem.completionMs.length,
          evidence: ['Usually done about ' + span(med) + ' after I nudge']
        });
      } else if (med > 3 * HOUR) {
        upsert('acts-later', {
          kind: 'pattern',
          text: 'You clear things in batches rather than the moment they ping.',
          ask: 'Would it help if I held small things and gave you them in one go?',
          confidence: confFor(sig.rem.completionMs.length, 0.72),
          hits: sig.rem.completionMs.length
        });
      }
    }

    /* --- how she writes ------------------------------------------------- */
    var m = sig.msg;
    if (m.n >= 3) {
      var avg = m.totalLen / m.n;
      if (avg > 140) {
        upsert('thinks-aloud', {
          kind: 'pattern',
          text: 'You think out loud with me — long messages, not commands.',
          confidence: confFor(m.n - 1, 0.76), hits: m.n
        });
      } else if (avg < 45) {
        upsert('short-form', {
          kind: 'pattern',
          text: 'You keep it short. I should too.',
          ask: 'Do you want me shorter? Your messages are, so I assume yes.',
          confidence: confFor(m.n - 1, 0.76), hits: m.n
        });
      }
    }
    if (m.lateN >= 2 && (m.lateLen / m.lateN) < 40) {
      upsert('late-clipped', {
        kind: 'pattern',
        text: 'Your messages get short after midnight — usually means you\'re running on empty.',
        ask: 'When you go quiet and clipped late at night, are you just tired?',
        confidence: confFor(m.lateN, 0.7), hits: m.lateN
      });
    }
    if (m.thanks >= 2) {
      upsert('says-thanks', {
        kind: 'fact',
        text: 'You say thank you to me. I noticed.',
        confidence: confFor(m.thanks, 0.7), hits: m.thanks
      });
    }

    /* --- what she keeps coming back to ---------------------------------- */
    var words = topEntries(sig.words, 3, 3);
    for (var i = 0; i < words.length; i++) {
      var w2 = words[i];
      upsert('topic-' + norm(w2[0]).replace(/ /g, '-'), {
        kind: 'pattern',
        text: capital(w2[0]) + ' keeps coming up with you.',
        ask: 'Is ' + w2[0] + ' a big thing right now, or just this week?',
        confidence: confFor(w2[1] - 1, 0.74), hits: w2[1],
        evidence: ['Mentioned ' + w2[1] + ' times']
      });
    }

    /* --- people ---------------------------------------------------------- */
    var people = topEntries(sig.people, 2, 2);
    for (var p = 0; p < people.length; p++) {
      var name = people[p][0], n = people[p][1];
      var rel = relationshipOf(name);
      // Only the top person gets the superlative — saying it about two people at once
      // reads as contradictory, and BEE claiming something plainly wrong costs more
      // trust than saying less.
      upsert('person-' + norm(name).replace(/ /g, '-'), {
        kind: 'fact',
        text: name + (rel ? ' (your ' + rel + ')' : '') +
          (p === 0 ? ' comes up more than anyone else.' : ' comes up a lot too.'),
        ask: 'Is ' + name.split(' ')[0] + ' someone I should always surface first?',
        confidence: confFor(n, 0.78), hits: n,
        evidence: ['Mentioned ' + n + ' times']
      });
    }

    var brandsTop = topEntries(sig.brands, 2, 1)[0];
    if (brandsTop) {
      upsert('brand-' + norm(brandsTop[0]).replace(/ /g, '-'), {
        kind: 'fact',
        text: brandsTop[0] + ' is taking up most of your work headspace.',
        confidence: confFor(brandsTop[1], 0.75), hits: brandsTop[1]
      });
    }

    /* --- moments --------------------------------------------------------- */
    var ph = topEntries(sig.photoHours, 2, 1)[0];
    if (ph && sig.photos.n >= 2) {
      upsert('photo-hour', {
        kind: 'pattern',
        text: 'You save moments around ' + hourLabel(+ph[0]) + '.',
        ask: 'Is ' + hourLabel(+ph[0]) + ' your wind-down, when you look back at the day?',
        confidence: confFor(ph[1], 0.72), hits: ph[1]
      });
    }
    if (sig.photos.n >= 3 && sig.photos.withNote / sig.photos.n > 0.7) {
      upsert('captions-own', {
        kind: 'preference',
        text: 'You write your own note on almost every photo — you want your words on it, not mine.',
        confidence: confFor(sig.photos.withNote, 0.82), hits: sig.photos.withNote
      });
    }

    /* --- showing up ------------------------------------------------------ */
    if (days >= 3) {
      upsert('checks-in', {
        kind: 'pattern',
        text: "You've checked in " + plural(days, 'day') + ' running.',
        confidence: confFor(days, 0.8), hits: days
      });
    }

    /* --- what she trusts me with ---------------------------------------- */
    if (sig.perms.denied >= 1 && sig.perms.denied >= sig.perms.granted) {
      upsert('cautious', {
        kind: 'preference',
        text: 'You say no to access unless the reason is obvious. I ask later, not upfront.',
        confidence: confFor(sig.perms.denied + 1, 0.8), hits: sig.perms.denied
      });
    }
    if (sig.airplane >= 1) {
      upsert('offline-comfort', {
        kind: 'preference',
        text: 'You like knowing you can cut me off from the network. Noted, permanently.',
        confidence: 0.7, hits: sig.airplane
      });
    }
  }

  function capital(s) { return String(s).charAt(0).toUpperCase() + String(s).slice(1); }

  function relationshipOf(name) {
    var K = kb(); if (!K || !isArr(K.contacts)) return null;
    for (var i = 0; i < K.contacts.length; i++) {
      if (K.contacts[i] && K.contacts[i].name === name) return K.contacts[i].relationship || null;
    }
    return null;
  }

  // Smallest contiguous hour window holding ~70% of activity.
  function activeWindow() {
    var h = [], total = 0, i;
    for (i = 0; i < 24; i++) { h[i] = sig.hours[i] || 0; total += h[i]; }
    if (total < 4) return null;
    var best = null;
    for (var w = 3; w <= 12; w++) {
      for (var s = 0; s < 24; s++) {
        var sum = 0;
        for (i = 0; i < w; i++) sum += h[(s + i) % 24];
        var share = sum / total;
        if (share >= 0.65) {
          if (!best || w < best.w) best = { start: s, end: (s + w) % 24, w: w, share: share };
          break;
        }
      }
      if (best) break;
    }
    return best;
  }

  /* ---------------------------------------------------------------------- *
   * 8. Seeding from the knowledge base
   * ---------------------------------------------------------------------- */

  function seedFromKB() {
    var K = kb();
    if (!K || meta.seeded || meta.erased) return;
    var added = 0;

    safe(function () {
      var seeds = isArr(K.seedMemories) ? K.seedMemories : [];
      for (var i = 0; i < seeds.length; i++) {
        var s = seeds[i]; if (!s || !s.text) continue;
        var id = 'k:' + (s.id || uid());
        if (byId(id) || isSuppressed(id)) continue;
        var c = typeof s.confidence === 'number' ? s.confidence : 0.6;
        // Seeds whose provenance is literally "you told me" are her words, not
        // my guesses — they belong on the told side of the screen.
        var said = /you told me/i.test(String(s.source || ''));
        var made = makeItem({
          id: id, kind: s.kind || 'fact', text: String(s.text),
          confidence: c, source: said ? 'told' : 'seed',
          firstSeen: s.at || iso(now()), lastSeen: s.at || iso(now()),
          saved: said || c >= 0.75,   // things she said plainly, I keep; the rest still expires
          evidence: s.source ? ['From ' + s.source] : []
        });
        if (said) {
          made.statedAt = s.at || iso(now());
          made.subject = seedSubject(made.text);
          made.relation = seedRelation(made.subject);
          made.label = seedLabel(made.subject);
          made.slot = 'gen';
          made.tags = words(made.text, 8);
        }
        items.push(made);
        added++;
      }
    });

    safe(function () {
      var rs = isArr(K.routines) ? K.routines : [];
      for (var i = 0; i < rs.length; i++) {
        var r = rs[i]; if (!r || !r.label) continue;
        var id = 'k:routine-' + (r.id || i);
        if (byId(id) || isSuppressed(id)) continue;
        var c = typeof r.confidence === 'number' ? r.confidence : 0.5;
        items.push(makeItem({
          id: id, kind: 'pattern',
          text: capital(r.label) + (r.time ? ', usually around ' + prettyTime(r.time) : '') +
                (r.days && r.days.length ? ' on ' + dayList(r.days) : '') + '.',
          ask: 'Do you still do ' + lower(r.label) + (r.time ? ' around ' + prettyTime(r.time) : '') + '?',
          confidence: c, source: 'kb', saved: c >= 0.8,
          evidence: ['A rhythm I picked up from your weeks']
        }));
        added++;
      }
    });

    safe(function () {
      var p = K.preferences || {};
      var push = function (id, text, c, kind) {
        var fid = 'k:pref-' + id;
        if (byId(fid) || isSuppressed(fid) || !text) return;
        items.push(makeItem({ id: fid, kind: kind || 'preference', text: text, confidence: c, source: 'kb', saved: c >= 0.75 }));
        added++;
      };
      if (p.doNotDisturb && p.doNotDisturb.from) {
        push('dnd', "You'd rather I stay quiet between " + prettyTime(p.doNotDisturb.from) + " and " +
          prettyTime(p.doNotDisturb.to) + '. I hold everything until then.', 0.85);
      }
      if (p.coffee) push('coffee', 'Coffee: ' + p.coffee + '.', 0.7);
      if (p.skinType) push('skin', 'Your skin runs ' + p.skinType + ' — I keep that in mind on product stuff.', 0.7);
      if (isArr(p.contentPillars) && p.contentPillars.length) {
        push('pillars', 'Your content lives around ' + list(p.contentPillars) + '.', 0.75);
      }
      if (isArr(p.postingDays) && p.postingDays.length) {
        push('posting', 'You post on ' + dayList(p.postingDays) + '.', 0.7);
      }
      if (isArr(p.dislikes) && p.dislikes.length) {
        push('dislikes', "Things you'd rather I never suggest: " + list(p.dislikes) + '.', 0.8);
      }
      if (isArr(p.comfortFoods) && p.comfortFoods.length) {
        push('comfort', 'On a bad day: ' + list(p.comfortFoods) + '.', 0.65);
      }
      if (p.commute) push('commute', 'Getting anywhere in LA: ' + p.commute + '.', 0.6);
    });

    meta.seeded = true;
    if (added) persistNow();
  }

  function lower(s) { return String(s).charAt(0).toLowerCase() + String(s).slice(1); }
  function article(s) { return /^[aeiou]/i.test(String(s).trim()) ? 'an ' : 'a '; }
  function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }
  function list(a) {
    a = (a || []).map(String);
    if (a.length <= 1) return a[0] || '';
    return a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
  }
  function dayList(days) {
    var names = ['Sundays', 'Mondays', 'Tuesdays', 'Wednesdays', 'Thursdays', 'Fridays', 'Saturdays'];
    var out = [];
    for (var i = 0; i < days.length; i++) {
      if (typeof days[i] === 'number' && names[days[i]]) out.push(names[days[i]]);
      else if (typeof days[i] === 'string') out.push(days[i]);
    }
    if (out.length === 5 && days.indexOf(0) === -1 && days.indexOf(6) === -1) return 'weekdays';
    if (out.length === 7) return 'every day';
    return list(out);
  }
  function prettyTime(hhmm) {
    if (!hhmm) return '';
    var m = String(hhmm).match(/^(\d{1,2}):(\d{2})/);
    if (!m) return String(hhmm);
    var h = +m[1], mm = m[2];
    var ampm = h < 12 ? 'am' : 'pm', hh = h % 12; if (hh === 0) hh = 12;
    return hh + (mm === '00' ? '' : ':' + mm) + ampm;
  }

  /* ---------------------------------------------------------------------- *
   * 9. traits() — a friend describing her, not a dashboard.
   * ---------------------------------------------------------------------- */

  function traits() {
    expireUnsaved();
    var K = kb(), prof = (K && K.profile) || {};
    var days = daysObserved();
    var evidence = sig.total + sig.msg.n;
    var thin = evidence < 8;

    /* active hours */
    var w = activeWindow();
    var wake = prof.wakeTime ? +String(prof.wakeTime).split(':')[0] : null;
    var sleep = prof.sleepTime ? +String(prof.sleepTime).split(':')[0] : null;
    var ah = {
      start: w ? w.start : (wake != null ? wake : 9),
      end: w ? w.end : (sleep != null ? sleep : 23),
      peak: (topEntries(sig.hours, 1, 1)[0] ? +topEntries(sig.hours, 1, 1)[0][0] : null),
      lateNights: sig.lateNights.length,
      source: w ? 'observed' : (wake != null ? 'told' : 'assumed'),
      confidence: w ? clamp(confFor(days, 0.8), 0, 0.8) : (wake != null ? 0.55 : 0.2)
    };
    ah.label = hourLabel(ah.start) + ' to ' + hourLabel(ah.end);
    ah.sentence = (ah.confidence < 0.5 ? 'I think ' : '') +
      'her day runs ' + ah.label +
      (ah.source === 'told' ? " — going by what she told me, not what I've watched" : '') +
      (ah.lateNights >= 2 ? ", and she stretches past midnight more than she'd admit" : '');

    /* tone */
    var m = sig.msg, avg = m.n ? m.totalLen / m.n : 0;
    var tone = { label: 'still learning', confidence: 0.15, why: "I haven't seen enough of how you write yet." };
    if (m.n >= 3) {
      var bangRate = m.bangs / m.n, lowRate = m.lower / m.n, dotRate = m.ellipses / m.n;
      if (bangRate > 0.4) tone = { label: 'warm and quick', confidence: confFor(m.n - 1, 0.72), why: 'You use exclamation marks in most messages.' };
      else if (dotRate > 0.35) tone = { label: 'measured, a little heavy', confidence: confFor(m.n - 2, 0.62), why: 'Lots of trailing dots — you leave sentences open.' };
      else if (lowRate > 0.7 && avg < 60) tone = { label: 'casual, unbothered', confidence: confFor(m.n - 1, 0.7), why: 'All lowercase, short — you type to me like a friend, not a tool.' };
      else if (avg > 140) tone = { label: 'open, thinks out loud', confidence: confFor(m.n - 2, 0.7), why: 'Your messages run long.' };
      else tone = { label: 'even, matter-of-fact', confidence: confFor(m.n - 2, 0.6), why: 'Plain sentences, no decoration.' };
      if (K && prof.voice && prof.voice.tone) tone.why += ' You also told me you like ' + prof.voice.tone + '.';
    }
    tone.sentence = tone.confidence < 0.5
      ? 'She might be ' + tone.label + ' — too early for me to say'
      : "she's " + tone.label;

    /* pace */
    var perDay = days ? (sig.total / days) : 0;
    var pace = { label: 'unclear', confidence: 0.15, why: 'Not enough days yet.' };
    if (days >= 2) {
      if (perDay >= 8 || sig.rem.created >= 6) pace = { label: 'full-throttle', confidence: confFor(days, 0.7), why: Math.round(perDay) + ' things a day on average, and ' + sig.rem.created + ' reminders set.' };
      else if (perDay >= 3) pace = { label: 'busy but holding it', confidence: confFor(days, 0.68), why: 'Steady traffic through the day.' };
      else pace = { label: 'unhurried', confidence: confFor(days, 0.55), why: 'You dip in a few times, not constantly.' };
    }
    pace.sentence = pace.confidence < 0.5 ? 'her pace is still a guess to me' : 'her pace is ' + pace.label;

    /* stress signals */
    var stress = [];
    if (sig.lateNights.length >= 2) stress.push({ label: 'short nights', why: 'Active after midnight ' + sig.lateNights.length + ' times.', severity: clamp(sig.lateNights.length / 5, 0.2, 1) });
    var back = backlog() + countKeys(sig.rem.pendingFired);
    if (back >= 2) stress.push({ label: 'a backlog building', why: back + ' things sitting unfinished.', severity: clamp(back / 6, 0.2, 1) });
    if (sig.rem.ignored >= 2) stress.push({ label: 'nudges going unanswered', why: sig.rem.ignored + ' reminders fired with no reply.', severity: clamp(sig.rem.ignored / 5, 0.2, 1) });
    if (m.lateN >= 2 && (m.lateLen / m.lateN) < 40) stress.push({ label: 'clipped late-night replies', why: 'Your words get shorter after midnight.', severity: 0.5 });
    if (sig.rem.created >= 4 && sig.rem.completed === 0) stress.push({ label: 'piling up, clearing none', why: 'Plenty set, nothing ticked off yet.', severity: 0.6 });

    /* interests */
    var interests = [];
    var wordTop = topEntries(sig.words, 2, 5);
    for (var i = 0; i < wordTop.length; i++) {
      interests.push({ label: wordTop[i][0], weight: wordTop[i][1], confidence: confFor(wordTop[i][1] - 1, 0.75), source: 'observed' });
    }
    safe(function () {
      var pil = (K && K.preferences && K.preferences.contentPillars) || [];
      for (var j = 0; j < pil.length && interests.length < 6; j++) {
        var lbl = String(pil[j]);
        var dup = false;
        for (var q = 0; q < interests.length; q++) if (norm(interests[q].label) === norm(lbl)) { dup = true; interests[q].source = 'told+observed'; interests[q].confidence = clamp(interests[q].confidence + 0.15, 0, 0.9); }
        if (!dup) interests.push({ label: lbl, weight: 1, confidence: 0.6, source: 'told' });
      }
    });
    interests.sort(function (a, b) { return (b.confidence * b.weight) - (a.confidence * a.weight); });
    interests = interests.slice(0, 5);

    /* responsiveness */
    var replyAvg = sig.reply.n ? sig.reply.totalMs / sig.reply.n : null;
    var doneRate = sig.rem.fired ? sig.rem.completed / sig.rem.fired : null;
    var resp = { label: 'unknown', score: 0.5, confidence: 0.15, why: "I haven't nudged you enough to know." };
    if (replyAvg != null || doneRate != null) {
      var score = 0.5;
      if (replyAvg != null) score = clamp(1 - (replyAvg / (10 * MIN)), 0, 1);
      if (doneRate != null) score = (replyAvg != null) ? (score * 0.5 + doneRate * 0.5) : doneRate;
      var whyBits = [];
      if (replyAvg != null) whyBits.push('you usually answer within ' + span(replyAvg));
      if (doneRate != null) whyBits.push('you finish about ' + Math.round(doneRate * 100) + ' out of 100 things I fire');
      resp = {
        label: score > 0.7 ? 'right there' : score > 0.4 ? 'gets to it eventually' : 'answers on her own time',
        score: score,
        confidence: clamp(confFor((sig.reply.n || 0) + (sig.rem.fired || 0), 0.75), 0.15, 0.75),
        why: capital(whyBits.join(', and ')) + '.'
      };
    }
    resp.sentence = resp.confidence < 0.5 ? "I can't tell yet how fast she comes back to me" : "when I ping her she's " + resp.label;

    /* the friend-paragraph */
    var name = prof.name ? String(prof.name).split(' ')[0] : null;
    var subject = name || 'She';
    var sentences = [];
    var opening = prof.occupation
      ? subject + "'s " + article(lower(prof.occupation)) + lower(prof.occupation) +
        (prof.city ? ' in ' + prof.city : '') + '.'
      : '';
    var rhythm = ah.confidence >= 0.4
      ? capital(ah.sentence) + '.'
      : (opening ? "I don't have her daily rhythm down yet." : subject + " keeps hours I haven't worked out yet.");
    sentences.push([opening, rhythm].join(' ').trim());
    if (tone.confidence >= 0.3) sentences.push('In how she talks to me, ' + tone.sentence + '. ' + tone.why);
    if (pace.confidence >= 0.3) sentences.push(capital(pace.sentence) + '. ' + pace.why);
    if (interests.length) sentences.push('What she keeps circling back to: ' + list(interests.slice(0, 3).map(function (x) { return x.label; })) + '.');
    if (stress.length) sentences.push('Right now the thing I\'d watch is ' + stress[0].label + ' — ' + lower(stress[0].why));
    if (resp.confidence >= 0.3) sentences.push(capital(resp.sentence) + '.');
    if (thin) sentences.push("All of that is early. I've been paying attention for " + plural(days || 1, 'day') +
      ", which isn't long enough to be sure of anyone.");

    return {
      activeHours: ah,
      tone: tone,
      pace: pace,
      stressSignals: stress,
      topInterests: interests,
      responsiveness: resp,
      // extras for display and for the brain
      sentences: sentences,
      daysObserved: days,
      evidenceCount: evidence,
      thin: thin,
      confidence: clamp((ah.confidence + tone.confidence + pace.confidence + resp.confidence) / 4, 0, 0.85)
    };
  }

  /* ---------------------------------------------------------------------- *
   * 10. mood() — honest, low confidence early, reasoning always exposed.
   * ---------------------------------------------------------------------- */

  function mood() {
    var m = sig.msg;
    var n = now(), h = n.getHours();
    var reasons = [];
    var energy = 0;   // -1 flat .. +1 bright
    var load = 0;     // 0 calm .. 1 stretched
    var signals = 0;

    // recent message shape
    var recent = m.recent.slice(-6);
    if (recent.length >= 2) {
      signals++;
      var sum = 0, bangs = 0, dots = 0, qs = 0;
      for (var i = 0; i < recent.length; i++) {
        sum += recent[i].len;
        if (recent[i].bang) bangs++;
        if (recent[i].dots) dots++;
        if (recent[i].q) qs++;
      }
      var avg = sum / recent.length;
      if (avg < 35) { energy -= 0.25; load += 0.15; reasons.push('your last few messages have been short'); }
      else if (avg > 150) { energy += 0.1; reasons.push("you've been writing me proper paragraphs"); }
      if (bangs / recent.length > 0.4) { energy += 0.35; reasons.push('and punchy — exclamation marks'); }
      if (dots / recent.length > 0.35) { energy -= 0.3; reasons.push('with a lot of trailing dots'); }
      if (qs / recent.length > 0.5) { load += 0.15; reasons.push('and mostly questions'); }
    }

    // time of day
    if (h >= 0 && h < 5) { signals++; energy -= 0.3; load += 0.2; reasons.push("it's " + clockLabel(n) + " and you're still up"); }
    else if (h >= 5 && h < 8) { signals++; reasons.push("it's early"); }
    else if (h >= 22) { signals++; energy -= 0.1; reasons.push("it's late"); }

    // how much sleep she's been giving herself
    var recentLate = 0, cutoff = +n - 4 * DAY;
    for (var j = 0; j < sig.lateNights.length; j++) if (ts(sig.lateNights[j]) > cutoff) recentLate++;
    if (recentLate >= 2) { signals++; energy -= 0.3; load += 0.2; reasons.push("you've been up past midnight " + recentLate + ' times in the last few days'); }

    // backlog
    var back = backlog() + countKeys(sig.rem.pendingFired);
    if (back >= 2) { signals++; load += clamp(back / 5, 0.2, 0.6); reasons.push(back + ' things are sitting unfinished'); }
    else if (back === 0 && sig.rem.completed >= 2) { signals++; energy += 0.2; load -= 0.1; reasons.push("you've cleared everything you set"); }

    // burst of capture = a busy head
    if (sig.rem.created >= 3 && sig.rem.created - sig.rem.completed >= 3) {
      signals++; load += 0.2; reasons.push("you've been offloading a lot into me");
    }
    if (m.thanks >= 2) { energy += 0.05; }

    load = clamp(load, 0, 1);
    energy = clamp(energy, -1, 1);

    var label;
    if (load >= 0.55 && energy <= -0.15) label = 'stretched thin';
    else if (load >= 0.55) label = 'busy, but on top of it';
    else if (energy <= -0.45) label = 'running on empty';
    else if (energy <= -0.18) label = 'a bit flat';
    else if (energy >= 0.35) label = 'bright';
    else if (load <= 0.15 && signals >= 2) label = 'steady';
    else label = 'steady';

    // Confidence: genuinely low until there's history. This is the honesty rule.
    var days = daysObserved();
    var base = 0.1 + signals * 0.08 + Math.min(days, 6) * 0.05;
    var conf = clamp(base, 0.08, 0.72);
    if (sig.total + m.n < 6) conf = Math.min(conf, 0.3);
    if (signals <= 1) conf = Math.min(conf, 0.22);
    // A few days of watching is not enough to state how someone feels.
    // Below this bar mood() is always phrased as a question.
    if (days < 4) conf = Math.min(conf, 0.45);

    var why = reasons.length
      ? capital(reasons.slice(0, 3).join(', ')) + '.'
      : "Honestly, nothing to go on yet — this is a placeholder, not a read.";

    var line;
    if (conf < 0.5) {
      line = 'You might be ' + label + ' — am I close?';
      if (label === 'steady') line = 'Nothing looks off to me, but I could easily be missing it. How are you actually?';
    } else {
      line = 'You seem ' + label + ' right now.';
    }

    return {
      label: label,
      confidence: conf,
      why: why,
      // extras
      line: line,
      question: conf < 0.5,
      signals: reasons.slice(0, 4),
      energy: energy,
      load: load,
      at: iso(n)
    };
  }

  /* ---------------------------------------------------------------------- *
   * 11. Public collection API
   * ---------------------------------------------------------------------- */

  function score(it) {
    var age = (+now()) - ts(it.lastSeen);
    var recency = clamp(1 - (age / (5 * DAY)), 0, 1);
    return (it.confidence || 0) * 0.5 + recency * 0.3 + clamp((it.hits || 1) / 8, 0, 1) * 0.2;
  }

  function clone(it) {
    var c = {
      id: it.id, kind: it.kind, text: it.text, evidence: (it.evidence || []).slice(),
      confidence: it.confidence, firstSeen: it.firstSeen, lastSeen: it.lastSeen,
      hits: it.hits, saved: it.saved, source: it.source, ask: it.ask || null
    };
    // A thing she SAID is not a probability. Hand it out with no confidence
    // number at all, so nothing downstream can draw a meter against her own
    // words — the attribution is the provenance instead.
    if (it.source === 'told') {
      delete c.confidence;
      c.stated = true;
      c.certainty = 'stated';
    }
    // Conversational-memory fields. Only present on things she told me.
    if (it.subject) c.subject = it.subject;
    if (it.label) c.label = it.label;
    if (it.relation) c.relation = it.relation;
    if (it.slot) c.slot = it.slot;
    if (it.tags) c.tags = (it.tags || []).slice();
    if (it.statedAt) { c.statedAt = it.statedAt; c.attribution = attribution(it); }
    if (it.utterance) c.utterance = it.utterance;
    return c;
  }

  function itemsApi(filter) {
    expireUnsaved();
    var f = filter || {};
    if (typeof filter === 'string') f = { kind: filter };
    var out = [];
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (f.kind && it.kind !== f.kind) continue;
      if (f.source && it.source !== f.source) continue;
      if (typeof f.saved === 'boolean' && !!it.saved !== f.saved) continue;
      if (typeof f.minConfidence === 'number' && (it.confidence || 0) < f.minConfidence) continue;
      if (f.since && ts(it.lastSeen) < ts(f.since)) continue;
      if (f.q && norm(it.text).indexOf(norm(f.q)) === -1) continue;
      out.push(clone(it));
    }
    out.sort(function (a, b) { return score(b) - score(a); });
    if (f.limit) out = out.slice(0, f.limit);
    return out;
  }

  function get(id) { var it = byId(id); return it ? clone(it) : null; }

  function add(item) {
    if (!item || !item.text) return null;
    // Dedupe: if she's telling me something I already half-know, strengthen it.
    var n = norm(item.text);
    for (var i = 0; i < items.length; i++) {
      if (norm(items[i].text) === n) {
        return reinforce(items[i].id, item.evidence || 'You told me again.');
      }
    }
    var it = makeItem(item);
    items.push(it);
    announce(it);
    persistNow();
    repaint();
    return clone(it);
  }

  function forget(id, byUser) {
    var idx = -1;
    for (var i = 0; i < items.length; i++) if (items[i].id === id) { idx = i; break; }
    if (idx === -1) return false;
    var kind = items[idx].kind;
    items.splice(idx, 1);
    // Forgetting sticks. Don't re-notice the same thing tomorrow.
    meta.suppressed[id] = iso(new Date((+now()) + SUPPRESS_MS));
    delete meta.announced[id];
    meta.forgetLog.push({ at: iso(now()), kind: kind, by: byUser === false ? 'system' : 'you' });
    if (meta.forgetLog.length > 60) meta.forgetLog = meta.forgetLog.slice(-60);
    persistNow();
    safe(function () { bus().emit('memory:forgotten', { count: 1, reason: byUser === false ? 'system' : 'user' }); });
    repaint();
    return true;
  }

  function saveItem(id) {
    var it = byId(id);
    if (!it) return false;
    it.saved = true;
    it.lastSeen = iso(now());
    persistNow();
    repaint();
    return true;
  }

  function unsave(id) {
    var it = byId(id);
    if (!it) return false;
    it.saved = false;
    it.lastSeen = iso(now());
    persistNow();
    repaint();
    return true;
  }

  function reinforce(id, evidence) {
    var it = byId(id);
    if (!it) return null;
    it.hits = (it.hits || 1) + 1;
    it.lastSeen = iso(now());            // resets the forget clock
    it.confidence = clamp(Math.max(it.confidence || 0, confFor(it.hits, 0.92)), 0, 0.92);
    if (evidence) {
      var e = isArr(evidence) ? evidence : [String(evidence)];
      for (var i = 0; i < e.length; i++) if (it.evidence.indexOf(e[i]) === -1) it.evidence.push(String(e[i]));
      if (it.evidence.length > 6) it.evidence = it.evidence.slice(-6);
    }
    persistNow();
    repaint();
    return clone(it);
  }

  // The n most interesting recent observations, phrased in BEE's voice.
  function noticed(n) {
    expireUnsaved();
    n = n || 3;
    var pool = items.slice().sort(function (a, b) {
      // interesting = confident enough to matter, recent, and about her behaviour
      var bonus = function (x) { return (x.source === 'observed' ? 0.12 : 0) + (x.kind === 'pattern' ? 0.05 : 0); };
      return (score(b) + bonus(b)) - (score(a) + bonus(a));
    });
    var out = [];
    for (var i = 0; i < pool.length && out.length < n; i++) {
      var it = pool[i];
      if ((it.confidence || 0) < 0.25) continue;
      var c = clone(it);
      c.raw = it.text;
      c.text = voice(it);              // BEE's voice — question form when weak
      c.strength = it.source === 'told' ? 'you told me' : strength(it.confidence).word;
      c.caveat = caveat(it);
      c.expiresIn = it.saved ? null : span(msLeft(it));
      out.push(c);
    }
    return out;
  }

  /* ---------------------------------------------------------------------- *
   * 12. context(intent) — compact briefing for the brain. Under ~600 chars.
   * ---------------------------------------------------------------------- */

  var INTENT_HINTS = {
    'reminder.create': ['reminder-hour', 'reminders-slide', 'acts-fast', 'acts-later', 'late-night', 'dnd', 'active-window'],
    'reminder.list': ['reminders-slide', 'acts-later', 'active-window'],
    'reminder.complete': ['acts-fast', 'checks-in'],
    'reminder.snooze': ['reminders-slide', 'late-night'],
    'photo.note': ['captions-own', 'photo-hour'],
    'photo.recall': ['captions-own', 'photo-hour'],
    'schedule.query': ['active-window', 'early-start', 'routine'],
    'schedule.next': ['active-window', 'routine'],
    'contact.find': ['person-'],
    'brand.query': ['brand-'],
    'memory.recall': [],
    'smalltalk': ['late-night', 'topic-', 'says-thanks'],
    'gratitude': ['says-thanks']
  };

  // Words that make a TOLD fact relevant to the intent she's acting on.
  var INTENT_TOPICS = {
    'reminder.create': 'routine schedule work gym',
    'reminder.list': 'routine schedule',
    'schedule.query': 'routine schedule work gym',
    'schedule.next': 'routine schedule',
    'contact.find': 'person family friend manager',
    'brand.query': 'work company client',
    'photo.note': 'people family',
    'smalltalk': 'preference like hate food coffee'
  };

  function context(intent) {
    expireUnsaved();
    var hints = INTENT_HINTS[intent] || [];
    var hintToks = contentTokens((INTENT_TOPICS[intent] || '') + ' ' + (intent || '').replace(/\./g, ' '));

    var weigh = function (x) {
      var s = score(x);
      for (var i = 0; i < hints.length; i++) if (x.id.indexOf(hints[i]) !== -1) { s += 0.5; break; }
      return s;
    };

    // Told facts first. What she actually said outranks anything I inferred.
    var toldRanked = [], inferred = [];
    for (var a = 0; a < items.length; a++) {
      (items[a].source === 'told' ? toldRanked : inferred).push(items[a]);
    }
    toldRanked.sort(function (x, y) {
      var w = function (it) {
        var s = (it.confidence || 0) * 0.6 +
          clamp(1 - (((+now()) - ts(it.statedAt || it.lastSeen)) / (21 * DAY)), 0, 1) * 0.4;
        for (var i = 0; i < hintToks.length; i++) {
          if (tokenHit(norm(it.text) + ' ' + norm(it.subject || ''), hintToks[i])) { s += 0.6; break; }
        }
        if (it.kind === 'person' || it.kind === 'preference') s += 0.08;
        return s;
      };
      return w(y) - w(x);
    });
    inferred.sort(function (x, y) { return weigh(y) - weigh(x); });

    var t = traits();
    var head = 'Her rhythm: ' + t.activeHours.label +
      (t.activeHours.confidence < 0.5 ? ' (unsure)' : '') +
      '. Tone: ' + t.tone.label + '.';
    var md = mood();
    var moodLine = 'Mood read: ' + md.label +
      (md.confidence < 0.5 ? ' (low confidence — do not state it as fact)' : ' (moderate)') + '.';

    var toldLines = [];
    for (var i = 0; i < toldRanked.length && toldLines.length < 7; i++) {
      var it = toldRanked[i];
      toldLines.push('- ' + clip(it.text.replace(/\s+/g, ' '), 110) + ' (' + dayPhrase(it.statedAt || it.lastSeen) + ')');
    }
    var infLines = [];
    for (var j = 0; j < inferred.length && infLines.length < 4; j++) {
      var p = inferred[j];
      if ((p.confidence || 0) < 0.28) continue;
      var tag = p.confidence >= 0.7 ? 'solid' : p.confidence >= 0.5 ? 'likely' : 'guess';
      infLines.push('- ' + clip(p.text.replace(/\s+/g, ' '), 100) + ' [' + tag + ']');
    }

    var showMood = true;
    var build = function () {
      var parts = [head + (showMood ? ' ' + moodLine : '')];
      if (toldLines.length) parts.push('SHE TOLD ME (her words — true, use plainly):\n' + toldLines.join('\n'));
      if (infLines.length) parts.push('I GUESSED (patterns — never state as fact):\n' + infLines.join('\n'));
      return parts.join('\n').trim();
    };

    // Trim the guesses first, then the mood read, and only then her own words.
    while (infLines.length && build().length > 600) infLines.pop();
    if (build().length > 600) showMood = false;
    while (toldLines.length > 1 && build().length > 600) toldLines.pop();
    var out = build();
    return out.length > 600 ? out.slice(0, 597) + '...' : out;
  }

  /* ---------------------------------------------------------------------- *
   * 13. Erase
   * ---------------------------------------------------------------------- */

  function hardErase() {
    items = [];
    sig = blankSignals();
    meta = blankMeta();
    meta.erased = true;
    meta.seeded = true; // erased means erased — seeds don't creep back in
    persistNow();
    repaint();
  }

  /* ---------------------------------------------------------------------- *
   * 14. renderScreen — the emotional centre of the app.
   * ---------------------------------------------------------------------- */

  function repaint() {
    if (!mounted || !mounted.isConnected) { mounted = null; return; }
    // Every tab shares the same #screen element, so isConnected is always true — it is
    // not evidence that BEE is the screen on show. Without this check a background tick
    // repaints the BEE screen over whichever tab the user actually navigated to.
    if (PB.app && typeof PB.app.current === 'function' && PB.app.current() !== 'bee') {
      mounted = null;
      return;
    }
    if (repaint._q) return;
    repaint._q = true;
    setTimeout(function () {
      repaint._q = false;
      if (mounted && mounted.isConnected) paint(mounted);
    }, 60);
  }

  function renderScreen(rootEl) {
    if (!rootEl) return;
    mounted = rootEl;
    expireUnsaved();
    seedFromKB();
    paint(rootEl);
    startCountdown();
  }

  function paint(root) {
    root.innerHTML = '';
    var wrap = el('div', 'pbm');

    wrap.appendChild(header());
    wrap.appendChild(toldSection());     // her words come first — always
    wrap.appendChild(inferredHead());
    wrap.appendChild(moodCard());
    wrap.appendChild(traitsCard());
    wrap.appendChild(noticedSection());
    wrap.appendChild(forgettingCard());

    root.appendChild(wrap);
  }

  function header() {
    var h = el('header', 'pbm-head');
    h.appendChild(el('div', 'pbm-eyebrow', 'BEE'));
    h.appendChild(el('h1', 'pbm-title', 'What I know about you'));
    var p = el('p', 'pbm-sub');
    p.textContent = 'Two lists, kept apart on purpose: the things you told me, and the things I worked out on my own. The second kind is always a guess.';
    h.appendChild(p);
    return h;
  }

  /* --- what you've told me ------------------------------------------------ */

  // A told fact belongs in the top list. Moods and corrections stay below with
  // the rest of the inference, where they came from.
  function isToldFact(it) {
    if (!it || it.source !== 'told') return false;
    return it.kind === 'fact' || it.kind === 'preference' ||
           it.kind === 'person' || it.kind === 'routine' || it.kind === 'event';
  }

  function toldGroups() {
    var groups = [], index = {};
    function bucket(key, label, sub, type, subject) {
      if (!index[key]) {
        index[key] = { key: key, label: label, sub: sub || '', type: type, subject: subject || null, items: [] };
        groups.push(index[key]);
      }
      return index[key];
    }
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (!isToldFact(it)) continue;
      var subj = it.subject || 'you';
      if (it.kind === 'person' || (it.relation && subj !== 'you')) {
        bucket('p:' + subj, it.label || labelFor(subj) || titleName(subj),
          it.relation ? 'your ' + it.relation : 'someone in your life', 'person', subj).items.push(it);
      } else if (it.kind === 'preference') {
        bucket('pref', 'What you like and what you don\'t', 'in your words', 'preference', null).items.push(it);
      } else if (it.kind === 'routine') {
        bucket('routine', 'How your week actually goes', 'in your words', 'routine', null).items.push(it);
      } else if (subj === 'you') {
        bucket('you', 'You', 'the basics you gave me', 'you', 'you').items.push(it);
      } else {
        bucket('s:' + subj, it.label || titleName(subj), 'a thing you asked me to hold', 'topic', subj).items.push(it);
      }
    }
    var rank = { you: 1, person: 2, preference: 3, routine: 4, topic: 5 };
    groups.sort(function (a, b) {
      var d = (rank[a.type] || 9) - (rank[b.type] || 9);
      if (d) return d;
      return b.items.length - a.items.length;
    });
    for (var g = 0; g < groups.length; g++) {
      groups[g].items.sort(function (x, y) { return ts(y.statedAt || y.lastSeen) - ts(x.statedAt || x.lastSeen); });
    }
    return groups;
  }

  function toldSection() {
    var sec = el('section', 'pbm-sec pbm-told');
    var head = el('div', 'pbm-sec-head pbm-told-head');
    head.appendChild(el('h2', 'pbm-h2 pbm-h2-strong', "What you've told me"));

    var groups = toldGroups();
    var total = 0;
    for (var g = 0; g < groups.length; g++) total += groups[g].items.length;

    head.appendChild(el('p', 'pbm-sec-sub', total
      ? total + (total === 1 ? ' thing' : ' things') + ", in your own words. I don't put a clock on these — you said them, so I keep them until you delete them."
      : "Nothing yet. Tell me something and I'll hold onto it."));
    sec.appendChild(head);

    if (!total) {
      var empty = el('div', 'pbm-card pbm-empty pbm-told-empty');
      empty.appendChild(el('p', null, 'Say any of these to me and it lands here:'));
      var ul = el('ul', 'pbm-examples');
      ['“Remember that I\'m allergic to penicillin.”',
       '“My sister\'s name is Sara and she lives in Boston.”',
       '“I hate morning meetings.”',
       '“I go to the gym on Tuesdays.”'].forEach(function (line) {
        ul.appendChild(el('li', null, line));
      });
      empty.appendChild(ul);
      empty.appendChild(el('p', 'pbm-foot', 'Ask me about it later — “what do you know about my sister?” — and I\'ll give it straight back.'));
      sec.appendChild(empty);
      return sec;
    }

    for (var i = 0; i < groups.length; i++) sec.appendChild(toldGroupCard(groups[i]));
    return sec;
  }

  function toldGroupCard(group) {
    var card = el('section', 'pbm-card pbm-group pbm-group-' + group.type);

    var gh = el('div', 'pbm-group-head');
    var names = el('div', 'pbm-group-names');
    names.appendChild(el('h3', 'pbm-group-name', group.label));
    if (group.sub) names.appendChild(el('span', 'pbm-group-rel', group.sub));
    gh.appendChild(names);
    gh.appendChild(el('span', 'pbm-group-n', group.items.length + (group.items.length === 1 ? ' thing' : ' things')));
    card.appendChild(gh);

    for (var i = 0; i < group.items.length; i++) card.appendChild(toldRow(group.items[i]));

    if ((group.type === 'person' || group.type === 'topic') && group.subject) {
      card.appendChild(btn('pbm-btn pbm-btn-forget pbm-group-forget',
        'Forget everything about ' + group.label,
        function () {
          ask('Forget everything about ' + group.label + '?',
            'Every single thing you told me about ' + group.label + ' goes now. No copy, no archive.',
            'Forget it all',
            function () {
              var n = forgetAbout(group.subject);
              haptic();
              toast(n ? n + (n === 1 ? ' thing' : ' things') + ' gone.' : 'Nothing to forget.');
            });
        }));
    }
    return card;
  }

  function toldRow(it) {
    var row = el('div', 'pbm-fact');
    row.appendChild(el('p', 'pbm-fact-text', it.text));

    var foot = el('div', 'pbm-fact-foot');
    var src = el('span', 'pbm-fact-src', attribution(it) +
      (it.hits > 1 ? ' · said it ' + it.hits + ' times' : ''));
    foot.appendChild(src);
    foot.appendChild(btn('pbm-x', 'Forget', function () {
      ask('Forget this?',
        '“' + clip(it.text, 90) + '”\n\nYou told me this. I\'ll delete it now — there\'s no copy.',
        'Forget it',
        function () {
          forget(it.id, true);
          haptic();
          toast("Gone. I won't bring it up again.");
        });
    }));
    row.appendChild(foot);

    if (it.utterance && norm(it.utterance) !== norm(it.text)) {
      var det = el('details', 'pbm-ev pbm-fact-ev');
      det.appendChild(el('summary', null, 'Your words'));
      det.appendChild(el('p', 'pbm-quote', '“' + it.utterance + '”'));
      row.appendChild(det);
    }
    return row;
  }

  function inferredHead() {
    var d = el('div', 'pbm-split');
    d.appendChild(el('h2', 'pbm-h2 pbm-h2-strong', "What I've picked up on my own"));
    d.appendChild(el('p', 'pbm-sec-sub',
      "You didn't tell me any of this — I worked it out from how you use me, so treat all of it as a guess. It comes with a clock, and it goes unless you save it."));
    return d;
  }

  /* --- mood ------------------------------------------------------------- */
  function moodCard() {
    var md = mood();
    var c = el('section', 'pbm-card pbm-mood');
    c.appendChild(el('h2', 'pbm-h2', 'How you\'ve been'));

    var line = el('p', 'pbm-mood-line', md.line);
    c.appendChild(line);

    var meter = confidenceRow(md.confidence, md.confidence < 0.5
      ? "That's a guess, not a read."
      : 'Reasonably confident, still not certain.');
    c.appendChild(meter);

    var why = el('div', 'pbm-why');
    why.appendChild(el('div', 'pbm-why-label', 'Because —'));
    if (md.signals && md.signals.length) {
      var ul = el('ul', 'pbm-why-list');
      for (var i = 0; i < md.signals.length; i++) {
        ul.appendChild(el('li', null, capital(md.signals[i])));
      }
      why.appendChild(ul);
    } else {
      why.appendChild(el('p', 'pbm-why-none', md.why));
    }
    c.appendChild(why);

    var row = el('div', 'pbm-mood-actions');
    row.appendChild(btn('pbm-btn pbm-btn-ghost', md.question ? "You're close" : "That's right", function () {
      add({ kind: 'mood', text: 'Around ' + clockLabel(now()) + ' you told me you were ' + md.label + '.',
            confidence: 0.8, source: 'told', evidence: ['You confirmed it yourself'] });
      toast('Noted. Thank you for telling me.');
      haptic();
    }));
    row.appendChild(btn('pbm-btn pbm-btn-ghost', 'Not really', function () {
      add({ kind: 'mood', text: 'My read of "' + md.label + '" was wrong. Weight that signal less.',
            confidence: 0.85, source: 'told', saved: true, evidence: ['You corrected me'] });
      toast("Got it. I'd rather be corrected than confident.");
      haptic();
    }));
    c.appendChild(row);
    return c;
  }

  /* --- traits ----------------------------------------------------------- */
  function traitsCard() {
    var t = traits();
    var c = el('section', 'pbm-card pbm-traits');
    c.appendChild(el('h2', 'pbm-h2', 'If a friend asked me about you'));

    var p = el('div', 'pbm-prose');
    for (var i = 0; i < t.sentences.length; i++) {
      if (!t.sentences[i]) continue;
      p.appendChild(el('p', i === t.sentences.length - 1 && t.thin ? 'pbm-prose-caveat' : null, t.sentences[i]));
    }
    c.appendChild(p);

    if (t.topInterests.length) {
      var chips = el('div', 'pbm-chips');
      for (var j = 0; j < t.topInterests.length; j++) {
        var it = t.topInterests[j];
        var chip = el('span', 'pbm-chip' + (it.confidence < 0.5 ? ' pbm-chip-weak' : ''), it.label);
        chip.title = it.confidence < 0.5 ? 'Only a guess so far' : 'Seen this a few times';
        chips.appendChild(chip);
      }
      c.appendChild(chips);
    }

    if (t.stressSignals.length) {
      var s = el('div', 'pbm-stress');
      s.appendChild(el('div', 'pbm-stress-label', "What I'd keep an eye on"));
      for (var k = 0; k < t.stressSignals.length && k < 3; k++) {
        var row = el('div', 'pbm-stress-row');
        row.appendChild(el('span', 'pbm-dot'));
        var txt = el('div', 'pbm-stress-txt');
        txt.appendChild(el('strong', null, capital(t.stressSignals[k].label)));
        txt.appendChild(el('span', 'pbm-stress-why', ' — ' + lower(t.stressSignals[k].why)));
        row.appendChild(txt);
        s.appendChild(row);
      }
      c.appendChild(s);
    }

    var foot = el('p', 'pbm-foot');
    foot.textContent = 'Built from ' + plural(t.evidenceCount, 'small thing') + ' over ' +
      plural(t.daysObserved || 1, 'day') +
      '. None of it is a conclusion — tell me where I\'m off.';
    c.appendChild(foot);
    return c;
  }

  /* --- noticed list ----------------------------------------------------- */
  function noticedSection() {
    var sec = el('section', 'pbm-sec');
    var head = el('div', 'pbm-sec-head');
    head.appendChild(el('h2', 'pbm-h2', 'Patterns, one by one'));
    sec.appendChild(head);

    var all = itemsApi({ limit: 60 });
    var list = [];
    for (var n = 0; n < all.length && list.length < 40; n++) {
      if (!isToldFact(all[n])) list.push(all[n]);   // told facts live in the top list
    }
    if (!list.length) {
      var empty = el('div', 'pbm-card pbm-empty');
      empty.appendChild(el('p', null, "Nothing yet. I don't invent things about you — I wait until I've actually seen them."));
      empty.appendChild(el('p', 'pbm-foot', 'Talk to me for a day or two and this fills in.'));
      sec.appendChild(empty);
      return sec;
    }

    for (var i = 0; i < list.length; i++) sec.appendChild(memoryRow(list[i]));
    return sec;
  }

  function memoryRow(it) {
    var raw = byId(it.id) || it;
    var card = el('article', 'pbm-item' + (it.saved ? ' is-saved' : '') + (it.confidence < 0.5 ? ' is-weak' : ''));

    var top = el('div', 'pbm-item-top');
    var badge = el('span', 'pbm-badge' + (it.source === 'kb' || it.source === 'seed' || it.source === 'told' ? ' pbm-badge-told' : ''),
      (it.source === 'kb' || it.source === 'seed' || it.source === 'told') ? 'you told me' : 'I noticed');
    top.appendChild(badge);
    if (it.saved) top.appendChild(el('span', 'pbm-badge pbm-badge-saved', 'saved'));
    card.appendChild(top);

    card.appendChild(el('p', 'pbm-item-text', voice(raw)));

    // Her own words get provenance, not a confidence meter.
    if (raw.source === 'told') {
      var stated = el('div', 'pbm-stated');
      stated.appendChild(el('span', 'pbm-stated-mark', '❝'));
      stated.appendChild(el('span', 'pbm-stated-txt', attribution(raw) || 'You told me this'));
      card.appendChild(stated);
    } else {
      card.appendChild(confidenceRow(it.confidence, caveat(raw)));
    }

    if (it.evidence && it.evidence.length) {
      var det = el('details', 'pbm-ev');
      var sum = el('summary', null, 'What made me think this');
      det.appendChild(sum);
      var ul = el('ul', 'pbm-ev-list');
      for (var i = 0; i < it.evidence.length; i++) ul.appendChild(el('li', null, it.evidence[i]));
      det.appendChild(ul);
      det.appendChild(el('p', 'pbm-ev-foot', 'Seen ' + it.hits + (it.hits === 1 ? ' time' : ' times') +
        ', first on ' + shortDate(it.firstSeen) + '.'));
      card.appendChild(det);
    }

    // The countdown — visible forgetting is the whole point.
    var life = el('div', 'pbm-life');
    if (it.saved) {
      life.className = 'pbm-life is-kept';
      life.appendChild(el('span', 'pbm-life-txt', "Kept. I won't drop this unless you tell me to."));
    } else {
      var left = msLeft(raw);
      var ttl = ttlFor(raw);
      var pct = clamp(left / ttl, 0, 1);
      var bar = el('div', 'pbm-bar');
      var fill = el('div', 'pbm-bar-fill');
      fill.style.width = Math.round(pct * 100) + '%';
      bar.appendChild(fill);
      life.appendChild(bar);
      var txt = el('span', 'pbm-life-txt', 'I forget this in ' + span(left) + ' unless you save it');
      txt.setAttribute('data-expire', String(expiresAt(raw)));
      txt.setAttribute('data-ttl', String(ttl));
      life.appendChild(txt);
    }
    card.appendChild(life);

    var actions = el('div', 'pbm-actions');
    if (it.saved) {
      actions.appendChild(btn('pbm-btn pbm-btn-ghost', 'Let it expire', function () {
        unsave(it.id);
        toast('Back on the clock.');
      }));
    } else {
      actions.appendChild(btn('pbm-btn pbm-btn-save', 'Save', function () {
        saveItem(it.id);
        haptic();
        toast("Kept. I'll hold onto that.");
      }));
    }
    actions.appendChild(btn('pbm-btn pbm-btn-forget', 'Forget', function () {
      doForget(it);
    }));
    card.appendChild(actions);

    return card;
  }

  // Ask before destroying, but never let a missing confirm sheet block the action.
  function ask(title, body, okLabel, run) {
    if (!(PB.ui && typeof PB.ui.confirm === 'function')) { run(); return; }
    var r;
    try { r = PB.ui.confirm(title, body, okLabel); }
    catch (e) { run(); return; }
    if (r && typeof r.then === 'function') r.then(function (ok) { if (ok) safe(run); });
    else if (r !== false) run();
  }

  function doForget(it) {
    ask('Forget this?',
      "I'll delete it now and stop noticing this pattern for a month. There's no copy.",
      'Forget it',
      function () {
        forget(it.id, true);
        haptic();
        toast("Gone. I won't bring it up again.");
      });
  }

  /* --- forgetting proof -------------------------------------------------- */
  function forgettingCard() {
    var c = el('section', 'pbm-card pbm-forget');
    c.appendChild(el('h2', 'pbm-h2', 'What I\'ve already let go'));

    var week = 0, t = +now();
    for (var i = 0; i < meta.forgetLog.length; i++) {
      if (t - ts(meta.forgetLog[i].at) < 7 * DAY) week++;
    }
    // Counted over the guesses only — her own words are never on the clock.
    var unsaved = 0, savedN = 0, toldN = 0;
    for (var j = 0; j < items.length; j++) {
      if (isToldFact(items[j])) { toldN++; continue; }
      if (items[j].saved) savedN++; else unsaved++;
    }

    var p = el('p', 'pbm-forget-line');
    p.textContent = week
      ? week + (week === 1 ? ' thing' : ' things') + ' quietly deleted in the last week. I kept no copy — I can\'t tell you what they were, which is the point.'
      : "Nothing has aged out yet. When it does, it's deleted, not archived.";
    c.appendChild(p);

    var stat = el('div', 'pbm-stats');
    stat.appendChild(statTile(toldN, toldN === 1 ? 'thing you told me' : 'things you told me'));
    stat.appendChild(statTile(savedN + unsaved, 'guesses I hold'));
    stat.appendChild(statTile(meta.expiredCount, 'forgotten for good'));
    c.appendChild(stat);

    var actions = el('div', 'pbm-actions pbm-actions-wide');
    actions.appendChild(btn('pbm-btn pbm-btn-forget', 'Forget everything unsaved, now', function () {
      ask('Clear everything unsaved?',
        'Everything except what you saved goes now. Immediately, permanently.',
        'Do it',
        function () {
          var n = forgetAllUnsaved();
          haptic();
          toast(n ? n + ' forgotten.' : 'Nothing to forget.');
        });
    }));
    c.appendChild(actions);

    var foot = el('p', 'pbm-foot');
    foot.textContent = 'Anything you told me in words stays until you delete it — that button leaves it alone. ' +
      'My own guesses have a short life by default: ' + span(TTL.pattern) + ' for patterns, ' +
      span(TTL.mood) + ' for moods.';
    c.appendChild(foot);
    return c;
  }

  function forgetAllUnsaved() {
    var n = 0;
    for (var i = items.length - 1; i >= 0; i--) {
