<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#F5B301">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BEE">
<title>Personalbee</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">
<style>
/* ===== css/base.css ===== */
/* Personalbee — base design system. Owned by the integrator. */

:root {
  /* brand */
  --honey: #F5B301;
  --honey-soft: #FFD76B;
  --honey-deep: #c98a00;
  --ink: #14122b;
  --ink-2: #1b1930;
  --ink-3: #2a2350;
  --cream: #fdfbf5;
  --cream-2: #f6efe0;
  --cream-3: #efe4cf;

  /* semantic — light */
  --bg: var(--cream);
  --bg-raised: #ffffff;
  --bg-sunken: var(--cream-2);
  --text: #14122b;
  --text-dim: #6b6483;
  --text-faint: #9a94ae;
  --line: rgba(20, 18, 43, .10);
  --line-strong: rgba(20, 18, 43, .18);

  --ok: #1ea94a;
  --warn: #e08600;
  --danger: #d92d42;
  --info: #2f7bef;

  --radius-sm: 12px;
  --radius: 18px;
  --radius-lg: 26px;
  --radius-full: 999px;

  --shadow-sm: 0 1px 2px rgba(20, 18, 43, .06);
  --shadow: 0 6px 20px rgba(20, 18, 43, .10);
  --shadow-lg: 0 18px 50px rgba(20, 18, 43, .22);

  /* One horizontal gutter for every screen. Screens used to each pick their own, which
     left titles landing at 2px, 16px, 34px and 49px from the edge as you switched tabs. */
  --gutter: 18px;

  /* The tab bar is gone — chat is the app. Kept at 0 rather than deleted because several
     screens still size their bottom padding off it; this makes them all tighten at once. */
  --tabbar-h: 0px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);

  --ease: cubic-bezier(.34, 1.4, .64, 1);
}

:root[data-theme="dark"],
:root:not([data-theme="light"]) {
  /* dark is opt-in per data-theme; see media query below for system */
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #100e20;
    --bg-raised: #1a1830;
    --bg-sunken: #0b0a18;
    --text: #f3f0ff;
    --text-dim: #a9a2c4;
    --text-faint: #7d7699;
    --line: rgba(255, 255, 255, .10);
    --line-strong: rgba(255, 255, 255, .18);
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow: 0 6px 20px rgba(0, 0, 0, .45);
    --shadow-lg: 0 18px 50px rgba(0, 0, 0, .6);
  }
}

:root[data-theme="dark"] {
  --bg: #100e20;
  --bg-raised: #1a1830;
  --bg-sunken: #0b0a18;
  --text: #f3f0ff;
  --text-dim: #a9a2c4;
  --text-faint: #7d7699;
  --line: rgba(255, 255, 255, .10);
  --line-strong: rgba(255, 255, 255, .18);
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
  --shadow: 0 6px 20px rgba(0, 0, 0, .45);
  --shadow-lg: 0 18px 50px rgba(0, 0, 0, .6);
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  overscroll-behavior-y: none;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

button, input, textarea, select { font: inherit; color: inherit; }
button { background: none; border: none; cursor: pointer; }
input, textarea { background: none; border: none; outline: none; }
img { max-width: 100%; display: block; }

/* ---------- app frame ---------- */

#app {
  position: relative;
  width: 100%;
  /* height, not min-height: with min-height the column grows to fit its content, the
     document itself scrolls, and the tab bar rides off the bottom of the screen. */
  height: 100%;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  overflow: hidden;
}

/* On a wide screen, present as a phone. On a phone, go fullscreen. */
@media (min-width: 620px) and (min-height: 700px) {
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 15%, #2a2350 0%, #14122b 55%, #0d0b1e 100%);
    padding: 24px;
  }
  #app {
    width: 390px; height: 844px; min-height: 0;
    max-height: calc(100vh - 48px);
    border-radius: 44px;
    box-shadow: 0 40px 90px rgba(0, 0, 0, .6), inset 0 0 0 2px #2c2c3a, 0 0 0 11px #000;
  }
  #app::after {
    content: ''; position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 104px; height: 26px; background: #000; border-radius: 999px; z-index: 200;
    pointer-events: none;
  }
}

#screen {
  flex: 1;
  /* A flex item's min-height defaults to auto, so without this it refuses to shrink
     below its content and scrolls the whole document instead of just itself. */
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  /* No padding here: the conversation needs the full bleed, and every other screen
     already sets its own insets. A shared inset would double up on all of them. */
  padding: 0;
}

/* ---------- sub-screen nav ---------- */
/* There is no tab bar any more. Chat is the app; everything else sits one level down
   behind a single hub, so the assistant doesn't read as a utility with five sections. */

.navbar {
  display: flex; align-items: center; gap: 4px;
  padding: calc(var(--safe-t) + 8px) 8px 8px;
  border-bottom: 1px solid var(--line);
  background: var(--bg);
  position: sticky; top: 0; z-index: 40;
}
.navbar-back {
  width: 44px; height: 44px; flex: none;
  display: flex; align-items: center; justify-content: center;
  color: var(--text); border-radius: var(--radius-full);
}
.navbar-back:active { background: var(--bg-sunken); }
.navbar-title { font-size: 16.5px; font-weight: 650; letter-spacing: -.01em; }
.navbar-spacer { width: 44px; flex: none; }

.navbody { padding-bottom: calc(var(--safe-b) + 40px); }

/* ---------- the hub ---------- */

.hub { padding: 8px var(--gutter) calc(var(--safe-b) + 40px); }
.hub-intro { color: var(--text-dim); font-size: 13.5px; margin: 6px 2px 16px; }

.hub-row {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  min-height: 68px; padding: 12px 14px; margin-bottom: 10px;
  background: var(--bg-raised); border: 1px solid var(--line);
  border-radius: var(--radius-lg); color: var(--text);
  transition: transform .14s var(--ease);
}
.hub-row:active { transform: scale(.985); }
.hub-ico { font-size: 22px; flex: none; width: 28px; text-align: center; }
.hub-mid { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
.hub-title { font-size: 16px; font-weight: 650; }
.hub-line { font-size: 12.5px; color: var(--text-dim); line-height: 1.4; }
.hub-count {
  flex: none; min-width: 26px; height: 26px; padding: 0 8px; border-radius: var(--radius-full);
  background: var(--honey); color: #3a2c00;
  display: flex; align-items: center; justify-content: center;
  font-size: 12.5px; font-weight: 700;
}
.hub-row-quiet { background: none; border-style: dashed; margin-top: 6px; }

.hub-build {
  margin: 22px 2px 0; text-align: center;
  font-size: 11.5px; color: var(--text-faint);
  min-height: 44px; display: flex; align-items: center; justify-content: center;
}

/* ---------- shared primitives (agents may use these) ---------- */

.wrap { padding: 0 18px; }

.card {
  background: var(--bg-raised);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 16px;
  box-shadow: var(--shadow-sm);
}
.card + .card { margin-top: 12px; }

.sec-title {
  font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase;
  color: var(--text-faint); margin: 24px 18px 9px;
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 44px; padding: 0 18px; border-radius: var(--radius-full);
  background: var(--bg-sunken); color: var(--text); font-size: 14.5px; font-weight: 600;
  border: 1px solid var(--line); transition: transform .15s var(--ease);
}
.btn:active { transform: scale(.96); }
.btn-primary { background: linear-gradient(var(--honey-soft), var(--honey)); color: #3a2c00; border-color: transparent; }
.btn-ghost { background: none; border-color: var(--line); }
.btn-danger { background: var(--danger); color: #fff; border-color: transparent; }
.btn-block { display: flex; width: 100%; }

.chip {
  display: inline-flex; align-items: center; min-height: 34px; padding: 0 13px;
  border-radius: var(--radius-full); background: var(--bg-sunken);
  border: 1px solid var(--line); font-size: 13px; font-weight: 500; color: var(--text);
}

.dim { color: var(--text-dim); }
.faint { color: var(--text-faint); }
.tiny { font-size: 12px; }
.small { font-size: 13px; }
.strong { font-weight: 650; }
.row { display: flex; align-items: center; gap: 10px; }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.stack { display: flex; flex-direction: column; }
.grow { flex: 1; min-width: 0; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hidden { display: none !important; }

.empty { text-align: center; padding: 40px 24px; color: var(--text-dim); }
.empty .empty-ico { font-size: 34px; margin-bottom: 10px; opacity: .8; }

.page-head { padding: 6px 18px 4px; }
.page-head h1 { font-size: 27px; font-weight: 700; letter-spacing: -.02em; }
.page-head p { color: var(--text-dim); font-size: 13.5px; margin-top: 3px; }

/* ---------- toast ---------- */

#toasts {
  position: absolute; left: 0; right: 0; bottom: calc(var(--tabbar-h) + var(--safe-b) + 84px);
  z-index: 300; display: flex; flex-direction: column; align-items: center; gap: 8px;
  pointer-events: none; padding: 0 18px;
}
.toast {
  background: var(--ink-2); color: #fff; padding: 11px 17px; border-radius: var(--radius-full);
  font-size: 13.5px; font-weight: 500; box-shadow: var(--shadow-lg); max-width: 100%;
  animation: toast-in .3s var(--ease);
}
@keyframes toast-in { from { opacity: 0; transform: translateY(10px) scale(.96); } }

/* ---------- sheet ---------- */

.sheet-scrim {
  position: absolute; inset: 0; z-index: 400; background: rgba(0, 0, 0, .45);
  backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  animation: fade-in .25s ease;
}
@keyframes fade-in { from { opacity: 0; } }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 401;
  background: var(--bg-raised); border-radius: 28px 28px 0 0;
  padding: 8px 18px calc(20px + var(--safe-b));
  max-height: 86%; overflow-y: auto; box-shadow: var(--shadow-lg);
  animation: sheet-up .32s var(--ease);
}
@keyframes sheet-up { from { transform: translateY(100%); } }
.sheet-grip { width: 38px; height: 4px; border-radius: 2px; background: var(--line-strong); margin: 6px auto 14px; }
.sheet-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; }

/* ---------- misc ---------- */

.conf-bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.conf-bar > i { display: block; height: 100%; background: var(--honey); border-radius: 2px; }

.pill {
  display: inline-block; padding: 3px 9px; border-radius: var(--radius-full);
  font-size: 11px; font-weight: 700; letter-spacing: .02em;
}
.pill-ok { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.pill-warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.pill-danger { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }
.pill-honey { background: color-mix(in srgb, var(--honey) 22%, transparent); color: var(--honey-deep); }
.pill-dim { background: var(--bg-sunken); color: var(--text-dim); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}


/* ===== css/beeui.css ===== */
/* =============================================================
   Personalbee — css/beeui.css  (agent 7)
   The conversation IS the app.

   A full-bleed messaging surface: slim header with the bee as the
   privacy indicator, transcript, and a composer pinned above the
   home indicator. It follows the theme, so light mode is light and
   dark mode is dark — no fixed ink slab any more.

   Every colour resolves back to a base.css token. --ink appears
   only as text ON honey or cream (fixed light surfaces), never on
   a theme surface, or dark mode would fall apart.
   ============================================================= */

.pb-beeui {
  /* --- the bee's own palette, derived entirely from tokens --- */
  --bee-wing: color-mix(in srgb, var(--info) 24%, var(--cream));
  --bee-line: var(--honey-deep);
  --bee-lid: var(--ink);
  --bee-pupil: var(--ink);
  --bee-eye-rim: var(--honey-soft);
  --bee-eye-white: var(--cream);

  /* honey is too pale to read as text on cream, so the accent
     deepens in light and brightens in dark */
  --bee-accent: var(--honey-deep);
  --bee-tint: color-mix(in srgb, var(--honey) 13%, transparent);
  --bee-edge: color-mix(in srgb, var(--honey) 48%, transparent);
  --bee-glow: color-mix(in srgb, var(--honey) 34%, transparent);

  --bee-ease: cubic-bezier(.34, 1.4, .64, 1);
  --bee-safe-b: env(safe-area-inset-bottom, 0px);
  --bee-safe-t: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .pb-beeui { --bee-accent: var(--honey); }
}
:root[data-theme="dark"] .pb-beeui { --bee-accent: var(--honey); }

/* =============================================================
   1. THE FRAME
   The conversation owns the whole app surface. It is not a sheet
   over a screen — it is the screen.
   ============================================================= */
.pb-beeui {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  /* JS sets `bottom` to the keyboard height; ease it so the lift isn't a jolt */
  transition: bottom .18s ease;
}

/* =============================================================
   2. HEADER — name, the honest state line, and one way out
   ============================================================= */
.pb-topbar {
  flex: none;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: calc(var(--bee-safe-t) + 9px) 10px 9px 14px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}

/* --- the bee: privacy indicator, trust principle #8 --- */
.pb-beebtn {
  position: relative;
  width: 44px;
  height: 44px;
  flex: none;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--bg-sunken);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: border-color .3s ease, box-shadow .3s ease, transform .2s var(--bee-ease);
}
.pb-beebtn:active { transform: scale(.93); }
.pb-beebtn-face {
  display: block;
  width: 31px;
  height: 31px;
  pointer-events: none;
}
.pb-bee-svg { width: 100%; height: 100%; display: block; overflow: visible; }

/* sleeping z */
.pb-zzz {
  position: absolute;
  top: -3px;
  right: -1px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .5px;
  color: var(--bee-accent);
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s ease;
}
.pb-beeui[data-state="asleep"] .pb-zzz {
  opacity: 1;
  animation: pbFloat 2.6s ease-in-out infinite;
}
@keyframes pbFloat {
  0%, 100% { opacity: .35; transform: translateY(0); }
  50% { opacity: 1; transform: translateY(-4px); }
}

/* mic-is-hot rings — the loudest thing on the screen, by design */
.pb-ring {
  position: absolute;
  inset: -1px;
  border-radius: 50%;
  border: 2px solid var(--honey);
  opacity: 0;
  pointer-events: none;
}
.pb-beeui[data-state="listening"] .pb-beebtn {
  border-color: var(--honey);
  box-shadow: 0 0 0 3px var(--bee-glow);
}
.pb-beeui[data-state="listening"] .pb-ring {
  animation: pbRing 1.5s cubic-bezier(.22, .61, .36, 1) infinite;
}
.pb-beeui[data-state="listening"] .pb-ring-2 { animation-delay: .55s; }
@keyframes pbRing {
  0% { opacity: .85; transform: scale(1); }
  70% { opacity: .12; transform: scale(1.8); }
  100% { opacity: 0; transform: scale(2.05); }
}

.pb-id { flex: 1; min-width: 0; }
.pb-id-name {
  font-size: 16.5px;
  font-weight: 750;
  letter-spacing: .04em;
  line-height: 1.15;
  color: var(--text);
}
.pb-id-sub {
  font-size: 11.5px;
  line-height: 1.3;
  margin-top: 1px;
  color: var(--text-dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.pb-beeui[data-state="listening"] .pb-id-sub {
  color: var(--bee-accent);
  font-weight: 650;
}

/* the single control to everything else BEE holds */
.pb-more {
  width: 44px;
  height: 44px;
  flex: none;
  border-radius: var(--radius-full);
  color: var(--text-dim);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background .2s ease, transform .18s var(--bee-ease);
}
.pb-more svg { width: 21px; height: 21px; }
.pb-more:active { background: var(--bg-sunken); transform: scale(.92); }

/* =============================================================
   3. HONEST BANNERS
   ============================================================= */
.pb-banner {
  flex: none;
  margin: 9px var(--gutter) 0;
  padding: 8px 13px;
  border-radius: var(--radius-full);
  border: 1px solid var(--line);
  background: var(--bg-sunken);
  color: var(--text-dim);
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 9px;
}
.pb-banner[hidden] { display: none; }
.pb-banner-dot {
  width: 7px; height: 7px; flex: none;
  border-radius: 50%;
  background: var(--honey);
}

.pb-hotbar {
  flex: none;
  margin: 9px var(--gutter) 0;
  padding: 10px 14px;
  border-radius: var(--radius-full);
  background: var(--honey);
  color: var(--ink);              /* honey is a fixed light surface — ink is safe here */
  font-size: 12.5px;
  font-weight: 750;
  display: flex;
  align-items: center;
  gap: 9px;
  box-shadow: var(--shadow-sm);
}
.pb-hotbar[hidden] { display: none; }
.pb-hotdot {
  width: 9px; height: 9px; flex: none;
  border-radius: 50%;
  background: var(--ink);
  animation: pbHotDot 1.1s ease-in-out infinite;
}
@keyframes pbHotDot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: .25; transform: scale(.7); }
}

/* =============================================================
   4. TRANSCRIPT
   ============================================================= */
.pb-transcript {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 16px var(--gutter) 20px;
  display: flex;
  flex-direction: column;
  /* no scroll-behavior here on purpose: the JS asks for a smooth scroll when a
     message lands, and an instant one when it re-attaches, and a blanket rule
     would animate the re-attach too */
}

.pb-day {
  display: flex;
  justify-content: center;
  margin: 18px 0 2px;
}
.pb-day:first-child { margin-top: 2px; }
.pb-day-label {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--text-faint);
  background: var(--bg-sunken);
  border-radius: var(--radius-full);
  padding: 4px 12px;
}

.pb-msg {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  max-width: 100%;
  margin-top: 16px;
  animation: pbRise .28s var(--bee-ease) both;
}
.pb-msg:first-child, .pb-day + .pb-msg { margin-top: 8px; }
/* consecutive messages from the same voice belong together */
.pb-msg-bee + .pb-msg-bee, .pb-msg-user + .pb-msg-user { margin-top: 5px; }
.pb-msg-bee + .pb-msg-bee .pb-avatar { visibility: hidden; }
.pb-msg-bee:has(+ .pb-msg-bee) .pb-stamp,
.pb-msg-user:has(+ .pb-msg-user) .pb-stamp { display: none; }

@keyframes pbRise {
  from { opacity: 0; transform: translateY(9px); }
  to { opacity: 1; transform: translateY(0); }
}
.pb-msg-user { justify-content: flex-end; }

.pb-avatar {
  width: 30px;
  height: 30px;
  flex: none;
  border-radius: 50%;
  background: var(--bg-sunken);
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: 2px;
}
.pb-avatar .pb-bee-svg { width: 21px; height: 21px; }

.pb-col {
  display: flex;
  flex-direction: column;
  min-width: 0;
  max-width: 84%;
}
.pb-msg-user .pb-col { align-items: flex-end; max-width: 80%; }

.pb-bubble {
  padding: 11px 15px;
  font-size: 15.5px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
  overflow-wrap: anywhere;
}
.pb-msg-bee .pb-bubble {
  background: var(--bg-raised);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: var(--radius-lg) var(--radius-lg) var(--radius-lg) 8px;
  box-shadow: var(--shadow-sm);
}
.pb-msg-user .pb-bubble {
  background: linear-gradient(160deg, var(--honey-soft), var(--honey));
  color: var(--ink);              /* honey is a fixed light surface — ink is safe here */
  font-weight: 500;
  border-radius: var(--radius-lg) var(--radius-lg) 8px var(--radius-lg);
}

.pb-stamp {
  font-size: 10.5px;
  color: var(--text-faint);
  margin: 5px 6px 0;
}

.pb-did {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}
.pb-did-item {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--bee-accent);
  border: 1px dashed var(--bee-edge);
  border-radius: var(--radius-full);
  padding: 4px 10px;
}

/* --- typing: a real one, not a spinner --- */
.pb-typing {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 15px 17px;
}
.pb-typing span {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--bee-accent);
  opacity: .35;
  animation: pbDot 1.25s ease-in-out infinite;
}
.pb-typing span:nth-child(2) { animation-delay: .16s; }
.pb-typing span:nth-child(3) { animation-delay: .32s; }
@keyframes pbDot {
  0%, 60%, 100% { opacity: .3; transform: translateY(0); }
  30% { opacity: 1; transform: translateY(-4px); }
}

/* --- quick replies + conversation openers --- */
.pb-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}
.pb-chips-center { justify-content: center; margin-top: 18px; }
.pb-chip {
  min-height: 40px;
  padding: 9px 15px;
  border-radius: var(--radius-full);
  border: 1px solid var(--bee-edge);
  background: var(--bee-tint);
  color: var(--bee-accent);
  font-size: 14px;
  font-weight: 600;
  text-align: left;
  cursor: pointer;
  transition: transform .16s var(--bee-ease), background .16s ease;
}
.pb-chip:active {
  transform: scale(.95);
  background: color-mix(in srgb, var(--honey) 26%, transparent);
}

/* --- the last-resort empty state (the greeting normally fills this) --- */
.pb-empty {
  margin: auto;
  text-align: center;
  padding: 20px 10px 40px;
  max-width: 320px;
}
.pb-empty-bee { width: 66px; height: 66px; margin: 0 auto 14px; }
.pb-empty-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
.pb-empty-sub { font-size: 14px; line-height: 1.5; color: var(--text-dim); }

/* =============================================================
   5. THE BEE ITSELF — its states must be unmistakable
   ============================================================= */
.pb-wing { fill: var(--bee-wing); opacity: .85; transform-origin: 50% 78%; }
.pb-torso { fill: var(--honey); }
.pb-belly { fill: none; stroke: var(--bee-line); stroke-width: 2; opacity: .35; stroke-linecap: round; }
.pb-antenna { fill: none; stroke: var(--bee-line); stroke-width: 2.2; stroke-linecap: round; }
.pb-antenna-tip { fill: var(--bee-line); }
.pb-eyes-closed { fill: none; stroke: var(--bee-lid); stroke-width: 2.8; stroke-linecap: round; }
.pb-eye-white { fill: var(--bee-eye-white); stroke: var(--bee-eye-rim); stroke-width: 1; }
.pb-pupil { fill: var(--bee-pupil); }
.pb-glint { fill: var(--bee-eye-white); }

/* eye swap — asleep is the default, and it reads as asleep */
.pb-eyes-open { opacity: 0; }
.pb-eyes-closed { opacity: 1; }
.pb-beeui[data-state="awake"] .pb-eyes-open,
.pb-beeui[data-state="listening"] .pb-eyes-open,
.pb-beeui[data-state="thinking"] .pb-eyes-open { opacity: 1; }
.pb-beeui[data-state="awake"] .pb-eyes-closed,
.pb-beeui[data-state="listening"] .pb-eyes-closed,
.pb-beeui[data-state="thinking"] .pb-eyes-closed { opacity: 0; }

/* asleep: slow breathing, wings folded still */
.pb-beeui[data-state="asleep"] .pb-beebtn-face .pb-bee-body {
  animation: pbBreathe 3.4s ease-in-out infinite;
  transform-origin: 50% 62%;
}
.pb-beeui[data-state="asleep"] .pb-beebtn-face .pb-wing {
  transform: rotate(0deg) scaleY(.86);
  opacity: .55;
}
@keyframes pbBreathe {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.07); }
}

/* awake: wings flutter, eyes open, the odd blink */
.pb-beeui[data-state="awake"] .pb-beebtn-face .pb-wing-l,
.pb-beeui[data-state="listening"] .pb-beebtn-face .pb-wing-l {
  animation: pbFlutterL .17s ease-in-out infinite alternate;
}
.pb-beeui[data-state="awake"] .pb-beebtn-face .pb-wing-r,
.pb-beeui[data-state="listening"] .pb-beebtn-face .pb-wing-r {
  animation: pbFlutterR .17s ease-in-out infinite alternate;
}
@keyframes pbFlutterL { from { transform: rotate(-8deg); } to { transform: rotate(6deg); } }
@keyframes pbFlutterR { from { transform: rotate(8deg); } to { transform: rotate(-6deg); } }

.pb-beeui[data-state="awake"] .pb-beebtn-face .pb-eyes-open {
  animation: pbBlink 6s ease-in-out infinite;
  transform-origin: 50% 57%;
}
@keyframes pbBlink {
  0%, 92%, 100% { transform: scaleY(1); }
  95% { transform: scaleY(.08); }
}

/* listening: the bee leans in and never stops moving */
.pb-beeui[data-state="listening"] .pb-beebtn-face .pb-bee-body {
  animation: pbLean 1.5s ease-in-out infinite;
  transform-origin: 50% 70%;
}
@keyframes pbLean {
  0%, 100% { transform: scale(1.02) translateY(0); }
  50% { transform: scale(1.08) translateY(-1px); }
}

/* thinking: a slow hover, the eyes drift, wings idle-slow */
.pb-beeui[data-state="thinking"] .pb-beebtn-face .pb-bee-body {
  animation: pbHover 1.5s ease-in-out infinite;
  transform-origin: 50% 70%;
}
.pb-beeui[data-state="thinking"] .pb-beebtn-face .pb-wing-l,
.pb-beeui[data-state="thinking"] .pb-beebtn-face .pb-wing-r {
  animation: pbFlutterSlow .42s ease-in-out infinite alternate;
}
.pb-beeui[data-state="thinking"] .pb-beebtn-face .pb-pupil {
  animation: pbPonder 2.2s ease-in-out infinite;
}
@keyframes pbHover {
  0%, 100% { transform: translateY(0) rotate(-2deg); }
  50% { transform: translateY(-3px) rotate(2deg); }
}
@keyframes pbFlutterSlow { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
@keyframes pbPonder {
  0%, 100% { transform: translateX(0); }
  35% { transform: translateX(-1.6px) translateY(-1px); }
  70% { transform: translateX(1.6px) translateY(-1px); }
}

/* avatars are portraits, not indicators — always eyes-open */
.pb-portrait .pb-eyes-open { opacity: 1 !important; }
.pb-portrait .pb-eyes-closed { opacity: 0 !important; }

/* =============================================================
   6. CARDS — rich, but restrained
   ============================================================= */
.pb-card {
  margin-top: 10px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--bg-raised);
  box-shadow: var(--shadow-sm);
  padding: 12px 14px;
  max-width: 100%;
}
.pb-card-head {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-bottom: 8px;
}
.pb-card-icon { font-size: 13px; line-height: 1; }
.pb-card-label {
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--bee-accent);
}
.pb-card-body { display: flex; flex-direction: column; gap: 6px; }
.pb-card-title {
  font-size: 15px;
  font-weight: 650;
  color: var(--text);
  line-height: 1.35;
  word-break: break-word;
}
.pb-card-line {
  font-size: 13px;
  color: var(--text-dim);
  line-height: 1.45;
  word-break: break-word;
}
.pb-card-note {
  font-size: 12.5px;
  color: var(--text-faint);
  font-style: italic;
  line-height: 1.45;
}
.pb-card-row {
  display: flex;
  gap: 10px;
  align-items: baseline;
  font-size: 13px;
}
.pb-card-when {
  flex: none;
  min-width: 64px;
  color: var(--bee-accent);
  font-weight: 700;
}
.pb-card-what {
  display: flex;
  flex-direction: column;
  color: var(--text-dim);
  min-width: 0;
  word-break: break-word;
}
.pb-card-what-title { color: var(--text); font-weight: 600; }
.pb-card-what-sub { font-size: 12px; color: var(--text-faint); }
.pb-card-thumb {
  width: 100%;
  max-height: 170px;
  object-fit: cover;
  border-radius: var(--radius-sm);
  display: block;
  margin-bottom: 4px;
}
.pb-card-go {
  margin-top: 11px;
  display: inline-flex;
  align-items: center;
  min-height: 38px;
  padding: 0 15px;
  border-radius: var(--radius-full);
  border: 1px solid var(--bee-edge);
  background: var(--bee-tint);
  color: var(--bee-accent);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.pb-card-go:active { background: color-mix(in srgb, var(--honey) 26%, transparent); }

.pb-conf { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
.pb-conf-track {
  flex: 1 1 auto;
  height: 5px;
  border-radius: var(--radius-full);
  background: var(--line);
  overflow: hidden;
}
.pb-conf-fill {
  height: 100%;
  border-radius: var(--radius-full);
  background: linear-gradient(90deg, var(--honey-soft), var(--honey));
}
.pb-conf-text { font-size: 11.5px; color: var(--text-faint); flex: none; }

/* =============================================================
   7. JUMP TO LATEST
   ============================================================= */
.pb-jump {
  position: absolute;
  right: var(--gutter);
  bottom: calc(var(--bee-safe-b) + 78px);
  width: 40px;
  height: 40px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--bg-raised);
  color: var(--text-dim);
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 3;
  animation: pbRise .2s var(--bee-ease) both;
}
.pb-jump[hidden] { display: none; }
.pb-jump svg { width: 19px; height: 19px; }
.pb-jump:active { transform: scale(.9); }
.pb-beeui.kb-up .pb-jump { bottom: 78px; }

/* =============================================================
   8. COMPOSER — always visible, always above the home indicator
   ============================================================= */
.pb-composer {
  flex: none;
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 10px 12px calc(10px + var(--bee-safe-b));
  background: var(--bg);
  border-top: 1px solid var(--line);
}
/* with the keyboard up, the home indicator is behind it — don't pad for it twice */
.pb-beeui.kb-up .pb-composer { padding-bottom: 10px; }

.pb-field {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  align-items: center;
  background: var(--bg-sunken);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 10px 16px;
  transition: border-color .2s ease;
}
.pb-field:focus-within { border-color: var(--bee-edge); }

.pb-input {
  width: 100%;
  border: 0;
  background: none;
  outline: none;
  resize: none;
  color: var(--text);
  font-family: inherit;
  font-size: 16px;              /* 16px keeps iOS from zooming the page on focus */
  line-height: 1.4;
  max-height: 118px;
  overflow-y: hidden;
  -webkit-appearance: none;
  appearance: none;
}
.pb-input::placeholder { color: var(--text-faint); }

.pb-mic,
.pb-send {
  width: 46px;
  height: 46px;
  flex: none;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform .18s var(--bee-ease), background .2s ease, box-shadow .25s ease;
}
.pb-mic svg, .pb-send svg { width: 21px; height: 21px; }
.pb-mic:active, .pb-send:active { transform: scale(.9); }

.pb-mic {
  background: var(--bg-sunken);
  border: 1px solid var(--line);
  color: var(--text-dim);
}
.pb-mic.is-hot {
  background: linear-gradient(160deg, var(--honey-soft), var(--honey));
  border-color: var(--honey);
  color: var(--ink);              /* honey is a fixed light surface — ink is safe here */
  animation: pbMicPulse 1.2s ease-in-out infinite;
}
@keyframes pbMicPulse {
  0%, 100% { box-shadow: 0 0 0 0 var(--bee-glow); }
  70% { box-shadow: 0 0 0 12px color-mix(in srgb, var(--honey) 0%, transparent); }
}

/* send only exists when there is something to send */
.pb-send {
  background: linear-gradient(160deg, var(--honey-soft), var(--honey));
  color: var(--ink);              /* honey is a fixed light surface — ink is safe here */
  border: 1px solid transparent;
  display: none;
}
.pb-composer.has-text .pb-send { display: flex; animation: pbPop .2s var(--bee-ease) both; }
@keyframes pbPop {
  from { transform: scale(.6); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

/* =============================================================
   9. "WHAT THE BEE IS DOING" SHEET
   Rendered by core's sheet, so it sits outside .pb-beeui and
   must stand on base tokens alone.
   ============================================================= */
.pb-explain-lead {
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--text-dim);
  margin-bottom: 14px;
}
.pb-explain-row {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  padding: 11px 12px;
  border-radius: var(--radius);
  border: 1px solid transparent;
  margin-bottom: 6px;
}
.pb-explain-row.is-now {
  border-color: color-mix(in srgb, var(--honey) 48%, transparent);
  background: color-mix(in srgb, var(--honey) 13%, transparent);
}
.pb-explain-ico { font-size: 18px; line-height: 1.2; flex: none; }
.pb-explain-mid { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pb-explain-name { font-size: 14.5px; font-weight: 650; color: var(--text); }
.pb-explain-line { font-size: 12.5px; line-height: 1.45; color: var(--text-dim); }

/* =============================================================
   10. SMALL SCREENS / MOTION / A11Y
   ============================================================= */
@media (max-height: 700px) {
  .pb-transcript { padding-top: 10px; }
  .pb-msg { margin-top: 13px; }
}

@media (prefers-reduced-motion: reduce) {
  .pb-beeui *,
  .pb-beeui *::before,
  .pb-beeui *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .12s !important;
  }
  .pb-transcript { scroll-behavior: auto; }
  /* the mic-is-live signal must survive reduced motion — keep it as a
     permanent, high-contrast ring instead of a pulse */
  .pb-beeui[data-state="listening"] .pb-ring {
    opacity: .9 !important;
    transform: scale(1.3) !important;
  }
  .pb-beeui[data-state="listening"] .pb-beebtn {
    box-shadow: 0 0 0 4px var(--honey) !important;
  }
}

@media (forced-colors: active) {
  .pb-bubble, .pb-card, .pb-chip, .pb-field, .pb-mic, .pb-send, .pb-beebtn {
    border: 1px solid CanvasText;
  }
}


/* ===== css/screens.css ===== */
/* css/screens.css — Agent 8
 * Today screen + router placeholders. Tokens only, mobile-first at 390px.
 * Bottom padding clears the tab bar and the floating bee.
 */

/* ---------- shell ---------- */

/* The scroll container is #screen; `.tdy-root` is the class Today puts on it, so these
   rules only ever apply while Today is the screen on show.
   `min-height: 0` is load-bearing: without it the flex item refuses to shrink, so the
   column grows to the height of the content, the whole document scrolls instead, and
   both the tab bar and anything sticky slide off the bottom of a 390px phone.
   Bottom clearance then comes from `.tdy` alone, so there is one number, not two. */
.tdy-root {
  -webkit-overflow-scrolling: touch;
  min-height: 0;
}

#screen.tdy-root { padding-bottom: 0; }

/* On a real phone the frame has no definite height, so the flex column above still
   grows to fit and the whole document scrolls — which drags the tab bar and the
   primary action off the bottom of the screen. Giving the frame a definite height
   while Today is showing is what makes `flex: 1` mean "the leftover space".
   Scoped to the complement of the desktop phone-frame query in base.css so the
   844px preview is left exactly as it was, and harmless where :has() is missing. */
@media (max-width: 619px), (max-height: 699px) {
  #app:has(> #screen.tdy-root) { height: 100%; }
}

.tdy {
  display: flex;
  flex-direction: column;
  gap: 22px;
  max-width: 520px;
  margin: 0 auto;
  padding: 18px 16px 148px;
  box-sizing: border-box;
  color: var(--text);
}

.tdy * { box-sizing: border-box; }

.tdy-tap {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.tdy-tap:focus-visible,
.tdy-seed:focus-visible,
.tdy-primary:focus-visible,
.tdy-btn:focus-visible,
.tdy-mini:focus-visible,
.tdy-check:focus-visible {
  outline: 2px solid var(--honey);
  outline-offset: 2px;
  border-radius: var(--radius);
}

/* ---------- hero ---------- */

.tdy-hero {
  padding: 6px 2px 0;
}

.tdy-datestrip {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--text-dim);
}

.tdy-greeting {
  margin: 8px 0 0;
  font-size: 27px;
  line-height: 1.18;
  font-weight: 700;
  letter-spacing: -.015em;
  color: var(--text);
}

.tdy-subline {
  margin: 8px 0 0;
  font-size: 14.5px;
  line-height: 1.5;
  color: var(--text-dim);
  max-width: 34ch;
}

/* ---------- sections ---------- */

.tdy-section {
  display: block;
}

.tdy-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  margin: 0 4px 9px;
}

.tdy-head-label {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .15em;
  text-transform: uppercase;
  color: var(--text-dim);
}

/* Negative margin keeps the hit area at 44px without moving the text off the
   heading's baseline. */
.tdy-head-action {
  appearance: none;
  background: none;
  border: 0;
  padding: 14px 8px;
  margin: -14px -8px;
  font: inherit;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-dim);
  cursor: pointer;
}

.tdy-head-action:active { color: var(--text); }

/* ---------- card base ---------- */

/* Cards follow the theme. They used to be pinned to `--cream` while their text used
   `--text`, which on a dark phone meant near-white type on a cream card — the screen
   was effectively unreadable after dark. The deliberately dark blocks below (the
   urgent nudge, an overdue row) set both their own background and their own text,
   so they still read the same in either theme. */
.tdy-card {
  background: var(--bg-raised);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 16px;
}

/* ---------- the empty day (the normal state of a new phone) ---------- */

.tdy-blank {
  background: linear-gradient(168deg,
    color-mix(in srgb, var(--honey) 13%, var(--bg-raised)), var(--bg-raised));
  border-color: color-mix(in srgb, var(--honey) 30%, var(--line));
  padding: 22px 20px;
}

.tdy-blank-mark {
  font-size: 22px;
  line-height: 1;
}

.tdy-blank-title {
  margin: 12px 0 0;
  font-size: 20px;
  line-height: 1.25;
  font-weight: 700;
  letter-spacing: -.01em;
  color: var(--text);
}

.tdy-blank-line {
  margin: 8px 0 0;
  font-size: 14.5px;
  line-height: 1.55;
  color: var(--text-dim);
  max-width: 32ch;
}

.tdy-blank-try {
  margin: 18px 0 0;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .04em;
  color: var(--text-faint);
}

.tdy-seeds {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 9px;
}

.tdy-seed {
  appearance: none;
  font: inherit;
  font-size: 13px;
  font-weight: 500;
  min-height: 44px;
  padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--line-strong);
  background: var(--bg-sunken);
  color: var(--text);
  cursor: pointer;
}

.tdy-seed:active { background: var(--bg); }

/* ---------- primary action ---------- */

.tdy-actionbar {
  position: sticky;
  bottom: calc(var(--tabbar-h) + var(--safe-b) + 12px);
  z-index: 20;
  display: flex;
  /* keep clear of the floating bee, which parks bottom-right */
  padding-right: 74px;
  /* the bar itself is only a rail — taps fall through to the card behind it */
  pointer-events: none;
}

.tdy-primary {
  pointer-events: auto;
  appearance: none;
  font: inherit;
  flex: 1 1 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  min-height: 52px;
  padding: 0 20px;
  border-radius: 999px;
  border: 1px solid var(--honey-deep);
  background: linear-gradient(var(--honey-soft), var(--honey));
  color: var(--ink);
  font-size: 15.5px;
  font-weight: 700;
  letter-spacing: -.005em;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform .15s var(--ease);
}

/* Once it is pinned, content scrolls underneath it. Fade the page out behind the
   button so rows dissolve rather than getting sliced in half by a hard edge.
   Invisible when the bar is at rest, because it fades to the page colour. */
.tdy-actionbar::before {
  content: '';
  position: absolute;
  z-index: -1;
  left: -16px;
  right: -16px;
  top: -22px;
  bottom: -18px;
  background: linear-gradient(to bottom, transparent, var(--bg) 62%);
  pointer-events: none;
}

.tdy-primary:active { transform: scale(.97); }

.tdy-primary-plus {
  font-size: 21px;
  font-weight: 400;
  line-height: 1;
  margin-top: -2px;
}

/* ---------- proactive nudge ---------- */

.tdy-nudge {
  background: linear-gradient(158deg, var(--honey-soft), var(--cream-2));
  border-color: var(--honey);
  padding: 18px;
}

.tdy-nudge-top {
  display: flex;
  align-items: center;
  gap: 8px;
}

.tdy-nudge-mark { font-size: 15px; line-height: 1; }

.tdy-nudge-kicker {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--text);
  opacity: .72;
}

.tdy-nudge-title {
  margin: 10px 0 0;
  font-size: 21px;
  line-height: 1.25;
  font-weight: 700;
  letter-spacing: -.01em;
  color: var(--text);
}

.tdy-why {
  margin: 12px 0 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.tdy-why li {
  position: relative;
  padding-left: 15px;
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--text);
  opacity: .88;
}

.tdy-why li::before {
  content: '';
  position: absolute;
  left: 2px;
  top: 8px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--ink);
  opacity: .45;
}

.tdy-caveat {
  margin: 12px 0 0;
  padding-top: 10px;
  border-top: 1px solid color-mix(in srgb, var(--ink) 14%, transparent);
  font-size: 12.5px;
  line-height: 1.45;
  font-style: italic;
  color: var(--text);
  opacity: .7;
}

.tdy-nudge.is-urgent {
  background: var(--ink);
  border-color: var(--ink);
}

.tdy-nudge.is-urgent .tdy-nudge-kicker,
.tdy-nudge.is-urgent .tdy-why li,
.tdy-nudge.is-urgent .tdy-caveat {
  color: var(--cream);
  opacity: .74;
}

.tdy-nudge.is-urgent .tdy-nudge-title { color: var(--honey-soft); }
.tdy-nudge.is-urgent .tdy-why li::before { background: var(--honey); opacity: .9; }
.tdy-nudge.is-urgent .tdy-caveat { border-top-color: var(--ink-2); }

/* ---------- buttons ---------- */

.tdy-btnrow {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}

.tdy-btnrow-tight { margin-top: 10px; }

.tdy-btn {
  appearance: none;
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  min-height: 44px;
  padding: 0 16px;
  border-radius: 999px;
  border: 1px solid var(--ink);
  background: none;
  color: var(--text);
  cursor: pointer;
}

.tdy-btn-solid {
  background: var(--ink);
  color: var(--cream);
}

.tdy-btn-ghost {
  background: transparent;
  border-color: var(--line);
  color: var(--text);
}

.tdy-btn:active { opacity: .82; }

.tdy-nudge.is-urgent .tdy-btn-solid {
  background: var(--honey);
  border-color: var(--honey);
  color: var(--ink);
}

.tdy-nudge.is-urgent .tdy-btn-ghost {
  border-color: var(--cream-2);
  color: var(--cream);
  opacity: .85;
}

.tdy-mini {
  appearance: none;
  font: inherit;
  font-size: 12.5px;
  font-weight: 600;
  min-height: 44px;
  padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--line-strong);
  background: var(--bg-sunken);
  color: var(--text);
  cursor: pointer;
  white-space: nowrap;
}

.tdy-mini:active { background: var(--bg); }
.tdy-mini-quiet { color: var(--text-dim); }

/* ---------- next up ---------- */

.tdy-next-top {
  display: flex;
  align-items: flex-start;
  gap: 11px;
}

.tdy-next-emoji {
  font-size: 19px;
  line-height: 1.35;
  flex: 0 0 auto;
}

.tdy-next-titlewrap { flex: 1 1 auto; min-width: 0; }

.tdy-next-title {
  margin: 0;
  font-size: 17.5px;
  line-height: 1.3;
  font-weight: 700;
  letter-spacing: -.01em;
  color: var(--text);
}

.tdy-next-when {
  margin-top: 4px;
  font-size: 13px;
  color: var(--text-dim);
}

.tdy-pill {
  flex: 0 0 auto;
  align-self: flex-start;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: .01em;
  padding: 5px 10px;
  border-radius: 999px;
  background: var(--honey-soft);
  color: var(--ink);
  white-space: nowrap;
}

.tdy-pill.is-live {
  background: var(--ink);
  color: var(--honey-soft);
}

.tdy-metalist {
  margin-top: 13px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.tdy-metarow {
  display: flex;
  gap: 9px;
  align-items: flex-start;
  font-size: 13.5px;
  line-height: 1.45;
  color: var(--text-dim);
}

.tdy-metaicon { flex: 0 0 16px; font-size: 12px; line-height: 1.5; }
.tdy-metatext { min-width: 0; }

/* ---------- timeline ---------- */

.tdy-timeline { padding: 8px 14px; }

.tdy-ev {
  display: grid;
  grid-template-columns: 62px 24px 1fr;
  align-items: start;
  gap: 10px;
  padding: 11px 0;
  min-height: 44px;
}

.tdy-ev-time {
  font-size: 12px;
  font-weight: 600;
  line-height: 22px;
  color: var(--text-dim);
  text-align: right;
  white-space: nowrap;
}

.tdy-ev-rail {
  position: relative;
  height: 100%;
  min-height: 22px;
}

.tdy-ev-rail::before {
  content: '';
  position: absolute;
  left: 50%;
  top: -14px;
  bottom: -18px;
  width: 1px;
  background: var(--line);
  transform: translateX(-50%);
}

.tdy-ev:first-child .tdy-ev-rail::before { top: 11px; }
.tdy-ev:last-child .tdy-ev-rail::before { bottom: auto; height: 11px; top: -14px; }

.tdy-ev-dot {
  position: relative;
  z-index: 1;
  display: block;
  width: 24px;
  height: 24px;
  line-height: 22px;
  text-align: center;
  font-size: 11px;
  border-radius: 50%;
  background: var(--bg-raised);
  border: 1px solid var(--line);
}

.tdy-ev-main { min-width: 0; padding-top: 2px; }

.tdy-ev-title {
  font-size: 14.5px;
  font-weight: 650;
  line-height: 1.35;
  color: var(--text);
}

.tdy-ev-meta {
  margin-top: 3px;
  font-size: 12.5px;
  line-height: 1.4;
  color: var(--text-dim);
}

.tdy-ev.is-past .tdy-ev-title,
.tdy-ev.is-past .tdy-ev-time { color: var(--text-dim); }
.tdy-ev.is-past { opacity: .58; }

.tdy-ev.is-live .tdy-ev-dot {
  background: var(--honey);
  border-color: var(--honey);
}

.tdy-ev.is-live .tdy-ev-title { color: var(--text); }

.tdy-nowrow {
  display: grid;
  grid-template-columns: 62px 24px 1fr;
  align-items: center;
  gap: 10px;
  padding: 2px 0;
}

.tdy-nowtime {
  font-size: 11px;
  font-weight: 700;
  color: var(--text);
  text-align: right;
}

.tdy-nowline {
  grid-column: 2 / 4;
  height: 1px;
  background: var(--honey);
  position: relative;
}

.tdy-nowlabel {
  grid-column: 3;
  justify-self: end;
  margin-top: -9px;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink);
  background: var(--honey-soft);
  padding: 2px 6px;
  border-radius: 999px;
}

/* ---------- reminders ---------- */

.tdy-rems { padding: 8px 12px; }

.tdy-rem {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 0;
  transition: opacity .2s ease, transform .2s ease;
}

.tdy-rem + .tdy-rem { border-top: 1px solid var(--line); }

.tdy-rem.is-done { opacity: .3; transform: translateX(6px); }

.tdy-check {
  appearance: none;
  position: relative;
  flex: 0 0 auto;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 0;
  background: none;
  cursor: pointer;
}

.tdy-check::after {
  content: '';
  position: absolute;
  inset: 10px;
  border-radius: 50%;
  border: 2px solid var(--line);
  transition: background .15s ease, border-color .15s ease;
}

.tdy-check:active::after {
  background: var(--honey);
  border-color: var(--honey);
}

.tdy-rem-main {
  flex: 1 1 auto;
  min-width: 0;
  padding: 8px 4px;
}

.tdy-rem-text {
  font-size: 14.5px;
  font-weight: 600;
  line-height: 1.35;
  color: var(--text);
}

.tdy-rem-sub {
  margin-top: 3px;
  font-size: 12.5px;
  line-height: 1.4;
  color: var(--text-dim);
}

.tdy-flag {
  flex: 0 0 auto;
  align-self: center;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: 4px 8px;
  border-radius: 999px;
  background: var(--honey);
  color: var(--ink);
}

/* overdue reads urgent: inverted block, honey flag */
.tdy-rem.is-overdue {
  background: var(--ink);
  border: 1px solid var(--honey);
  border-radius: var(--radius);
  padding: 2px 10px 2px 0;
  margin: 6px 0;
  border-top: 0;
}

.tdy-rem.is-overdue + .tdy-rem { border-top: 0; }
.tdy-rem.is-overdue .tdy-rem-text { color: var(--cream); }
.tdy-rem.is-overdue .tdy-rem-sub { color: var(--honey-soft); }
.tdy-rem.is-overdue .tdy-check::after { border-color: var(--cream-2); }

/* ---------- outstanding work ---------- */

.tdy-work { padding: 6px 14px; }

.tdy-deliv {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 0;
  min-height: 44px;
}

.tdy-deliv + .tdy-deliv { border-top: 1px solid var(--line); }

.tdy-deliv-main { flex: 1 1 auto; min-width: 0; }

.tdy-deliv-what {
  font-size: 14.5px;
  font-weight: 650;
  line-height: 1.35;
  color: var(--text);
}

.tdy-deliv-meta {
  margin-top: 3px;
  font-size: 12.5px;
  line-height: 1.4;
  color: var(--text-dim);
}

.tdy-deliv.is-soon .tdy-deliv-meta { color: var(--text); font-weight: 600; }

.tdy-deliv.is-soon {
  background: var(--bg-sunken);
  border-radius: var(--radius);
  padding: 12px;
  margin: 6px 0;
  border-top: 0;
}

.tdy-deliv.is-late {
  background: var(--ink);
  border: 1px solid var(--honey);
  border-radius: var(--radius);
  padding: 12px;
  margin: 6px 0;
  border-top: 0;
}

.tdy-deliv.is-late .tdy-deliv-what { color: var(--cream); }
.tdy-deliv.is-late .tdy-deliv-meta { color: var(--honey-soft); }
.tdy-deliv.is-late .tdy-mini { background: transparent; color: var(--cream);
  border-color: color-mix(in srgb, var(--cream) 38%, transparent); }

/* ---------- BEE noticed ---------- */

.tdy-noticed { padding: 6px 14px; }

.tdy-notice { padding: 14px 0; }

.tdy-notice + .tdy-notice { border-top: 1px solid var(--line); }

.tdy-notice.is-weak {
  border: 1px dashed var(--line);
  border-radius: var(--radius);
  padding: 13px;
  margin: 8px 0;
}

.tdy-notice.is-weak + .tdy-notice { border-top: 0; }

.tdy-notice-text {
  margin: 0;
  font-size: 15px;
  line-height: 1.45;
  color: var(--text);
}

.tdy-notice.is-weak .tdy-notice-text { color: var(--text); }

.tdy-notice-ev {
  margin: 6px 0 0;
  font-size: 12.5px;
  line-height: 1.45;
  color: var(--text-dim);
}

/* ---------- moments strip ---------- */

.tdy-moments { padding: 12px; }

.tdy-strip {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  padding-bottom: 2px;
}

.tdy-strip::-webkit-scrollbar { display: none; }

.tdy-thumb {
  flex: 0 0 auto;
  width: 104px;
}

.tdy-thumb img {
  display: block;
  width: 104px;
  height: 128px;
  object-fit: cover;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--bg-sunken);
}

.tdy-thumb-note {
  display: block;
  margin-top: 6px;
  font-size: 11.5px;
  line-height: 1.35;
  color: var(--text-dim);
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

/* ---------- footer ---------- */

.tdy-foot {
  margin: 0;
  padding: 0 4px;
  font-size: 12px;
  line-height: 1.5;
  color: var(--text-dim);
  max-width: 32ch;
}

/* ---------- router placeholder ---------- */

.scr-coming {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  gap: 10px;
  max-width: 520px;
  margin: 0 auto;
  padding: 72px 28px 160px;
  color: var(--text);
}

.scr-coming-emoji { font-size: 30px; line-height: 1; }

.scr-coming-title {
  margin: 4px 0 0;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -.01em;
}

.scr-coming-line {
  margin: 0;
  font-size: 14px;
  line-height: 1.55;
  color: var(--text-dim);
  max-width: 30ch;
}

/* The .tdy-btn palette is tuned for the always-light nudge card it normally sits in.
   Out here it sits on the page itself, so it has to follow the theme. */
.scr-coming .tdy-btn {
  margin-top: 10px;
  color: var(--text);
  border-color: var(--line-strong);
}

/* ---------- motion ---------- */

@media (prefers-reduced-motion: reduce) {
  .tdy-rem,
  .tdy-check::after {
    transition: none;
  }
}


/* ===== css/reminders.css ===== */
/* css/reminders.css — Agent 3 — Reminders screen, composer, action sheet, in-app banners.
   Tokens only. Every color routes through a var() with a token-valued fallback so the file
   is safe if base.css loads late, and inherits dark mode automatically when it doesn't.
   Namespace: .rm-* and .rm-banners (banners are appended to <body>). */

/* ------------------------------------------------------------------ screen */

/* The id selector is needed because this class lands on #screen itself, and base.css
   styles #screen by id — without it the horizontal padding is dropped and the title
   sits flush against the edge while every other screen is inset.
   The class is repeated in the third selector on purpose: other screens leave their own
   `#screen.xx` class behind when the user switches tabs, and a later stylesheet would
   otherwise win the tie and hand us its padding. */
.rm-screen,
#screen.rm-screen,
#screen.rm-screen.rm-screen {
  /* column so the quiet delivery line settles at the foot even on a short list */
  display: flex;
  flex-direction: column;
  min-height: 100%;
  /* clears the tab bar and leaves room for the floating bee to sit over nothing.
     The top inset lives on the header instead, so that the scroller starts at the
     very top edge and the pinned button below has nothing sliding past above it. */
  padding: 0 var(--gutter) calc(140px + env(safe-area-inset-bottom, 0px));
  color: var(--text, #14122b);
  -webkit-tap-highlight-color: transparent;
}

.rm-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  padding: calc(var(--safe-t, 0px) + 20px) 2px 12px;
}

.rm-head-titles { min-width: 0; flex: 1 1 auto; }

.rm-title {
  margin: 0;
  font-size: 30px;
  line-height: 1.1;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--text, #14122b);
}

.rm-sub {
  margin: 6px 0 0;
  font-size: 13px;
  line-height: 1.35;
  color: var(--text-dim, #6b6483);
}

/* ------------------------------------------------------- new reminder cta */
/* The one thing this screen is for. First in the DOM, first on the eye, and it
   stays put at the top of the scroller so it is never more than a glance away. */

.rm-newwrap {
  position: sticky;
  top: var(--safe-t, 0px);      /* pins clear of the status bar, never under it */
  z-index: 5;
  background: var(--bg, #fdfbf5);
  padding: 2px 0 10px;
}

.rm-new {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  width: 100%;
  min-height: 60px;
  margin: 0;
  padding: 0 18px;
  border: none;
  border-radius: var(--radius, 18px);
  background: var(--honey, #F5B301);
  color: var(--ink, #14122b);
  font: inherit;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: -0.01em;
  cursor: pointer;
  box-shadow: 0 10px 24px -14px var(--honey, #F5B301);
  transition: transform .12s ease, filter .12s ease;
}

/* In the desktop phone frame, base.css draws a notch across the top 36px. Pin the
   button below it so the label is never covered by it. */
@media (min-width: 620px) and (min-height: 700px) {
  .rm-newwrap { top: 40px; }
}

.rm-new:active { transform: scale(.985); filter: brightness(.96); }
.rm-new-ico { display: inline-flex; }
.rm-new-label { line-height: 1; }

/* ------------------------------------------------- notification nudge line */
/* Only ever shown when there is something to fix. One tap does the fixing. */

.rm-nudge-host:empty { display: none; }

.rm-nudge {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 48px;
  margin: 0 0 16px;
  padding: 8px 10px 8px 12px;
  border: 1px solid var(--line, rgba(20, 18, 43, .10));
  border-radius: var(--radius-sm, 12px);
  background: transparent;
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.rm-nudge:active { background: var(--bg-sunken, #f6efe0); }

.rm-nudge-ico { flex: 0 0 auto; color: var(--honey-deep, #c98a00); }

.rm-nudge-text { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px; }

.rm-nudge-title {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--text, #14122b);
}

.rm-nudge-sub {
  font-size: 12px;
  line-height: 1.35;
  color: var(--text-dim, #6b6483);
}

.rm-nudge-chev { flex: 0 0 auto; color: var(--text-faint, #9a94ae); }

/* --------------------------------------------- delivery line + its sheet */
/* The honesty stays in the product; it just stops shouting. */

.rm-deliv-line {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-height: 46px;
  margin: 18px 0 0;
  padding: 0 4px;
  border: none;
  border-top: 1px solid var(--line, rgba(20, 18, 43, .10));
  border-radius: 0;
  background: none;
  font: inherit;
  text-align: left;
  cursor: pointer;
  color: var(--text-dim, #6b6483);
}

.rm-deliv-ico { flex: 0 0 auto; opacity: .8; }

.rm-deliv-label {
  flex: 1 1 auto;
  min-width: 0;
  font-size: 12.5px;
  font-weight: 600;
}

.rm-deliv-word {
  flex: 0 0 auto;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--text-faint, #9a94ae);
}

.rm-deliv-line.is-off .rm-deliv-word { color: var(--danger, var(--text-dim, #6b6483)); }
.rm-deliv-line.is-on .rm-deliv-word { color: var(--honey-deep, #c98a00); }

.rm-deliv-chev { flex: 0 0 auto; opacity: .55; }

.rm-deliv { display: block; padding: 2px 0 4px; }

.rm-deliv-headline {
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text, #14122b);
}

.rm-deliv-detail {
  margin: 8px 0 0;
  font-size: 14px;
  line-height: 1.5;
  color: var(--text-dim, #6b6483);
}

.rm-deliv-fine {
  margin: 12px 0 0;
  padding: 12px 13px;
  border-radius: var(--radius-sm, 12px);
  background: var(--bg-sunken, #f6efe0);
  font-size: 13px;
  line-height: 1.5;
  color: var(--text-dim, #6b6483);
}

.rm-deliv-facts {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px 12px;
  margin-top: 14px;
  padding-top: 13px;
  border-top: 1px solid var(--line, rgba(20, 18, 43, .10));
}

.rm-fact { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

.rm-fact-k {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--text-dim, #6b6483);
  opacity: .8;
}

.rm-fact-v {
  font-size: 13px;
  font-weight: 600;
  color: var(--text, #14122b);
  overflow-wrap: anywhere;
}

.rm-deliv-cta { margin-top: 16px; width: 100%; }

/* ------------------------------------------------------------- sections */

.rm-list { display: block; flex: 1 0 auto; }

.rm-sec { margin: 0 0 20px; }

.rm-sec-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 2px 8px;
}

.rm-sec-label {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text-dim, #6b6483);
}

.rm-sec-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 10px;
  background: var(--bg-sunken, #f6efe0);
  border: 1px solid var(--line, rgba(20, 18, 43, .10));
  font-size: 11px;
  font-weight: 700;
  color: var(--text-dim, #6b6483);
}

.rm-sec-overdue .rm-sec-label { color: var(--danger, var(--text, #14122b)); }

.rm-sec-overdue .rm-sec-count {
  background: var(--honey-soft, #FFD76B);
  color: var(--ink, #14122b);
  border-color: transparent;
}

.rm-sec-undated .rm-row { border-style: dashed; }

.rm-sec-note {
  margin: -2px 2px 8px;
  font-size: 12px;
  line-height: 1.4;
  color: var(--text-dim, #6b6483);
}

.rm-sec-items { display: flex; flex-direction: column; gap: 8px; }

/* ------------------------------------------------------------------ row */

.rm-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 10px 6px 10px 10px;
  border-radius: var(--radius, 18px);
  border: 1px solid var(--line, rgba(20, 18, 43, .10));
  background: var(--bg-raised, #fdfbf5);
  transition: background .15s ease, opacity .2s ease;
}

.rm-row.is-overdue {
  border-color: color-mix(in srgb, var(--honey, #F5B301) 55%, var(--line, rgba(20, 18, 43, .10)));
  background: color-mix(in srgb, var(--honey, #F5B301) 8%, var(--bg-raised, #fdfbf5));
}

.rm-row.is-done { opacity: .62; }

.rm-check {
  flex: 0 0 auto;
  width: 44px;
  height: 44px;
  margin: -2px 0 0 -4px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: none;
  background: none;
  padding: 0;
  cursor: pointer;
  color: transparent;
  -webkit-tap-highlight-color: transparent;
}

.rm-check::before {
  content: "";
  position: absolute;
  width: 26px;
  height: 26px;
  border-radius: 9px;
  border: 2px solid var(--line, rgba(20, 18, 43, .10));
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--text-dim, #6b6483) 18%, transparent);
  transition: background .15s ease, border-color .15s ease;
}

.rm-check { position: relative; }
.rm-check-ico { position: relative; z-index: 1; display: inline-flex; }

.rm-check:active::before { transform: scale(.92); }

.rm-check.is-checked { color: var(--text, #14122b); }

.rm-check.is-checked::before {
  background: var(--honey, #F5B301);
  border-color: var(--honey, #F5B301);
  box-shadow: none;
}

.rm-row.is-overdue .rm-check::before {
  border-color: color-mix(in srgb, var(--honey, #F5B301) 70%, transparent);
}

.rm-main { flex: 1 1 auto; min-width: 0; padding: 3px 0 2px; }

.rm-text {
  font-size: 16px;
  line-height: 1.35;
  font-weight: 600;
  letter-spacing: -0.005em;
  color: var(--text, #14122b);
  overflow-wrap: anywhere;
}

.rm-row.is-done .rm-text { text-decoration: line-through; font-weight: 500; }

.rm-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
}

.rm-time {
  font-size: 12.5px;
  line-height: 1.3;
  color: var(--text-dim, #6b6483);
}

.rm-time.is-late { color: var(--danger, var(--text, #14122b)); font-weight: 700; }
.rm-time.is-vague { font-style: italic; }

.rm-tag {
  display: inline-flex;
  align-items: center;
  height: 19px;
  padding: 0 7px;
  border-radius: 9px;
  background: var(--bg-sunken, #f6efe0);
  border: 1px solid var(--line, rgba(20, 18, 43, .10));
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .01em;
  color: var(--text-dim, #6b6483);
  white-space: nowrap;
}

.rm-tag-soft { opacity: .75; font-weight: 600; }

.rm-more {
  flex: 0 0 auto;
  width: 44px;
  height: 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: none;
  background: none;
  padding: 0;
  border-radius: 12px;
  color: var(--text-dim, #6b6483);
  cursor: pointer;
}

.rm-more:active { background: var(--bg-sunken, #f6efe0); }

/* ------------------------------------------------------------------ done */

.rm-done {
  margin: 4px 0 0;
  border-top: 1px solid var(--line, rgba(20, 18, 43, .10));
  padding-top: 12px;
}

.rm-done-summary {
  list-style: none;
  cursor: pointer;
  min-height: 44px;
  display: flex;
  align-items: center;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text-dim, #6b6483);
}

.rm-done-summary::-webkit-details-marker { display: none; }

.rm-done-summary::after {
  content: "▾";
  margin-left: 8px;
  font-size: 11px;
  transform: translateY(-1px);
}

.rm-done[open] .rm-done-summary::after { content: "▴"; }
.rm-done .rm-sec-items { padding-top: 4px; }

/* ----------------------------------------------------------------- empty */

.rm-empty {
  text-align: center;
  padding: 26px 14px 10px;
}

.rm-empty-bee { font-size: 30px; line-height: 1; }

.rm-empty-body {
  margin: 10px auto 0;
  max-width: 30ch;
  font-size: 14.5px;
  line-height: 1.5;
  color: var(--text-dim, #6b6483);
}

.rm-empty-examples {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  margin-top: 16px;
}

.rm-empty-examples .rm-chip { min-height: 44px; }

/* ----------------------------------------------------------- composer */

.rm-composer { display: block; padding: 2px 0 6px; }

.rm-field {
  border-radius: var(--radius, 18px);
  border: 1px solid var(--line, rgba(20, 18, 43, .10));
  background: var(--bg-sunken, #f6efe0);
  padding: 12px 14px;
}

.rm-input {
  display: block;
  width: 100%;
  border: none;
  outline: none;
  resize: none;
  background: transparent;
  font: inherit;
  font-size: 17px;
  line-height: 1.4;
  font-weight: 600;
  color: var(--text, #14122b);
  min-height: 52px;
}

.rm-input::placeholder { color: var(--text-dim, #6b6483); opacity: .7; font-weight: 500; }

.rm-preview {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  padding: 0 4px;
  min-height: 22px;
  font-size: 13px;
  line-height: 1.35;
  color: var(--text-dim, #6b6483);
}

.rm-preview-dot {
  width: 7px;
  height: 7px;
  flex: 0 0 auto;
  border-radius: 50%;
  background: var(--line, rgba(20, 18, 43, .10));
}

.rm-preview.is-ok .rm-preview-dot { background: var(--honey, #F5B301); }
.rm-preview.is-ok .rm-preview-text { color: var(--text, #14122b); font-weight: 700; }
.rm-preview.is-vague .rm-preview-dot { background: var(--honey-soft, #FFD76B); }
.rm-preview-text { overflow-wrap: anywhere; }

.rm-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 14px;
}

.rm-chip {
  min-height: 36px;
  padding: 0 13px;
  border-radius: 999px;
  border: 1px solid var(--line, rgba(20, 18, 43, .10));
  background: var(--bg-sunken, #f6efe0);
  color: var(--text, #14122b);
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

.rm-chip:active { background: var(--honey-soft, #FFD76B); }

.rm-save { width: 100%; margin-top: 16px; }

.rm-composer-foot {
  margin-top: 10px;
  text-align: center;
  font-size: 12px;
  color: var(--text-dim, #6b6483);
}

/* --------------------------------------------------------------- buttons */

.rm-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 46px;
  padding: 0 16px;
  border-radius: 14px;
  border: 1px solid transparent;
  font: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: transform .12s ease, filter .12s ease;
}

.rm-btn:active { transform: scale(.985); }
.rm-btn[disabled] { opacity: .45; cursor: default; }

.rm-btn-primary {
  background: var(--honey, #F5B301);
  color: var(--ink, #14122b);
}

.rm-btn-ghost {
  background: transparent;
  border-color: var(--line, rgba(20, 18, 43, .10));
  color: var(--text, #14122b);
}

/* --------------------------------------------------------- actions sheet */

.rm-actions { display: block; padding: 2px 0 4px; }

.rm-actions-head { padding: 0 4px 12px; }

.rm-actions-title {
  font-size: 17px;
  font-weight: 700;
  line-height: 1.3;
  color: var(--text, #14122b);
  overflow-wrap: anywhere;
}

.rm-actions-sub {
  margin-top: 3px;
  font-size: 13px;
  color: var(--text-dim, #6b6483);
}

.rm-actions-group {
  margin: 14px 4px 6px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--text-dim, #6b6483);
  opacity: .8;
}

.rm-action {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  min-height: 52px;
  padding: 0 14px;
  margin-bottom: 8px;
  border-radius: 14px;
  border: 1px solid var(--line, rgba(20, 18, 43, .10));
  background: var(--bg-sunken, #f6efe0);
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.rm-action:active { filter: brightness(.97); }

.rm-action-label {
  font-size: 15.5px;
  font-weight: 650;
  color: var(--text, #14122b);
}

.rm-action-sub {
  font-size: 12.5px;
  color: var(--text-dim, #6b6483);
  white-space: nowrap;
}

.rm-action-danger .rm-action-label { color: var(--danger, var(--text, #14122b)); }

/* ---------------------------------------------------- fallback sheet */

.rm-fallback-sheet {
  margin: 16px 0;
  padding: 16px;
  border-radius: var(--radius-lg, 26px);
  border: 1px solid var(--line, rgba(20, 18, 43, .10));
  background: var(--bg-raised, #fdfbf5);
}

.rm-fallback-title {
  font-size: 17px;
  font-weight: 800;
  margin-bottom: 12px;
  color: var(--text, #14122b);
}

/* ------------------------------------------------------- in-app banners */

.rm-banners {
  position: fixed;
  top: calc(8px + env(safe-area-inset-top, 0px));
  left: 8px;
  right: 8px;
  z-index: 9000;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}

.rm-banner {
  pointer-events: auto;
  border-radius: var(--radius, 18px);
  padding: 12px 12px 10px;
  background: var(--ink-2, #1b1930);
  color: var(--cream, #fdfbf5);
  border: 1px solid color-mix(in srgb, var(--honey, #F5B301) 35%, transparent);
  box-shadow: 0 18px 40px -18px color-mix(in srgb, var(--ink, #14122b) 60%, transparent);
  transform: translateY(-14px);
  opacity: 0;
  transition: transform .22s cubic-bezier(.2, .8, .3, 1), opacity .22s ease;
}

.rm-banner.is-in { transform: translateY(0); opacity: 1; }
.rm-banner.is-leaving { transform: translateY(-10px); opacity: 0; }

.rm-banner-top {
  display: flex;
  align-items: center;
  gap: 8px;
}

.rm-banner-bee { font-size: 15px; line-height: 1; }

.rm-banner-label {
  flex: 1 1 auto;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--honey-soft, #FFD76B);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.rm-banner-x {
  flex: 0 0 auto;
  width: 34px;
  height: 34px;
  margin: -6px -6px -6px 0;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: none;
  background: none;
  padding: 0;
  border-radius: 10px;
  color: var(--cream-2, #f6efe0);
  opacity: .7;
  cursor: pointer;
}

.rm-banner-text {
  margin-top: 6px;
  font-size: 16px;
  font-weight: 700;
  line-height: 1.35;
  color: var(--cream, #fdfbf5);
  overflow-wrap: anywhere;
}

.rm-banner-sub {
  margin-top: 4px;
  font-size: 12px;
  line-height: 1.4;
  color: var(--cream-2, #f6efe0);
  opacity: .72;
}

.rm-banner-acts {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}

.rm-banner-acts .rm-btn {
  min-height: 40px;
  flex: 1 1 auto;
  font-size: 14px;
}

.rm-banner-acts .rm-btn-ghost {
  color: var(--cream, #fdfbf5);
  border-color: color-mix(in srgb, var(--cream, #fdfbf5) 28%, transparent);
}

/* --------------------------------------------------------------- misc */

.rm-ico { display: inline-flex; align-items: center; justify-content: center; }
.rm-ico svg { display: block; }

.rm-screen button:focus-visible,
.rm-composer button:focus-visible,
.rm-actions button:focus-visible,
.rm-banner button:focus-visible,
.rm-input:focus-visible {
  outline: 2px solid var(--honey, #F5B301);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: reduce) {
  .rm-banner,
  .rm-btn,
  .rm-new,
  .rm-check::before { transition: none; }
}

@media (min-width: 480px) {
  .rm-screen { max-width: 560px; margin: 0 auto; }
  .rm-banners { left: 50%; right: auto; transform: translateX(-50%); width: min(520px, calc(100vw - 16px)); }
}


/* ===== css/photo.css ===== */
/* =============================================================================
   css/photo.css — Agent 4 — Moments

   The whole visual argument of this screen: the user's note is loud, dark and
   first; BEE's guess is quiet, dimmed, boxed off and second. Never invert this.

   Colours are tokens from css/base.css only. Where transparency is needed the
   rgb triples are the token values themselves (--ink 20,18,43 / --cream 253,251,245).
   ========================================================================== */

/* This class lands on #screen itself, and base.css styles #screen by id — an id beats a
   class, so a plain `.pb-moments` padding is silently discarded and the whole screen sits
   flush against both edges. Matching the id here is what makes the padding stick. */
.pb-moments,
#screen.pb-moments {
  --pm-ink-rgb: 20, 18, 43;
  --pm-cream-rgb: 253, 251, 245;
  --pm-gap: 14px;

  display: block;
  padding: calc(var(--safe-t) + 18px) var(--gutter) 140px;
  color: var(--text);
  -webkit-tap-highlight-color: transparent;
}

/* ---------------------------------------------------------------- header - */

.pm-head { padding: 10px 0 6px; }

.pm-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.pm-title {
  margin: 0;
  font-size: 30px;
  line-height: 1.1;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--text);
}

.pm-sub {
  margin: 8px 0 0;
  font-size: 13.5px;
  line-height: 1.45;
  color: var(--text-dim);
  max-width: 30ch;
}

.pm-view-toggle {
  width: 44px;
  height: 44px;
  flex: 0 0 44px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--bg-sunken);
  color: var(--text-dim);
  cursor: pointer;
}

.pm-view-toggle:active { transform: scale(0.94); }

.pm-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

/* ------------------------------------------------------------ storage warn */

.pm-warn {
  margin: 12px 0 4px;
  padding: 14px 16px;
  border-radius: var(--radius);
  background: var(--honey-soft);
  border: 1px solid var(--honey);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
}

.pm-warn-text {
  margin: 0;
  font-size: 14px;
  line-height: 1.45;
  font-weight: 600;
  color: var(--text);
}

/* --------------------------------------------------------- capture buttons */

.pm-actions {
  display: flex;
  gap: 10px;
  margin: 16px 0 6px;
}

.pm-capture {
  flex: 1 1 auto;
  min-height: 56px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 0 16px;
  border: none;
  border-radius: var(--radius);
  background: var(--honey);
  color: var(--ink);
  font-size: 15.5px;
  font-weight: 700;
  cursor: pointer;
}

.pm-capture:active { transform: scale(0.985); }

.pm-capture-alt {
  flex: 0 0 auto;
  background: var(--bg-sunken);
  color: var(--text-dim);
  border: 1px solid var(--line);
  font-weight: 600;
}

.pm-capture-alt .pm-capture-label {
  font-size: 14px;
}

/* ------------------------------------------------------------------ search */

.pm-search {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 14px 0 4px;
  padding: 0 14px;
  min-height: 48px;
  border-radius: var(--radius);
  background: var(--bg-sunken);
  border: 1px solid var(--line);
  color: var(--text-dim);
}

.pm-search-input {
  flex: 1 1 auto;
  min-width: 0;
  border: none;
  background: transparent;
  font: inherit;
  font-size: 15px;
  color: var(--text);
  padding: 12px 0;
  outline: none;
  -webkit-appearance: none;
  appearance: none;
}

.pm-search-input::placeholder { color: var(--text-dim); }

/* ------------------------------------------------------------------- list */

.pm-list {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: var(--pm-gap);
}

.pm-list[data-view="grid"] {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.pm-group {
  margin: 14px 0 -2px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-dim);
}

.pm-list[data-view="feed"] .pm-group:first-child { margin-top: 4px; }

/* ------------------------------------------------------------------- card */

.pm-card {
  background: var(--bg-raised);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: 0 2px 10px rgba(var(--pm-ink-rgb), 0.05);
}

.pm-thumb {
  position: relative;
  display: block;
  width: 100%;
  padding: 0;
  border: none;
  background: var(--bg-sunken);
  aspect-ratio: 4 / 3;
  cursor: pointer;
  overflow: hidden;
}

.pm-thumb-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.pm-thumb.is-broken {
  display: flex;
  align-items: center;
  justify-content: center;
}

.pm-thumb-fallback { font-size: 30px; opacity: 0.5; }

.pm-pin-mark {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 32px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 999px;
  background: var(--honey);
  color: var(--ink);
}

.pm-pin-mark svg { width: 15px; height: 15px; }

.pm-body { padding: 14px 16px 16px; }

/* ---- 1. HER WORDS. Loud. First. Never dimmed. ---------------------------- */

.pm-note {
  margin: 0;
  font-size: 18px;
  line-height: 1.35;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.pm-note-empty {
  display: block;
  width: 100%;
  min-height: 44px;
  text-align: left;
  padding: 0;
  border: none;
  background: transparent;
  font: inherit;
  font-size: 17px;
  font-weight: 700;
  color: var(--text-dim);
  cursor: pointer;
}

.pm-meta {
  margin: 7px 0 0;
  font-size: 12.5px;
  color: var(--text-dim);
}

/* ---- 2. BEE'S GUESS. Quiet. Second. Boxed off. Dismissible. -------------- */

.pm-guess {
  margin-top: 14px;
  padding: 12px 13px 13px;
  border-radius: var(--radius);
  background: var(--bg-sunken);
  border: 1px dashed var(--line);
}

.pm-guess-idle { border-style: dashed; padding: 4px; background: transparent; }

.pm-guess-ask {
  display: block;
  width: 100%;
  min-height: 44px;
  padding: 0 12px;
  border: none;
  border-radius: calc(var(--radius) - 4px);
  background: transparent;
  font: inherit;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text-dim);
  text-align: left;
  cursor: pointer;
}

.pm-guess-ask:disabled { opacity: 0.6; cursor: default; }

.pm-guess-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}

.pm-guess-label {
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: var(--text-dim);
}

.pm-guess-conf {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--text-dim);
  white-space: nowrap;
}

.pm-guess-bar {
  margin: 8px 0 9px;
  height: 3px;
  border-radius: 999px;
  background: rgba(var(--pm-ink-rgb), 0.08);
  overflow: hidden;
}

.pm-guess-bar-fill {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: var(--honey-soft);
}

.pm-guess-text {
  margin: 0;
  font-size: 13.5px;
  line-height: 1.45;
  font-weight: 400;
  font-style: italic;
  color: var(--text-dim);
  overflow-wrap: anywhere;
}

.pm-guess-actions {
  display: flex;
  gap: 8px;
  margin-top: 11px;
  flex-wrap: wrap;
}

.pm-chip {
  min-height: 44px;
  padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-raised);
  font: inherit;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text-dim);
  cursor: pointer;
}

.pm-chip:active { transform: scale(0.97); }

.pm-chip-wrong {
  border-color: rgba(var(--pm-ink-rgb), 0.28);
  color: var(--text);
  font-weight: 700;
}

.pm-guess-dot {
