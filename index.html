  margin: 6px 0 0;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: var(--text-dim);
}

/* ------------------------------------------------------------ compact card */

.pm-card-compact { border-radius: var(--radius); }
.pm-card-compact .pm-thumb { aspect-ratio: 1 / 1; }
.pm-card-compact .pm-body { padding: 10px 11px 12px; }

.pm-card-compact .pm-note,
.pm-card-compact .pm-note-empty {
  font-size: 14px;
  line-height: 1.3;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.pm-card-compact .pm-meta { font-size: 11.5px; }

/* ------------------------------------------------------------------ empty */

.pm-empty {
  margin-top: 30px;
  padding: 34px 24px;
  text-align: center;
  border: 1px dashed var(--line);
  border-radius: var(--radius-lg);
  background: var(--bg-sunken);
}

.pm-empty-mark { font-size: 34px; display: block; margin-bottom: 10px; }

.pm-empty-title {
  margin: 0;
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
}

.pm-empty-sub {
  margin: 8px auto 0;
  max-width: 26ch;
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--text-dim);
}

/* ------------------------------------------------------- note editor + mic */

.pm-note-editor { margin-top: 10px; }

.pm-note-row {
  display: flex;
  align-items: flex-end;
  gap: 10px;
}

.pm-note-input {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 76px;
  padding: 13px 14px;
  border-radius: var(--radius);
  border: 1.5px solid var(--line);
  background: var(--bg-raised);
  font: inherit;
  font-size: 16.5px;   /* >=16px so iOS doesn't zoom */
  font-weight: 600;
  line-height: 1.4;
  color: var(--text);
  resize: none;
  outline: none;
}

.pm-note-input:focus { border-color: var(--honey); }
.pm-note-input::placeholder { font-weight: 400; color: var(--text-dim); }

.pm-mic {
  position: relative;
  flex: 0 0 52px;
  width: 52px;
  height: 52px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-sunken);
  color: var(--text-dim);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.pm-mic.is-unavailable { opacity: 0.5; }

.pm-mic.is-listening {
  background: var(--honey);
  border-color: var(--honey);
  color: var(--ink);
}

.pm-mic-pulse {
  position: absolute;
  inset: -4px;
  border-radius: 999px;
  border: 2px solid var(--honey);
  opacity: 0;
  pointer-events: none;
}

.pm-mic.is-listening .pm-mic-pulse {
  animation: pm-pulse 1.4s ease-out infinite;
}

@keyframes pm-pulse {
  0%   { opacity: 0.9; transform: scale(0.9); }
  100% { opacity: 0;   transform: scale(1.25); }
}

@media (prefers-reduced-motion: reduce) {
  .pm-mic.is-listening .pm-mic-pulse { animation: none; opacity: 0.7; }
}

/* --------------------------------------------------------- capture prompt */

.pm-ask { padding: 2px 0 8px; }

.pm-ask-figure {
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--bg-sunken);
  max-height: 34vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.pm-ask-img {
  width: 100%;
  max-height: 34vh;
  object-fit: cover;
  display: block;
}

.pm-ask-q {
  margin: 16px 0 4px;
  font-size: 21px;
  font-weight: 800;
  letter-spacing: -0.015em;
  color: var(--text);
}

.pm-ask-sub {
  margin: 0;
  font-size: 13px;
  line-height: 1.45;
  color: var(--text-dim);
}

.pm-ask-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 16px;
}

.pm-btn {
  min-height: 50px;
  padding: 0 18px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--bg-sunken);
  font: inherit;
  font-size: 15.5px;
  font-weight: 700;
  color: var(--text);
  cursor: pointer;
}

.pm-btn:active { transform: scale(0.985); }

.pm-btn-primary {
  background: var(--honey);
  border-color: var(--honey);
  color: var(--ink);
}

.pm-btn-quiet {
  background: var(--bg-sunken);
  color: var(--text-dim);
  font-weight: 600;
}

.pm-btn-text {
  background: transparent;
  border-color: transparent;
  color: var(--text-dim);
  font-weight: 600;
  min-height: 44px;
}

.pm-btn-danger {
  background: transparent;
  border-color: rgba(var(--pm-ink-rgb), 0.25);
  color: var(--text);
}

/* ------------------------------------------------------------ detail sheet */

.pm-detail { padding: 2px 0 10px; }

.pm-detail-figure {
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--bg-sunken);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 120px;
}

.pm-detail-img {
  width: 100%;
  max-height: 44vh;
  object-fit: contain;
  display: block;
}

.pm-detail-when {
  margin: 10px 0 0;
  font-size: 12.5px;
  color: var(--text-dim);
}

.pm-detail-h {
  margin: 18px 0 0;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--text);
}

.pm-detail-h-quiet {
  color: var(--text-dim);
  font-weight: 700;
  margin-top: 26px;
}

.pm-detail-saverow { margin-top: 12px; display: flex; }
.pm-detail-saverow .pm-btn { flex: 1 1 auto; }

.pm-detail-guess { margin-top: 8px; }
.pm-detail-guess .pm-guess { margin-top: 0; }

.pm-tagrow {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 16px;
}

.pm-tag {
  padding: 6px 11px;
  border-radius: 999px;
  background: var(--bg-sunken);
  border: 1px solid var(--line);
  font-size: 12px;
  font-weight: 600;
  color: var(--text-dim);
}

.pm-detail-footer {
  display: flex;
  gap: 8px;
  margin-top: 24px;
}

.pm-detail-footer .pm-btn { flex: 1 1 50%; }

/* ------------------------------------------------------------------ misc */

.pm-hidden-input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
  left: -9999px;
}

/* Fallback sheet — only used if PB.ui.sheet is unavailable. */

.pm-fallback-backdrop {
  position: fixed;
  inset: 0;
  z-index: 900;
  background: rgba(var(--pm-ink-rgb), 0.45);
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.pm-fallback-panel {
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 8px 16px calc(20px + env(safe-area-inset-bottom, 0px));
  background: var(--bg-raised);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
}

.pm-fallback-head {
  position: sticky;
  top: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 0;
  background: var(--bg-raised);
}

.pm-fallback-title {
  margin: 0;
  font-size: 17px;
  font-weight: 800;
  color: var(--text);
}

.pm-fallback-x {
  width: 44px;
  height: 44px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-sunken);
  color: var(--text-dim);
  font-size: 15px;
  cursor: pointer;
}


/* ===== css/memory.css ===== */
/* =============================================================================
 * css/memory.css — Agent 5 — the BEE screen (PB.memory.renderScreen)
 *
 * Quiet, warm, paper-like. This screen has to feel like being looked after,
 * not like a dashboard. So: prose over metrics, honey used sparingly as a
 * mark of care, and the forgetting countdown given real visual weight.
 *
 * Tokens only. Everything derived from the guaranteed CSS variables.
 * ========================================================================== */

.pbm {
  /* local derivations — all traceable back to guaranteed tokens */
  --pbm-shadow: var(--line);
  --pbm-shadow: color-mix(in srgb, var(--ink) 7%, transparent);
  --pbm-shadow-lift: var(--line);
  --pbm-shadow-lift: color-mix(in srgb, var(--ink) 12%, transparent);
  --pbm-honey-wash: var(--cream-2);
  --pbm-honey-wash: color-mix(in srgb, var(--honey) 12%, var(--cream));
  --pbm-honey-edge: var(--honey-soft);
  --pbm-honey-edge: color-mix(in srgb, var(--honey) 45%, transparent);
  --pbm-pip-off: var(--line);
  --pbm-pip-off: color-mix(in srgb, var(--ink) 14%, transparent);
  --pbm-ink-soft: var(--text-dim);

  display: block;
  padding: 18px 16px calc(96px + env(safe-area-inset-bottom, 0px));
  color: var(--text);
  -webkit-text-size-adjust: 100%;
}

/* ---------------------------------------------------------------- header -- */

.pbm-head { margin: 4px 2px 20px; }

.pbm-eyebrow {
  font-size: 11px;
  letter-spacing: .18em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--honey);
  margin-bottom: 8px;
}

.pbm-title {
  font-size: 27px;
  line-height: 1.18;
  font-weight: 700;
  letter-spacing: -.02em;
  margin: 0 0 10px;
  color: var(--text);
}

.pbm-sub {
  margin: 0;
  font-size: 14.5px;
  line-height: 1.55;
  color: var(--text-dim);
  max-width: 34ch;
}

/* ----------------------------------------------------------------- cards -- */

.pbm-card {
  background: var(--bg-raised);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 20px 18px;
  margin-bottom: 18px;
  box-shadow: 0 1px 2px var(--pbm-shadow), 0 10px 24px -18px var(--pbm-shadow-lift);
}

.pbm-h2 {
  font-size: 12px;
  letter-spacing: .12em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--text-dim);
  margin: 0 0 14px;
}

.pbm-sec { margin-bottom: 18px; }
.pbm-sec-head { padding: 4px 2px; }
.pbm-sec-head .pbm-h2 { margin-bottom: 12px; }

.pbm-foot {
  margin: 14px 0 0;
  font-size: 12.5px;
  line-height: 1.5;
  color: var(--text-dim);
}

/* ------------------------------------------------------------------ mood -- */

.pbm-mood {
  background: var(--pbm-honey-wash);
  border-color: var(--pbm-honey-edge);
}

.pbm-mood-line {
  margin: 0 0 14px;
  font-size: 21px;
  line-height: 1.35;
  font-weight: 600;
  letter-spacing: -.015em;
  color: var(--text);
  text-wrap: pretty;
}

.pbm-why {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--pbm-honey-edge);
}

.pbm-why-label {
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--text-dim);
  margin-bottom: 8px;
}

.pbm-why-list {
  margin: 0;
  padding: 0;
  list-style: none;
}

.pbm-why-list li {
  position: relative;
  padding-left: 16px;
  margin-bottom: 6px;
  font-size: 14px;
  line-height: 1.5;
  color: var(--text);
}

.pbm-why-list li::before {
  content: "";
  position: absolute;
  left: 2px;
  top: 9px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--honey);
}

.pbm-why-none { margin: 0; font-size: 14px; line-height: 1.5; color: var(--text-dim); }

.pbm-mood-actions {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}
.pbm-mood-actions .pbm-btn { flex: 1; }

/* ---------------------------------------------------------------- traits -- */

.pbm-prose { margin: 0; }

.pbm-prose p {
  margin: 0 0 12px;
  font-size: 16px;
  line-height: 1.62;
  color: var(--text);
  text-wrap: pretty;
}
.pbm-prose p:last-child { margin-bottom: 0; }

.pbm-prose-caveat {
  font-size: 14px !important;
  color: var(--text-dim) !important;
  font-style: italic;
  padding-top: 4px;
}

.pbm-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 16px;
}

.pbm-chip {
  display: inline-block;
  padding: 7px 13px;
  border-radius: 999px;
  background: var(--bg-sunken);
  border: 1px solid var(--line);
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}

.pbm-chip-weak {
  background: transparent;
  color: var(--text-dim);
  font-weight: 500;
  border-style: dashed;
}

.pbm-stress {
  margin-top: 18px;
  padding: 14px;
  border-radius: var(--radius);
  background: var(--bg-sunken);
}

.pbm-stress-label {
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: uppercase;
  font-weight: 700;
  color: var(--text-dim);
  margin-bottom: 10px;
}

.pbm-stress-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 8px;
}
.pbm-stress-row:last-child { margin-bottom: 0; }

.pbm-dot {
  flex: none;
  width: 7px;
  height: 7px;
  margin-top: 7px;
  border-radius: 50%;
  background: var(--honey);
}

.pbm-stress-txt { font-size: 14px; line-height: 1.5; }
.pbm-stress-txt strong { font-weight: 650; color: var(--text); }
.pbm-stress-why { color: var(--text-dim); }

/* ------------------------------------------------------- memory items ---- */

.pbm-item {
  background: var(--bg-raised);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 16px 16px 14px;
  margin-bottom: 12px;
  box-shadow: 0 1px 2px var(--pbm-shadow);
}

.pbm-item.is-saved {
  border-color: var(--pbm-honey-edge);
  box-shadow: inset 3px 0 0 var(--honey), 0 1px 2px var(--pbm-shadow);
}

.pbm-item.is-weak { border-style: dashed; }

.pbm-item-top {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 10px;
}

.pbm-badge {
  display: inline-block;
  padding: 4px 9px;
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--text-dim);
  background: var(--bg-sunken);
  border: 1px solid var(--line);
}

.pbm-badge-told {
  color: var(--text);
  background: var(--bg-sunken);
}

.pbm-badge-saved {
  color: var(--ink);
  background: var(--honey-soft);
  border-color: var(--pbm-honey-edge);
}

.pbm-item-text {
  margin: 0 0 12px;
  font-size: 16.5px;
  line-height: 1.5;
  color: var(--text);
  font-weight: 500;
  letter-spacing: -.005em;
  text-wrap: pretty;
}

.pbm-item.is-weak .pbm-item-text { font-weight: 450; color: var(--text); }

/* ------------------------------------------------------------ confidence -- */

.pbm-conf {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 4px 8px;
  margin-bottom: 12px;
}

.pbm-pips {
  display: inline-flex;
  gap: 3px;
  align-self: center;
}

.pbm-pip {
  width: 16px;
  height: 5px;
  border-radius: 3px;
  background: var(--pbm-pip-off);
}
.pbm-pip.is-on { background: var(--honey); }

.pbm-conf-word {
  font-size: 12.5px;
  font-weight: 650;
  color: var(--text);
}

.pbm-conf-note {
  font-size: 12.5px;
  line-height: 1.45;
  color: var(--text-dim);
  flex: 1 1 100%;
}

/* -------------------------------------------------------------- evidence -- */

.pbm-ev {
  margin: 0 0 12px;
  border-top: 1px solid var(--line);
  padding-top: 10px;
}

.pbm-ev > summary {
  list-style: none;
  cursor: pointer;
  font-size: 12.5px;
  font-weight: 650;
  color: var(--text-dim);
  padding: 8px 0;
  min-height: 24px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.pbm-ev > summary::-webkit-details-marker { display: none; }

.pbm-ev > summary::after {
  content: "+";
  font-weight: 700;
  font-size: 14px;
  color: var(--honey);
}
.pbm-ev[open] > summary::after { content: "–"; }

.pbm-ev-list {
  margin: 2px 0 0;
  padding: 0 0 0 2px;
  list-style: none;
}

.pbm-ev-list li {
  position: relative;
  padding-left: 14px;
  margin-bottom: 5px;
  font-size: 13px;
  line-height: 1.45;
  color: var(--text-dim);
}
.pbm-ev-list li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 8px;
  width: 6px;
  height: 1px;
  background: var(--text-dim);
}

.pbm-ev-foot {
  margin: 8px 0 2px;
  font-size: 12px;
  color: var(--text-dim);
  font-style: italic;
}

/* ------------------------------------------------- the forgetting clock --- */

.pbm-life {
  margin: 0 0 12px;
  padding-top: 2px;
}

.pbm-bar {
  height: 3px;
  border-radius: 3px;
  background: var(--pbm-pip-off);
  overflow: hidden;
  margin-bottom: 7px;
}

.pbm-bar-fill {
  height: 100%;
  border-radius: 3px;
  background: var(--honey-soft);
  transition: width .6s linear;
}

.pbm-life-txt {
  display: block;
  font-size: 12px;
  line-height: 1.4;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}

.pbm-life.is-kept .pbm-life-txt {
  color: var(--text);
  font-weight: 550;
}

/* --------------------------------------------------------------- actions -- */

.pbm-actions {
  display: flex;
  gap: 10px;
}

.pbm-actions-wide { margin-top: 16px; }
.pbm-actions-wide .pbm-btn { flex: 1; }

.pbm-btn {
  flex: 1;
  min-height: 44px;
  padding: 12px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--bg-sunken);
  color: var(--text);
  font: inherit;
  font-size: 14.5px;
  font-weight: 650;
  letter-spacing: -.005em;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform .12s ease, background .16s ease, border-color .16s ease;
}

.pbm-btn:active { transform: scale(.975); }

.pbm-btn-save {
  background: var(--honey);
  border-color: var(--honey);
  color: var(--ink);
}

.pbm-btn-forget {
  background: transparent;
  color: var(--text-dim);
}
.pbm-btn-forget:active { background: var(--bg-sunken); }

.pbm-btn-ghost {
  background: transparent;
  color: var(--text);
}

/* ------------------------------------------------- what I've let go of ---- */

.pbm-forget { background: var(--bg-sunken); }

.pbm-forget-line {
  margin: 0 0 16px;
  font-size: 15px;
  line-height: 1.55;
  color: var(--text);
  text-wrap: pretty;
}

.pbm-stats {
  display: flex;
  gap: 10px;
}

.pbm-stat {
  flex: 1;
  text-align: center;
  padding: 12px 6px;
  border-radius: var(--radius);
  background: var(--bg-raised);
  border: 1px solid var(--line);
}

.pbm-stat-n {
  font-size: 22px;
  font-weight: 700;
  line-height: 1.1;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

.pbm-stat-l {
  margin-top: 4px;
  font-size: 11px;
  line-height: 1.3;
  color: var(--text-dim);
}

/* ----------------------------------------------------------------- empty -- */

.pbm-empty p {
  margin: 0 0 8px;
  font-size: 15.5px;
  line-height: 1.55;
  color: var(--text);
  text-wrap: pretty;
}
.pbm-empty p:last-child { margin-bottom: 0; }

/* --------------------------------------------------------------- motion --- */

@media (prefers-reduced-motion: reduce) {
  .pbm-btn, .pbm-bar-fill { transition: none; }
  .pbm-btn:active { transform: none; }
}

/* Narrow phones (≤360px) — keep tap targets, shed padding. */
@media (max-width: 360px) {
  .pbm { padding-left: 12px; padding-right: 12px; }
  .pbm-card { padding: 16px 14px; }
  .pbm-title { font-size: 24px; }
  .pbm-mood-line { font-size: 19px; }
  .pbm-btn { font-size: 14px; padding: 12px 10px; }
}


/* ===== css/trust.css ===== */
/* ==========================================================================
   Personalbee — css/trust.css  (Agent 9)
   Trust screen + the just-in-time permission sheet.

   Tokens only. No hex value appears in this file that is not already a token
   in css/base.css. Pass / fail / not-applicable are carried by honey, ink and
   cream rather than green and red — this screen states facts, it does not
   alarm anyone.

   Mobile first, built for 390x844. Every tap target is at least 44px.
   ========================================================================== */

.pb-trust {
  padding: 14px 14px 96px;
  color: var(--text);
  -webkit-text-size-adjust: 100%;
}

.pb-trust *,
.pb-trust *::before,
.pb-trust *::after { box-sizing: border-box; }

/* --------------------------------------------------------------------------
   Cards + section headings
   -------------------------------------------------------------------------- */

.pbt-card {
  background: var(--bg-raised);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 18px 16px;
  margin: 0 0 14px;
}

.pbt-head {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin: 0 0 14px;
}

.pbt-num {
  flex: 0 0 auto;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--honey-soft);
  color: var(--ink);
  font-size: 13px;
  font-weight: 700;
  line-height: 28px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.pbt-h2 {
  margin: 3px 0 0;
  font-size: 17px;
  line-height: 1.25;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.pbt-sub {
  margin: 6px 0 0;
  font-size: 13px;
  line-height: 1.5;
  color: var(--text-dim);
}

.pb-trust code {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 0.92em;
  background: var(--bg-sunken);
  border-radius: 6px;
  padding: 1px 5px;
}

/* --------------------------------------------------------------------------
   Hero
   -------------------------------------------------------------------------- */

.pbt-hero {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--cream);
  padding: 22px 18px;
}

.pbt-kicker {
  margin: 0;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--honey);
}

.pbt-h1 {
  margin: 8px 0 0;
  font-size: 27px;
  line-height: 1.12;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--cream);
}

.pbt-lede {
  margin: 10px 0 0;
  font-size: 14px;
  line-height: 1.55;
  color: var(--cream-2);
  opacity: 0.86;
}

.pbt-stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  margin: 18px 0 0;
  background: var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}

.pbt-stats-2 { grid-template-columns: 1fr 1fr; background: var(--line); }

.pbt-stat {
  background: var(--ink-2);
  padding: 13px 12px;
  min-height: 76px;
}

.pbt-stat b {
  display: block;
  font-size: 22px;
  line-height: 1.1;
  font-weight: 800;
  color: var(--honey);
  font-variant-numeric: tabular-nums;
}

.pbt-stat span {
  display: block;
  margin-top: 5px;
  font-size: 11px;
  line-height: 1.35;
  color: var(--cream-2);
  opacity: 0.72;
}

/* the same stat block used on a light card (section 4) */
.pbt-card:not(.pbt-hero) .pbt-stat { background: var(--bg-sunken); }
.pbt-card:not(.pbt-hero) .pbt-stat b { color: var(--text); }
.pbt-card:not(.pbt-hero) .pbt-stat span { color: var(--text-dim); opacity: 1; }

.pbt-hero-foot {
  margin: 14px 0 0;
  font-size: 12px;
  line-height: 1.5;
  color: var(--cream-2);
  opacity: 0.7;
}

/* --------------------------------------------------------------------------
   Rows + the airplane toggle
   -------------------------------------------------------------------------- */

.pbt-row {
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 56px;
}

.pbt-row-main { flex: 1 1 auto; min-width: 0; }

.pbt-row-title {
  font-size: 15px;
  font-weight: 700;
  line-height: 1.3;
}

.pbt-row-note {
  margin-top: 5px;
  font-size: 12.5px;
  line-height: 1.5;
  color: var(--text-dim);
}

.pbt-toggle {
  flex: 0 0 auto;
  position: relative;
  width: 62px;
  height: 44px;
  padding: 0 6px;
  border: 0;
  background: transparent;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.pbt-toggle::before {
  content: "";
  position: absolute;
  inset: 8px 0;
  border-radius: 999px;
  background: var(--bg-sunken);
  border: 1px solid var(--line);
  transition: background 160ms ease, border-color 160ms ease;
}

.pbt-toggle.is-on::before {
  background: var(--honey);
  border-color: var(--honey);
}

.pbt-knob {
  position: absolute;
  top: 11px;
  left: 3px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--bg-raised);
  border: 1px solid var(--line);
  transition: transform 160ms ease;
}

.pbt-toggle.is-on .pbt-knob { transform: translateX(28px); border-color: var(--honey); }

.pbt-toggle:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 999px; }

/* fine print block: the precise scope of the block */
.pbt-fine {
  margin: 14px 0 0;
  padding: 12px 13px;
  background: var(--bg-sunken);
  border-radius: var(--radius);
  font-size: 12.5px;
  line-height: 1.55;
  color: var(--text-dim);
}

.pbt-fine div + div { margin-top: 7px; }
.pbt-fine b { color: var(--text); font-weight: 700; }

/* --------------------------------------------------------------------------
   Buttons
   -------------------------------------------------------------------------- */

.pbt-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 48px;
  width: 100%;
  padding: 12px 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--bg-raised);
  color: var(--text);
  font: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform 90ms ease, opacity 120ms ease;
}

.pbt-btn:active { transform: scale(0.985); }
.pbt-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.pbt-btn[disabled] { opacity: 0.55; cursor: default; }

.pbt-btn-primary {
  background: var(--honey);
  border-color: var(--honey);
  color: var(--ink);
}

.pbt-btn-danger {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--cream);
  min-height: 60px;
  font-size: 16px;
  margin-top: 14px;
}

.pbt-btn-small {
  width: auto;
  min-height: 44px;
  padding: 10px 16px;
  font-size: 13.5px;
  background: var(--bg-sunken);
}

.pbt-btn-ghost { background: transparent; color: var(--text-dim); }

.pbt-fineprint {
  margin: 10px 0 0;
  font-size: 12px;
  line-height: 1.55;
  color: var(--text-dim);
}

/* --------------------------------------------------------------------------
   1 — the prove-it result
   -------------------------------------------------------------------------- */

.pbt-prove { margin-top: 16px; }

.pbt-result {
  margin: 12px 0 0;
  padding: 13px 14px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--bg-sunken);
  font-size: 13px;
  line-height: 1.55;
}

.pbt-result.is-ok {
  background: var(--honey-soft);
  border-color: var(--honey);
}

.pbt-result.is-bad {
  background: var(--ink-2);
  border-color: var(--ink);
  color: var(--cream);
}

.pbt-result-top {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 6px;
  font-size: 14px;
  font-weight: 800;
  margin-bottom: 9px;
}

.pbt-result-time {
  font-size: 11.5px;
  font-weight: 600;
  opacity: 0.7;
  font-variant-numeric: tabular-nums;
}

.pbt-result-line { margin-top: 6px; }
.pbt-result-line b {
  display: inline-block;
  min-width: 118px;
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 11.5px;
  text-transform: none;
  opacity: 0.75;
}

.pbt-dim { opacity: 0.7; font-size: 12px; }

/* --------------------------------------------------------------------------
   2 — erase + the wipe receipt
   -------------------------------------------------------------------------- */

.pbt-erase-now {
  font-size: 14px;
  line-height: 1.5;
  margin-bottom: 12px;
}

.pbt-erase-now b { font-variant-numeric: tabular-nums; }

.pbt-keylist {
  list-style: none;
  margin: 0;
  padding: 0;
  border-top: 1px solid var(--line);
}

.pbt-keylist li {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 2px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  line-height: 1.4;
}

.pbt-keylist li span { min-width: 0; }
.pbt-keylist li b {
  flex: 0 0 auto;
  font-variant-numeric: tabular-nums;
  color: var(--text-dim);
  font-weight: 600;
}

.pbt-receipt {
  margin-top: 16px;
  padding: 14px;
  border: 1px solid var(--honey);
  border-radius: var(--radius);
  background: var(--honey-soft);
}

.pbt-receipt-top {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text);
  opacity: 0.75;
}

.pbt-ba {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 12px 0 4px;
}

.pbt-ba > div:not(.pbt-arrow) {
  flex: 1 1 0;
  background: var(--bg-raised);
  border-radius: var(--radius);
  padding: 11px 12px;
  min-width: 0;
}

.pbt-ba span {
  display: block;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-dim);
}

.pbt-ba b {
  display: block;
  margin-top: 3px;
  font-size: 20px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

.pbt-ba i {
  display: block;
  margin-top: 2px;
  font-size: 11.5px;
  font-style: normal;
  color: var(--text-dim);
}

.pbt-arrow { flex: 0 0 auto; font-size: 17px; color: var(--text); opacity: 0.5; }

.pbt-receipt-label {
  margin: 12px 0 2px;
  font-size: 12px;
  font-weight: 700;
}

.pbt-receipt .pbt-keylist li { border-bottom-color: var(--line); }
.pbt-receipt .pbt-fineprint { color: var(--text); opacity: 0.75; }

/* --------------------------------------------------------------------------
   3 — identifiers
   -------------------------------------------------------------------------- */

.pbt-claim {
  border-top: 1px solid var(--line);
  margin-bottom: 14px;
}

.pbt-claim-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 11px 2px;
  border-bottom: 1px solid var(--line);
  font-size: 13.5px;
  line-height: 1.4;
}

.pbt-claim-row span { color: var(--text-dim); min-width: 0; }
.pbt-claim-row b { flex: 0 0 auto; font-weight: 700; text-align: right; }

.pbt-scan {
  padding: 13px 14px;
  border-radius: var(--radius);
  background: var(--bg-sunken);
}

.pbt-scan-top { margin-bottom: 8px; }

.pbt-scan-body {
  margin: 0;
  font-size: 13px;
  line-height: 1.6;
  color: var(--text-dim);
}

.pbt-scan-body b { color: var(--text); }

.pbt-findings {
  list-style: none;
  margin: 10px 0 0;
  padding: 0;
  font-size: 12.5px;
  line-height: 1.6;
}

.pbt-findings li { padding: 4px 0; }

/* --------------------------------------------------------------------------
   Chips
   -------------------------------------------------------------------------- */

.pbt-chip {
  display: inline-block;
  padding: 5px 11px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 700;
  line-height: 1.3;
  white-space: nowrap;
}

.pbt-chip-ok  { background: var(--honey); color: var(--ink); }
.pbt-chip-bad { background: var(--ink); color: var(--cream); }
.pbt-chip-na  { background: var(--bg-sunken); color: var(--text-dim); border: 1px solid var(--line); }

/* --------------------------------------------------------------------------
   4 — forgets by default
   -------------------------------------------------------------------------- */

.pbt-empty {
  margin: 4px 0 0;
  padding: 14px;
  border-radius: var(--radius);
  background: var(--bg-sunken);
  font-size: 13px;
  line-height: 1.6;
  color: var(--text-dim);
}

.pbt-countdown {
  margin-top: 14px;
  padding: 14px;
  border-radius: var(--radius);
  background: var(--ink);
  color: var(--cream);
}

.pbt-countdown-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--honey);
}

.pbt-countdown-text {
  margin-top: 7px;
  font-size: 14.5px;
  line-height: 1.45;
}

.pbt-countdown-clock {
  margin-top: 9px;
  font-size: 20px;
  font-weight: 800;
  color: var(--honey-soft);
  font-variant-numeric: tabular-nums;
}

.pbt-countdown-clock.is-due { color: var(--cream-2); }

.pbt-expiry {
  list-style: none;
  margin: 12px 0 0;
  padding: 0;
  border-top: 1px solid var(--line);
}

.pbt-expiry li {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 2px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  line-height: 1.45;
}

.pbt-expiry em {
  flex: 0 0 auto;
  font-style: normal;
  font-size: 11.5px;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}

/* --------------------------------------------------------------------------
   5 — permissions
   -------------------------------------------------------------------------- */

.pbt-perms { list-style: none; margin: 0; padding: 0; }

.pbt-perm {
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}

.pbt-perm:first-child { padding-top: 0; }
.pbt-perm:last-child { border-bottom: 0; padding-bottom: 0; }

.pbt-perm-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.pbt-perm-name { font-size: 15px; font-weight: 700; }

.pbt-perm-why {
  margin-top: 6px;
  font-size: 13px;
  line-height: 1.5;
}

.pbt-perm-meta {
  margin-top: 5px;
  font-size: 11.5px;
  line-height: 1.45;
  color: var(--text-dim);
}

.pbt-perm-actions {
  display: flex;
  gap: 8px;
  margin-top: 11px;
  flex-wrap: wrap;
}

/* --------------------------------------------------------------------------
   6 — badges
   -------------------------------------------------------------------------- */

.pbt-badge-group + .pbt-badge-group { margin-top: 20px; }

.pbt-badge-title {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 10px;
}

.pbt-badges { display: grid; gap: 8px; margin-top: 10px; }

.pbt-badge {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  padding: 12px 13px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
}

.pbt-badge b { display: block; font-size: 13.5px; line-height: 1.3; }

.pbt-badge i {
  display: block;
  margin-top: 3px;
  font-style: normal;
  font-size: 12px;
  line-height: 1.45;
  color: var(--text-dim);
}

.pbt-badge-mark {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  font-size: 12px;
  line-height: 22px;
  text-align: center;
  font-weight: 800;
}

.pbt-badge.is-real { background: var(--honey-soft); border-color: var(--honey); }
.pbt-badge.is-real .pbt-badge-mark { background: var(--ink); color: var(--honey); }
.pbt-badge.is-real i { color: var(--text); opacity: 0.72; }

.pbt-badge.is-pending { background: var(--bg-sunken); opacity: 0.72; }
.pbt-badge.is-pending .pbt-badge-mark { background: var(--bg-raised); color: var(--text-dim); border: 1px solid var(--line); }

/* --------------------------------------------------------------------------
   7 — live checks
   -------------------------------------------------------------------------- */

.pbt-checks { list-style: none; margin: 0 0 14px; padding: 0; }

.pbt-check {
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
}

.pbt-check:first-child { padding-top: 0; }

.pbt-check-top {
  display: flex;
  align-items: center;
  gap: 9px;
}

.pbt-check-label {
  flex: 1 1 auto;
  font-size: 14px;
  font-weight: 700;
  line-height: 1.35;
  min-width: 0;
}

.pbt-dot {
  flex: 0 0 auto;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--line);
}

.pbt-check.pbt-pass .pbt-dot { background: var(--honey); }
.pbt-check.pbt-fail .pbt-dot { background: var(--ink); }
.pbt-check.pbt-na   .pbt-dot { background: var(--bg-sunken); border: 1px solid var(--line); }

.pbt-check-ev {
  margin: 7px 0 0 18px;
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--text-dim);
  overflow-wrap: anywhere;
}

/* --------------------------------------------------------------------------
   8 — the bee's contract
   -------------------------------------------------------------------------- */

.pbt-bee { list-style: none; margin: 0; padding: 0; }

.pbt-bee li {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid var(--line);
}

.pbt-bee li:first-child { padding-top: 0; }
.pbt-bee li:last-child { border-bottom: 0; padding-bottom: 4px; }

.pbt-bee b { display: block; font-size: 14px; line-height: 1.3; }

.pbt-bee i {
  display: block;
  margin-top: 5px;
  font-style: normal;
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--text-dim);
}

.pbt-bee-dot {
  flex: 0 0 auto;
  width: 16px;
  height: 16px;
  margin-top: 3px;
  border-radius: 50%;
}

.pbt-bee-dot.is-asleep { background: var(--bg-sunken); border: 1px solid var(--line); }
.pbt-bee-dot.is-awake  { background: var(--honey); }
.pbt-bee-dot.is-live   { background: var(--honey); animation: pbt-pulse 1.5s ease-in-out infinite; }

@keyframes pbt-pulse {
  0%, 100% { box-shadow: 0 0 0 0 var(--honey-soft); opacity: 1; }
  50%      { box-shadow: 0 0 0 6px var(--honey-soft); opacity: 0.75; }
}

/* --------------------------------------------------------------------------
   Access log
   -------------------------------------------------------------------------- */

.pbt-logcount {
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--text-dim);
  margin-bottom: 10px;
  font-variant-numeric: tabular-nums;
}

.pbt-log { list-style: none; margin: 0; padding: 0; }

.pbt-logitem {
  position: relative;
  padding: 12px 0 12px 14px;
  border-bottom: 1px solid var(--line);
}

.pbt-logitem::before {
  content: "";
  position: absolute;
  left: 0;
  top: 14px;
  bottom: 14px;
  width: 3px;
  border-radius: 2px;
  background: var(--line);
}

.pbt-logitem.is-warn::before  { background: var(--honey); }
.pbt-logitem.is-block::before { background: var(--ink); }
.pbt-logitem.is-erase::before { background: var(--ink); }

.pbt-log-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
}

.pbt-log-kind {
  font-size: 10.5px;
  font-weight: 800;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--text-dim);
}

.pbt-log-when {
  flex: 0 0 auto;
  font-size: 11px;
  color: var(--text-dim);
  font-variant-numeric: tabular-nums;
}

.pbt-log-label {
  margin-top: 5px;
  font-size: 13.5px;
  font-weight: 700;
  line-height: 1.35;
}

.pbt-log-detail {
  margin-top: 4px;
  font-size: 12.5px;
  line-height: 1.55;
  color: var(--text-dim);
  overflow-wrap: anywhere;
}

.pbt-log-stamp {
  margin-top: 5px;
  font-size: 11px;
  color: var(--text-dim);
  opacity: 0.75;
  font-variant-numeric: tabular-nums;
}

.pbt-foot {
  margin: 18px 4px 0;
  font-size: 12px;
  line-height: 1.65;
  color: var(--text-dim);
  text-align: center;
}

/* --------------------------------------------------------------------------
   The just-in-time permission sheet
   -------------------------------------------------------------------------- */

.pbt-scrim {
  position: fixed;
  inset: 0;
  z-index: 900;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}

/* The dim lives on a pseudo-element, not on .pbt-scrim itself — opacity on the
   parent would fade the sheet along with the backdrop. */
.pbt-scrim::before {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--ink);
  opacity: 0;
  transition: opacity 180ms ease;
}

.pbt-scrim.is-in::before { opacity: 0.62; }

.pbt-sheet {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 460px;
  background: var(--bg-raised);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  padding: 10px 18px calc(22px + env(safe-area-inset-bottom, 0px));
  transform: translateY(18px);
  opacity: 0;
  transition: transform 200ms ease, opacity 200ms ease;
}

.pbt-scrim.is-in .pbt-sheet { transform: translateY(0); opacity: 1; }

.pbt-grab {
  width: 38px;
  height: 4px;
  margin: 0 auto 14px;
  border-radius: 2px;
  background: var(--line);
}

.pbt-sheet-title {
  margin: 0;
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.01em;
}

.pbt-sheet-why {
  margin: 9px 0 0;
  font-size: 14.5px;
  line-height: 1.55;
}

.pbt-sheet-facts {
  list-style: none;
  margin: 14px 0 0;
  padding: 12px 13px;
  background: var(--bg-sunken);
  border-radius: var(--radius);
  font-size: 12.5px;
  line-height: 1.55;
  color: var(--text-dim);
}

.pbt-sheet-facts li { padding-left: 15px; position: relative; }
.pbt-sheet-facts li + li { margin-top: 6px; }
.pbt-sheet-facts li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 8px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--honey);
}

.pbt-sheet-actions {
  display: grid;
  gap: 9px;
  margin-top: 16px;
}

.pbt-sheet-foot {
  margin: 12px 0 0;
  font-size: 11.5px;
  line-height: 1.5;
  color: var(--text-dim);
  text-align: center;
}

/* --------------------------------------------------------------------------
   Larger phones / small tablets
   -------------------------------------------------------------------------- */

@media (min-width: 460px) {
  .pb-trust { padding: 18px 18px 96px; }
  .pbt-card { padding: 20px 18px; }
  .pbt-badges { grid-template-columns: 1fr 1fr; }
  .pbt-h1 { font-size: 30px; }
}

/* --------------------------------------------------------------------------
   Accessibility
   -------------------------------------------------------------------------- */

@media (prefers-reduced-motion: reduce) {
  .pb-trust *,
  .pbt-scrim,
  .pbt-sheet {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
  .pbt-bee-dot.is-live { animation: none; box-shadow: 0 0 0 4px var(--honey-soft); }
}

@media (forced-colors: active) {
  .pbt-card, .pbt-badge, .pbt-btn { border: 1px solid CanvasText; }
  .pbt-chip { border: 1px solid CanvasText; }
}


/* ===== css/profile.css ===== */
/* Personalbee — first run + who-this-is settings */

.pbo {
  position: absolute; inset: 0; z-index: 800;
  background: var(--bg);
  padding: calc(var(--safe-t) + 40px) 24px calc(var(--safe-b) + 28px);
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  animation: pbo-in .4s var(--ease);
}
@keyframes pbo-in { from { opacity: 0; transform: translateY(12px); } }
.pbo.pbo-out { opacity: 0; transform: translateY(-10px); transition: opacity .3s, transform .3s; }

.pbo-step { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; }
.pbo-hidden { display: none; }

.pbo-bee { margin-bottom: 20px; }
.pbo-bee svg { display: block; }

.pbo-h1 {
  font-size: 32px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1;
  margin-bottom: 8px;
}
.pbo-lede { color: var(--text-dim); font-size: 16px; line-height: 1.5; margin-bottom: 30px; }

.pbo-label {
  display: block; font-size: 11px; font-weight: 700; letter-spacing: .09em;
  text-transform: uppercase; color: var(--text-faint); margin-bottom: 9px;
}

.pbo-input {
  width: 100%; min-height: 54px;
  background: var(--bg-sunken); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 14px 16px;
  font-size: 17px; color: var(--text); margin-bottom: 18px;
}
.pbo-input:focus { border-color: var(--honey); outline: none; }
.pbo-input::placeholder { color: var(--text-faint); }

.pbo-privacy {
  font-size: 13.5px; line-height: 1.55; color: var(--text-dim);
  background: var(--bg-sunken); border-radius: var(--radius);
  padding: 14px 16px; margin-bottom: 26px;
}
.pbo-privacy strong { color: var(--text); font-weight: 650; }

.pbo-btn {
  min-height: 54px; border-radius: var(--radius-full);
  font-size: 16px; font-weight: 650;
  display: flex; align-items: center; justify-content: center;
  transition: transform .15s var(--ease), opacity .2s;
}
.pbo-btn:active { transform: scale(.97); }
.pbo-btn-primary { background: linear-gradient(var(--honey-soft), var(--honey)); color: #3a2c00; }
.pbo-btn-primary:disabled { opacity: .38; transform: none; }

/* --- the two ways to start --- */

.pbo-choice {
  display: flex; flex-direction: column; gap: 5px; text-align: left;
  width: 100%; padding: 18px; margin-bottom: 12px;
  background: var(--bg-raised); border: 1px solid var(--line);
  border-radius: var(--radius-lg); color: var(--text);
  transition: transform .15s var(--ease), border-color .2s;
}
.pbo-choice:active { transform: scale(.985); }
.pbo-choice.is-primary { border-color: var(--honey); box-shadow: 0 0 0 3px color-mix(in srgb, var(--honey) 16%, transparent); }
.pbo-choice-title { font-size: 17px; font-weight: 650; margin-bottom: 3px; }
.pbo-choice-line { font-size: 13.5px; line-height: 1.5; color: var(--text-dim); }

.pbo-honest {
  font-size: 13px; line-height: 1.55; color: var(--text-dim);
  border-left: 3px solid var(--honey); padding: 4px 0 4px 13px; margin: 20px 0 8px;
}
.pbo-honest strong { color: var(--text); font-weight: 650; }

.pbo-back {
  align-self: flex-start; margin-top: 10px; min-height: 44px;
  font-size: 14px; color: var(--text-dim); font-weight: 500;
}

}

@media (prefers-reduced-motion: reduce) {
  .pbo, .pbo-out { animation: none; transition: none; }

      if (!Object.prototype.hasOwnProperty.call(INTENTS, name)) continue;
      rules = INTENTS[name];
      var s = 0;
      for (i = 0; i < rules.length; i++) {
        if (rules[i][0].test(text)) s += rules[i][1];
        else if (alt && rules[i][0].test(alt)) s += rules[i][1];
      }
      if (s > 0) scores[name] = s;
    }

    // Contextual nudges
    var hasWhen = !!(dt && (dt.date || dt.recurrence));
    if (hasWhen && ACTION_VERB.test(text) && !/\?\s*$/.test(text)) {
      scores['reminder.create'] = (scores['reminder.create'] || 0) + 2.0;
    }
    if (hasWhen && /\breminder\b/i.test(text)) {
      scores['reminder.create'] = (scores['reminder.create'] || 0) + 0.8;
    }
    if (ctx && ctx.hasPhoto) {
      scores['photo.note'] = (scores['photo.note'] || 0) + 1.6;
    }
    if (ctx && ctx.screen === 'reminders' && scores['reminder.list']) {
      scores['reminder.list'] += 0.5;
    }
    // snooze phrasing is a sub-case of create; if both fire, snooze needs an explicit cue
    if (scores['reminder.snooze'] && scores['reminder.create'] &&
      !/\b(snooze|push\s+(it|that)|move\s+(it|that)|not\s+now|later)\b/i.test(text)) {
      delete scores['reminder.snooze'];
    }
    // "What should I do today?" names the day, so schedule.query fires too.
    // Reading the calendar back at her is exactly the wrong answer to a
    // request for judgement — when both fire, judgement wins.
    if (scores['advice.priority'] && (scores['schedule.query'] || scores['reminder.list'])) {
      scores['advice.priority'] += 1.0;
    }
    // a bare "who is X" beats brand keywords
    if (scores['contact.find'] && scores['brand.query'] && /\bwho\s+is\b/i.test(text)) {
      scores['contact.find'] += 1.2;
    }
    // "delete everything" is trust, not memory.forget
    if (scores['trust.query'] && scores['memory.forget'] && /\b(everything|all\s+my\s+data)\b/i.test(text)) {
      scores['trust.query'] += 1.5;
    }
    // greetings shouldn't out-rank a real request
    if (scores['smalltalk'] && Object.keys(scores).length > 1) {
      scores['smalltalk'] *= 0.55;
    }

    var top = null, topScore = 0, second = 0;
    for (name in scores) {
      if (!Object.prototype.hasOwnProperty.call(scores, name)) continue;
      if (scores[name] > topScore) { second = topScore; topScore = scores[name]; top = name; }
      else if (scores[name] > second) { second = scores[name]; }
    }

    if (!top) return { intent: 'unknown', confidence: hasWhen ? 0.3 : 0.15, scores: scores };

    var base = 1 - 1 / (1 + topScore * 0.55);          // 3 -> .62, 5 -> .73, 6.4 -> .78
    var margin = topScore > 0 ? clamp((topScore - second) / topScore, 0, 1) : 0;
    var conf = base * (0.72 + 0.28 * margin);
    conf = clamp(conf * 1.25, 0.05, 0.97);

    return { intent: top, confidence: round2(conf), scores: scores };
  }

  /* ------------------------------------------------------------------ *
   * 4. Entity extraction                                                *
   * ------------------------------------------------------------------ */

  var LEAD_STRIPS = [
    /^\s*(?:hey|hi|hello|yo|ok|okay|so|um|uh)\s+(?:bee|bea|b)\b[\s,!.:-]*/i,
    /^\s*bee\b[\s,!.:-]+/i,
    /^\s*(?:hey|hi|hello|yo|ok|okay|so)\b[\s,!.:-]+/i,
    /^\s*(?:please|pls|plz)\b[\s,]*/i,
    /^\s*(?:can|could|would|will|wud)\s+(?:you|u)\s+(?:please\s+|pls\s+)?/i,
    /^\s*(?:i\s+)?(?:need|want|have|gotta|got|ought)\s+(?:you\s+)?to\s+/i,
    /^\s*don'?t\s+(?:let\s+me\s+forget|forget)\s+(?:to|about|that)?\s*/i,
    /^\s*make\s+sure\s+(?:that\s+)?i\s+/i,
    /^\s*(?:set|add|create|make)\s+(?:up\s+)?(?:a|an|another)?\s*(?:new\s+)?(?:reminder|alarm|nudge|task|to-?do|timer)\s*(?:to|for|about|that|so\s+i)?\s*/i,
    /^\s*(?:remind|remaind|reminde)\s+(?:me|us)\s*(?:to|that|about|i|for|when)?\s*/i,
    /^\s*(?:nudge|ping|poke|buzz|tell)\s+(?:me|us)\s*(?:to|that|about)?\s*/i,
    /^\s*remember\s+(?:to|that)\s*/i,
    /^\s*(?:i\s+)?(?:need|have|gotta|got)\s+to\s+/i,
    /^\s*(?:add|write|put)\s+a\s+(?:note|caption)\s+(?:to|for|on)\s+(?:this|that|the)\s+(?:photo|pic|picture|shot|image)\s*[:,-]?\s*/i,
    /^\s*(?:save|keep|log|store)\s+(?:this|that)\s+(?:photo|pic|picture|selfie|shot|image|look|moment)\s+(?:as|with|:)\s*/i,
    /^\s*(?:also|and|then)\s+/i
  ];
  /* Trailing particles like "in"/"on"/"up"/"off" belong to phrasal verbs ("check in"),
     so they are deliberately absent from this list. */
  var TRAIL_JUNK = /[\s,]*\b(?:at|by|for|to|and|but|then|around|about|before|after|until|til|till|from)\b[\s,.!?]*$/i;
  var LEAD_JUNK = /^[\s,.:;-]*\b(?:at|on|in|by|and|then|that|to)\b[\s,]+/i;
  /* A connector sitting immediately in front of a removed time phrase is dead weight. */
  var SPAN_CHAR = '\u0001';
  var SPAN_RE = /\u0001/g;
  var CONNECTOR_BEFORE_SPAN = /\b(?:at|on|in|by|for|to|and|around|about|before|after|until|til|till|starting|from|of)\s*(?=\u0001)/gi;

  function cleanTask(orig, dt) {
    var s = orig;
    // mark out every datetime span (a sentinel, so we know where the time phrase used to be)
    if (dt && dt.spans && dt.spans.length) {
      var sorted = dt.spans.slice().sort(function (a, b) { return b[0] - a[0]; });
      for (var i = 0; i < sorted.length; i++) {
        s = s.slice(0, sorted[i][0]) + SPAN_CHAR + s.slice(sorted[i][1]);
      }
    }
    s = squash(s);
    // strip the scaffolding, repeatedly (phrases stack: "hey bee can you remind me to ...")
    var changed = true, guard = 0;
    while (changed && guard++ < 8) {
      changed = false;
      for (var j = 0; j < LEAD_STRIPS.length; j++) {
        var next = s.replace(LEAD_STRIPS[j], '');
        if (next !== s) { s = next; changed = true; }
      }
    }
    s = s.replace(CONNECTOR_BEFORE_SPAN, '');
    s = squash(s.replace(SPAN_RE, ' '));
    // tidy orphan connectors left where the time phrase used to be
    guard = 0;
    while (guard++ < 4) {
      var before = s;
      s = s.replace(TRAIL_JUNK, '');
      s = s.replace(LEAD_JUNK, '');
      s = squash(s);
      if (s === before) break;
    }
    s = s.replace(/^[\s,.:;-]+/, '').replace(/[\s,;:-]+$/, '');
    s = squash(s);
    if (!s) return null;
    // sensible capitalization: lift the first letter, leave everything else as typed
    if (/^[a-z]/.test(s)) s = titleFirst(s);
    return s;
  }

  function findPerson(text, taskText) {
    var lower = String(text || '').toLowerCase();
    var best = null, bestLen = 0;
    var contacts = kbList('contacts');
    var i, c, cand, j;
    for (i = 0; i < contacts.length; i++) {
      c = contacts[i];
      if (!c) continue;
      var names = [];
      if (c.name) {
        names.push(String(c.name));
        var first = String(c.name).split(/\s+/)[0];
        if (first && first.length > 2) names.push(first);
      }
      if (c.nickname) names.push(String(c.nickname));
      for (j = 0; j < names.length; j++) {
        cand = names[j];
        if (cand.length < 3) continue;
        try {
          if (new RegExp('\\b' + esc(cand.toLowerCase()) + '\\b').test(lower) && cand.length > bestLen) {
            best = c.name || cand; bestLen = cand.length;
          }
        } catch (e) { /* ignore bad name */ }
      }
    }
    if (best) return best;

    // relationship words -> a contact with that relationship
    var relM = /\b(?:my\s+)?(mom|mum|mother|dad|father|sister|brother|manager|agent|assistant|editor|boyfriend|girlfriend|partner|roommate|landlord|trainer|derm|dermatologist|therapist|doctor|dentist)\b/i.exec(lower);
    if (relM) {
      var rel = relM[1].toLowerCase();
      for (i = 0; i < contacts.length; i++) {
        c = contacts[i];
        if (!c) continue;
        var r = String(c.relationship || '').toLowerCase();
        if (r && (r === rel || r.indexOf(rel) >= 0)) return c.name || rel;
      }
      return titleFirst(rel);
    }

    // fall back to a proper noun in an obvious slot
    var m = /\b(?:call|text|email|dm|message|ring|meet|see|thank|ask|tell|remind|from|with|to)\s+([A-Z][a-z]{1,15})\b/.exec(String(text || ''));
    if (m && !/^(I|The|A|An|My|It|This|That|Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday|Today|Tomorrow|Tonight)$/.test(m[1])) return m[1];
    m = /\bwho(?:'?s| is| was| are)\s+(?:the\s+)?([a-z]{2,15})\b/i.exec(String(text || ''));
    if (m && !/^(that|this|it|she|he|they|my|your)$/i.test(m[1])) return titleFirst(m[1]);
    return null;
  }

  var GENERIC_PLACES = /\b(?:at|to|from|in|by)\s+(?:the\s+|my\s+)?(gym|studio|office|store|shop|salon|pharmacy|airport|market|bank|mall|clinic|dentist|doctor|post\s+office|grocery|nail\s+salon|derm|set|hotel|apartment|house|home)\b/i;

  function findPlace(text, person) {
    var lower = String(text || '').toLowerCase();
    var places = kbList('places');
    var best = null, bestLen = 0;
    for (var i = 0; i < places.length; i++) {
      var p = places[i];
      if (!p || !p.name) continue;
      var n = String(p.name);
      if (n.length < 3) continue;
      try {
        if (new RegExp('\\b' + esc(n.toLowerCase()) + '\\b').test(lower) && n.length > bestLen) {
          best = n; bestLen = n.length;
        }
      } catch (e) { /* ignore */ }
    }
    if (best) return best;
    var m = GENERIC_PLACES.exec(lower);
    if (m) return squash(m[1]);
    m = /\b(?:at|to)\s+([A-Z][A-Za-z'’]+(?:\s+[A-Z][A-Za-z'’]+)?)\b/.exec(String(text || ''));
    if (m && (!person || m[1].indexOf(person) < 0)) {
      if (!/^(I|My|The|Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday|Today|Tomorrow|Tonight)\b/.test(m[1])) return m[1];
    }
    return null;
  }

  function findBrand(text) {
    var lower = String(text || '').toLowerCase();
    var brands = kbList('brands');
    var best = null, bestLen = 0;
    for (var i = 0; i < brands.length; i++) {
      var b = brands[i];
      if (!b || !b.name) continue;
      var n = String(b.name);
      if (n.length < 2) continue;
      try {
        if (new RegExp('\\b' + esc(n.toLowerCase()) + '\\b').test(lower) && n.length > bestLen) {
          best = n; bestLen = n.length;
        }
      } catch (e) { /* ignore */ }
    }
    if (best) return best;
    var m = /\b([A-Z][A-Za-z&'’-]{1,20})\s+(?:deal|campaign|collab|partnership|brief|contract|deliverables?|invoice)\b/.exec(String(text || ''));
    if (m) return m[1];
    m = /\b(?:for|with)\s+([A-Z][A-Za-z&'’-]{2,20})\b(?=.*\b(?:deal|brand|campaign|sponsor|deliverable)\b)/i.exec(String(text || ''));
    if (m) return m[1];
    return null;
  }

  function findTopic(text, intent, task) {
    var m = /\b(?:about|regarding|re:?|on\s+the\s+topic\s+of)\s+(?:the\s+|my\s+)?(.{2,60}?)\s*[.?!]*$/i.exec(String(text || ''));
    if (m) return squash(m[1]);
    if (intent === 'memory.recall' || intent === 'photo.recall' || intent === 'brand.query') {
      m = /\b(?:remember|know|find|show|pull\s+up)\s+(?:me\s+)?(?:the\s+|that\s+|my\s+)?(.{2,60}?)\s*[.?!]*$/i.exec(String(text || ''));
      if (m) return squash(m[1]);
    }
    return null;
  }

  /* ------------------------------------------------------------------ *
   * 5. Clarification                                                    *
   * ------------------------------------------------------------------ */

  function clarify(intent, conf, dt, entities, raw) {
    var task = entities.task;
    var quoted = task ? '"' + task + '"' : 'that';

    if (intent === 'reminder.create') {
      if (!task && !dt.date) {
        return 'Happy to set a reminder — what for, and when?';
      }
      if (dt.unresolvedAnchor) {
        return 'I don\'t have a time for your ' + dt.unresolvedAnchor + ' — what time should I use?';
      }
      if (!dt.date && !dt.recurrence) {
        return 'Got it — ' + quoted + '. When should I nudge you?';
      }
      if (dt.past && dt.dayKind === 'today') {
        return 'That time\'s already gone today — want me to make it tomorrow?';
      }
      if (!dt.hasTime) {
        return 'Got it — ' + quoted + '. What time works?';
      }
      if (dt.ambiguous || dt.confidence < 0.5) {
        return 'I heard "' + (dt.text || raw) + '" — which day and time did you mean?';
      }
      if (!task) {
        return 'Sure — what should I remind you about?';
      }
      return null;
    }

    // Asking "what should I do?" and getting a question back is the one
    // failure this intent exists to prevent. It never clarifies.
    if (intent === 'advice.priority') return null;

    if (intent === 'reminder.snooze' && !dt.date) {
      return 'How long should I push it — 10 minutes, an hour, tomorrow?';
    }
    if (intent === 'reminder.complete' && !task) {
      return 'Nice. Which one should I check off?';
    }
    if (intent === 'memory.forget' && !task && !entities.topic) {
      return 'Which one should I forget?';
    }
    if (intent === 'contact.find' && !entities.person) {
      return 'Who do you mean?';
    }
    if (intent === 'unknown') {
      return 'I didn\'t quite catch that. Want me to set a reminder, or look something up?';
    }
    if (conf < 0.45) {
      return 'I think I follow, but I\'d rather ask — what would you like me to do with that?';
    }
    return null;
  }

  /* ------------------------------------------------------------------ *
   * 6. parse()                                                          *
   * ------------------------------------------------------------------ */

  var LOW_CONF = 0.45;
  var BARE_SNOOZE_NUM = new RegExp('\\b(?:for|by|another)?\\s*(\\d{1,3}|' + NUM_SRC + ')\\b(?!\\s*(?::|\\d))', 'i');

  function emptyEntities() {
    return {
      task: null, datetime: null, datetimeText: null, recurrence: null,
      person: null, place: null, topic: null, brand: null
    };
  }

  function fallbackResult(raw) {
    return {
      intent: 'unknown',
      confidence: 0,
      entities: emptyEntities(),
      needsClarification: true,
      clarifyQuestion: 'I didn\'t quite catch that. Want me to set a reminder, or look something up?',
      raw: raw == null ? '' : String(raw)
    };
  }

  function parse(text, ctx) {
    var raw = text == null ? '' : String(text);
    try {
      var trimmed = squash(raw);
      if (!trimmed) return fallbackResult(raw);
      ctx = ctx || {};
      var now = (ctx.now instanceof Date && !isNaN(ctx.now.getTime())) ? ctx.now : defaultNow();

      var dt = scanDateTime(trimmed, now);
      var cls = classify(trimmed, ctx, dt);
      var intent = cls.intent;
      var confidence = cls.confidence;

      var entities = emptyEntities();

      // "snooze 15" / "snooze for 15" — a bare number in a snooze means minutes.
      if (intent === 'reminder.snooze' && !dt.date) {
        var bare = BARE_SNOOZE_NUM.exec(trimmed);
        if (bare) {
          var n = toNum(bare[1]);
          if (!isNaN(n) && n >= 1 && n <= 240) {
            var d2 = addMinutes(now, n);
            d2.setSeconds(0, 0);
            dt.date = d2;
            dt.text = squash(bare[0]);
            dt.hasTime = true;
            dt.confidence = 0.7;
          }
        }
      }

      // Time entities only matter for intents that are actually about time.
      var timeful = (intent === 'reminder.create' || intent === 'reminder.snooze' ||
        intent === 'schedule.query' || intent === 'schedule.next' ||
        intent === 'reminder.list' || intent === 'photo.recall' ||
        intent === 'photo.note' || intent === 'advice.priority' ||
        intent === 'unknown');
      if (timeful || dt.recurrence) {
        entities.datetime = dt.date ? dt.date.toISOString() : null;
        entities.datetimeText = dt.text;
        entities.recurrence = dt.recurrence;
      }

      entities.task = cleanTask(trimmed, dt);
      // For question-ish intents the "task" is really the query; keep it, it's harmless,
      // but drop it when it collapses to nothing meaningful.
      if (entities.task && entities.task.length < 2) entities.task = null;

      entities.person = findPerson(trimmed, entities.task);
      entities.place = findPlace(trimmed, entities.person);
      entities.brand = findBrand(trimmed);
      entities.topic = findTopic(trimmed, intent, entities.task);

      // Low intent confidence -> don't guess.
      if (confidence < LOW_CONF && intent !== 'unknown') {
        // A clear time + action still reads as a reminder even at modest confidence.
        if (!(intent === 'reminder.create' && dt.date && dt.confidence >= 0.7)) {
          intent = 'unknown';
          confidence = round2(Math.max(confidence, 0.2));
        }
      }

      var q = clarify(intent, confidence, dt, entities, trimmed);
      var needs = !!q;

      // Blend in datetime confidence for reminders so the number stays honest.
      if (intent === 'reminder.create' && (dt.date || dt.recurrence)) {
        confidence = round2(clamp(confidence * 0.6 + dt.confidence * 0.4, 0.05, 0.97));
      }

      return {
        intent: intent,
        confidence: confidence,
        entities: entities,
        needsClarification: needs,
        clarifyQuestion: q,
        raw: raw
      };
    } catch (e) {
      return fallbackResult(raw);
    }
  }

  /* ------------------------------------------------------------------ *
   * 7. Self test                                                        *
   * ------------------------------------------------------------------ */

  function test() {

    try {
      // Fixed clock: Wednesday 12 August 2026, 10:00 local.

    for (var i = 0; i < items.length; i++) if (items[i].id === id) return items[i];
    return null;
  }
  function norm(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim(); }

  function isSuppressed(id) {
    var until = meta.suppressed[id];
    return until ? (+now() < ts(until)) : false;
  }

  function makeItem(o) {
    var t = iso(now());
    return {
      id: o.id || ('m_' + uid()),
      kind: o.kind || 'pattern',
      text: String(o.text || '').trim(),
      evidence: isArr(o.evidence) ? o.evidence.slice(0, 6) : (o.evidence ? [String(o.evidence)] : []),
      confidence: clamp(typeof o.confidence === 'number' ? o.confidence : 0.3, 0, 0.95),
      firstSeen: o.firstSeen || t,
      lastSeen: o.lastSeen || t,
      hits: o.hits || 1,
      saved: !!o.saved,
      source: o.source || 'observed',
      ask: o.ask || null

    if (meta.announced[item.id]) return;
    if ((item.confidence || 0) < 0.34) return;

  // Create or strengthen a derived pattern. Deterministic id so it merges.
  function upsert(key, o) {

    if (isSuppressed(id)) return null;
    var it = byId(id);
    var t = iso(now());

      it = makeItem({
        id: id, kind: o.kind, text: o.text, ask: o.ask,
        evidence: o.evidence, confidence: o.confidence,
        hits: o.hits || 1, source: o.source || 'observed', saved: !!o.saved

      announce(it);
    } else {
      it.text = o.text || it.text;
      if (o.ask) it.ask = o.ask;
      it.kind = o.kind || it.kind;
      it.lastSeen = t;
      it.hits = Math.max(it.hits, o.hits || it.hits);
      if (typeof o.confidence === 'number') {

        it.confidence = clamp(Math.max(it.confidence, o.confidence), 0, 0.92);
      }
      if (isArr(o.evidence)) {
        for (var i = 0; i < o.evidence.length; i++) {

  /* ---------------------------------------------------------------------- *
   * 5. expireUnsaved — the trust principle, actually implemented.
   * ---------------------------------------------------------------------- */

  function expireUnsaved() {
    var kept = [], gone = 0, t = +now();

      var e = ts(it.lastSeen || it.firstSeen) + ttlFor(it);
      if (e <= t) {
        gone++;
        // We log THAT we forgot, and when — never what it was.
        meta.forgetLog.push({ at: iso(now()), kind: it.kind, by: 'ttl' });
        // Don't instantly re-notice the same thing tomorrow: brief cool-off.
        if (it.id.indexOf('p:') === 0) meta.suppressed[it.id] = iso(new Date(t + 2 * DAY));
        delete meta.announced[it.id];
      } else {
        kept.push(it);
      }
    }
    if (gone) {
      items = kept;
      meta.expiredCount += gone;
      if (meta.forgetLog.length > 60) meta.forgetLog = meta.forgetLog.slice(-60);

      safe(function () { bus().emit('memory:forgotten', { count: gone, reason: 'ttl' }); });

    }

  /* ---------------------------------------------------------------------- *
   * 5B. learn() — conversational memory.

   * observe() watches BEHAVIOUR and guesses. learn() listens to WORDS and
   * doesn't have to guess. The two are kept apart on purpose, all the way
   * through to the screen: what you told me vs what I picked up on my own.
   *
   * Everything learned here is source:'told' and saved:true from birth —
   * a thing she said out loud must never quietly expire underneath her.
   * ---------------------------------------------------------------------- */

  var REL_WORDS = 'wife|husband|partner|fiancee|fiance|girlfriend|boyfriend|sister|brother|' +
    'mum|mom|mother|dad|father|daughter|son|kid|child|grandma|grandmother|grandpa|grandfather|' +
    'aunt|uncle|cousin|niece|nephew|best friend|friend|manager|boss|colleague|coworker|co-worker|' +
    'teammate|assistant|editor|agent|client|landlord|roommate|flatmate|housemate|neighbour|neighbor|' +

  var NAME_SEQ = "(?:(?:Dr|Dr\\.|Mr|Mr\\.|Mrs|Mrs\\.|Ms|Ms\\.)\\s+)?" + NAME_RE +

  var EXPLICIT_RE = /(?:^|\b)(?:please\s+)?(?:can you\s+|could you\s+)?(?:remember(?:\s+this)?(?:\s+that)?|don't forget(?:\s+that)?|do not forget(?:\s+that)?|dont forget(?:\s+that)?|note(?:\s+that|\s+this)?|make a note(?:\s+that|\s+of)?|keep in mind(?:\s+that)?|just so you know(?:\s+that)?|for future reference|for the future|fyi|jot down|write down|save this|store this)\s*[:,]?\s+/i;

  // Weather, not climate. These belong to mood(), not to permanent memory.
  var TRANSIENT_RE = /\b(tired|exhausted|knackered|sleepy|hungry|starving|bored|stressed|stressed out|sad|upset|happy|excited|annoyed|angry|anxious|sick|ill|unwell|late|swamped|nervous|fine|okay|ok|good|great|bad|awful|fed up|dying|dead)\b/i;

  // Slots that can only hold one value at a time. A second statement about the
  // same slot is a CORRECTION, not a second fact.
  var SINGLE_SLOTS = {
    name: true, age: true, relation: true, location: true, origin: true,
    employer: true, occupation: true, identity: true, value: true,
    lives: true, works: true, studies: true, moved: true, diet: true

  /* --- little language helpers ----------------------------------------- */

  function rx(src, flags) { return safe(function () { return new RegExp(src, flags || 'i'); }, null); }

  function tidyText(s) { return String(s == null ? '' : s).replace(/[‘’]/g, "'").replace(/\s+/g, ' ').trim(); }

    }).join(' ');

  // Keep her capitalisation if she used any; otherwise make it look like a name.
  function tidyName(s) {

  // First person -> second person. English second person takes the base verb,
  // so a pronoun swap is enough for almost everything.
  var FLIPS = [
    [/\bi'm\b/gi, "you're"], [/\bim\b/gi, "you're"],
    [/\bi am\b/gi, 'you are'],
    [/\bi wasn't\b/gi, "you weren't"], [/\bi was\b/gi, 'you were'],
    [/\bi've\b/gi, "you've"], [/\bi'll\b/gi, "you'll"], [/\bi'd\b/gi, "you'd"],
    [/\bmyself\b/gi, 'yourself'], [/\bmy\b/gi, 'your'], [/\bmine\b/gi, 'yours'],
    [/\bwe're\b/gi, "you're"], [/\bwe've\b/gi, "you've"], [/\bwe\b/gi, 'you'],
    [/\bour\b/gi, 'your'], [/\bours\b/gi, 'yours'], [/\bus\b/gi, 'you'],

  function dayPlural(s) {

      mon: 'Mondays', tues: 'Tuesdays', tue: 'Tuesdays', wednes: 'Wednesdays', wed: 'Wednesdays',
      thurs: 'Thursdays', thur: 'Thursdays', thu: 'Thursdays', fri: 'Fridays',
      satur: 'Saturdays', sat: 'Saturdays', sun: 'Sundays'

  }

  function unitLabel(s) {
    var t = String(s || '').toLowerCase();

  }

  function words(s, max) {
    var toks = norm(s).split(' ');
    var out = [];
    for (var i = 0; i < toks.length && out.length < (max || 6); i++) {
      if (toks[i] && toks[i].length > 2 && !STOPSET[toks[i]]) out.push(toks[i]);

    return out;
  }

  // Words that can never be what something is ABOUT.
  var NOT_A_TOPIC = {
    around: 1, after: 1, before: 1, near: 1, with: 1, from: 1, into: 1, over: 1, under: 1,
    than: 1, then: 1, until: 1, about: 1, past: 1, since: 1, upon: 1, onto: 1, every: 1,
    later: 1, earlier: 1, instead: 1, anyway: 1, though: 1

  // The thing a preference is ABOUT — the last real content word carries it.
  function topicOf(phrase) {
    var w = words(phrase, 10);
    for (var i = w.length - 1; i >= 0; i--) {

  function dayPhrase(v) {

    if (diff <= 0) return 'earlier today';
    if (diff <= DAY + HOUR) return 'yesterday';
    if (diff < 6 * DAY) return 'on ' + ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][d.getDay()];

    var x = new Date(+d); x.setHours(0, 0, 0, 0); return x;
  }
  function attribution(it) {

  }

  /* --- who I already know ----------------------------------------------- */

  // The name behind a relationship word — from what she's told me, then the KB.
  function knownName(rel) {
    if (!rel) return null;
    var r = relWord(rel);
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      if (it.source === 'told' && it.relation === r && it.subject && it.subject !== r) return it.subject;
    }
    var K = kb();
    if (K && isArr(K.contacts)) {
      for (var j = 0; j < K.contacts.length; j++) {
        var c = K.contacts[j];

      }

    return null;
  }

  // A subject I already hold, mentioned inside this sentence.
  function subjectInText(text) {

      var s = items[i].subject;
      if (!s || s === 'you' || s.length < 3) continue;
      if (low.indexOf(' ' + s + ' ') !== -1 || low.indexOf(' ' + s + "'s ") !== -1) {
        if (!best || s.length > best.length) best = s;
      }
    }
    return best;
  }

  // A seeded memory is usually about a person in her contacts — find who.
  function seedSubject(text) {
    var low = ' ' + norm(text) + ' ';
    var K = kb();
    if (K && isArr(K.contacts)) {
      for (var i = 0; i < K.contacts.length; i++) {
        var c = K.contacts[i];
        if (!c || !c.name) continue;
        var first = norm(String(c.name).split(/\s+/)[0]);
        if (first.length > 2 && (low.indexOf(' ' + first + ' ') !== -1 || low.indexOf(' ' + first + "'s ") !== -1)) return first;
      }
    }
    return 'you';
  }

    var c = seedContact(subject);
    return (c && c.relationship) ? relWord(c.relationship) : null;

  function seedLabel(subject) {
    var c = seedContact(subject);
    return c ? String(c.name).split(/\s+/)[0] : null;
  }
  function seedContact(subject) {
    var K = kb();
    if (!K || !isArr(K.contacts) || !subject || subject === 'you') return null;
    for (var i = 0; i < K.contacts.length; i++) {
      var c = K.contacts[i];
      if (!c || !c.name) continue;
      if (norm(String(c.name).split(/\s+/)[0]) === subject) return c;
    }
    return null;
  }

  function relationFor(subject) {
    for (var i = 0; i < items.length; i++) {
      if (items[i].subject === subject && items[i].relation) return items[i].relation;

    return null;
  }

  function labelFor(subject) {
    for (var i = 0; i < items.length; i++) {

  /* --- fact construction ------------------------------------------------- */

  function mkFact(o) {
    var f = {
      kind: o.kind || 'fact',
      text: sentenceCase(o.text),
      subject: normSubject(o.subject || 'you'),
      label: o.label ? tidyText(o.label) : null,
      relation: o.relation ? relWord(o.relation) : null,
      slot: o.slot || 'gen',
      tags: isArr(o.tags) ? o.tags.slice(0, 8) : [],

    };

    return f;
  }

  // "Dr Nadia" -> key 'nadia', shown as "Dr Nadia".
  function nameKey(s) {

    var last = parts[parts.length - 1];
    return (last.length > 1 ? last : parts[0]);

  function confidenceFor(f, ctx) {
    var base = typeof f.confidence === 'number' ? f.confidence : (f.slot === 'gen' ? 0.72 : 0.82);
    if (ctx.explicit) base = Math.max(base, 0.9);
    if (ctx.hedged) base = Math.min(base, 0.55);
    return clamp(base, 0.2, 0.93);

  /* --- the extractor ------------------------------------------------------ *
   * Ordered rules, first match wins per clause. Specific shapes first so the
   * phrasing stays human; a guarded pronoun-flip catches the rest.
   * ----------------------------------------------------------------------- */

  function extractFacts(c, ctx) {
    var out = [], m, r;
    c = stripEnd(c);
    if (!c || c.split(/\s+/).length < 2) return out;

    /* continuation: "...and she lives in Boston" / "...and she's a doctor" */
    m = c.match(/^(?:she|he|they|it)(?:'s|'re|s)?\s+(.+)$/i);
    if (m) {
      if (ctx.last && ctx.last.subject && ctx.last.subject !== 'you') {
        var pron = c.match(/^(she|he|they|it)('s|'re)/i);
        var verb = pron ? (pron[2].toLowerCase() === "'re" ? 'are ' : 'is ') : '';

          kind: 'person', subject: ctx.last.subject, label: ctx.last.label, relation: ctx.last.relation,

    /* "my sister's name is Sara" / "my manager is called Dr Nadia" */
    m = c.match(rx("\\bmy (" + REL_WORDS + ")(?:'s)?\\s+(?:name is|name's|is called|is named|goes by)\\s+(" + NAME_SEQ + ")"));

      r = relWord(m[1]);
      out.push(mkFact({ kind: 'person', subject: nameKey(m[2]), label: titleName(m[2]), relation: r,
        slot: 'name', tags: [r, 'name'],
        text: 'Your ' + r + ' is called ' + titleName(m[2]) }));

    }

    /* "my daughter is 7" */
    m = c.match(rx('\\bmy (' + REL_WORDS + ')\\s+(?:is|just turned|turns|turned|will be)\\s+(\\d{1,2})\\b'));
    if (m) {
      r = relWord(m[1]);
      out.push(mkFact({ kind: 'person', subject: knownName(r) || r, relation: r, slot: 'age', tags: [r, 'age'],
        text: 'Your ' + r + ' is ' + m[2] }));
      return compact(out);
    }

    /* "my boss is Ali" / "my therapist is Dr Nadia" — a capitalised name */
    m = c.match(rx('\\bmy (' + REL_WORDS + ')\\s+is\\s+(' + CAPNAME_RE + ')\\s*$', ''));
    if (m) {
      r = relWord(m[1]);
      out.push(mkFact({ kind: 'person', subject: nameKey(m[2]), label: tidyText(m[2]), relation: r,
        slot: 'name', tags: [r, 'name'],
        text: 'Your ' + r + ' is called ' + tidyText(m[2]) }));
      return compact(out);
    }

    /* "Ali is my manager" */
    m = c.match(rx('^(' + NAME_SEQ + ')\\s+is my\\s+(' + REL_WORDS + ')\\b'));
    if (m && !isPronoun(m[1])) {
      r = relWord(m[2]);
      out.push(mkFact({ kind: 'person', subject: nameKey(m[1]), label: titleName(m[1]), relation: r,
        slot: 'relation', tags: [r],
        text: titleName(m[1]) + ' is your ' + r }));
      return compact(out);
    }

    /* "my manager Ali handles the invoices" — two facts out of one clause */
    m = c.match(rx('^my (' + REL_WORDS + ')\\s+(' + NAME_RE + ')\\s+(is|was|works|lives|likes|loves|hates|prefers|has|does|studies|moved|handles|runs|wants|needs)\\b\\s*(.*)$'));
    if (m && !isPronoun(m[2])) {
      r = relWord(m[1]);
      out.push(mkFact({ kind: 'person', subject: nameKey(m[2]), label: titleName(m[2]), relation: r,
        slot: 'name', tags: [r, 'name'],
        text: 'Your ' + r + ' is called ' + titleName(m[2]) }));
      out.push(mkFact({ kind: 'person', subject: nameKey(m[2]), label: titleName(m[2]), relation: r,
        slot: verbSlot(m[3] + ' ' + m[4]), tags: words(m[4]),
        text: titleName(m[2]) + ' ' + m[3] + (m[4] ? ' ' + m[4] : '') }));
      return compact(out);
    }

    m = c.match(rx("^my (" + REL_WORDS + ")('s)?\\s+(.+)$"));
    if (m) {
      r = relWord(m[1]);
      out.push(mkFact({
        kind: 'person', subject: knownName(r) || r, relation: r,
        slot: m[2] ? 'gen' : verbSlot(m[3]), tags: [r].concat(words(m[3])),
        text: 'Your ' + r + (m[2] ? "'s" : '') + ' ' + flipPerson(m[3])
