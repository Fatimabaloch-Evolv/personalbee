    return null;
  }

  /* ---------------------------------------------------------- the confirm */

  function quote(s) { return '“' + s + '”'; }

  // THE confirm-back. Restates the task and the RESOLVED time, never the vague phrase.
  function formatConfirm(r) {
    if (!r) return '';
    var task = String(r.text || '').trim();
    if (!task) return '';
    var d = effDue(r);

    if (!d) {
      return 'Saved: ' + quote(task) + '. There’s no time on it, so I won’t be able to nudge you — ' +
        'tell me when and I’ll set one. Something like “tomorrow at 3” works.';
    }

    var when = dayPhrase(d) + ' at ' + compactTime(d);
    var out;

    if (r.recurrence) {
      out = 'Got it. ' + quote(task) + ' — ' + recurrencePhrase(r.recurrence) + '. First one ' + when + '.';
    } else {
      out = 'Got it. ' + quote(task) + ' — ' + when + '.';
      var ms = d.getTime() - now().getTime();
      if (ms > 0 && ms < 7 * DAY) out += ' That’s ' + relPhrase(d) + '.';
      else if (ms <= 0) out += ' That’s already passed — I’ll flag it as soon as you’re back.';
    }

    if (hasTag(r, ASSUMED_TAG)) {
      out += ' You didn’t give me a time, so I picked ' + compactTime(d) + ' — say the word and I’ll move it.';
    }
    return out;
  }

  /* -------------------------------------------------------------- the API */

  function create(obj) {
    obj = obj || {};
    var text = String(obj.text || obj.task || '').trim();
    if (!text) return null;

    var dueIso = iso(obj.due);
    var tags = Object.prototype.toString.call(obj.tags) === '[object Array]' ? obj.tags.slice() : [];
    var rec = obj.recurrence || null;

    // A repeating reminder always gets a concrete first firing time — never left silent.
    var recSaidTime = !!recTimeParts(rec);
    if (rec) {
      var hadDate = !!dueIso;
      dueIso = alignToRecurrence(dueIso, rec);
      // We invented the hour for it, so own up to that in the confirm-back.
      if (!recSaidTime && !hadDate && dueIso && tags.indexOf(ASSUMED_TAG) === -1) tags.push(ASSUMED_TAG);
    }

    if (dueIso) {
      var d = new Date(dueIso);
      var rawWhen = String(obj.dueText || '');
      var saidATime = recSaidTime ||
        /\d\s*(?::\d{2})?\s*(?:am|pm)|\d{1,2}:\d{2}|noon|midnight|morning|evening|tonight|afternoon|lunch|bed/i.test(rawWhen);
      if (looksLikeMidnight(d) && !saidATime) {
        d = applyDefaultHour(d);
        dueIso = d.toISOString();
        if (tags.indexOf(ASSUMED_TAG) === -1) tags.push(ASSUMED_TAG);
      }
    }

    var r = normalize({
      id: obj.id,
      text: text,
      due: dueIso,
      dueText: obj.dueText || null,
      recurrence: obj.recurrence || null,
      createdAt: obj.createdAt || now().toISOString(),
      completedAt: null,
      source: obj.source || 'manual',
      confirmed: true,
      fired: false,
      snoozedUntil: null,
      tags: tags
    });
    if (!r) return null;

    items.push(r);
    save();
    emit('reminder:created', r);
    schedule();
    maybeAskNotify();
    repaint();
    return r;
  }

  // Convenience for the brain / chat path: text in, reminder out.
  function createFromText(text, source) {
    text = String(text || '').trim();
    if (!text) return null;
    var p = parseText(text);
    return create({
      text: p.task || text,
      due: p.due,
      dueText: p.dueText,
      recurrence: p.recurrence,
      source: source || 'chat'
    });
  }

  function update(id, patch) {
    var r = byId(id);
    if (!r || !patch) return null;
    if ('text' in patch && String(patch.text || '').trim()) r.text = String(patch.text).trim();
    if ('due' in patch) {
      var newDue = iso(patch.due);
      var tagIdx = r.tags.indexOf(ASSUMED_TAG);
      if (tagIdx !== -1) r.tags.splice(tagIdx, 1);
      if (newDue) {
        var d = new Date(newDue);
        var saidATime = /\d\s*(?::\d{2})?\s*(?:am|pm)|\d{1,2}:\d{2}|noon|midnight|morning|evening|tonight|afternoon/i.test(String(patch.dueText || ''));
        if (looksLikeMidnight(d) && !saidATime) {
          d = applyDefaultHour(d);
          newDue = d.toISOString();
          r.tags.push(ASSUMED_TAG);
        }
      }
      r.due = newDue;
      r.snoozedUntil = null;
      // Moving a reminder into the future re-arms it; leaving it in the past keeps its state.
      r.fired = !!(newDue && new Date(newDue).getTime() <= now().getTime() && r.fired);
    }
    if ('dueText' in patch) r.dueText = patch.dueText == null ? null : String(patch.dueText);
    if ('recurrence' in patch) r.recurrence = patch.recurrence || null;
    if ('tags' in patch && Object.prototype.toString.call(patch.tags) === '[object Array]') r.tags = patch.tags.slice();
    // Same rule as create: a repeating reminder must always hold a concrete next firing time.
    if (r.recurrence && ('due' in patch || 'recurrence' in patch)) {
      r.due = alignToRecurrence(r.due, r.recurrence);
      if (r.due && new Date(r.due).getTime() > now().getTime()) r.fired = false;
    }
    save();
    emit('reminder:updated', r);
    schedule();
    repaint();
    return r;
  }

  function complete(id) {
    var r = byId(id);
    if (!r || r.completedAt) return r;

    // Recurring reminders roll forward instead of disappearing.
    if (r.recurrence) {
      var nxt = nextOccurrence(r, now());
      var done = cloneShallow(r);
      done.completedAt = now().toISOString();
      emit('reminder:completed', done);
      if (nxt) {
        r.due = nxt.toISOString();
        r.snoozedUntil = null;
        r.fired = false;
        r.completedAt = null;
        save();
        schedule();
        repaint();
        toast('Done. Next one ' + dayPhrase(nxt) + ' at ' + compactTime(nxt) + '.');
        haptic();
        return r;
      }
    }

    r.completedAt = now().toISOString();
    r.snoozedUntil = null;
    save();
    emit('reminder:completed', r);
    dismissBannerFor(r.id);
    schedule();
    repaint();
    haptic();
    return r;
  }

  function uncomplete(id) {
    var r = byId(id);
    if (!r) return null;
    r.completedAt = null;
    var d = effDue(r);
    r.fired = !!(d && d.getTime() <= now().getTime());
    save();
    emit('reminder:updated', r);
    schedule();
    repaint();
    return r;
  }

  function snooze(id, minutes) {
    var r = byId(id);
    if (!r) return null;
    var m = parseInt(minutes, 10);
    if (!isFinite(m) || m <= 0) m = 10;
    var until = addMinutes(now(), m);
    until.setSeconds(0, 0);
    r.snoozedUntil = until.toISOString();
    r.fired = false;
    r.completedAt = null;
    save();
    emit('reminder:snoozed', r);
    dismissBannerFor(r.id);
    schedule();
    repaint();
    toast('Snoozed. Back at ' + compactTime(until) + '.');
    return r;
  }

  function remove(id) {
    for (var i = 0; i < items.length; i++) {
      if (items[i].id === id) {
        var r = items.splice(i, 1)[0];
        save();
        emit('reminder:removed', r);
        dismissBannerFor(id);
        schedule();
        repaint();
        return r;
      }
    }
    return null;
  }

  function cloneShallow(o) {
    var c = {};
    for (var k in o) if (Object.prototype.hasOwnProperty.call(o, k)) c[k] = o[k];
    return c;
  }

  function sortByDue(a, b) {
    var da = effDue(a), db = effDue(b);
    if (da && db) {
      if (da.getTime() !== db.getTime()) return da.getTime() - db.getTime();
      return String(a.createdAt).localeCompare(String(b.createdAt));
    }
    if (da) return -1;                 // dated first
    if (db) return 1;                  // undated last
    return String(a.createdAt).localeCompare(String(b.createdAt));
  }

  function list(filter) {
    filter = filter || {};
    var status = filter.status || 'open';
    var from = filter.from ? new Date(filter.from) : null;
    var to = filter.to ? new Date(filter.to) : null;
    if (from && isNaN(from.getTime())) from = null;
    if (to && isNaN(to.getTime())) to = null;

    var out = [];
    for (var i = 0; i < items.length; i++) {
      var r = items[i];
      if (status === 'open' && !isOpen(r)) continue;
      if (status === 'done' && isOpen(r)) continue;
      if (from || to) {
        var d = effDue(r);
        if (!d) continue;              // a range question is a question about dated things
        if (from && d.getTime() < from.getTime()) continue;
        if (to && d.getTime() > to.getTime()) continue;
      }
      out.push(r);
    }
    out.sort(sortByDue);
    if (status === 'done') out.reverse();  // most recently finished first
    return out;
  }

  function upcoming(n) {
    var count = parseInt(n, 10);
    if (!isFinite(count) || count <= 0) count = 3;
    var out = [];
    for (var i = 0; i < items.length; i++) {
      var r = items[i];
      if (!isOpen(r)) continue;
      if (!effDue(r)) continue;
      out.push(r);
    }
    out.sort(sortByDue);
    return out.slice(0, count);
  }

  function overdue() {
    var out = [];
    for (var i = 0; i < items.length; i++) {
      var r = items[i];
      if (isOpen(r) && r.fired) out.push(r);
    }
    out.sort(sortByDue);
    return out;
  }

  /* ------------------------------------------------------ permission / OS */

  function trustState() {
    try {
      if (PB.trust && PB.trust.permission) return PB.trust.permission('notifications') || 'unasked';
    } catch (e) {}
    return null; // trust module not present
  }

  function osState() {
    try {
      if (typeof window.Notification === 'undefined') return 'unsupported';
      return Notification.permission; // 'granted'|'denied'|'default'
    } catch (e) {}
    return 'unsupported';
  }

  var WHY_NOTIFY =
    'So a reminder can reach you when the app isn’t in front of you. ' +
    'That’s the only thing I’ll use it for — no marketing, nothing sent anywhere.';

  function maybeAskNotify() {
    var asked = false;
    try { asked = !!(PB.store && PB.store.get && PB.store.get(KEY_ASKED, false)); } catch (e) {}
    if (asked) return;
    try { if (PB.store && PB.store.set) PB.store.set(KEY_ASKED, true); } catch (e) {}

    // Just-in-time only: this runs on the FIRST reminder ever created, never at launch.
    setTimeout(function () { requestNotify(); }, 700);
  }

  function requestNotify() {
    var ts = trustState();
    if (ts === 'granted' || ts === 'denied') { updateDelivery(); return; }
    try {
      if (PB.trust && PB.trust.request) {
        var p = PB.trust.request('notifications', WHY_NOTIFY);
        if (p && typeof p.then === 'function') {
          p.then(function () { updateDelivery(); }, function () { updateDelivery(); });
        } else {
          updateDelivery();
        }
        return;
      }
    } catch (e) {}
    // No trust module — degrade to the browser's own prompt, still just-in-time.
    try {
      if (typeof window.Notification !== 'undefined' && Notification.permission === 'default') {
        var q = Notification.requestPermission();
        if (q && typeof q.then === 'function') q.then(function () { updateDelivery(); });
      }
    } catch (e) {}
    updateDelivery();
  }

  function canUseOsNotification() {
    var ts = trustState();
    if (ts !== null && ts !== 'granted') return false;   // trust module says no
    return osState() === 'granted';
  }

  function osNotify(r) {
    if (!canUseOsNotification()) return false;
    try {
      var n = new Notification('Personalbee', {
        body: r.text,
        tag: 'pb-reminder-' + r.id,
        silent: false
      });
      n.onclick = function () {
        try { window.focus(); } catch (e) {}
        try { if (PB.ui && PB.ui.go) PB.ui.go('reminders'); } catch (e) {}
        try { n.close(); } catch (e) {}
      };
      return true;
    } catch (e) { return false; }
  }

  /* ------------------------------------------------------------ delivery */

  function deliveryStatus() {
    var ts = trustState();
    var os = osState();
    var level, headline, detail, action = null;

    if (os === 'unsupported') {
      level = 'partial';
      headline = 'In-app reminders only';
      detail = 'This device can’t show system notifications, so I’ll only be able to nudge you while Personalbee is open.';
    } else if (ts === 'denied' || os === 'denied') {
      level = 'off';
      headline = 'Notifications are off';
      detail = 'I can only nudge you while Personalbee is open on screen. Turn notifications on in your browser or phone settings and I’ll be able to reach you properly.';
    } else if (ts === 'granted' && os === 'granted') {
      level = 'on';
      headline = 'Reminders can reach you';
      detail = 'Notifications are on. If the app is fully closed, I’ll deliver the moment you open it again.';
    } else if (ts === 'granted' && os !== 'granted') {
      level = 'partial';
      headline = 'Half on';
      detail = 'You said yes to me, but the browser hasn’t granted notifications yet. Until it does, nudges show inside the app only.';
      action = { label: 'Fix this', fn: requestNotify };
    } else {
      level = 'partial';
      headline = 'In-app reminders only';
      detail = 'I haven’t asked for notification permission yet, so reminders will show inside the app only.';
      action = { label: 'Turn on notifications', fn: requestNotify };
    }

    return {
      level: level,
      headline: headline,
      detail: detail,
      action: action,
      trust: ts,
      os: os,
      lastTick: lastTickAt,
      externallyDriven: !!lastExternalTickAt,
      waiting: upcoming(999).length
    };
  }

  /* ------------------------------------------------------- firing / tick */

  var fireTimer = null;

  function schedule() {
    if (fireTimer) { clearTimeout(fireTimer); fireTimer = null; }
    var soonest = null;
    for (var i = 0; i < items.length; i++) {
      var r = items[i];
      if (!isOpen(r) || r.fired) continue;
      var d = effDue(r);
      if (!d) continue;
      if (soonest === null || d.getTime() < soonest) soonest = d.getTime();
    }
    if (soonest === null) return;
    var delay = soonest - now().getTime();
    if (delay < 0) delay = 0;
    if (delay > 60000) delay = 60000;  // re-arm at least every minute
    fireTimer = setTimeout(function () { fireTimer = null; tick(); }, delay + 250);
  }

  function tick(fromApp) {
    var n = now();
    lastTickAt = n;
    if (fromApp !== false) lastExternalTickAt = n;
    try { if (PB.store && PB.store.set) PB.store.set(KEY_LASTTICK, n.toISOString()); } catch (e) {}

    var fired = [];
    for (var i = 0; i < items.length; i++) {
      var r = items[i];
      if (!isOpen(r) || r.fired) continue;
      var d = effDue(r);
      if (!d) continue;
      if (d.getTime() <= n.getTime()) {
        r.fired = true;
        fired.push(r);
      }
    }

    if (fired.length) {
      save();
      for (var j = 0; j < fired.length; j++) {
        emit('reminder:fired', fired[j]);
        osNotify(fired[j]);
      }
      if (didCatchUp && fired.length > 2) {
        showSummaryBanner(fired);
      } else {
        for (var k = 0; k < fired.length && k < 3; k++) showBanner(fired[k]);
        if (fired.length > 3) showSummaryBanner(fired.slice(3));
      }
      haptic();
      repaint();
    }

    updateDelivery();
    refreshTimes();
    schedule();
  }

  // Anything that came due while the app was closed still gets delivered, once, on open.
  function catchUp() {
    var missedSince = lastTickAt ? new Date(lastTickAt.getTime()) : null;
    didCatchUp = true;
    var pending = [];
    for (var i = 0; i < items.length; i++) {
      var r = items[i];
      if (!isOpen(r) || r.fired) continue;
      var d = effDue(r);
      if (d && d.getTime() <= now().getTime()) pending.push(r);
    }
    if (pending.length > 1) {
      for (var j = 0; j < pending.length; j++) { pending[j].fired = true; emit('reminder:fired', pending[j]); }
      save();
      showSummaryBanner(pending, missedSince);
    } else {
      tick(false);
    }
    didCatchUp = false;
    lastTickAt = now();
    try { if (PB.store && PB.store.set) PB.store.set(KEY_LASTTICK, lastTickAt.toISOString()); } catch (e) {}
    updateDelivery();
    schedule();
  }

  /* ---------------------------------------------------- in-app banner UI */

  var bannerHost = null;
  var bannerFor = {};   // id -> node

  function ensureBannerHost() {
    if (bannerHost && bannerHost.parentNode) return bannerHost;
    bannerHost = el('div', 'rm-banners');
    bannerHost.id = 'rm-banners';
    bannerHost.setAttribute('role', 'status');
    bannerHost.setAttribute('aria-live', 'polite');
    try { document.body.appendChild(bannerHost); } catch (e) {}
    return bannerHost;
  }

  function dismissBanner(node) {
    if (!node || !node.parentNode) return;
    node.classList.add('is-leaving');
    setTimeout(function () {
      if (node.parentNode) node.parentNode.removeChild(node);
    }, 220);
    for (var id in bannerFor) {
      if (bannerFor[id] === node) delete bannerFor[id];
    }
  }

  function dismissBannerFor(id) {
    if (bannerFor[id]) dismissBanner(bannerFor[id]);
  }

  function showBanner(r) {
    var host = ensureBannerHost();
    dismissBannerFor(r.id);

    var b = el('div', 'rm-banner');
    var top = el('div', 'rm-banner-top');
    top.appendChild(el('span', 'rm-banner-bee', '🐝'));
    var lbl = el('div', 'rm-banner-label', 'Reminder');
    var d = effDue(r);
    if (d) lbl.textContent = 'Reminder · ' + clock(d);
    top.appendChild(lbl);
    var x = el('button', 'rm-banner-x');
    x.type = 'button';
    x.setAttribute('aria-label', 'Dismiss');
    x.appendChild(svg(ICON.close));
    x.addEventListener('click', function () { dismissBanner(b); });
    top.appendChild(x);
    b.appendChild(top);

    b.appendChild(el('div', 'rm-banner-text', r.text));

    var acts = el('div', 'rm-banner-acts');
    var done = el('button', 'rm-btn rm-btn-primary', 'Done');
    done.type = 'button';
    done.addEventListener('click', function () { complete(r.id); dismissBanner(b); });
    var sn = el('button', 'rm-btn rm-btn-ghost', 'Snooze 10m');
    sn.type = 'button';
    sn.addEventListener('click', function () { snooze(r.id, 10); dismissBanner(b); });
    var open = el('button', 'rm-btn rm-btn-ghost', 'Open');
    open.type = 'button';
    open.addEventListener('click', function () {
      try { if (PB.ui && PB.ui.go) PB.ui.go('reminders'); } catch (e) {}
      dismissBanner(b);
    });
    acts.appendChild(done);
    acts.appendChild(sn);
    acts.appendChild(open);
    b.appendChild(acts);

    host.appendChild(b);
    bannerFor[r.id] = b;
    requestAnimationFrame(function () { b.classList.add('is-in'); });
    return b;
  }

  function showSummaryBanner(list_, since) {
    var host = ensureBannerHost();
    var b = el('div', 'rm-banner');
    var top = el('div', 'rm-banner-top');
    top.appendChild(el('span', 'rm-banner-bee', '🐝'));
    top.appendChild(el('div', 'rm-banner-label', list_.length + ' reminders came due'));
    var x = el('button', 'rm-banner-x');
    x.type = 'button';
    x.setAttribute('aria-label', 'Dismiss');
    x.appendChild(svg(ICON.close));
    x.addEventListener('click', function () { dismissBanner(b); });
    top.appendChild(x);
    b.appendChild(top);

    var names = [];
    for (var i = 0; i < list_.length && i < 3; i++) names.push(list_[i].text);
    var more = list_.length > 3 ? ' …and ' + (list_.length - 3) + ' more' : '';
    b.appendChild(el('div', 'rm-banner-text', names.join(' · ') + more));
    if (since) {
      b.appendChild(el('div', 'rm-banner-sub', 'These landed while the app was closed — last check ' + relPhrase(since) + '.'));
    }

    var acts = el('div', 'rm-banner-acts');
    var open = el('button', 'rm-btn rm-btn-primary', 'See them');
    open.type = 'button';
    open.addEventListener('click', function () {
      try { if (PB.ui && PB.ui.go) PB.ui.go('reminders'); } catch (e) {}
      dismissBanner(b);
    });
    acts.appendChild(open);
    b.appendChild(acts);

    host.appendChild(b);
    requestAnimationFrame(function () { b.classList.add('is-in'); });
  }

  /* ------------------------------------------------------------ NLU glue */

  // Returns {task, due(ISO|null), dueText, recurrence, confidence}
  function parseText(text) {
    var out = { task: String(text || '').trim(), due: null, dueText: null, recurrence: null, confidence: 0 };
    if (!out.task) return out;

    var parsed = null;
    try {
      if (PB.nlu && PB.nlu.parse) parsed = PB.nlu.parse(text, { now: now() });
    } catch (e) { parsed = null; }

    if (parsed && parsed.entities) {
      var e = parsed.entities;
      if (e.datetime) out.due = iso(e.datetime);
      if (e.datetimeText) out.dueText = String(e.datetimeText);
      if (e.recurrence) out.recurrence = e.recurrence;
      if (e.task && String(e.task).trim()) out.task = String(e.task).trim();
      out.confidence = typeof parsed.confidence === 'number' ? parsed.confidence : 0;
    }

    if (!out.due) {
      try {
        if (PB.nlu && PB.nlu.parseDateTime) {
          var dt = PB.nlu.parseDateTime(text, now());
          if (dt) {
            if (dt.date) out.due = iso(dt.date);
            if (dt.text) out.dueText = String(dt.text);
            if (dt.recurrence) out.recurrence = out.recurrence || dt.recurrence;
            if (typeof dt.confidence === 'number' && dt.confidence > out.confidence) out.confidence = dt.confidence;
          }
        }
      } catch (e2) {}
    }

    // If the parser gave us the phrase but not a trimmed task, strip it ourselves.
    if (out.dueText && out.task === String(text).trim()) {
      var stripped = stripPhrase(out.task, out.dueText);
      if (stripped) out.task = stripped;
    }
    out.task = tidyTask(out.task);
    return out;
  }

  function stripPhrase(text, phrase) {
    if (!phrase) return text;
    var i = text.toLowerCase().indexOf(String(phrase).toLowerCase());
    if (i === -1) return text;
    var s = (text.slice(0, i) + ' ' + text.slice(i + phrase.length));
    return s.replace(/\s{2,}/g, ' ').trim();
  }

  function tidyTask(t) {
    t = String(t || '').trim();
    t = t.replace(/^(?:please\s+)?(?:can you\s+|could you\s+)?(?:remind me (?:to|about|that)?|reminder(?: to)?|remember to|don'?t let me forget to|set a reminder(?: to)?)\s+/i, '');
    t = t.replace(/\s+(?:at|on|by|in)$/i, '');
    t = t.replace(/[,\s]+$/, '').trim();
    if (t) t = t.charAt(0).toUpperCase() + t.slice(1);
    return t;
  }

  /* -------------------------------------------------------- composer UI */

  function openComposer(opts) {
    opts = opts || {};
    var editing = opts.reminder || null;
    var wrap = el('div', 'rm-composer');

    var field = el('div', 'rm-field');
    var input = document.createElement('textarea');
    input.className = 'rm-input';
    input.rows = 2;
    input.placeholder = placeholderExample();
    input.setAttribute('aria-label', 'What should I remind you about?');
    input.value = editing
      ? (editing.text + (editing.dueText ? ' ' + editing.dueText : (effDue(editing) ? ' ' + dayPhrase(effDue(editing)) + ' at ' + compactTime(effDue(editing)) : '')))
      : (opts.seed || '');
    field.appendChild(input);
    wrap.appendChild(field);

    var preview = el('div', 'rm-preview');
    var pIcon = el('span', 'rm-preview-dot');
    var pText = el('span', 'rm-preview-text', 'Type it the way you’d say it.');
    preview.appendChild(pIcon);
    preview.appendChild(pText);
    wrap.appendChild(preview);

    var chipRow = el('div', 'rm-chips');
    var chips = [
      { label: 'In 1 hour', add: 'in 1 hour' },
      { label: 'Tonight 7pm', add: 'tonight at 7pm' },
      { label: 'Tomorrow 9am', add: 'tomorrow at 9am' },
      { label: 'Next Monday', add: 'next Monday at 10am' }
    ];
    chips.forEach(function (c) {
      var b = el('button', 'rm-chip', c.label);
      b.type = 'button';
      b.addEventListener('click', function () {
        var base = tidyTask(state.task || input.value);
        input.value = (base ? base + ' ' : '') + c.add;
        input.focus();
        run();
      });
      chipRow.appendChild(b);
    });
    wrap.appendChild(chipRow);

    var saveBtn = el('button', 'rm-btn rm-btn-primary rm-save', editing ? 'Save changes' : 'Set reminder');
    saveBtn.type = 'button';
    saveBtn.disabled = true;
    wrap.appendChild(saveBtn);

    var foot = el('div', 'rm-composer-foot');
    foot.textContent = 'I’ll read it back to you before it counts.';
    wrap.appendChild(foot);

    var state = { task: '', due: null, dueText: null, recurrence: null };
    var t = null;

    function run() {
      var raw = input.value.trim();
      if (!raw) {
        state = { task: '', due: null, dueText: null, recurrence: null };
        preview.className = 'rm-preview';
        pText.textContent = 'Type it the way you’d say it.';
        saveBtn.disabled = true;
        return;
      }
      var p = parseText(raw);
      state.task = p.task || raw;
      state.due = p.due;
      state.dueText = p.dueText;
      state.recurrence = p.recurrence;
      saveBtn.disabled = false;

      if (p.due) {
        var d = new Date(p.due);
        if (looksLikeMidnight(d) && !/\d\s*(?:am|pm)|\d{1,2}:\d{2}|noon|midnight|morning|evening|tonight|afternoon/i.test(String(p.dueText || ''))) {
          d = applyDefaultHour(d);
        }
        preview.className = 'rm-preview is-ok';
        var rec = p.recurrence ? recurrencePhrase(p.recurrence) + ' · next ' : '';
        pText.textContent = rec + dayPhrase(d) + ' at ' + compactTime(d) + ' · ' + relPhrase(d);
      } else {
        preview.className = 'rm-preview is-vague';
        pText.textContent = 'No time in there yet — I’ll file it under “No time set” and won’t be able to nudge you.';
      }
    }

    input.addEventListener('input', function () {
      if (t) clearTimeout(t);
      t = setTimeout(run, 120);
    });
    input.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' && !ev.shiftKey) {
        ev.preventDefault();
        saveBtn.click();
      }
    });

    var sheet = null;
    saveBtn.addEventListener('click', function () {
      var raw = input.value.trim();
      if (!raw) return;
      run();
      var r;
      if (editing) {
        r = update(editing.id, {
          text: state.task || raw,
          due: state.due,
          dueText: state.dueText,
          recurrence: state.recurrence
        });
      } else {
        r = create({
          text: state.task || raw,
          due: state.due,
          dueText: state.dueText,
          recurrence: state.recurrence,
          source: 'manual'
        });
      }
      if (sheet && sheet.close) { try { sheet.close(); } catch (e) {} }
      if (r) toast(formatConfirm(r), 5200);
    });

    try {
      if (PB.ui && PB.ui.sheet) sheet = PB.ui.sheet(editing ? 'Edit reminder' : 'New reminder', wrap);
    } catch (e) { sheet = null; }
    if (sheet) revealSheet();

    if (!sheet) {
      // No sheet helper available — fall back to an inline panel so the feature still works.
      var host = mountedRoot || document.body;
      var fb = el('div', 'rm-fallback-sheet');
      fb.appendChild(el('div', 'rm-fallback-title', editing ? 'Edit reminder' : 'New reminder'));
      fb.appendChild(wrap);
      var cancel = el('button', 'rm-btn rm-btn-ghost', 'Cancel');
      cancel.type = 'button';
      cancel.addEventListener('click', function () { if (fb.parentNode) fb.parentNode.removeChild(fb); });
      fb.appendChild(cancel);
      host.appendChild(fb);
      sheet = { close: function () { if (fb.parentNode) fb.parentNode.removeChild(fb); } };
    }

    setTimeout(function () { try { input.focus(); } catch (e) {} run(); }, 60);
    return sheet;
  }

  /* ------------------------------------------------------- actions sheet */

  function openActions(r) {
    var wrap = el('div', 'rm-actions');
    var head = el('div', 'rm-actions-head');
    head.appendChild(el('div', 'rm-actions-title', r.text));
    var d = effDue(r);
    head.appendChild(el('div', 'rm-actions-sub', d ? dayPhrase(d) + ' at ' + compactTime(d) : 'No time set'));
    wrap.appendChild(head);

    var sheet = null;
    function close() { if (sheet && sheet.close) { try { sheet.close(); } catch (e) {} } }

    function row(label, sub, fn, cls) {
      var b = el('button', 'rm-action ' + (cls || ''));
      b.type = 'button';
      b.appendChild(el('span', 'rm-action-label', label));
      if (sub) b.appendChild(el('span', 'rm-action-sub', sub));
      b.addEventListener('click', function () { close(); setTimeout(fn, 60); });
      wrap.appendChild(b);
      return b;
    }

    if (isOpen(r)) {
      row('Mark done', null, function () { complete(r.id); });

      var snoozeHead = el('div', 'rm-actions-group', 'Snooze');
      wrap.appendChild(snoozeHead);
      row('10 minutes', at(10), function () { snooze(r.id, 10); });
      row('1 hour', at(60), function () { snooze(r.id, 60); });
      row('This evening', atClock(19), function () { snooze(r.id, minutesUntilHour(19)); });
      row('Tomorrow morning', atClock(9, true), function () { snooze(r.id, minutesUntilHour(9, true)); });
    } else {
      row('Move back to open', null, function () { uncomplete(r.id); });
    }

    wrap.appendChild(el('div', 'rm-actions-group', 'Change'));
    row('Edit wording or time', null, function () { openComposer({ reminder: r }); });
    row('Delete', null, function () {
      try {
        if (PB.ui && PB.ui.confirm) {
          PB.ui.confirm('Delete this reminder?', r.text, 'Delete').then(function (ok) { if (ok) remove(r.id); });
          return;
        }
      } catch (e) {}
      remove(r.id);
    }, 'rm-action-danger');

    try {
      if (PB.ui && PB.ui.sheet) sheet = PB.ui.sheet('Reminder', wrap);
    } catch (e) { sheet = null; }
    if (sheet) revealSheet();
    return sheet;
  }

  function at(mins) {
    var d = addMinutes(now(), mins);
    return 'until ' + compactTime(d);
  }

  function minutesUntilHour(hour, tomorrow) {
    var n = now();
    var d = startOfDay(n);
    if (tomorrow) d = addDays(d, 1);
    d.setHours(hour, 0, 0, 0);
    if (d.getTime() <= n.getTime()) d = addDays(d, 1);
    return Math.max(1, Math.round((d.getTime() - n.getTime()) / 60000));
  }

  function atClock(hour, tomorrow) {
    var n = now();
    var d = startOfDay(n);
    if (tomorrow) d = addDays(d, 1);
    d.setHours(hour, 0, 0, 0);
    if (d.getTime() <= n.getTime()) d = addDays(d, 1);
    return dayPhrase(d) + ' at ' + compactTime(d);
  }

  /* ------------------------------------------------------------- screen */

  var mountedRoot = null;
  var lastRoot = null;        // the element we last painted, kept so we can tidy up after ourselves
  var deliveryNodes = null;  // the quiet footer line + the nudge slot above the list
  var sheetNodes = null;      // the "how reminders reach you" sheet, while it's open
  var timeNodes = [];

  function repaint() {
    if (!mountedRoot) return;
    if (!mountedRoot.isConnected && !(mountedRoot.parentNode)) { mountedRoot = null; return; }
    // #screen is shared across tabs, so being connected doesn't mean we're the visible
    // screen. Repainting regardless would paint Reminders over another tab.
    if (PB.app && typeof PB.app.current === 'function' && PB.app.current() !== 'reminders') {
      mountedRoot = null;
      return;
    }
    renderScreen(mountedRoot);
  }

  function groupsFor() {
    var n = now();
    var todayEnd = addDays(startOfDay(n), 1);
    var tomorrowEnd = addDays(startOfDay(n), 2);
    var weekEnd = addDays(startOfDay(n), 7);

    var g = {
      overdue: [], today: [], tomorrow: [], week: [], later: [], undated: [], done: []
    };

    for (var i = 0; i < items.length; i++) {
      var r = items[i];
      if (!isOpen(r)) { g.done.push(r); continue; }
      var d = effDue(r);
      if (!d) { g.undated.push(r); continue; }
      var t = d.getTime();
      if (t <= n.getTime()) g.overdue.push(r);
      else if (t < todayEnd.getTime()) g.today.push(r);
      else if (t < tomorrowEnd.getTime()) g.tomorrow.push(r);
      else if (t < weekEnd.getTime()) g.week.push(r);
      else g.later.push(r);
    }
    for (var k in g) if (Object.prototype.hasOwnProperty.call(g, k)) g[k].sort(sortByDue);
    g.done.reverse();
    return g;
  }

  function renderScreen(rootEl) {
    if (!rootEl) return;
    mountedRoot = rootEl;
    lastRoot = rootEl;
    timeNodes = [];
    deliveryNodes = null;   // sheetNodes deliberately survives a repaint: the sheet is
                            // outside rootEl and stays live while it's open.
    rootEl.innerHTML = '';
    rootEl.classList.add('rm-screen');

    var g = groupsFor();
    var openCount = g.overdue.length + g.today.length + g.tomorrow.length + g.week.length + g.later.length + g.undated.length;

    /* header */
    var head = el('header', 'rm-head');
    var titles = el('div', 'rm-head-titles');
    titles.appendChild(el('h1', 'rm-title', 'Reminders'));
    // The state of the list is said once, here. The empty state below carries the
    // invitation instead, so the same sentence never lands twice on one screen.
    var sub;
    if (openCount === 0) sub = 'Nothing on the list.';
    else if (g.overdue.length) sub = g.overdue.length + ' waiting on you · ' + openCount + ' open';
    else sub = openCount + ' open';
    titles.appendChild(el('p', 'rm-sub', sub));
    head.appendChild(titles);
    rootEl.appendChild(head);

    /* the action, first and unmissable */
    var add = el('button', 'rm-new');
    add.type = 'button';
    add.appendChild(svg(ICON.plus, 'rm-ico rm-new-ico'));
    add.appendChild(el('span', 'rm-new-label', 'New reminder'));
    add.addEventListener('click', function () { openComposer({}); });
    var addWrap = el('div', 'rm-newwrap');
    addWrap.appendChild(add);
    rootEl.appendChild(addWrap);

    /* one line, and only when there is something worth doing about it */
    var nudgeHost = el('div', 'rm-nudge-host');
    rootEl.appendChild(nudgeHost);

    var body = el('div', 'rm-list');
    rootEl.appendChild(body);

    if (openCount === 0 && g.done.length === 0) {
      body.appendChild(renderEmpty());
    } else {
      section(body, 'Overdue', g.overdue, 'rm-sec-overdue');
      section(body, 'Today', g.today);
      section(body, 'Tomorrow', g.tomorrow);
      section(body, 'This week', g.week);
      section(body, 'Later', g.later);
      section(body, 'No time set', g.undated, 'rm-sec-undated');

      if (g.done.length) {
        var doneWrap = el('details', 'rm-done');
        var summary = document.createElement('summary');
        summary.className = 'rm-done-summary';
        summary.textContent = 'Done · ' + g.done.length;
        doneWrap.appendChild(summary);
        var dl = el('div', 'rm-sec-items');
        for (var i = 0; i < g.done.length && i < 25; i++) dl.appendChild(renderRow(g.done[i]));
        doneWrap.appendChild(dl);
        body.appendChild(doneWrap);
      }
    }

    /* the honest bit — quiet, at the foot, one tap from the whole truth */
    rootEl.appendChild(renderDeliveryLine(nudgeHost));

    updateDelivery();
  }

  function section(host, label, arr, cls) {
    if (!arr || !arr.length) return;
    var sec = el('section', 'rm-sec ' + (cls || ''));
    var h = el('div', 'rm-sec-head');
    h.appendChild(el('span', 'rm-sec-label', label));
    h.appendChild(el('span', 'rm-sec-count', String(arr.length)));
    sec.appendChild(h);
    if (cls === 'rm-sec-undated') {
      sec.appendChild(el('p', 'rm-sec-note', 'These have no time, so they can’t nudge you. Tap one to give it a time.'));
    }
    var wrap = el('div', 'rm-sec-items');
    for (var i = 0; i < arr.length; i++) wrap.appendChild(renderRow(arr[i]));
    sec.appendChild(wrap);
    host.appendChild(sec);
  }

  function renderRow(r) {
    var done = !isOpen(r);
    var d = effDue(r);
    var overdueRow = !done && d && d.getTime() <= now().getTime();

    var row = el('div', 'rm-row' + (done ? ' is-done' : '') + (overdueRow ? ' is-overdue' : ''));
    row.setAttribute('data-id', r.id);

    var box = el('button', 'rm-check' + (done ? ' is-checked' : ''));
    box.type = 'button';
    box.setAttribute('aria-label', done ? 'Mark not done: ' + r.text : 'Mark done: ' + r.text);
    box.setAttribute('aria-pressed', done ? 'true' : 'false');
    box.appendChild(svg(ICON.check, 'rm-check-ico'));
    box.addEventListener('click', function (ev) {
      ev.stopPropagation();
      if (done) uncomplete(r.id); else complete(r.id);
    });
    row.appendChild(box);

    var main = el('div', 'rm-main');
    main.appendChild(el('div', 'rm-text', r.text));

    var meta = el('div', 'rm-meta');
    var timeEl = el('span', 'rm-time');
    meta.appendChild(timeEl);
    timeNodes.push({ node: timeEl, r: r });
    paintTime(timeEl, r);

    if (r.recurrence) {
      meta.appendChild(el('span', 'rm-tag', recurrencePhrase(r.recurrence)));
    }
    if (r.snoozedUntil && isOpen(r)) {
      meta.appendChild(el('span', 'rm-tag', 'snoozed'));
    }
    if (hasTag(r, ASSUMED_TAG) && isOpen(r)) {
      meta.appendChild(el('span', 'rm-tag rm-tag-soft', 'time I picked'));
    }
    if (r.source === 'chat' || r.source === 'voice') {
      meta.appendChild(el('span', 'rm-tag rm-tag-soft', r.source === 'voice' ? 'from voice' : 'from chat'));
    }
    main.appendChild(meta);
    row.appendChild(main);

    var more = el('button', 'rm-more');
    more.type = 'button';
    more.setAttribute('aria-label', 'More options for ' + r.text);
    more.appendChild(svg(ICON.dots));
    more.addEventListener('click', function (ev) {
      ev.stopPropagation();
      openActions(r);
    });
    row.appendChild(more);

    attachLongPress(row, function () { openActions(r); });
    return row;
  }

  function paintTime(node, r) {
    var d = effDue(r);
    if (!isOpen(r)) {
      node.textContent = r.completedAt ? 'Done ' + relPhrase(new Date(r.completedAt)) : 'Done';
      node.className = 'rm-time';
      return;
    }
    if (!d) {
      node.textContent = 'No time set';
      node.className = 'rm-time is-vague';
      return;
    }
    var late = d.getTime() <= now().getTime();
    node.textContent = dayPhrase(d) + ' at ' + clock(d) + ' · ' + relPhrase(d);
    node.className = 'rm-time' + (late ? ' is-late' : '');
  }

  function refreshTimes() {
    for (var i = 0; i < timeNodes.length; i++) {
      var t = timeNodes[i];
      if (!t.node || !t.node.parentNode) continue;
      paintTime(t.node, t.r);
    }
  }

  function attachLongPress(node, fn) {
    var timer = null, moved = false, fired = false;
    function start(ev) {
      moved = false; fired = false;
      timer = setTimeout(function () {
        fired = true;
        haptic();
        fn();
      }, 480);
    }
    function cancel() {
      if (timer) { clearTimeout(timer); timer = null; }
    }
    node.addEventListener('touchstart', start, { passive: true });
    node.addEventListener('touchmove', function () { moved = true; cancel(); }, { passive: true });
    node.addEventListener('touchend', cancel);
    node.addEventListener('touchcancel', cancel);
    node.addEventListener('contextmenu', function (ev) {
      ev.preventDefault();
      if (!fired) fn();
    });
  }

  function renderEmpty() {
    var e = el('div', 'rm-empty');
    e.appendChild(el('div', 'rm-empty-bee', '🐝'));
    e.appendChild(el('p', 'rm-empty-body',
      'Say it the way you’d say it out loud. I’ll read back the exact time I set it for.'));
    var ex = el('div', 'rm-empty-examples');
    examples().forEach(function (s) {
      var b = el('button', 'rm-chip', s);
      b.type = 'button';
      b.addEventListener('click', function () { openComposer({ seed: s }); });
      ex.appendChild(b);
    });
    e.appendChild(ex);
    return e;
  }

  /* --------------------------------------------------- delivery, demoted */

  // The truth about what this app can and can't do stays in the product — it just
  // stops being the first thing anyone reads. One line at the foot of the list,
  // one tap to the whole story, and a single offer up top when there's a fix to make.

  var FINE = 'Straight answer: I can’t wake your phone on my own if Personalbee is fully closed. ' +
    'Anything that came due while you were away fires the second you open it.';

  function statusWord(s) {
    if (s.os === 'unsupported') return 'in-app only';
    if (s.level === 'on') return 'on';
    if (s.level === 'off') return 'off';
    return 'in-app only';
  }

  function nudgeKey(s) { return s.action ? s.action.label : 'none'; }

  function paintNudge(host, s) {
    if (!host) return;
    host.innerHTML = '';
    if (!s.action) return;                    // nothing to offer, so say nothing
    var b = el('button', 'rm-nudge');
    b.type = 'button';
    b.appendChild(svg(ICON.bell, 'rm-ico rm-nudge-ico'));
    var t = el('span', 'rm-nudge-text');
    t.appendChild(el('span', 'rm-nudge-title',
      s.action.label === 'Fix this' ? 'Finish turning notifications on' : 'Turn on notifications'));
    t.appendChild(el('span', 'rm-nudge-sub', 'Until then I can only nudge you while the app is open.'));
    b.appendChild(t);
    b.appendChild(svg(ICON.chev, 'rm-ico rm-nudge-chev'));
    b.addEventListener('click', function () { s.action.fn(); });
    host.appendChild(b);
  }

  function renderDeliveryLine(nudgeHost) {
    var s = deliveryStatus();
    var b = el('button', 'rm-deliv-line');
    b.type = 'button';
    b.appendChild(svg(ICON.bell, 'rm-ico rm-deliv-ico'));
    b.appendChild(el('span', 'rm-deliv-label', 'How reminders reach you'));
    var word = el('span', 'rm-deliv-word', statusWord(s));
    b.appendChild(word);
    b.appendChild(svg(ICON.chev, 'rm-ico rm-deliv-chev'));
    b.addEventListener('click', function () { openDelivery(); });
    deliveryNodes = { line: b, word: word, nudgeHost: nudgeHost || null, nudgeKey: null };
    return b;
  }

  function openDelivery() {
    var s = deliveryStatus();
    var wrap = el('div', 'rm-deliv');
    var headline = el('div', 'rm-deliv-headline', s.headline);
    var detail = el('p', 'rm-deliv-detail', s.detail);
    wrap.appendChild(headline);
    wrap.appendChild(detail);
    wrap.appendChild(el('p', 'rm-deliv-fine', FINE));

    var facts = el('div', 'rm-deliv-facts');
    function fact(k, v) {
      var f = el('div', 'rm-fact');
      f.appendChild(el('span', 'rm-fact-k', k));
      var val = el('span', 'rm-fact-v', v);
      f.appendChild(val);
      facts.appendChild(f);
      return val;
    }
    var permV = fact('Permission', permissionWord(s));
    fact('App', 'open now');
    var lastV = fact('Last check', lastCheckWord());
    var waitV = fact('Waiting', s.waiting + (s.waiting === 1 ? ' reminder' : ' reminders'));
    wrap.appendChild(facts);

    if (s.action) {
      var cta = el('button', 'rm-btn rm-btn-primary rm-deliv-cta', s.action.label);
      cta.type = 'button';
      cta.addEventListener('click', function () { s.action.fn(); });
      wrap.appendChild(cta);
    }

    sheetNodes = { wrap: wrap, headline: headline, detail: detail, perm: permV, last: lastV, wait: waitV };

    var sheet = null;
    try { if (PB.ui && PB.ui.sheet) sheet = PB.ui.sheet('How reminders reach you', wrap); } catch (e) { sheet = null; }
    if (!sheet) toast(s.headline + ' — ' + s.detail, 6000);
    else revealSheet();
    return sheet;
  }

  function permissionWord(s) {
    if (s.os === 'unsupported') return 'not available here';
    if (s.trust === 'denied' || s.os === 'denied') return 'denied';
    if (s.trust === 'granted' && s.os === 'granted') return 'granted';
    if (s.trust === 'granted') return 'granted to me, pending in browser';
    if (s.trust === 'unasked' || s.trust === null) return 'not asked yet';
    return String(s.trust);
  }

  function lastCheckWord() {
    if (!lastTickAt) return 'starting up';
    var secs = Math.max(0, Math.round((now().getTime() - lastTickAt.getTime()) / 1000));
    if (secs < 30) return 'just now';
    if (secs < 90) return 'a minute ago';
    return relPhrase(lastTickAt);
  }

  function updateDelivery() {
    var s = null;

    if (deliveryNodes && deliveryNodes.line && deliveryNodes.line.parentNode) {
      s = deliveryStatus();
      deliveryNodes.line.className = 'rm-deliv-line is-' + s.level;
      deliveryNodes.word.textContent = statusWord(s);
      // Only rebuild the nudge when it actually changes — it must never blink under a thumb.
      var key = nudgeKey(s);
      if (key !== deliveryNodes.nudgeKey) {
        paintNudge(deliveryNodes.nudgeHost, s);
        deliveryNodes.nudgeKey = key;
      }
    } else if (deliveryNodes) {
      deliveryNodes = null;
    }

    if (sheetNodes && sheetNodes.wrap && sheetNodes.wrap.parentNode) {
      s = s || deliveryStatus();
      sheetNodes.headline.textContent = s.headline;
      sheetNodes.detail.textContent = s.detail;
      sheetNodes.perm.textContent = permissionWord(s);
      sheetNodes.last.textContent = lastCheckWord();
      sheetNodes.wait.textContent = s.waiting + (s.waiting === 1 ? ' reminder' : ' reminders');
    } else if (sheetNodes) {
      sheetNodes = null;
    }
  }

  /* ---------------------------------------------------------------- boot */

  function wire() {
    try {
      if (PB.bus && PB.bus.on) {
        PB.bus.on('data:erased', function () {
          items = [];
          lastTickAt = null;
          try { if (PB.store && PB.store.del) { PB.store.del(KEY); PB.store.del(KEY_ASKED); PB.store.del(KEY_LASTTICK); } } catch (e) {}
          if (bannerHost) { bannerHost.innerHTML = ''; bannerFor = {}; }
          repaint();
        });
        PB.bus.on('permission:granted', function (p) {
          if (p && p.name === 'notifications') updateDelivery();
        });
        PB.bus.on('permission:denied', function (p) {
          if (p && p.name === 'notifications') updateDelivery();
        });
        PB.bus.on('screen:changed', function (p) {

    if (!note) return ids;
    try {
      if (!PB.kb || typeof PB.kb.findContact !== 'function') return ids;
      var words = note.split(/[^A-Za-z']+/);
      for (var i = 0; i < words.length; i++) {
        var w = words[i];
        if (!w || w.length < 3) continue;
        var hits = PB.kb.findContact(w);
        if (hits && hits.length) {
          var top = hits[0];
          var name = (top && top.name || '').toLowerCase();
          var nick = (top && top.nickname || '').toLowerCase();
          var lw = w.toLowerCase();
          // Only link on a real name/nickname hit, never on a vibe match.
          if (top && top.id &&
              (name.split(/\s+/).indexOf(lw) >= 0 || nick === lw) &&
              ids.indexOf(top.id) < 0) {
            ids.push(top.id);
          }
        }
      }
    } catch (e) { /* kb may not be ready — degrade quietly */ }
    return ids;
  }

  function contactName(id) {
    try {
      if (!PB.kb || !PB.kb.contacts) return null;
      for (var i = 0; i < PB.kb.contacts.length; i++) {
        if (PB.kb.contacts[i].id === id) return PB.kb.contacts[i].name || null;
      }
    } catch (e) {}
    return null;
  }

  /* --------------------------------------------------------------------- */
  /* The guess — deterministic, offline, and honest about being a guess     */
  /* --------------------------------------------------------------------- */

  var SUBJECT_HINTS = [
    { words: ['gloss', 'lipstick', 'lip', 'balm'], subject: 'a lip product' },
    { words: ['serum', 'moisturizer', 'moisturiser', 'cleanser', 'toner', 'spf', 'sunscreen'], subject: 'a skincare bottle' },
    { words: ['palette', 'eyeshadow', 'blush', 'bronzer'], subject: 'a makeup palette' },
    { words: ['swatch', 'shade'], subject: 'swatches on skin' },
    { words: ['nails', 'manicure'], subject: 'nails' },
    { words: ['hair'], subject: 'hair' },
    { words: ['outfit', 'fit', 'dress'], subject: 'an outfit' },
    { words: ['receipt', 'invoice'], subject: 'a receipt' },
    { words: ['screenshot', 'screen'], subject: 'a screenshot' },
    { words: ['call sheet', 'brief', 'contract', 'note', 'list'], subject: 'a page of text' },
    { words: ['pr', 'package', 'packaging', 'box'], subject: 'PR packaging' },
    { words: ['coffee', 'lunch', 'dinner', 'food', 'matcha'], subject: 'food or a drink' },
    { words: ['set', 'shoot', 'studio'], subject: 'something on set' },
    { words: ['mirror', 'selfie'], subject: 'a mirror shot' }
  ];

  function hueName(r, g, b, sat) {
    if (sat < 0.14) return 'mostly neutral';
    var mx = Math.max(r, g, b);
    if (mx === r && g >= b) return r - b > 60 && g > 110 ? 'warm gold' : 'warm pink-red';
    if (mx === r) return 'pink-red';
    if (mx === g) return 'green';
    if (mx === b && r > g) return 'purple-toned';
    return 'cool blue';
  }

  function heuristicGuess(sample, note) {
    var bits = [];
    var confidence = 0.18;
    var text = (note || '').toLowerCase();

    // 1. Anything she said outranks anything the pixels say.
    var subject = null;
    for (var i = 0; i < SUBJECT_HINTS.length; i++) {
      var hint = SUBJECT_HINTS[i];
      for (var j = 0; j < hint.words.length; j++) {
        if (text.indexOf(hint.words[j]) >= 0) { subject = hint.subject; break; }
      }
      if (subject) break;
    }

    if (subject) {
      bits.push('probably ' + subject + ', going by what you wrote');
      confidence += 0.16;
    }

    // 2. Then geometry, light and colour — but only if we could actually read
    //    the pixels. If we couldn't, say so rather than inventing detail.
    if (sample.ok) {
      var shape = 'a square frame';
      if (sample.w && sample.h) {
        var ratio = sample.w / sample.h;
        if (ratio < 0.85) shape = 'a tall portrait shot';
        else if (ratio > 1.18) shape = 'a wide landscape shot';
      }
      var light = sample.bright > 0.72 ? 'bright, probably daylight or a ring light'
        : sample.bright < 0.3 ? 'dim, low light'
          : 'soft, even light';
      var colour = hueName(sample.r, sample.g, sample.b, sample.sat);
      var busy = (sample.contrast || 0) > 0.22
        ? 'a fair amount going on in the frame'
        : 'a simple frame, likely one thing close up';

      if (!subject) bits.push('I can only really see shape and colour here');
      bits.push(shape + ', ' + light);
      bits.push(colour + ' overall, ' + busy);
      confidence += 0.06;
    } else {
      bits.push(subject
        ? 'though I couldn\'t actually read the picture itself'
        : 'I couldn\'t read this picture, and you haven\'t told me yet what it is');
    }

    if (text.length > 12) confidence += 0.04;
    confidence = Math.max(0.1, Math.min(0.45, confidence));

    var sentence = bits.join('. ') + '.';
    sentence = sentence.replace(/(^|\.\s+)([a-z])/g, function (all, lead, ch) {
      return lead + ch.toUpperCase();
    });

    return {
      text: sentence,
      confidence: Math.round(confidence * 100) / 100,
      source: 'offline'
    };
  }

  /**
   * guess(momentOrId) -> Promise<moment|null>
   * Writes aiGuess/aiConfidence onto the moment and persists. Never touches
   * userNote. Uses PB.brain.vision only when a key exists and airplane mode
   * is off; otherwise a deterministic local heuristic.
   */
  function guess(momentOrId) {
    var m = typeof momentOrId === 'string' ? get(momentOrId) : momentOrId;
    if (!m || !m.id) return Promise.resolve(null);

    var canAsk = false;
    try {
      canAsk = !!(PB.brain && PB.brain.hasKey && PB.brain.hasKey() &&
        typeof PB.brain.vision === 'function' && !isAirplane());
    } catch (e) { canAsk = false; }

    var remote = Promise.resolve(null);
    if (canAsk) {
      try {
        remote = Promise.resolve(PB.brain.vision(m.dataUrl))['catch'](function () { return null; });
      } catch (e) { remote = Promise.resolve(null); }
    }

    return remote.then(function (r) {
      if (r) {
        var text = typeof r === 'string' ? r : (r && (r.text || r.guess)) || '';
        if (text) {
          var conf = (r && typeof r.confidence === 'number') ? r.confidence : 0.55;
          return { text: String(text), confidence: Math.max(0, Math.min(0.9, conf)), source: 'brain' };
        }
      }
      return sampleImage(m.dataUrl).then(function (s) {
        sampleCache[m.id] = s;
        return heuristicGuess(s, m.userNote);
      });
    })['catch'](function () {
      return { text: 'I couldn\'t read this one at all.', confidence: 0.1, source: 'offline' };
    }).then(function (g) {
      var list = readAll();
      var target = null;
      for (var i = 0; i < list.length; i++) if (list[i].id === m.id) target = list[i];
      if (!target) return null;
      target.aiGuess = g.text;
      target.aiConfidence = g.confidence;
      m.aiGuess = g.text;
      m.aiConfidence = g.confidence;
      var res = saveMoment(list, target);
      if (!res.ok && res.quota) reportQuota(target);
      emit('photo:updated', target);
      repaint();
      return target;
    });
  }

  /* --------------------------------------------------------------------- */
  /* Public data API                                                       */
  /* --------------------------------------------------------------------- */

  function sortMoments(a, b) {
    if (!!a.pinned !== !!b.pinned) return a.pinned ? -1 : 1;
    return safeDate(b.createdAt).getTime() - safeDate(a.createdAt).getTime();
  }

  /**
   * add(dataUrl, userNote) -> moment
   * Returns the moment synchronously. Downscaling + persistence finish on the
   * returned object's non-enumerable `ready` promise -> { saved:bool }.
   */
  function add(dataUrl, userNote) {
    var note = typeof userNote === 'string' ? userNote.trim() : '';
    var m = {
      id: uid(),
      dataUrl: typeof dataUrl === 'string' ? dataUrl : '',
      userNote: note,
      aiGuess: null,
      aiConfidence: 0,
      createdAt: now().toISOString(),
      tags: deriveTags(note),
      pinned: false,
      linkedContactIds: linkContacts(note)
    };

    var ready = downscale(m.dataUrl, MAX_EDGE, JPEG_Q).then(function (small) {
      m.dataUrl = small.dataUrl;
      var list = readAll();
      list.push(m);
      var res = saveMoment(list, m);

      if (!res.ok && res.quota) {
        // One rescue attempt at a harsher compression before we admit defeat.
        return downscale(m.dataUrl, RESCUE_EDGE, RESCUE_Q).then(function (tiny) {
          m.dataUrl = tiny.dataUrl;
          var list2 = readAll();
          list2.push(m);
          var res2 = saveMoment(list2, m);
          if (!res2.ok) {
            reportQuota(m);
            return { saved: false, moment: m };
          }
          toast('Storage was tight, so I saved that one a little smaller.', 4000);
          emit('photo:added', m);
          repaint();
          return { saved: true, moment: m };
        });
      }

      if (!res.ok) {
        reportQuota(m);
        return { saved: false, moment: m };
      }

      lastStorageError = null;
      emit('photo:added', m);
      repaint();
      return { saved: true, moment: m };
    })['catch'](function () {
      reportQuota(m);
      return { saved: false, moment: m };
    });

    try {
      Object.defineProperty(m, 'ready', { value: ready, enumerable: false, configurable: true });
    } catch (e) { /* older engines: caller just won't get `ready` */ }

    return m;
  }

  /** capture() -> Promise<moment|null> */
  function capture(useLibrary) {
    var wantsCamera = useLibrary !== true;

    var gate = Promise.resolve(true);
    if (wantsCamera && PB.trust && PB.trust.request) {
      try {
        gate = Promise.resolve(PB.trust.request(
          'camera',
          'So you can snap something and tell me what it is in your own words. Photos stay on this phone — I never upload them.'
        ))['catch'](function () { return false; });
      } catch (e) { gate = Promise.resolve(false); }
    }

    return gate.then(function (allowed) {
      if (!allowed) {
        toast('No camera then — you can still pick a photo from your library.');
        return null;
      }
      return pickFile(wantsCamera, function (late) { finishCapture(late); })
        .then(function (dataUrl) {
          if (!dataUrl) return null;
          return finishCapture(dataUrl);
        });
    })['catch'](function () { return null; });
  }

  function finishCapture(rawDataUrl) {
    return downscale(rawDataUrl, MAX_EDGE, JPEG_Q).then(function (small) {
      return askNote(small.dataUrl).then(function (note) {
        if (note === null) {
          toast('Gone. Nothing saved.');
          return null;
        }
        var m = add(small.dataUrl, note);
        var ready = m.ready || Promise.resolve({ saved: true });
        return ready.then(function (res) {
          if (!res || !res.saved) return m;
          guess(m); // supplements her note in the background; never blocks
          return m;
        });
      });
    })['catch'](function () { return null; });
  }

  function get(id) {
    var list = readAll();
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  function attachNote(id, text) {
    var list = readAll();
    var target = null;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) target = list[i];
    if (!target) return null;
    target.userNote = typeof text === 'string' ? text.trim() : '';
    target.tags = deriveTags(target.userNote);
    target.linkedContactIds = linkContacts(target.userNote);
    var res = saveMoment(list, target);
    if (!res.ok) {
      if (res.quota) reportQuota(target);
      else toast('I couldn\'t save that edit — your note is unchanged.');
      return get(id);
    }
    emit('photo:updated', target);
    repaint();
    return target;
  }

  function remove(id) {
    var list = readAll();
    var kept = [];
    var found = null;
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) found = list[i];
      else kept.push(list[i]);
    }
    if (!found) return false;
    var res = writeAll(kept, function (back) { return back.length === kept.length; });
    if (!res.ok) { toast('I couldn\'t delete that one just now.'); return false; }
    delete sampleCache[id];
    lastStorageError = null;
    emit('photo:removed', found);
    repaint();
    return true;
  }

  function pin(id, value) {
    var list = readAll();
    var target = null;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) target = list[i];
    if (!target) return null;
    target.pinned = value === undefined ? !target.pinned : !!value;
    var res = saveMoment(list, target);
    if (!res.ok) { toast('I couldn\'t save that just now.'); return get(id); }
    emit('photo:updated', target);
    repaint();
    return target;
  }

  /** Clears the guess only. Her note is never touched. */
  function clearGuess(id) {
    var list = readAll();
    var target = null;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) target = list[i];
    if (!target) return null;
    target.aiGuess = null;
    target.aiConfidence = 0;
    saveMoment(list, target);
    emit('photo:updated', target);
    repaint();
    return target;
  }

  function list(filter) {
    var all = readAll();
    var f = filter;
    if (typeof filter === 'string') {
      if (filter === 'pinned') f = { pinned: true };
      else if (filter === 'all' || !filter) f = {};
      else f = { query: filter };
    }
    f = f || {};
    var out = [];
    for (var i = 0; i < all.length; i++) {
      var m = all[i];
      if (f.pinned !== undefined && !!m.pinned !== !!f.pinned) continue;
      if (f.tag && m.tags.indexOf(f.tag) < 0) continue;
      if (f.hasGuess !== undefined && !!m.aiGuess !== !!f.hasGuess) continue;
      if (f.contactId && m.linkedContactIds.indexOf(f.contactId) < 0) continue;
      if (f.since && safeDate(m.createdAt).getTime() < new Date(f.since).getTime()) continue;
      if (f.query && !matches(m, f.query)) continue;
      out.push(m);
    }
    out.sort(sortMoments);
    if (f.limit) out = out.slice(0, f.limit);
    return out;
  }

  function matches(m, query) {
    var q = String(query || '').toLowerCase().trim();
    if (!q) return true;
    var terms = q.split(/\s+/);
    var hay = [
      m.userNote || '',
      m.aiGuess || '',
      (m.tags || []).join(' '),
      fmtDay(safeDate(m.createdAt)),
      safeDate(m.createdAt).toDateString()
    ].join(' ').toLowerCase();
    for (var i = 0; i < terms.length; i++) {
      if (hay.indexOf(terms[i]) < 0) return false;
    }
    return true;
  }

  /** Ranked search — her own words weigh far more than the guess. */
  function search(query) {
    var q = String(query || '').toLowerCase().trim();
    if (!q) return list();
    var terms = q.split(/\s+/);
    var all = readAll();
    var scored = [];
    for (var i = 0; i < all.length; i++) {
      var m = all[i];
      var note = (m.userNote || '').toLowerCase();
      var ai = (m.aiGuess || '').toLowerCase();
      var tags = (m.tags || []).join(' ').toLowerCase();
      var score = 0;
      for (var t = 0; t < terms.length; t++) {
        var term = terms[t];
        if (note.indexOf(term) >= 0) score += 5;
        if (tags.indexOf(term) >= 0) score += 2;
        if (ai.indexOf(term) >= 0) score += 1;   // the guess is the weakest signal
      }
      if (score > 0) {
        if (m.pinned) score += 1;   // a nudge for matches only, never a free pass
        scored.push({ m: m, score: score });
      }
    }
    scored.sort(function (a, b) {
      if (b.score !== a.score) return b.score - a.score;
      return sortMoments(a.m, b.m);
    });
    var out = [];
    for (var k = 0; k < scored.length; k++) out.push(scored[k].m);
    return out;
  }

  /* --------------------------------------------------------------------- */
  /* Rendering                                                             */
  /* --------------------------------------------------------------------- */

  var mounted = null;   // { root, query }
  var view = 'feed';
  try { view = (PB.store && PB.store.get) ? (PB.store.get(VIEW_KEY, 'feed') || 'feed') : 'feed'; } catch (e) {}

  function confidenceWord(c) {
    if (c < 0.35) return 'low confidence';
    if (c < 0.6) return 'not sure';
    return 'fairly confident';
  }

  function icon(name) {
    var paths = {
      camera: '<path fill="currentColor" d="M9 3.5 7.8 5.5H5A2.5 2.5 0 0 0 2.5 8v9A2.5 2.5 0 0 0 5 19.5h14A2.5 2.5 0 0 0 21.5 17V8A2.5 2.5 0 0 0 19 5.5h-2.8L15 3.5H9zM12 8.5a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/>',
      image: '<path fill="currentColor" d="M4 4.5h16A1.5 1.5 0 0 1 21.5 6v12A1.5 1.5 0 0 1 20 19.5H4A1.5 1.5 0 0 1 2.5 18V6A1.5 1.5 0 0 1 4 4.5zm2 11 3.2-4 2.4 3 3.2-4.4 4 5.4H6z"/>',
      pin: '<path fill="currentColor" d="M14.5 2.5 21 9l-2.6 1-3.2 4.4.5 3.3L13 20 9.6 16.6 4.4 21l-1.1-1.1 4.4-5.2L4.3 11l2.3-2.7 3.3.5L14.5 2.5z"/>',
      search: '<path fill="currentColor" d="M10.5 3a7.5 7.5 0 1 1-4.6 13.4l-3.2 3.2-1.4-1.4 3.2-3.2A7.5 7.5 0 0 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/>',
      feed: '<path fill="currentColor" d="M3.5 4.5h17v6h-17v-6zm0 9h17v6h-17v-6z"/>',
      grid: '<path fill="currentColor" d="M3.5 3.5h7v7h-7v-7zm10 0h7v7h-7v-7zm-10 10h7v7h-7v-7zm10 0h7v7h-7v-7z"/>'
    };
    var span = el('span', 'pm-icon');
    span.innerHTML = '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">' +
      (paths[name] || '') + '</svg>';
    return span;
  }

  function repaint() {
    if (!mounted || !mounted.root || !document.body.contains(mounted.root)) {
      mounted = null;
      return;
    }
    var root = mounted.root;
    var q = mounted.query;
    renderScreen(root, { keepQuery: q });
  }

  function renderScreen(rootEl, opts) {
    if (!rootEl) return;
    opts = opts || {};
    var query = opts.keepQuery || '';
    mounted = { root: rootEl, query: query };

    rootEl.innerHTML = '';
    rootEl.classList.add('pb-moments');

    /* ---- header ---- */
    var head = el('header', 'pm-head');
    var titleRow = el('div', 'pm-title-row');
    titleRow.appendChild(el('h1', 'pm-title', 'Moments'));
    var viewBtn = el('button', 'pm-view-toggle');
    viewBtn.type = 'button';
    viewBtn.setAttribute('aria-label', view === 'feed' ? 'Switch to grid' : 'Switch to list');
    viewBtn.appendChild(icon(view === 'feed' ? 'grid' : 'feed'));
    viewBtn.addEventListener('click', function () {
      view = view === 'feed' ? 'grid' : 'feed';
      try { if (PB.store && PB.store.set) PB.store.set(VIEW_KEY, view); } catch (e) {}
      haptic();
      repaint();
    });
    titleRow.appendChild(viewBtn);
    head.appendChild(titleRow);
    head.appendChild(el('p', 'pm-sub',
      'Your words are the record. Anything I add is a guess until you say otherwise.'));
    rootEl.appendChild(head);

    /* ---- storage warning ---- */
    if (lastStorageError) {
      var warn = el('div', 'pm-warn');
      warn.appendChild(el('p', 'pm-warn-text', lastStorageError.text));
      var dismiss = el('button', 'pm-btn pm-btn-text', 'Got it');
      dismiss.type = 'button';
      dismiss.addEventListener('click', function () { lastStorageError = null; repaint(); });
      warn.appendChild(dismiss);
      rootEl.appendChild(warn);
    }

    /* ---- capture actions ---- */
    var actions = el('div', 'pm-actions');
    var shoot = el('button', 'pm-capture');
    shoot.type = 'button';
    shoot.appendChild(icon('camera'));
    shoot.appendChild(el('span', 'pm-capture-label', 'Take a photo'));
    shoot.addEventListener('click', function () { haptic(); capture(); });
    var lib = el('button', 'pm-capture pm-capture-alt');
    lib.type = 'button';
    lib.appendChild(icon('image'));
    lib.appendChild(el('span', 'pm-capture-label', 'From library'));
    lib.addEventListener('click', function () { haptic(); capture(true); });
    actions.appendChild(shoot);
    actions.appendChild(lib);
    rootEl.appendChild(actions);

    /* ---- search ---- */
    var all = readAll();
    if (all.length > 2) {
      var searchWrap = el('div', 'pm-search');
      searchWrap.appendChild(icon('search'));
      var input = el('input', 'pm-search-input');
      input.type = 'search';
      input.value = query;
      input.setAttribute('placeholder', 'Search your moments');
      input.setAttribute('aria-label', 'Search your moments');
      input.addEventListener('input', function () {
        mounted.query = input.value;
        var results = input.value.trim() ? search(input.value) : list();
        paintList(listWrap, results, input.value);
      });
      searchWrap.appendChild(input);
      rootEl.appendChild(searchWrap);
    }

    /* ---- moments ---- */
    var listWrap = el('div', 'pm-list');
    listWrap.setAttribute('data-view', view);
    rootEl.appendChild(listWrap);
    paintList(listWrap, query.trim() ? search(query) : list(), query);
  }

  function paintList(wrap, moments, query) {
    wrap.innerHTML = '';
    wrap.setAttribute('data-view', view);

    if (!moments.length) {
      var empty = el('div', 'pm-empty');
      if (query && query.trim()) {
        empty.appendChild(el('p', 'pm-empty-title', 'Nothing matches "' + query.trim() + '".'));
        empty.appendChild(el('p', 'pm-empty-sub', 'I only search what you wrote, plus my own guesses.'));
      } else {
        empty.appendChild(el('span', 'pm-empty-mark', '📷'));
        empty.appendChild(el('p', 'pm-empty-title', 'No moments yet.'));
        empty.appendChild(el('p', 'pm-empty-sub',
          'Take a photo and tell me what it is. I\'ll keep your words exactly as you said them.'));
      }
      wrap.appendChild(empty);
      return;
    }

    var lastGroup = null;
    for (var i = 0; i < moments.length; i++) {
      var m = moments[i];
      if (view === 'feed') {
        var group = m.pinned ? 'Pinned' : fmtDay(safeDate(m.createdAt));
        if (group !== lastGroup) {
          wrap.appendChild(el('h2', 'pm-group', group));
          lastGroup = group;
        }
      }
      wrap.appendChild(renderCard(m, { compact: view === 'grid' }));
    }
  }

  /**
   * The card. Hierarchy is the product:
   *   1. her note   — big, bold, first
   *   2. the guess  — smaller, dimmed, labelled, dismissible
   */
  function renderCard(m, opts) {
    opts = opts || {};
    var card = el('article', 'pm-card' + (opts.compact ? ' pm-card-compact' : ''));
    card.setAttribute('data-id', m.id);

    /* photo */
    var figure = el('button', 'pm-thumb');
    figure.type = 'button';
    figure.setAttribute('aria-label', 'Open ' + label(m));
    var img = el('img', 'pm-thumb-img');
    img.alt = m.userNote ? m.userNote : 'A moment with no note yet';
    img.loading = 'lazy';
    img.src = m.dataUrl;
    img.addEventListener('error', function () {
      figure.classList.add('is-broken');
      img.remove();
      figure.appendChild(el('span', 'pm-thumb-fallback', '🖼'));
    });
    figure.appendChild(img);
    if (m.pinned) {
      var pinMark = el('span', 'pm-pin-mark');
      pinMark.appendChild(icon('pin'));

    if (typeof c === 'string') return trim(c);
    if (isArr(c)) {
      return c.map(function (x) {
        if (typeof x === 'string') return '- ' + x;
        if (!x || !x.text) return '';
        var cf = (typeof x.confidence === 'number') ? (' [' + Math.round(x.confidence * 100) + '%]') : '';
        return '- ' + clip(x.text, 100) + cf;
      }).filter(Boolean).join('\n');
    }
    return '';
  }

  function memoryItems() {
    var list = call(PB.memory, ['items', 'list', 'all', 'getAll'], [], null);
    if (!isArr(list) && PB.store && isFn(PB.store.get)) {
      list = tryCall(PB.store.get, PB.store, ['memories', []], []);
    }
    if (!isArr(list)) list = [];
    if (!list.length && kb() && isArr(kb().seedMemories)) list = kb().seedMemories.slice();
    return list.filter(function (m) { return m && m.text; });
  }

  function memoryRecall(query) {
    var q = trim(query);
    // PB.memory.items({q}) does a substring pass for us.
    if (q && PB.memory && isFn(PB.memory.items)) {
      var direct = tryCall(PB.memory.items, PB.memory, [{ q: q }], null);
      if (isArr(direct) && direct.length) {
        return direct.filter(function (m) { return m && m.text; }).slice(0, 5);
      }
    }
    var hits = call(PB.memory, ['recall', 'search', 'find'], [q], null);
    if (isArr(hits) && hits.length) {
      return hits.map(function (x) { return (x && x.item) ? x.item : x; })
        .filter(function (m) { return m && m.text; }).slice(0, 5);
    }
    var all = memoryItems();
    if (!trim(query)) return all.slice(0, 5);
    var toks = tokens(query);
    var scored = all.map(function (m) {
      return { m: m, s: scoreText(low(m.text) + ' ' + low(arr(m.evidence).join(' ')) + ' ' + low(m.kind), toks) };
    }).filter(function (x) { return x.s > 0; }).sort(function (a, b) { return b.s - a.s; });
    return scored.map(function (x) { return x.m; }).slice(0, 5);
  }

  function memoryForget(item) {
    if (!item) return false;
    var ok = call(PB.memory, ['forget', 'remove', 'del', 'delete'], [item.id || item], null);
    if (ok !== null && ok !== undefined) return true;
    ok = call(PB.memory, ['forget', 'remove'], [item], null);
    return ok !== null && ok !== undefined;
  }

  /* ------------------------------------------------------------------ *
   * Absorbing what she tells us
   *
   * PB.memory is growing learn()/recall()/about()/forgetAbout(). None of
   * them are guaranteed to exist, so every call is guarded and every one
   * has a local fallback that writes through PB.memory.add — which means
   * anything BEE learns here also shows up on the Memory screen.
   * ------------------------------------------------------------------ */

  var RELATION = 'sister|brother|mum|mom|mother|dad|father|parents|partner|boyfriend|girlfriend|' +
    'husband|wife|fiance|fiancé|best friend|friend|roommate|flatmate|housemate|manager|agent|' +
    'editor|assistant|landlord|therapist|trainer|doctor|dentist|derm|dermatologist|neighbour|' +
    'neighbor|cousin|aunt|auntie|uncle|niece|nephew|grandma|grandmother|grandpa|grandfather|abuela|' +
    'son|daughter|kid|dog|cat|puppy|boss|coworker|co-worker|colleague|client|nail tech|hairdresser';

  var REL_RE = new RegExp('\\b(' + RELATION + ')\\b', 'i');

  function looksLikeName(s) {
    s = trim(s);
    if (!s || s.length > 30) return false;
    if (!/^[A-Z][a-zA-Z'’.-]+(\s+[A-Z][a-zA-Z'’.-]+)?$/.test(s)) return false;
    return !REL_RE.test(s);
  }

  function tidyFact(s) {
    s = trim(s).replace(/[.\s]*$/, '');
    return s;
  }

  var CONNECTIVE = /^(and|but|or|so|then|she|he|they|who|which|because|although|plus)$/i;

  /* "Sara and she lives in Alhambra" -> "Sara". Case-insensitive regexes will
   * happily swallow the rest of the sentence, so trim back to the name. */
  function nameHead(s) {
    var parts = trim(s).split(/\s+/);
    if (!parts.length) return '';
    var out = [parts[0].replace(/[,;:]+$/, '')];
    if (parts.length > 1 && /^[A-Z]/.test(parts[1]) && !CONNECTIVE.test(parts[1])) {
      out.push(parts[1].replace(/[,;:]+$/, ''));
    }
    return out.join(' ');
  }

  /* Pull durable facts out of one utterance. Deliberately conservative —
   * a wrong "fact" is worse than a missed one. */
  function extractFacts(text) {
    var raw = trim(text);
    if (!raw || raw.length < 4) return [];
    var out = [];
    var m;

    function add(txt, kind, subject, conf) {
      txt = tidyFact(txt);
      if (!txt || txt.length < 3 || txt.length > 160) return;
      for (var i = 0; i < out.length; i++) if (low(out[i].text) === low(txt)) return;
      out.push({
        text: cap(txt) + '.',
        kind: kind || 'fact',
        subject: trim(subject || ''),
        confidence: typeof conf === 'number' ? conf : 0.9
      });
    }

    var named = '';   // a person we just learned the name of, for the rest of the sentence

    // "my sister's name is Sara" / "my sister is called Sara"
    m = raw.match(new RegExp('\\bmy\\s+(' + RELATION + ')(?:\'s|’s)?\\s+(?:name\\s+is|is\\s+called|is\\s+named|goes\\s+by)\\s+([A-Za-z][\\w\'’.-]*(?:\\s+\\S+)?)', 'i'));
    if (m) {
      named = nameHead(m[2]);
      if (named) add('your ' + low(m[1]) + '\'s name is ' + cap(named), 'fact', m[1], 0.95);
    }

    // "my sister Sara" — a name apposed straight onto the relationship
    if (!named) {
      m = raw.match(new RegExp('\\bmy\\s+(' + RELATION + ')\\s+([A-Z][a-zA-Z\'’.-]{1,20})\\b'));
      if (m && looksLikeName(m[2])) {
        named = trim(m[2]);
        add('your ' + low(m[1]) + ' is ' + named, 'fact', m[1], 0.85);
      }
    }

    // "my sister is a nurse" / "my manager is Dani" — anything else about a person
    m = raw.match(new RegExp('\\bmy\\s+(' + RELATION + ')\\s+(?:is|works|lives|studies|runs)\\s+([^,.;!?]{2,70})', 'i'));
    if (m && !/\bname\b|\bcalled\b|\bnamed\b/i.test(m[0])) {
      var verb = raw.slice(m.index).match(/\b(is|works|lives|studies|runs)\b/i);
      add('your ' + low(m[1]) + ' ' + low(verb ? verb[1] : 'is') + ' ' + trim(m[2]), 'fact', m[1], 0.85);
    }

    // birthdays / dates tied to a name
    m = raw.match(/\b([A-Z][a-zA-Z'’-]{1,20})(?:'s|’s)\s+(birthday|anniversary)\s+is\s+([^,.;!?]{2,40})/);
    if (m) add(trim(m[1]) + '\'s ' + low(m[2]) + ' is ' + trim(m[3]), 'event', m[1], 0.9);
    m = raw.match(new RegExp('\\bmy\\s+(' + RELATION + ')(?:\'s|’s)?\\s+(birthday|anniversary)\\s+is\\s+([^,.;!?]{2,40})', 'i'));
    if (m) add('your ' + low(m[1]) + '\'s ' + low(m[2]) + ' is ' + trim(m[3]), 'event', m[1], 0.9);

    // preferences
    m = raw.match(/\b(?:i'?m|i am)\s+allergic\s+to\s+([^,.;!?]{2,50})/i);
    if (m) add('you\'re allergic to ' + low(trim(m[1])), 'preference', m[1], 0.95);

    m = raw.match(/\bi\s+(?:hate|can'?t stand|don'?t like|dislike|am not into)\s+([^,.;!?]{2,60})/i);
    if (m) add('you don\'t like ' + low(trim(m[1])), 'preference', m[1], 0.85);

    // "never book me before 10" / "don't call me after 9"
    m = raw.match(/\b(?:never|don'?t|do not)\s+(book|schedule|call|text|ping|message|nudge)\s+me\s+(before|after|on|during)\s+([^,.;!?]{1,30})/i);
    if (m) add('don\'t ' + low(m[1]) + ' you ' + low(m[2]) + ' ' + trim(m[3]), 'preference', m[1], 0.9);

    m = raw.match(/\bi\s+(?:love|really like|am obsessed with|swear by)\s+([^,.;!?]{2,60})/i);
    if (m) add('you love ' + low(trim(m[1])), 'preference', m[1], 0.85);

    m = raw.match(/\bi\s+(?:live|'m living|am living)\s+in\s+([^,.;!?]{2,50})/i);
    if (m) add('you live in ' + trim(m[1]), 'fact', m[1], 0.9);

    m = raw.match(/\bi\s+work\s+(?:at|for|with)\s+([^,.;!?]{2,50})/i);
    if (m) add('you work with ' + trim(m[1]), 'fact', m[1], 0.9);

    m = raw.match(/\b(?:call me|i go by|my name'?s|my name is)\s+([A-Za-z][\w'’.-]{1,20})/i);
    if (m) add('you go by ' + cap(trim(m[1])), 'fact', m[1], 0.95);

    // "remember that ..." / "don't forget that ..." — she is telling us on purpose
    m = raw.match(/\b(?:remember|note|keep in mind|don'?t forget)\s+(?:that\s+)?([^.;!?]{4,120})/i);
    if (m && !/^to\b/i.test(trim(m[1]))) add(trim(m[1]), 'fact', '', 0.9);

    // "my X is Y" for non-person attributes: coffee order, gym, skin type…
    m = raw.match(/\bmy\s+([a-z][a-z' -]{2,24})\s+is\s+([^,.;!?]{2,60})/i);
    if (m && !REL_RE.test(m[1]) && !/\bname\b/i.test(m[1])) {
      add('your ' + low(trim(m[1])) + ' is ' + trim(m[2]), 'preference', m[1], 0.8);
    }

    // "…and she's a doctor" — resolve the pronoun against the name we just
    // learned in this same sentence, then take the second clause as well.
    var rest = raw;
    if (named) {
      rest = rest.replace(/\b(she|he|they)(?:'s|’s)\b/gi, named + ' is');
      rest = rest.replace(/\b(she|he|they)\b/gi, named);
    }
    m = rest.match(/\b([A-Z][a-zA-Z'’-]{1,20})\s+(lives in|works at|works as|works for|studies|is an|is a|is)\s+([^,.;!?]{2,50})/);
    if (m && looksLikeName(m[1])) {
      var tail = trim(m[3]);
      // "Sara is Sara" and "Sara is called X" are noise, not facts.
      if (low(tail) !== low(m[1]) && !/^(called|named)\b/i.test(tail)) {
        add(trim(m[1]) + ' ' + low(m[2]) + ' ' + tail, 'fact', m[1], 0.85);
      }
    }

    return out.slice(0, 3);
  }

  /* Did she actually ask for a reminder, or just tell BEE something? */
  function hasReminderCue(text) {
    return /\b(remind me|reminder|remember to|don'?t let me forget|add (?:it |this |that )?to my list|put (?:it |this |that )?on my list|nudge me|ping me|wake me|set an? alarm)\b/i.test(trim(text));
  }

  /* After BEE learns something, move the conversation on — a real question,
   * never a menu. The confirmation line is prepended by respond(). */
  function forwardAfterLearning(learned) {
    var first = learned[0] || {};
    var subject = trim(first.subject);
    var name = trim(first.text).match(/\bname is ([A-Z][\w'’-]+)/);
    if (name) subject = name[1];

    var text, chips;
    if (subject && looksLikeName(subject)) {
      text = 'Anything else I should know about ' + subject + '?';
      chips = [
        { label: 'What do you have on ' + shortLabel(subject) + '?', send: 'What do you know about ' + subject + '?' },
        { label: 'Nothing else', send: 'that\'s it for now' }
      ];
    } else if (low(first.kind) === 'preference') {
      text = 'I\'ll keep that in mind. Anything else you\'d rather I never suggest?';
      chips = [
        { label: 'What do you know about me?', send: 'What do you know about me?' },
        { label: 'What\'s next?', send: 'What\'s next today?' }
      ];
    } else {
      var ev = nextEvent(now());
      text = ev && sameDay(toDate(ev.start), now())
        ? ('Anything else? Otherwise — ' + (trim(ev.title) || 'your next thing') + ' is ' + fmtRelative(toDate(ev.start)) + '.')
        : 'Anything else you want me holding onto?';
      chips = [
        { label: 'What do you know about me?', send: 'What do you know about me?' },
        { label: 'What\'s next?', send: 'What\'s next today?' }
      ];
    }
    return reply(text, chips, memCard(learned, 'learned'), [], true);
  }
