      } catch (e) { /* quota or private mode — degrade quietly */ }
    },
    del: function (k) {
      try {
        if (PB.store && PB.store.del) return PB.store.del(k);
        localStorage.removeItem('pb.' + k);
      } catch (e) {}
    },
    keys: function () {
      try {
        if (PB.store && PB.store.keys) {
          var ks = PB.store.keys();
          if (Array.isArray(ks)) return ks.slice();
        }
      } catch (e) {}
      var out = [];
      try {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf('pb.') === 0) out.push(k.slice(3));
        }
      } catch (e) {}
      return out;
    },
    raw: function (k) { try { return localStorage.getItem('pb.' + k); } catch (e) { return null; } },
    clearAll: function () {
      try { if (PB.store && PB.store.clearAll) { PB.store.clearAll(); return; } } catch (e) {}
      try {
        var ks = [];
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf('pb.') === 0) ks.push(k);
        }
        for (var j = 0; j < ks.length; j++) localStorage.removeItem(ks[j]);
      } catch (e) {}
    }
  };

  function emit(ev, payload) {
    try { if (PB.bus && PB.bus.emit) PB.bus.emit(ev, payload || {}); } catch (e) {}
  }
  function on(ev, fn) {
    try { if (PB.bus && PB.bus.on) return PB.bus.on(ev, fn); } catch (e) {}
    return function () {};
  }
  function toast(msg, ms) {
    try { if (PB.ui && PB.ui.toast) return PB.ui.toast(msg, ms); } catch (e) {}
  }
  function haptic() {
    try { if (PB.ui && PB.ui.haptic) return PB.ui.haptic(); } catch (e) {}
  }
  function now() {
    try { if (PB.util && PB.util.now) return PB.util.now(); } catch (e) {}
    return new Date();
  }
  function uid() {
    try { if (PB.util && PB.util.uid) return PB.util.uid(); } catch (e) {}
    return Math.random().toString(36).slice(2, 9);
  }
  function esc(s) {
    try { if (PB.ui && PB.ui.esc) return PB.ui.esc(s); } catch (e) {}
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function num(n) {
    try { return Number(n).toLocaleString('en-US'); } catch (e) { return String(n); }
  }
  function byteLen(str) {
    if (str == null) return 0;
    try { return new Blob([String(str)]).size; } catch (e) {}
    try { return unescape(encodeURIComponent(String(str))).length; } catch (e) {}
    return String(str).length;
  }
  function fmtBytes(b) {
    if (b < 1024) return num(b) + ' bytes';
    return num(b) + ' bytes (' + (b / 1024).toFixed(1) + ' KB)';
  }
  function clockTime(d) {
    try { if (PB.util && PB.util.fmtTime) return PB.util.fmtTime(d); } catch (e) {}
    try {
      return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    } catch (e) { return d.toISOString(); }
  }
  function dayLabel(d) {
    try { if (PB.util && PB.util.fmtDay) return PB.util.fmtDay(d); } catch (e) {}
    try { return d.toLocaleDateString('en-US', { weekday: 'short', day: 'numeric', month: 'short' }); }
    catch (e) { return ''; }
  }
  function ago(d) {
    var ms = Date.now() - d.getTime();
    if (ms < 0) return 'just now';
    var s = Math.floor(ms / 1000);
    if (s < 10) return 'just now';
    if (s < 60) return s + 's ago';
    var m = Math.floor(s / 60);
    if (m < 60) return m + ' min ago';
    var h = Math.floor(m / 60);
    if (h < 24) return h + 'h ago';
    var dd = Math.floor(h / 24);
    return dd + 'd ago';
  }
  function countdown(ms) {
    if (ms <= 0) return '0s';
    var s = Math.floor(ms / 1000);
    var d = Math.floor(s / 86400); s -= d * 86400;
    var h = Math.floor(s / 3600);  s -= h * 3600;
    var m = Math.floor(s / 60);    s -= m * 60;
    if (d > 0) return d + 'd ' + h + 'h ' + m + 'm';
    if (h > 0) return h + 'h ' + m + 'm ' + s + 's';
    if (m > 0) return m + 'm ' + s + 's';
    return s + 's';
  }

  /* ---------------------------------------------------------------------- *
   * 2. The access log — the receipt that makes everything else credible
   * ---------------------------------------------------------------------- */

  var firstGestureAt = null;
  try {
    var markGesture = function () {
      if (firstGestureAt == null) firstGestureAt = Date.now();
    };
    document.addEventListener('pointerdown', markGesture, true);
    document.addEventListener('keydown', markGesture, true);
    document.addEventListener('touchstart', markGesture, true);
  } catch (e) {}

  function readLog() {
    var l = S.get(K_LOG, []);
    return Array.isArray(l) ? l : [];
  }

  /**
   * Append one entry to the access log. Append-only: entries are never edited.
   * When the cap is reached the oldest are dropped and counted, so the screen
   * can say honestly how many were trimmed rather than silently losing them.
   */
  function record(kind, label, detail, extra) {
    var entry = {
      id: uid(),
      at: new Date().toISOString(),
      kind: String(kind || 'event'),
      label: String(label || ''),
      detail: detail == null ? '' : String(detail),
      beforeGesture: firstGestureAt == null
    };
    if (extra && typeof extra === 'object') {
      for (var k in extra) if (Object.prototype.hasOwnProperty.call(extra, k)) entry[k] = extra[k];
    }
    try {
      var log = readLog();
      log.push(entry);
      if (log.length > LOG_CAP) {
        var dropped = log.length - LOG_CAP;
        log = log.slice(dropped);
        S.set(K_TRIM, (Number(S.get(K_TRIM, 0)) || 0) + dropped);
      }
      S.set(K_LOG, log);
    } catch (e) {}
    return entry;
  }

  /* ---------------------------------------------------------------------- *
   * 3. Principle 1 — the network guard. A real block, not a cosmetic one.
   *
   *    Installed once at load and left in place forever. When airplane mode is
   *    OFF every call is passed straight through to the original function with
   *    the original arguments, so the app behaves exactly as if we were never
   *    here. When it is ON, cross-origin requests are refused before they can
   *    reach the network stack.
   *
   *    Scope, stated precisely so the claim is checkable:
   *      blocked  — any request whose origin differs from this document's
   *      allowed  — data:, blob:, and this app's own files, none of which
   *                 leave the device
   * ---------------------------------------------------------------------- */

  var airplaneOn = S.get(K_AIR, false) === true;
  var guardReport = { fetch: false, xhr: false, beacon: false, socket: false, eventsource: false, media: false };

  function blockedError(url, via) {
    var e = new Error('Personalbee airplane mode blocked a ' + via + ' request to ' + url);
    e.name = 'PBAirplaneBlocked';
    e.code = 'PB_AIRPLANE_BLOCKED';
    e.pbBlocked = true;
    return e;
  }

  /** Is this URL local to the device (i.e. nothing leaves)? */
  function classify(url) {
    var raw = String(url == null ? '' : url);
    var out = { local: true, host: '', url: raw };
    try {
      var u = new URL(raw, location.href);
      out.host = u.host || u.protocol;
      var p = u.protocol;
      if (p === 'data:' || p === 'blob:' || p === 'about:' || p === 'file:') { out.local = true; return out; }
      if (location.origin && location.origin !== 'null') {
        out.local = (u.origin === location.origin);
      } else {
        out.local = (u.host !== '' && u.host === location.host);
      }
      return out;
    } catch (e) {
      // Unparseable — treat a bare relative path as local, anything else as remote.
      out.local = !/^[a-z][a-z0-9+.-]*:/i.test(raw);
      out.host = raw.slice(0, 60);
      return out;
    }
  }

  function noteOutbound(via, method, c) {
    var blocked = airplaneOn;
    record(
      blocked ? 'net.blocked' : 'net.attempt',
      blocked ? 'Outbound request blocked' : 'Outbound request sent',
      (method ? method.toUpperCase() + ' ' : '') + c.host + ' — via ' + via,
      { blocked: blocked, via: via, host: c.host }
    );
    if (blocked) emit('net:blocked', { url: c.url, via: via });
    return blocked;
  }

  // --- fetch -------------------------------------------------------------
  (function () {
    if (typeof window.fetch !== 'function') return;
    if (window.fetch.__pbGuarded) { guardReport.fetch = true; return; }
    var original = window.fetch;
    var guarded = function (input, init) {
      var url = '';
      try {
        url = (typeof input === 'string') ? input
            : (input && input.url) ? input.url
            : String(input);
      } catch (e) { url = ''; }
      var c = classify(url);
      if (!c.local) {
        var method = (init && init.method) || (input && input.method) || 'GET';
        if (noteOutbound('fetch', method, c)) {
          return Promise.reject(blockedError(url, 'fetch'));
        }
      }
      return original.apply(window, arguments);
    };
    guarded.__pbGuarded = true;
    guarded.__pbOriginal = original;
    try { window.fetch = guarded; guardReport.fetch = true; } catch (e) {}
  })();

  // --- XMLHttpRequest ----------------------------------------------------
  (function () {
    var proto = window.XMLHttpRequest && window.XMLHttpRequest.prototype;
    if (!proto) return;
    if (proto.__pbGuarded) { guardReport.xhr = true; return; }
    var oOpen = proto.open, oSend = proto.send;
    if (typeof oOpen !== 'function' || typeof oSend !== 'function') return;

    proto.open = function (method, url) {
      try { this.__pbMethod = method; this.__pbUrl = url; } catch (e) {}
      return oOpen.apply(this, arguments);
    };
    proto.send = function () {
      var c = classify(this.__pbUrl || '');
      if (!c.local && noteOutbound('xhr', this.__pbMethod || 'GET', c)) {
        var self = this;
        try { self.__pbBlocked = true; } catch (e) {}
        // Fail the way a dead network fails: asynchronously, via an error
        // event. Throwing synchronously would break naive callers.
        setTimeout(function () {
          var delivered = false;
          try { self.dispatchEvent(new Event('error')); delivered = true; } catch (e) {}
          if (!delivered && typeof self.onerror === 'function') {
            try { self.onerror(blockedError(c.url, 'xhr')); } catch (e) {}
          }
        }, 0);
        return; // original send is never called
      }
      return oSend.apply(this, arguments);
    };
    proto.__pbGuarded = true;
    guardReport.xhr = true;
  })();

  // --- navigator.sendBeacon ---------------------------------------------
  (function () {
    if (!navigator || typeof navigator.sendBeacon !== 'function') return;
    if (navigator.sendBeacon.__pbGuarded) { guardReport.beacon = true; return; }
    var original = navigator.sendBeacon;
    var guarded = function (url, data) {
      var c = classify(url);
      if (!c.local && noteOutbound('sendBeacon', 'POST', c)) return false;
      return original.apply(navigator, arguments);
    };
    guarded.__pbGuarded = true;
    try { navigator.sendBeacon = guarded; guardReport.beacon = true; } catch (e) {}
  })();

  // --- WebSocket ---------------------------------------------------------
  (function () {
    var O = window.WebSocket;
    if (typeof O !== 'function' || O.__pbGuarded) { guardReport.socket = !!O && !!O.__pbGuarded; return; }
    var G = function (url, protocols) {
      var c = classify(url);
      if (!c.local && noteOutbound('websocket', 'WS', c)) throw blockedError(url, 'websocket');
      return (protocols === undefined) ? new O(url) : new O(url, protocols);
    };
    try {
      G.prototype = O.prototype;
      ['CONNECTING', 'OPEN', 'CLOSING', 'CLOSED'].forEach(function (k) { G[k] = O[k]; });
      G.__pbGuarded = true;
      window.WebSocket = G;
      guardReport.socket = true;
    } catch (e) {}
  })();

  // --- EventSource -------------------------------------------------------
  (function () {
    var O = window.EventSource;
    if (typeof O !== 'function' || O.__pbGuarded) { guardReport.eventsource = !!O && !!O.__pbGuarded; return; }
    var G = function (url, cfg) {
      var c = classify(url);
      if (!c.local && noteOutbound('eventsource', 'GET', c)) throw blockedError(url, 'eventsource');
      return (cfg === undefined) ? new O(url) : new O(url, cfg);
    };
    try {
      G.prototype = O.prototype;
      G.__pbGuarded = true;
      window.EventSource = G;
      guardReport.eventsource = true;
    } catch (e) {}
  })();

  /* ---------------------------------------------------------------------- *
   * 3b. Camera / microphone guard.
   *     Two jobs: log every real hardware open, and make "revoke" mean
   *     something — a revoked permission refuses new streams and stops any
   *     stream that is already live.
   * ---------------------------------------------------------------------- */

  var liveStreams = []; // [{ names:[], stream }]

  (function () {
    var md = navigator && navigator.mediaDevices;
    if (!md || typeof md.getUserMedia !== 'function') return;
    if (md.getUserMedia.__pbGuarded) { guardReport.media = true; return; }
    var original = md.getUserMedia;
    var guarded = function (constraints) {
      var names = [];
      try {
        if (constraints && constraints.video) names.push('camera');
        if (constraints && constraints.audio) names.push('mic');
      } catch (e) {}
      for (var i = 0; i < names.length; i++) {
        if (permission(names[i]) === 'denied') {
          record('device.refused', capitalize(names[i]) + ' refused',
                 'Permission is off in Trust, so the request never reached the hardware.');
          return Promise.reject(new Error('Personalbee: ' + names[i] + ' permission is off.'));
        }
      }
      return original.apply(md, arguments).then(function (stream) {
        for (var j = 0; j < names.length; j++) {
          record('device.open', capitalize(names[j]) + ' opened', 'Live on this device. Nothing is uploaded.');
        }
        liveStreams.push({ names: names.slice(), stream: stream });
        try {
          stream.addEventListener('inactive', function () { forget(stream); });
        } catch (e) {}
        return stream;
      });
    };
    guarded.__pbGuarded = true;
    try { md.getUserMedia = guarded; guardReport.media = true; } catch (e) {}
  })();

  function forget(stream) {
    for (var i = liveStreams.length - 1; i >= 0; i--) {
      if (liveStreams[i].stream === stream) liveStreams.splice(i, 1);
    }
  }

  /** Stop any live camera/mic stream held for `name`. Returns tracks stopped. */
  function stopStreamsFor(name) {
    var stopped = 0;
    for (var i = liveStreams.length - 1; i >= 0; i--) {
      var rec = liveStreams[i];
      if (rec.names.indexOf(name) === -1) continue;
      try {
        var tracks = rec.stream.getTracks ? rec.stream.getTracks() : [];
        for (var j = 0; j < tracks.length; j++) {
          var kind = tracks[j].kind;
          if ((name === 'camera' && kind === 'video') || (name === 'mic' && kind === 'audio')) {
            try { tracks[j].stop(); stopped++; } catch (e) {}
          }
        }
      } catch (e) {}
      liveStreams.splice(i, 1);
    }
    return stopped;
  }

  function capitalize(s) { return String(s).charAt(0).toUpperCase() + String(s).slice(1); }

  /* ---------------------------------------------------------------------- *
   * 4. Airplane mode
   * ---------------------------------------------------------------------- */

  function isAirplane() { return airplaneOn === true; }

  function setAirplane(on) {
    var next = !!on;
    if (next === airplaneOn) return;
    airplaneOn = next;
    S.set(K_AIR, airplaneOn);
    record(airplaneOn ? 'airplane.on' : 'airplane.off',
           airplaneOn ? 'Airplane mode on' : 'Airplane mode off',
           airplaneOn
             ? 'Outbound requests are refused inside the app before they reach the network.'
             : 'Outbound requests are allowed again. Only the optional Claude path uses one.');
    emit('airplane:changed', { on: airplaneOn });
    haptic();
  }

  /**
   * Attempt a genuine outbound request and report what actually happened.
   * User-initiated only — nothing here ever runs on its own.
   */
  function probe() {
    var url = PROBE_URL + '?t=' + Date.now();
    var started = (window.performance && performance.now) ? performance.now() : Date.now();
    var elapsed = function () {
      var end = (window.performance && performance.now) ? performance.now() : Date.now();
      return Math.round(end - started);
    };

    return new Promise(function (resolve) {
      var fetchResult = null, xhrResult = null;
      var done = function () {
        if (!fetchResult || !xhrResult) return;
        resolve({
          at: new Date(),
          ms: elapsed(),
          airplane: airplaneOn,
          url: PROBE_URL,
          fetch: fetchResult,
          xhr: xhrResult
        });
      };

      // fetch channel
      try {
        window.fetch(url, { method: 'GET', mode: 'cors', cache: 'no-store' })
          .then(function (res) {
            fetchResult = { outcome: 'sent', detail: 'Response received — HTTP ' + res.status + '. Data left this device.' };
            done();
          })
          .catch(function (err) {
            if (err && err.pbBlocked) {
              fetchResult = { outcome: 'blocked', detail: 'Refused by Personalbee. The request never reached the network stack.' };
            } else {
              fetchResult = {
                outcome: 'not-blocked',
                detail: 'Personalbee did not block it — the request left the app. The browser then failed it: ' +
                        ((err && err.message) || 'network error') +
                        '. That is the network or the browser stopping it, not this app.'
              };
            }
            done();
          });
      } catch (err) {
        fetchResult = (err && err.pbBlocked)
          ? { outcome: 'blocked', detail: 'Refused by Personalbee before the call was made.' }
          : { outcome: 'error', detail: String((err && err.message) || err) };
        done();
      }

      // XHR channel
      try {
        var x = new XMLHttpRequest();
        var settled = false;
        var finish = function (r) { if (settled) return; settled = true; xhrResult = r; done(); };
        x.onload = function () {
          finish({ outcome: 'sent', detail: 'Response received — HTTP ' + x.status + '. Data left this device.' });
        };
        x.onerror = function () {
          if (x.__pbBlocked) {
            finish({ outcome: 'blocked', detail: 'Refused by Personalbee. send() was never called on the real object.' });
          } else {
            finish({ outcome: 'not-blocked', detail: 'Personalbee did not block it. The browser attempted the request and the network failed it.' });
          }
        };
        x.ontimeout = function () { finish({ outcome: 'not-blocked', detail: 'Personalbee did not block it. The request left the app and timed out.' }); };
        x.timeout = 8000;
        x.open('GET', url, true);
        x.send();
        setTimeout(function () {
          finish({ outcome: 'not-blocked', detail: 'Personalbee did not block it. No result after 9 seconds.' });
        }, 9000);
      } catch (err) {
        xhrResult = (err && err.pbBlocked)
          ? { outcome: 'blocked', detail: 'Refused by Personalbee before send().' }
          : { outcome: 'error', detail: String((err && err.message) || err) };
        done();
      }
    }).then(function (result) {
      record('probe', 'Network test run',
             'fetch: ' + result.fetch.outcome + ' · XHR: ' + result.xhr.outcome +
             ' · airplane ' + (result.airplane ? 'on' : 'off'),
             { probe: true });
      return result;
    });
  }

  /* ---------------------------------------------------------------------- *
   * 5. Permissions — just in time, never at launch
   * ---------------------------------------------------------------------- */

  function permMap() {
    var m = S.get(K_PERM, {});
    return (m && typeof m === 'object' && !Array.isArray(m)) ? m : {};
  }
  function permission(name) {
    var rec = permMap()[name];
    return (rec && rec.state) || 'unasked';
  }
  function permRecord(name) {
    return permMap()[name] || null;
  }
  function writePerm(name, state, why) {
    var m = permMap();
    var prev = m[name] || {};
    m[name] = {
      state: state,
      why: why || prev.why || '',
      askedAt: prev.askedAt || new Date().toISOString(),
      decidedAt: new Date().toISOString()
    };
    S.set(K_PERM, m);
  }

  /**
   * Ask for a permission, at the moment its feature is first used, with the
   * plain-language reason the caller supplied. Never called at load.
   */
  function request(name, why) {
    name = String(name || '');
    why = String(why || '');

    if (permission(name) === 'granted') {
      record('permission.use', capitalize(name) + ' used', 'Already allowed — not asked again.');
      return Promise.resolve(true);
    }

    record('permission.ask', capitalize(name) + ' requested', why || '(no reason given)',
           { permission: name });

    return askSheet(name, why).then(function (granted) {
      writePerm(name, granted ? 'granted' : 'denied', why);
      if (granted) {
        record('permission.grant', capitalize(name) + ' allowed', why);
        emit('permission:granted', { name: name });
      } else {
        record('permission.deny', capitalize(name) + ' not allowed', why);
        emit('permission:denied', { name: name });
      }
      repaint();
      return granted;
    });
  }

  function revoke(name) {
    writePerm(name, 'denied', (permRecord(name) || {}).why);
    var stopped = stopStreamsFor(name);
    record('permission.revoke', capitalize(name) + ' turned off',
           stopped > 0
             ? 'Turned off in Trust. ' + stopped + ' live track' + (stopped === 1 ? '' : 's') + ' stopped immediately.'
             : 'Turned off in Trust. Any future use will have to ask again.');
    emit('permission:denied', { name: name });
    haptic();
    repaint();
  }

  function grantFromScreen(name) {
    var rec = permRecord(name);
    writePerm(name, 'granted', (rec && rec.why) || '');
    record('permission.grant', capitalize(name) + ' allowed', 'Turned on from the Trust screen.');
    emit('permission:granted', { name: name });
    haptic();
    repaint();
  }

  /* --- the just-in-time sheet ------------------------------------------- */

  var PERM_FACTS = {
    camera:        ['Photos stay in this app, on this phone.', 'No photo is ever uploaded.'],
    mic:           ['Audio is used while you speak and then dropped.', 'No recording is stored or sent.'],
    notifications: ['Used only for reminders you created.', 'No marketing, ever.'],
    location:      ['Read once, at the moment you ask.', 'No background tracking, no history.'],
    contacts:      ['Read on this device to match names you type.', 'Nothing is copied off the phone.'],
    calendar:      ['Read on this device to show your day.', 'Nothing is written or shared.']
  };

  function askSheet(name, why) {
    return new Promise(function (resolve) {
      var meta = null;
      for (var i = 0; i < PERMS.length; i++) if (PERMS[i].name === name) meta = PERMS[i];
      var title = meta ? meta.title : capitalize(name);
      var facts = PERM_FACTS[name] || ['Used on this device only.'];

      var scrim = document.createElement('div');
      scrim.className = 'pbt-scrim';
      scrim.innerHTML =
        '<div class="pbt-sheet" role="dialog" aria-modal="true" aria-label="' + esc(title) + ' permission">' +
          '<div class="pbt-grab" aria-hidden="true"></div>' +
          '<h3 class="pbt-sheet-title">Allow ' + esc(title.toLowerCase()) + '?</h3>' +
          '<p class="pbt-sheet-why">' + esc(why || (meta ? meta.blurb : '')) + '</p>' +
          '<ul class="pbt-sheet-facts">' +
            facts.map(function (f) { return '<li>' + esc(f) + '</li>'; }).join('') +
            '<li>You can turn this off any time on the Trust screen.</li>' +
          '</ul>' +
          '<div class="pbt-sheet-actions">' +
            '<button type="button" class="pbt-btn pbt-btn-primary" data-a="allow">Allow</button>' +
            '<button type="button" class="pbt-btn" data-a="deny">Not now</button>' +
          '</div>' +
          '<p class="pbt-sheet-foot">Asked because you just used this feature — not at launch.</p>' +
        '</div>';

      var settled = false;
      function close(answer) {
        if (settled) return;
        settled = true;
        try { document.removeEventListener('keydown', onKey, true); } catch (e) {}
        try { scrim.classList.remove('is-in'); } catch (e) {}
        setTimeout(function () { try { scrim.remove(); } catch (e) {} }, 180);
        resolve(!!answer);
      }
      function onKey(ev) { if (ev.key === 'Escape') { ev.stopPropagation(); close(false); } }

      scrim.addEventListener('click', function (ev) {
        var btn = ev.target.closest ? ev.target.closest('[data-a]') : null;
        if (btn) { haptic(); close(btn.getAttribute('data-a') === 'allow'); return; }
        if (ev.target === scrim) close(false); // dismissed = not allowed
      });
      document.addEventListener('keydown', onKey, true);

      try {
        document.body.appendChild(scrim);
        requestAnimationFrame(function () { scrim.classList.add('is-in'); });
        var first = scrim.querySelector('[data-a="allow"]');
        if (first) first.focus();
      } catch (e) { close(false); }
    });
  }

  /* ---------------------------------------------------------------------- *
   * 6. Storage inspection — bytes, keys, and the identifier scan
   * ---------------------------------------------------------------------- */

  function snapshot() {
    var keys = S.keys();
    var items = [];
    var total = 0;
    for (var i = 0; i < keys.length; i++) {
      var raw = S.raw(keys[i]);
      var b = byteLen(raw) + byteLen('pb.' + keys[i]);
      total += b;
      items.push({ key: keys[i], bytes: b, label: KEY_LABELS[keys[i]] || keys[i] });
    }
    items.sort(function (a, b) { return b.bytes - a.bytes; });
    return { keys: keys.length, bytes: total, items: items };
  }

  function bytes() { return snapshot().bytes; }

  var RE_EMAIL = /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g;
  // Requires separators, so ISO timestamps and long digit runs don't false-positive.
  var RE_PHONE = /(?:\+\d{1,3}[ .\-]?)?(?:\(\d{3}\)[ .\-]?|\d{3}[ .\-])\d{3}[ .\-]\d{4}(?!\d)/g;

  function maskEmail(s) {
    var at = s.indexOf('@');
    if (at < 1) return '***';
    return s.charAt(0) + '***@' + s.slice(at + 1).charAt(0) + '***';
  }
  function maskPhone(s) {
    var digits = s.replace(/\D/g, '');
    return '***-***-' + digits.slice(-4);
  }

  /** Read every stored byte and count anything that looks like an identifier. */
  function scanIdentifiers() {
    var keys = S.keys();
    var res = { keysScanned: 0, bytesScanned: 0, emails: [], phones: [], binarySkipped: 0 };
    for (var i = 0; i < keys.length; i++) {
      var raw = S.raw(keys[i]);
      if (raw == null) continue;
      res.keysScanned++;
      res.bytesScanned += byteLen(raw);
      // Base64 image payloads are binary; scanning them yields noise, so they
      // are replaced with a marker and counted rather than silently ignored.
      var text = raw.replace(/data:[a-z0-9.+\/-]+;base64,[A-Za-z0-9+\/=]+/gi, function () {
        res.binarySkipped++;
        return '"[image bytes]"';
      });
      var em = text.match(RE_EMAIL);
      if (em) for (var a = 0; a < em.length; a++) res.emails.push({ key: keys[i], value: maskEmail(em[a]) });
      var ph = text.match(RE_PHONE);
      if (ph) for (var b = 0; b < ph.length; b++) res.phones.push({ key: keys[i], value: maskPhone(ph[b]) });
    }
    return res;
  }

  /* ---------------------------------------------------------------------- *
   * 7. Principle 2 — erase everything, and show the wipe
   * ---------------------------------------------------------------------- */

  var lastWipe = null; // kept in memory only, so the "after" byte count stays honest

  function confirmErase() {
    var title = 'Erase everything?';
    var body = 'This deletes every reminder, moment, note and log on this device, right now. ' +
               'There is no copy anywhere else, so there is nothing to restore.';
    try {
      if (PB.ui && PB.ui.confirm) return Promise.resolve(PB.ui.confirm(title, body, 'Erase'));
    } catch (e) {}
    return Promise.resolve(window.confirm(title + '\n\n' + body));
  }

  function eraseAll() {
    return confirmErase().then(function (ok) {
      if (!ok) return;

      var before = snapshot();
      var wasAirplane = airplaneOn;

      S.clearAll();

      var after = snapshot(); // measured before anything is written back

      // The airplane setting is re-applied: silently dropping a network block
      // the user switched on would be a safety regression, not a clean slate.
      // This is disclosed on the receipt below.
      if (wasAirplane) S.set(K_AIR, true);

      record('data.erase', 'Everything erased',
             'Destroyed ' + before.keys + ' key' + (before.keys === 1 ? '' : 's') +
             ', ' + num(before.bytes) + ' bytes. Storage measured at ' + num(after.bytes) +
             ' bytes immediately after.');

      lastWipe = {
        at: new Date(),
        before: before,
        afterBytes: after.bytes,
        afterKeys: after.keys,
        keptAirplane: wasAirplane
      };

      emit('data:erased', {});
      haptic();
      toast('Erased. ' + num(before.bytes) + ' bytes gone.', 2600);
      repaint();
    });
  }

  /* ---------------------------------------------------------------------- *
   * 8. Principle 7 — live, self-verifying checks. Run at render time.
   * ---------------------------------------------------------------------- */

  function checks() {
    var out = [];
    var log = readLog();

    // 1. Is the guard actually installed right now?
    var parts = [];
    parts.push('fetch: ' + (window.fetch && window.fetch.__pbGuarded ? 'guarded' : 'NOT guarded'));
    parts.push('XMLHttpRequest: ' + (window.XMLHttpRequest && window.XMLHttpRequest.prototype.__pbGuarded ? 'guarded' : 'NOT guarded'));
    parts.push('sendBeacon: ' + (guardReport.beacon ? 'guarded' : 'n/a'));
    parts.push('WebSocket: ' + (guardReport.socket ? 'guarded' : 'n/a'));
    var guardOk = !!(window.fetch && window.fetch.__pbGuarded) &&
                  !!(window.XMLHttpRequest && window.XMLHttpRequest.prototype.__pbGuarded);
    out.push({
      pass: guardOk ? 'pass' : 'fail',
      label: 'Every outbound channel runs through the guard',
      evidence: parts.join(' · ')
    });

    // 2. Third-party code.
    var remoteScripts = [];
    try {
      var scripts = document.getElementsByTagName('script');
      for (var i = 0; i < scripts.length; i++) {
        var src = scripts[i].getAttribute('src');
        if (!src) continue;
        if (!classify(scripts[i].src || src).local) remoteScripts.push(classify(scripts[i].src || src).host);
      }
      out.push({
        pass: remoteScripts.length === 0 ? 'pass' : 'fail',
        label: 'No third-party code on the page',
        evidence: scripts.length + ' script tag' + (scripts.length === 1 ? '' : 's') + ' on this page, ' +
                  remoteScripts.length + ' loaded from another host' +
                  (remoteScripts.length ? ': ' + remoteScripts.join(', ') : '.')
      });
    } catch (e) {}

    // 3. Remote assets.
    try {
      var remoteAssets = 0, assetCount = 0;
      var tags = ['img', 'iframe', 'video', 'audio', 'source'];
      for (var t = 0; t < tags.length; t++) {
        var els = document.getElementsByTagName(tags[t]);
        for (var j = 0; j < els.length; j++) {
          var s = els[j].getAttribute('src');
          if (!s) continue;
          assetCount++;
          if (!classify(els[j].src || s).local) remoteAssets++;
        }
      }
      var links = document.querySelectorAll('link[rel~="stylesheet"], link[rel="preconnect"], link[as="font"]');
      for (var L = 0; L < links.length; L++) {
        var href = links[L].getAttribute('href');
        if (!href) continue;
        assetCount++;
        if (!classify(links[L].href || href).local) remoteAssets++;
      }
      out.push({
        pass: remoteAssets === 0 ? 'pass' : 'fail',
        label: 'No images, fonts or stylesheets pulled from the web',
        evidence: assetCount + ' asset reference' + (assetCount === 1 ? '' : 's') + ' checked, ' +
                  remoteAssets + ' remote. Icons are emoji and inline SVG.'
      });
    } catch (e) {}

    // 4. Storage is local-only, and it genuinely works.
    var snap = snapshot();
    var storageOk = false, storageNote = '';
    try {
      var token = 'ok-' + uid();
      S.set(K_TEST, token);
      var readBack = S.get(K_TEST, null);
      S.del(K_TEST);
      var goneAfter = S.get(K_TEST, null);
      storageOk = (readBack === token) && (goneAfter === null);
      storageNote = storageOk
        ? 'Wrote a test key, read it back, deleted it, confirmed it was gone.'
        : 'Test key did not round-trip — storage may be blocked in this browser.';
    } catch (e) { storageNote = 'Storage test threw: ' + (e && e.message); }
    out.push({
      pass: storageOk ? 'pass' : 'fail',
      label: 'Storage is this device only, and delete really deletes',
      evidence: snap.keys + ' key' + (snap.keys === 1 ? '' : 's') + ', ' + num(snap.bytes) +
                ' bytes in localStorage on ' + (location.origin && location.origin !== 'null' ? location.origin : 'this file') +
                '. No server, no account, no sync target. ' + storageNote
    });

    // 5. Has anything actually left?
    var sent = 0, blocked = 0;
    for (var k = 0; k < log.length; k++) {
      if (log[k].kind === 'net.attempt') sent++;
      else if (log[k].kind === 'net.blocked') blocked++;
    }
    out.push({
      pass: sent === 0 ? 'pass' : 'fail',
      label: 'Nothing has left this device',
      evidence: sent + ' outbound request' + (sent === 1 ? '' : 's') + ' sent, ' + blocked +
                ' blocked by airplane mode. Every one is in the access log below.' +
                (sent > 0 ? ' The sent ones were the network test or the optional Claude call — both start with you.' : '')
    });

    // 6. Nothing asked for at launch.
    var launchAsks = 0;
    for (var m = 0; m < log.length; m++) {
      if (log[m].kind === 'permission.ask' && log[m].beforeGesture) launchAsks++;
    }
    out.push({
      pass: launchAsks === 0 ? 'pass' : 'fail',
      label: 'No permission was requested before you tapped something',
      evidence: launchAsks + ' permission request' + (launchAsks === 1 ? '' : 's') +
                ' recorded before any tap or keypress, across every session on this device.'
    });

    // 7. Connection context — reported honestly, including when it doesn't apply.
    var proto = location.protocol;
    if (proto === 'file:') {
      out.push({
        pass: 'na',
        label: 'Connection is secure',
        evidence: 'Running from file:// — there is no connection to secure, because there is no server. ' +
                  'isSecureContext = ' + String(window.isSecureContext) + '.'
      });
    } else {
      var secure = window.isSecureContext === true;
      out.push({
        pass: secure ? 'pass' : 'fail',
        label: 'Connection is secure',
        evidence: 'Protocol ' + proto + ', isSecureContext = ' + String(secure) +
                  (secure ? '.' : '. On a local server this is expected; at ship it must be HTTPS.')
      });
    }

    // 8. Erase is wired.
    var eraseOk = !!(PB.store && typeof PB.store.clearAll === 'function') || storageOk;
    out.push({
      pass: eraseOk ? 'pass' : 'fail',
      label: 'The erase button is connected to real deletion',
      evidence: (PB.store && typeof PB.store.clearAll === 'function'
                  ? 'PB.store.clearAll() is present and bound to the button.'
                  : 'Falling back to a direct localStorage sweep.') +
                ' It removes every pb.* key on this device with no server round-trip.'
    });

    return out;
  }

  /* ---------------------------------------------------------------------- *
   * 9. Principle 4 — forgets by default (reads PB.memory, guarded)
   * ---------------------------------------------------------------------- */

  function memoryState() {
    var out = { available: false, source: null, ttlDays: null, items: [], saved: 0, expiring: 0, next: null };
    var items = null;
    var M = PB.memory;

    try {
      if (M) {
        if (typeof M.all === 'function') items = M.all();
        else if (typeof M.list === 'function') items = M.list();
        else if (typeof M.items === 'function') items = M.items();
        else if (Array.isArray(M.items)) items = M.items;

        if (typeof M.ttlDays === 'function') out.ttlDays = M.ttlDays();
        else if (typeof M.ttlDays === 'number') out.ttlDays = M.ttlDays;
        else if (typeof M.TTL_DAYS === 'number') out.ttlDays = M.TTL_DAYS;
        else if (typeof M.ttl === 'number') out.ttlDays = M.ttl;

        if (Array.isArray(items)) out.source = 'PB.memory';
      }
    } catch (e) { items = null; }

    if (!Array.isArray(items)) {
      try {
        var raw = S.get('memory', null);
        if (Array.isArray(raw)) { items = raw; out.source = 'pb.memory in local storage'; }
        else if (raw && Array.isArray(raw.items)) { items = raw.items; out.source = 'pb.memory in local storage'; }
      } catch (e) {}
    }

    if (!Array.isArray(items)) return out;

    out.available = true;
    if (out.ttlDays == null) out.ttlDays = 7; // stated on screen as an assumption
    var ttlMs = out.ttlDays * 86400000;
    var nowMs = now().getTime();

    for (var i = 0; i < items.length; i++) {
      var it = items[i] || {};
      if (it.saved === true) { out.saved++; continue; }
      var base = null;
      if (it.expiresAt) base = new Date(it.expiresAt).getTime();
      else {
        var seen = it.lastSeen || it.firstSeen || it.at;
        var t = seen ? new Date(seen).getTime() : NaN;
        if (!isNaN(t)) base = t + ttlMs;
      }
      if (base == null || isNaN(base)) continue;
      out.expiring++;
      out.items.push({ text: it.text || '(untitled)', kind: it.kind || 'note', expiresAt: base, overdue: base <= nowMs });
    }
    out.items.sort(function (a, b) { return a.expiresAt - b.expiresAt; });
    out.next = out.items.length ? out.items[0] : null;
    return out;
  }

  /* ---------------------------------------------------------------------- *
   * 10. The Trust screen
   * ---------------------------------------------------------------------- */

  var currentRoot = null;
  var ticker = null;
  var probeState = null; // { running, result }

  function repaint() {
    if (!currentRoot) return;
    if (!document.body.contains(currentRoot)) { currentRoot = null; stopTicker(); return; }
    var scroller = document.scrollingElement || document.documentElement;
    var y = 0;
    try { y = currentRoot.scrollTop || scroller.scrollTop || 0; } catch (e) {}
    renderScreen(currentRoot);
    try {
      if (currentRoot.scrollTop !== undefined) currentRoot.scrollTop = y;
      if (scroller) scroller.scrollTop = y;
    } catch (e) {}
  }

  function stopTicker() {
    if (ticker) { clearInterval(ticker); ticker = null; }
  }

  function startTicker() {
    stopTicker();
    ticker = setInterval(function () {
      if (!currentRoot || !document.body.contains(currentRoot)) { stopTicker(); currentRoot = null; return; }
      tick();
    }, 1000);
  }

  function tick() {
    var nowMs = now().getTime();
    var nodes = currentRoot.querySelectorAll('[data-expires]');
    for (var i = 0; i < nodes.length; i++) {
      var at = Number(nodes[i].getAttribute('data-expires'));
      var left = at - nowMs;
      nodes[i].textContent = left <= 0 ? 'due to be forgotten' : 'forgotten in ' + countdown(left);
      nodes[i].classList.toggle('is-due', left <= 0);
    }
    var rel = currentRoot.querySelectorAll('[data-ago]');
    for (var j = 0; j < rel.length; j++) {
      var t = Number(rel[j].getAttribute('data-ago'));
      rel[j].textContent = ago(new Date(t));
    }
  }

  /* --- section builders -------------------------------------------------- */

  function statusChip(state, textPass, textFail, textNa) {
    if (state === 'pass') return '<span class="pbt-chip pbt-chip-ok">' + esc(textPass || 'Verified') + '</span>';
    if (state === 'na')   return '<span class="pbt-chip pbt-chip-na">' + esc(textNa || 'Not applicable') + '</span>';
    return '<span class="pbt-chip pbt-chip-bad">' + esc(textFail || 'Needs attention') + '</span>';
  }

  function sectionHead(n, title, sub) {
    return '<div class="pbt-head">' +
             '<span class="pbt-num">' + n + '</span>' +
             '<div><h2 class="pbt-h2">' + esc(title) + '</h2>' +
             (sub ? '<p class="pbt-sub">' + esc(sub) + '</p>' : '') + '</div>' +
           '</div>';
  }

  function buildSummary(snap, ident, chk) {
    var log = readLog();
    var sent = 0;
    for (var i = 0; i < log.length; i++) if (log[i].kind === 'net.attempt') sent++;
    var granted = 0;
    for (var j = 0; j < PERMS.length; j++) if (permission(PERMS[j].name) === 'granted') granted++;
    var failing = 0;
    for (var k = 0; k < chk.length; k++) if (chk[k].pass === 'fail') failing++;

    return '<section class="pbt-card pbt-hero">' +
      '<p class="pbt-kicker">Trust</p>' +
      '<h1 class="pbt-h1">Proof, not a promise.</h1>' +
      '<p class="pbt-lede">Everything on this screen is measured on your phone, right now. ' +
        'If a number is bad, it still says so.</p>' +
      '<div class="pbt-stats">' +
        '<div class="pbt-stat"><b>' + num(sent) + '</b><span>requests sent off this phone, ever</span></div>' +
        '<div class="pbt-stat"><b>' + num(ident.emails.length + ident.phones.length) + '</b><span>emails or phone numbers stored</span></div>' +
        '<div class="pbt-stat"><b>' + num(snap.bytes) + '</b><span>bytes held, in ' + num(snap.keys) + ' record' + (snap.keys === 1 ? '' : 's') + '</span></div>' +
        '<div class="pbt-stat"><b>' + num(granted) + ' of ' + PERMS.length + '</b><span>permissions you have allowed</span></div>' +
      '</div>' +
      '<p class="pbt-hero-foot">' + (failing === 0
        ? 'All ' + chk.length + ' live checks pass. They are re-run every time you open this screen.'
        : failing + ' of ' + chk.length + ' live checks did not pass. Details in section 7.') + '</p>' +
    '</section>';
  }

  function buildAirplane() {
    var on = isAirplane();
    var html = '<section class="pbt-card" id="pbt-airplane">' +
      sectionHead(1, 'Airplane mode', 'Switch it on and the app keeps working. Nothing can leave.') +
      '<div class="pbt-row pbt-row-toggle">' +
        '<div class="pbt-row-main">' +
          '<div class="pbt-row-title">Block all outbound network</div>' +
          '<div class="pbt-row-note">' + (on
            ? 'On. Requests to any other origin are refused inside the app before the browser can send them.'
            : 'Off. Only one thing would use the network: the optional Claude reply, and only if you added a key.') + '</div>' +
        '</div>' +
        '<button type="button" class="pbt-toggle' + (on ? ' is-on' : '') + '" role="switch" aria-checked="' + (on ? 'true' : 'false') +
          '" data-act="airplane" aria-label="Airplane mode"><span class="pbt-knob"></span></button>' +
      '</div>' +
      '<div class="pbt-fine">' +
        '<div><b>Blocked when on:</b> every request to a different origin — fetch, XMLHttpRequest, sendBeacon, WebSocket, EventSource.</div>' +
        '<div><b>Still allowed:</b> <code>data:</code>, <code>blob:</code> and this app’s own files. None of those leave the device.</div>' +
        '<div><b>Unaffected either way:</b> reminders, moments, memory, chat parsing, the whole app. Try it.</div>' +
      '</div>' +
      '<div class="pbt-prove">' +
        '<button type="button" class="pbt-btn pbt-btn-primary" data-act="probe"' + (probeState && probeState.running ? ' disabled' : '') + '>' +
          (probeState && probeState.running ? 'Testing…' : 'Prove it — try a real request now') + '</button>' +
        '<p class="pbt-fineprint">Sends a genuine GET to ' + esc(PROBE_URL) + ' over both fetch and XMLHttpRequest, ' +
          'and reports exactly what happened. This only ever runs when you tap it.</p>';

    if (probeState && probeState.result) {
      var r = probeState.result;
      var both = (r.fetch.outcome === 'blocked' && r.xhr.outcome === 'blocked');
      html += '<div class="pbt-result ' + (both ? 'is-ok' : 'is-bad') + '">' +
        '<div class="pbt-result-top">' + (both ? 'Blocked. Nothing left the phone.' : 'Not blocked by Personalbee.') +
          '<span class="pbt-result-time">' + clockTime(r.at) + ' · ' + r.ms + ' ms</span></div>' +
        '<div class="pbt-result-line"><b>fetch</b> ' + esc(r.fetch.detail) + '</div>' +
        '<div class="pbt-result-line"><b>XMLHttpRequest</b> ' + esc(r.xhr.detail) + '</div>' +
        '<div class="pbt-result-line pbt-dim">Airplane mode was ' + (r.airplane ? 'on' : 'off') + ' during this test. ' +
          'The attempt is in the access log either way.</div>' +
      '</div>';
    }
    html += '</div></section>';
    return html;
  }

  function buildErase(snap) {
    var html = '<section class="pbt-card" id="pbt-erase">' +
      sectionHead(2, 'Erase everything', 'One tap. It happens on the phone, so it happens immediately.') +
      '<div class="pbt-erase-now">Holding right now: <b>' + fmtBytes(snap.bytes) + '</b> across ' +
        num(snap.keys) + ' record' + (snap.keys === 1 ? '' : 's') + '.</div>';

    if (snap.items.length) {
      html += '<ul class="pbt-keylist">';
      for (var i = 0; i < snap.items.length; i++) {
        html += '<li><span>' + esc(snap.items[i].label) + '</span><b>' + num(snap.items[i].bytes) + ' B</b></li>';
      }
      html += '</ul>';
    }

    html += '<button type="button" class="pbt-btn pbt-btn-danger" data-act="erase">Erase everything</button>' +
      '<p class="pbt-fineprint">There is no server copy, so there is no 30-day request and nothing to undo. ' +
      'You will be asked once to confirm.</p>';

    if (lastWipe) {
      var w = lastWipe;
      html += '<div class="pbt-receipt">' +
        '<div class="pbt-receipt-top">Wipe receipt · ' + esc(clockTime(w.at)) + ' ' + esc(dayLabel(w.at)) + '</div>' +
        '<div class="pbt-ba">' +
          '<div><span>Before</span><b>' + num(w.before.bytes) + ' B</b><i>' + num(w.before.keys) + ' records</i></div>' +
          '<div class="pbt-arrow" aria-hidden="true">→</div>' +
          '<div><span>After</span><b>' + num(w.afterBytes) + ' B</b><i>' + num(w.afterKeys) + ' records</i></div>' +
        '</div>' +
        '<div class="pbt-receipt-label">Destroyed:</div><ul class="pbt-keylist">';
      if (w.before.items.length) {
        for (var j = 0; j < w.before.items.length; j++) {
          html += '<li><span>' + esc(w.before.items[j].label) + '</span><b>' + num(w.before.items[j].bytes) + ' B</b></li>';
        }
      } else {
        html += '<li><span>Nothing was stored at the time.</span><b>0 B</b></li>';
      }
      html += '</ul><p class="pbt-fineprint">Measured at ' + num(w.afterBytes) + ' bytes the instant the wipe finished. ' +
        'Anything stored now was written after that: the log entry recording this wipe' +
        (w.keptAirplane ? ', and your airplane-mode switch, which was kept on so the network block did not silently turn itself off.' : '.') +
        '</p></div>';
    }
    return html + '</section>';
  }

  function buildIdentifiers(ident) {
    var found = ident.emails.length + ident.phones.length;
    var html = '<section class="pbt-card">' +
      sectionHead(3, 'No email, no phone number', 'Not collecting it beats promising to protect it.') +
      '<div class="pbt-claim">' +
        '<div class="pbt-claim-row"><span>Sign-up</span><b>None</b></div>' +
        '<div class="pbt-claim-row"><span>Account or password</span><b>None</b></div>' +
        '<div class="pbt-claim-row"><span>Email field anywhere in the app</span><b>None</b></div>' +
        '<div class="pbt-claim-row"><span>Phone number field anywhere in the app</span><b>None</b></div>' +
        '<div class="pbt-claim-row"><span>Device or advertising ID read</span><b>None</b></div>' +
        '<div class="pbt-claim-row"><span>What identifies you here</span><b>A first name you typed</b></div>' +
      '</div>' +
      '<div class="pbt-scan">' +

  function renderScreen(rootEl) {

    try { html += buildPermissions(); } catch (e) {}
    try { html += buildBadges(); } catch (e) {}

  function wire(rootEl) {

      var btn = ev.target.closest ? ev.target.closest('[data-act]') : null;
      if (!btn) return;
      var act = btn.getAttribute('data-act');
      var name = btn.getAttribute('data-name');

      if (act === 'airplane') {
        setAirplane(!isAirplane());
        probeState = null;
        repaint();
        toast(isAirplane() ? 'Airplane mode on. Try the app — it all still works.' : 'Airplane mode off.', 2400);
        return;
      }

      if (act === 'probe') {
        probeState = { running: true, result: null };
        repaint();
        probe().then(function (result) {
          probeState = { running: false, result: result };
          repaint();
        }).catch(function () {
          probeState = null;
          repaint();
        });
        return;
      }

      if (act === 'erase') { eraseAll(); return; }
      if (act === 'revoke') { revoke(name); toast(capitalize(name) + ' turned off.', 2000); return; }

      }

   * 12. Export
   * ---------------------------------------------------------------------- */

    setAirplane: setAirplane,
    permission: permission,
    request: request,
    eraseAll: eraseAll,
    renderScreen: renderScreen,
    log: function () { return readLog().slice().reverse(); },

    record: record,
    revoke: revoke,
    checks: checks,
    bytes: bytes,
    scan: scanIdentifiers,
    probe: probe,
    permissions: function () {

  void LOAD_AT;
})();

} catch (e) { console.error('[PB] module failed: js/trust.js', e); }

  function delStore(key) {
    try { if (PB.store && typeof PB.store.del === 'function') PB.store.del(key); } catch (e) { /* ignore */ }
  }
  function nowDate() {
    try {
      if (PB.util && typeof PB.util.now === 'function') {
        var d = PB.util.now();
        if (d instanceof Date && !isNaN(d.getTime())) return d;
      }
    } catch (e) { /* ignore */ }
    return new Date();
  }
  function uid() {
    try { if (PB.util && typeof PB.util.uid === 'function') return String(PB.util.uid()); } catch (e) { /* ignore */ }
    return 'm' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }
  function fmtTime(d) {
    try {
      if (PB.util && typeof PB.util.fmtTime === 'function') return String(PB.util.fmtTime(d));
    } catch (e) { /* ignore */ }
    try { return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
    catch (e2) { return ''; }
  }
  function fmtDay(d) {
    try {
      if (PB.util && typeof PB.util.fmtDay === 'function') return String(PB.util.fmtDay(d));
    } catch (e) { /* ignore */ }
    try { return d.toLocaleDateString(); } catch (e2) { return ''; }
  }
  function toDate(v) {
    if (v instanceof Date) return isNaN(v.getTime()) ? null : v;
    if (typeof v === 'number') { var dn = new Date(v); return isNaN(dn.getTime()) ? null : dn; }
    if (typeof v === 'string' && v) { var ds = new Date(v); return isNaN(ds.getTime()) ? null : ds; }
    return null;
  }
  function isAirplane() {
    try {
      if (PB.trust && typeof PB.trust.isAirplane === 'function') return !!PB.trust.isAirplane();
    } catch (e) { /* ignore */ }
    return false;
  }
  function goScreen(id) {
    try { if (PB.ui && typeof PB.ui.go === 'function') { PB.ui.go(id); return true; } } catch (e) { /* ignore */ }
    try { if (PB.app && typeof PB.app.go === 'function') { PB.app.go(id); return true; } } catch (e2) { /* ignore */ }
    return false;
  }
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }

  /* ---------------------------------------------------------
     the bee, as inline SVG.
     Round honey body, tinted wings, antennae with tips, one
     closed-eye group and one open-eye group swapped by state.
     Every colour comes from CSS, so the palette lives in
     css/beeui.css and follows the theme.
     --------------------------------------------------------- */
  function beeSvg(extraClass) {
    return '' +
      '<svg class="pb-bee-svg ' + (extraClass || '') + '" viewBox="0 0 64 64" aria-hidden="true" focusable="false">' +
        '<g class="pb-bee-body">' +
          '<ellipse class="pb-wing pb-wing-l" cx="24" cy="22" rx="9" ry="13"/>' +
          '<ellipse class="pb-wing pb-wing-r" cx="40" cy="22" rx="9" ry="13"/>' +
          '<ellipse class="pb-torso" cx="32" cy="38" rx="18" ry="16"/>' +
          '<path class="pb-belly" d="M17 45 q15 9 30 0" />' +
          '<path class="pb-antenna" d="M27 22 q-3 -7 -7 -8 M37 22 q3 -7 7 -8"/>' +
          '<circle class="pb-antenna-tip" cx="19" cy="13" r="2.2"/>' +
