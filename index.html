  /* Persist a fact. Prefer the sibling's learn(); otherwise write it through
   * PB.memory.add in the contract's exact shape. */
  function memLearn(text) {
    var raw = trim(text);
    if (!raw) return [];

    // PB.memory owns this when it can. Its phrasing and its subject index are
    // better than anything reconstructed out here.
    if (PB.memory && isFn(PB.memory.learn)) {
      var got = tryCall(PB.memory.learn, PB.memory, [raw], null);
      if (isArr(got) && got.length) return got.filter(function (x) { return x && x.text; });
      if (got && got.text) return [got];
      // It found nothing. Try the local pass before giving up — nothing to
      // collide with, and it catches shapes memory.js doesn't cover yet.
    }

    var facts = extractFacts(raw);
    if (!facts.length) return [];

    var stored = [];
    facts.forEach(function (f) {
      var item = {
        kind: f.kind,
        text: f.text,
        evidence: ['You told me: "' + clip(raw, 90) + '"'],
        confidence: f.confidence,
        saved: true,
        source: 'told'
      };
      var saved = null;
      if (PB.memory && isFn(PB.memory.add)) saved = tryCall(PB.memory.add, PB.memory, [item], null);
      if (!saved) saved = item;
      saved.subject = f.subject;
      stored.push(saved);
    });
    return stored;
  }

  function memRecall(query) {
    var q = trim(query);
    if (PB.memory && isFn(PB.memory.recall)) {
      var hits = tryCall(PB.memory.recall, PB.memory, [q], null);
      if (isArr(hits) && hits.length) {
        return hits.map(function (x) { return (x && x.item) ? x.item : x; })
          .filter(function (m) { return m && m.text; }).slice(0, 5);
      }
    }
    return memoryRecall(q);
  }

  function memAbout(subject) {
    var s = trim(subject);
    if (!s) return [];
    if (PB.memory && isFn(PB.memory.about)) {
      var hits = tryCall(PB.memory.about, PB.memory, [s], null);
      if (isArr(hits) && hits.length) {
        return hits.map(function (x) { return (x && x.item) ? x.item : x; })
          .filter(function (m) { return m && m.text; }).slice(0, 5);
      }
    }
    // Fallback: everything whose text mentions the subject.
    var needle = low(s);
    var all = memoryItems();
    var direct = all.filter(function (m) { return low(m.text).indexOf(needle) !== -1; });
    if (direct.length) return direct.slice(0, 5);
    return memRecall(s);
  }

  function memForgetAbout(subject) {
    var s = trim(subject);
    if (!s) return 0;
    if (PB.memory && isFn(PB.memory.forgetAbout)) {
      var n = tryCall(PB.memory.forgetAbout, PB.memory, [s], null);
      if (typeof n === 'number') return n;
      if (n === true) return 1;
      if (isArr(n)) return n.length;
    }
    var hits = memAbout(s);
    var dropped = 0;
    hits.forEach(function (m) { if (memoryForget(m)) dropped++; });
    return dropped;
  }

  /* One short, natural line confirming what just got stored. */
  function confirmLearned(items) {
    items = arr(items).filter(function (m) { return m && m.text; });
    if (!items.length) return '';
    var texts = items.slice(0, 2).map(function (m) {
      return trim(m.text).replace(/\.$/, '');
    });
    if (texts.length === 1) {
      return 'Got it — ' + lowerFirst(texts[0]) + '. I\'ll keep that.';
    }
    return 'Got it — ' + lowerFirst(texts[0]) + ', and ' + lowerFirst(texts[1]) + '. Both saved.';
  }

  function lowerFirst(s) {
    s = trim(s);
    if (!s) return s;
    // Don't lowercase a proper noun.
    if (/^[A-Z][a-z]/.test(s) && !/^(You|Your|I|Her|His|Their)\b/.test(s)) return s;
    return s.charAt(0).toLowerCase() + s.slice(1);
  }

  /* ------------------------------------------------------------------ *
   * Questions about her, and about people she's mentioned
   * ------------------------------------------------------------------ */

  function isQuestion(text) {
    var t = trim(text);
    if (!t) return false;
    if (/\?\s*$/.test(t)) return true;
    return /^(what|who|when|where|which|how|why|do|does|did|is|are|was|were|can|could|tell me|remind me what|remember)\b/i.test(t);
  }

  /* What is she asking *about*? Returns '' for "what do you know about me". */
  function askedSubject(text) {
    var raw = trim(text);
    var m;

    if (/\b(about me|know about me|noticed about me|remember about me|store about me)\b/i.test(raw)) return '';

    // "what's my sister's name" / "when is my mom's birthday"
    m = raw.match(new RegExp('\\bmy\\s+(' + RELATION + ')\\b', 'i'));
    if (m) return low(m[1]);

    // "what did I say about the retinoid" / "tell me about Priya"
    m = raw.match(/\b(?:about|regarding|on)\s+([A-Za-z][\w'’-]*(?:\s+[\w'’-]+)?)\s*\??$/i);
    if (m && !/^me$/i.test(trim(m[1]))) return trim(m[1]);

    // "who is Sara" / "who's Elena"
    m = raw.match(/\bwho(?:'s|’s| is| was)\s+([A-Za-z][\w'’-]{1,24})/i);
    if (m) return trim(m[1]);

    // "what's my coffee order" — any "my <thing>"
    m = raw.match(/\bmy\s+([a-z][a-z' -]{2,24})\b/i);
    if (m) return low(trim(m[1]));

    // A bare capitalised name anywhere but the very first word.
    m = raw.match(/(?:\s)([A-Z][a-z'’-]{2,20})\b/);
    if (m && looksLikeName(m[1])) return trim(m[1]);

    return '';
  }

  /* "what's my sister's NAME" — which fact actually answers the question? */
  function attributeWanted(text) {
    var t = low(text);
    if (/\bname\b|\bcalled\b|\bwho is\b/.test(t)) return /(is called|name is|goes by|named)/;
    if (/\bbirthday\b|\bborn\b/.test(t)) return /(birthday|born)/;
    if (/\bnumber\b|\bphone\b|\btext\b/.test(t)) return /(number|phone|\d{3})/;
    if (/\b(do|does|job|work|works|doing)\b/.test(t)) return /(works|work|is an? |job|nurse|doctor|designer|editor|manager)/;
    if (/\blive|lives|living|where\b/.test(t)) return /(lives|live|based|apartment)/;
    if (/\ballerg/.test(t)) return /allerg/;
    return null;
  }

  function memoryLine(m) {
    var txt = trim(m && m.text);
    if (!txt) return '';
    if (!/[.!?]$/.test(txt)) txt += '.';
    return txt.replace(/\.{2,}$/, '.');
  }

  /* Try to answer straight out of memory. Returns a reply or null.
   * Only fires on something that is actually a question — "I had a weird day"
   * must never be answered with a list of things BEE knows. */
  function answerFromMemory(text, parsed) {
    if (!isQuestion(text) && !/\b(you (?:know|remember)|i told you|did i (?:say|tell))\b/i.test(text)) return null;

    var subject = askedSubject(text);

    // "what do you know about me" is the only question worth answering with a
    // general list; anything else vague should go somewhere more useful.
    if (!subject && !/\b(about me|know about me|noticed|remember about me|store about me|know about my)\b/i.test(text)) {
      return null;
    }
    if (!subject && parsed && ents(parsed).person && !isGenericPerson(ents(parsed).person)) {
      subject = trim(ents(parsed).person);
    }

    var indexed = !!(PB.memory && isFn(PB.memory.about));
    var hits = subject ? memAbout(subject) : memRecall(text);
    if ((!hits || !hits.length) && subject) hits = memRecall(subject);

    // Asked about a person by name and BEE has nothing? Say so, and ask.
    // Better than a shrug, and much better than an unrelated list.
    if ((!hits || !hits.length) && subject && looksLikeName(subject)) {
      return reply(
        'Nothing on ' + subject + ' — you haven\'t mentioned them to me yet. Who are they?',
        [
          { label: 'Who do you know?', send: 'Who do you know?' },
          { label: 'What do you know about me?', send: 'What do you know about me?' }
        ],
        memCard([], 'empty'), []);
    }
    if (!hits || !hits.length) return null;

    // When memory.js has a real subject index, trust it — it links "my sister"
    // to "Sara is a doctor" in a way substring matching never will. Only sanity
    // check relevance when we're on the crude fallback.
    if (subject && !indexed) {
      var needle = low(subject);
      var relevant = hits.filter(function (m) { return low(m.text).indexOf(needle) !== -1; });
      if (relevant.length) hits = relevant;
      else if (scoreText(low(hits[0].text), tokens(text)) < 1) return null;
    }

    state.lastTopic = subject || state.lastTopic;

    // She asked for one specific thing — lead with the line that answers it,
    // not with everything BEE happens to hold on the subject.
    if (hits.length > 1) {
      var want = attributeWanted(text);
      if (want) {
        var direct = hits.filter(function (m) { return want.test(low(m.text)); });
        if (direct.length) hits = direct.concat(hits.filter(function (m) { return direct.indexOf(m) === -1; })).slice(0, 4);
        if (direct.length === 1) hits = [direct[0]];
      }
    }

    var lines = [];
    if (hits.length === 1) {
      lines.push(memoryLine(hits[0]));
      var credit = call(PB.memory, ['attribution'], [hits[0]], '');
      if (typeof credit === 'string' && trim(credit)) {
        lines[0] += ' ' + cap(trim(credit)).replace(/[.\s]*$/, '') + '.';
      } else {
        var when = toDate(hits[0].firstSeen);
        if (when && low(hits[0].source) === 'told') lines[0] += ' You told me ' + fmtRelative(when) + '.';
      }
    } else {
      // Lead with the fact she asked for, not with a header over a list.
      // "What's my posting schedule?" wants "Wednesdays and Saturdays, around
      // 6pm" — the four related things BEE also holds come after, or not at all.
      var headline = '';
      try { headline = kbHeadline(text); } catch (e) { headline = ''; }
      var rest = hits.slice(0, 4);
      if (headline) {
        rest = rest.filter(function (m) { return !saysTheSame(headline, memoryLine(m)); });
        lines.push(headline);
        if (rest.length) lines.push(subject ? ('Also on ' + subject + ':') : 'Also:');
      } else {
        lines.push(subject ? ('On ' + subject + ':') : 'Here\'s what I have:');
      }
      rest.forEach(function (m) { lines.push('· ' + memoryLine(m)); });
    }

    var chips = [];
    if (subject) {
      chips.push({ label: 'What else about ' + shortLabel(subject) + '?', send: 'What else do you know about ' + subject + '?' });
      chips.push({ label: 'Forget that', send: 'Forget what you know about ' + subject });
    } else {
      chips.push({ label: 'What else?', send: 'What else have you noticed about me?' });
    }
    chips.push({ label: 'What\'s next?', send: 'What\'s next today?' });

    return reply(lines.join('\n'), chips, memCard(hits, 'recall'), []);
  }

  /* ------------------------------------------------------------------ *
   * Resolving "him", "her", "that", "the same time"
   * ------------------------------------------------------------------ */

  function noteSubjects(text, parsed) {
    var e = ents(parsed);
    if (e.person && !isGenericPerson(e.person)) state.lastPerson = trim(e.person);
    var m = trim(text).match(/(?:^|\s)([A-Z][a-z'’-]{2,20})\b/);
    if (m && looksLikeName(m[1])) state.lastPerson = trim(m[1]);
    var rel = trim(text).match(REL_RE);
    if (rel) state.lastTopic = low(rel[1]);
    if (e.topic) state.lastTopic = trim(e.topic);
  }

  /* Rewrite pronouns against what was just said, so the NLU and the search
   * paths see a sentence that actually names things. */
  function resolveRefs(text) {
    var t = trim(text);
    if (!t) return t;

    if (state.lastPerson && /\b(him|her|them|they|he|she)\b/i.test(t)) {
      t = t.replace(/\b(him|her|them|they|he|she)\b/gi, state.lastPerson);
    }
    if (state.lastTopic && /\b(that|it|this)\b/i.test(t) && !/\bthat\s+(is|was|'s)\b/i.test(t)) {
      t = t.replace(/\b(that|it|this)\b/i, state.lastTopic);
    }
    return t;
  }

  function historyText(history, role) {
    var list = arr(history);
    for (var i = list.length - 1; i >= 0; i--) {
      var h = list[i];
      if (!h) continue;
      var r = low(h.role || h.from || h.who);
      var t = trim(h.text || h.content || h.message);
      if (!t) continue;
      if (!role || r === role) return t;
    }
    return '';
  }

  /* --- photo -------------------------------------------------------- */

  function allMoments() {
    var list = call(PB.photo, ['list', 'all', 'moments', 'getAll'], [], null);
    if (!isArr(list) && PB.store && isFn(PB.store.get)) {
      list = tryCall(PB.store.get, PB.store, ['photos', []], []);
    }
    return isArr(list) ? list : [];
  }

  function searchMoments(query) {
    var hits = call(PB.photo, ['search', 'find', 'recall', 'query'], [query], null);
    if (isArr(hits) && hits.length) {
      return hits.map(function (x) { return (x && x.item) ? x.item : x; }).filter(Boolean);
    }
    var all = allMoments();
    if (!trim(query)) return all.slice(0, 6);
    var toks = tokens(query);
    return all.map(function (m) {
      var hay = low(m.userNote) + ' ' + low(m.aiGuess) + ' ' + low(arr(m.tags).join(' '));
      return { m: m, s: scoreText(hay, toks) };
    }).filter(function (x) { return x.s > 0; })
      .sort(function (a, b) { return b.s - a.s; })
      .map(function (x) { return x.m; })
      .slice(0, 6);
  }

  /* ------------------------------------------------------------------ *
   * Text matching
   * ------------------------------------------------------------------ */

  var STOP = {
    'the': 1, 'a': 1, 'an': 1, 'and': 1, 'or': 1, 'but': 1, 'for': 1, 'of': 1, 'to': 1, 'in': 1,
    'on': 1, 'at': 1, 'is': 1, 'was': 1, 'are': 1, 'be': 1, 'been': 1, 'it': 1, 'its': 1, 'this': 1,
    'that': 1, 'with': 1, 'my': 1, 'me': 1, 'i': 1, 'you': 1, 'your': 1, 'we': 1, 'us': 1, 'he': 1,
    'she': 1, 'they': 1, 'them': 1, 'his': 1, 'her': 1, 'their': 1, 'who': 1, 'whos': 1, 'what': 1,
    'whats': 1, 'when': 1, 'where': 1, 'which': 1, 'how': 1, 'why': 1, 'do': 1, 'does': 1, 'did': 1,
    'can': 1, 'could': 1, 'would': 1, 'should': 1, 'will': 1, 'about': 1, 'from': 1, 'was': 1,
    'guy': 1, 'girl': 1, 'person': 1, 'one': 1, 'thing': 1, 'again': 1, 'was': 1, 'name': 1,
    'called': 1, 'remember': 1, 'find': 1, 'know': 1, 'think': 1, 'like': 1, 'just': 1, 'some': 1,
    'there': 1, 'here': 1, 'get': 1, 'got': 1, 'have': 1, 'has': 1, 'had': 1, 'need': 1, 'want': 1,
    'please': 1, 'bee': 1, 'hey': 1, 'ok': 1, 'okay': 1
  };

  function tokens(s) {
    var raw = low(s).replace(/[^a-z0-9\s'-]/g, ' ').split(/\s+/);
    var out = [];
    for (var i = 0; i < raw.length; i++) {
      var t = raw[i].replace(/^'+|'+$/g, '');
      if (t.length < 3) continue;
      if (STOP[t]) continue;
      out.push(t);
    }
    return out;
  }

  function scoreText(hay, toks) {
    if (!hay || !toks || !toks.length) return 0;
    var s = 0;
    for (var i = 0; i < toks.length; i++) {
      var t = toks[i];
      if (hay.indexOf(t) !== -1) s += 1;
      else if (t.length > 4 && hay.indexOf(t.slice(0, t.length - 1)) !== -1) s += 0.6;
    }
    return s;
  }

  /* Words the NLU sometimes hands back as a "person" that aren't a person. */
  var GENERIC_PERSON = {
    'guy': 1, 'girl': 1, 'man': 1, 'woman': 1, 'someone': 1, 'somebody': 1, 'person': 1,
    'dude': 1, 'they': 1, 'them': 1, 'him': 1, 'her': 1, 'he': 1, 'she': 1, 'people': 1,
    'friend': 1, 'that': 1, 'this': 1, 'one': 1, 'who': 1
  };

  function isGenericPerson(s) {
    s = low(trim(s));
    if (!s) return true;
    var parts = s.split(/\s+/);
    for (var i = 0; i < parts.length; i++) {
      if (!GENERIC_PERSON[parts[i]]) return false;
    }
    return true;
  }

  /* Rank contacts using PB.kb.findContact plus our own fuzzy pass. The raw
   * sentence carries the descriptors ("tall", "conference", "packaging"), so
   * it is always searched — a bare entity like "guy" would sink the query. */
  function rankContacts(query, raw) {
    var out = [];
    var seen = {};

    function push(c, bump) {
      if (!c || !c.id) return;
      if (seen[c.id] !== undefined) { out[seen[c.id]].score += bump; return; }
      seen[c.id] = out.length;
      out.push({ contact: c, score: bump });
    }

    var queries = [];
    if (trim(raw)) queries.push(trim(raw));
    if (trim(query) && low(trim(query)) !== low(trim(raw))) queries.push(trim(query));
    if (!queries.length) return out;

    // Agent 1's ranking is the stronger signal — weight it steeply, and weight
    // the descriptive sentence above any single extracted entity.
    var CURVE = [6, 3, 2, 1.5, 1];
    for (var qi = 0; qi < queries.length; qi++) {
      var found = call(kb(), ['findContact'], [queries[qi]], null);
      if (!isArr(found)) continue;
      var weight = qi === 0 ? 1 : 0.4;
      for (var i = 0; i < found.length && i < 6; i++) {
        var c = found[i];
        if (c && c.item) c = c.item;
        push(c, (CURVE[i] !== undefined ? CURVE[i] : 0.75) * weight);
      }
    }

    var contacts = (kb() && isArr(kb().contacts)) ? kb().contacts : [];
    var toks = tokens(queries.join(' '));
    for (var j = 0; j < contacts.length; j++) {
      var k = contacts[j];
      if (!k) continue;
      var nameHay = low(k.name) + ' ' + low(k.nickname);
      var softHay = low(k.relationship) + ' ' + low(arr(k.tags).join(' ')) + ' ' +
        low(k.howTheyMet) + ' ' + low(k.vibe) + ' ' + low(k.notes);
      var s = scoreText(nameHay, toks) * 2.5 + scoreText(softHay, toks);
      if (s > 0) push(k, s);
    }

    out.sort(function (a, b) { return b.score - a.score; });
    return out;
  }

  function contactLine(c) {
    if (!c) return '';
    var bits = [];
    if (c.relationship) bits.push(c.relationship);
    if (c.vibe) bits.push(clip(c.vibe, 70));
    else if (c.howTheyMet) bits.push('met ' + clip(c.howTheyMet, 60));
    var tail = bits.slice(0, 2).join(', ');
    return trim(c.name) + (tail ? ' — ' + tail : '');
  }

  /* ------------------------------------------------------------------ *
   * Calendar helpers
   * ------------------------------------------------------------------ */

  function eventsOn(d) {
    var evs = call(kb(), ['eventsOn'], [d], null);
    if (isArr(evs)) return evs.slice().sort(function (a, b) {
      return (toDate(a && a.start) || 0) - (toDate(b && b.start) || 0);
    });
    var all = (kb() && isArr(kb().calendar)) ? kb().calendar : [];
    return all.filter(function (e) { return e && sameDay(toDate(e.start), d); })
      .sort(function (a, b) { return (toDate(a.start) || 0) - (toDate(b.start) || 0); });
  }

  function nextEvent(from) {
    var e = call(kb(), ['nextEvent'], [from || now()], null);
    if (e && e.start) return e;
    var all = (kb() && isArr(kb().calendar)) ? kb().calendar : [];
    var t = (toDate(from) || now()).getTime();
    var upcoming = all.filter(function (x) {
      var s = toDate(x && x.start);
      return s && s.getTime() >= t;
    }).sort(function (a, b) { return toDate(a.start) - toDate(b.start); });
    return upcoming.length ? upcoming[0] : null;
  }

  function withNames(ev) {
    var ids = arr(ev && ev.withIds);
    if (!ids.length) return [];
    var contacts = (kb() && isArr(kb().contacts)) ? kb().contacts : [];
    var out = [];
    for (var i = 0; i < ids.length; i++) {
      for (var j = 0; j < contacts.length; j++) {
        if (contacts[j] && contacts[j].id === ids[i]) {
          out.push(firstName(contacts[j].name) || contacts[j].name);
          break;
        }
      }
    }
    return out;
  }

  function eventLine(ev, withDay) {
    if (!ev) return '';
    var s = toDate(ev.start);
    var when = s ? ((withDay ? fmtDay(s) + ' ' : '') + fmtTime(s)) : '';
    var who = withNames(ev);
    var bits = [];
    if (when) bits.push(when);
    bits.push(trim(ev.title) || 'Something');
    var tail = '';
    if (who.length) tail += ' with ' + joinList(who);
    if (ev.location) tail += ' at ' + ev.location;
    return bits.join(' — ') + tail;
  }

  /* ------------------------------------------------------------------ *
   * Response construction
   * ------------------------------------------------------------------ */

  function reply(text, chips, card, did, soft) {
    return {
      text: trim(text) || 'I\'m here.',
      chips: normChips(chips),
      card: card || null,
      did: arr(did).filter(function (d) { return !!d; }),
      _soft: soft === true
    };
  }

  function normChips(chips) {
    var out = [];
    arr(chips).forEach(function (c) {
      if (!c) return;
      if (typeof c === 'string') out.push({ label: c, send: c });
      else if (c.label) out.push({ label: String(c.label), send: String(c.send || c.label) });
    });
    return out.slice(0, 4);
  }

  function finalize(r) {
    if (!r || typeof r !== 'object') r = reply('I\'m here.');
    delete r._soft;
    return {
      text: trim(r.text) || 'I\'m here.',
      chips: normChips(r.chips),
      card: r.card || null,
      did: arr(r.did)
    };
  }

  var DEFAULT_CHIPS = [
    { label: 'What\'s next?', send: 'What\'s next today?' },
    { label: 'My reminders', send: 'What are my reminders?' },
    { label: 'What can you do?', send: 'What can you do?' }
  ];

  /* ------------------------------------------------------------------ *
   * Intent handlers
   * ------------------------------------------------------------------ */

  function ents(parsed) {
    return (parsed && parsed.entities) ? parsed.entities : {};
  }

  function parseWhen(text) {
    if (PB.nlu && isFn(PB.nlu.parseDateTime)) {
      var r = tryCall(PB.nlu.parseDateTime, PB.nlu, [text, now()], null);
      if (r && (r.date || r.recurrence)) return r;
    }
    return null;
  }

  /* --- reminder.create ---------------------------------------------- */

  function hReminderCreate(text, parsed) {
    var e = ents(parsed);
    var task = trim(e.task) || stripLead(text);
    if (!task) task = 'that';

    var due = toDate(e.datetime);
    var dueText = trim(e.datetimeText);
    var rec = e.recurrence || null;

    if (!due && !rec) {
      var guess = parseWhen(text);
      if (guess) {
        due = toDate(guess.date);
        dueText = dueText || trim(guess.text);
        rec = rec || guess.recurrence || null;
      }
    }

    // "at the same time" / "same time as last one"
    if (!due && !rec && /\bsame time\b/i.test(text) && state.lastReminder) {
      due = toDate(state.lastReminder.due);
      if (due) {
        due = new Date(due.getTime());
        if (due.getTime() <= now().getTime()) due = new Date(due.getTime() + 86400000);
        dueText = dueText || 'same time as last one';
      }
    }

    // Never guess a time. Ask.
    if (!due && !rec) {
      state.pending = { kind: 'reminder.time', task: task, askedAt: now().getTime() };
      return reply(
        'Got it — ' + task + '. When do you want me to nudge you?',
        [
          { label: 'Tonight', send: 'tonight' },
          { label: 'Tomorrow morning', send: 'tomorrow morning' },
          { label: 'In an hour', send: 'in 1 hour' },
          { label: 'No time needed', send: 'no time needed' }
        ],
        null,
        []
      );
    }

    var r = createReminder(task, due, dueText, rec);
    rememberReminder(r);

    var chips = [
      { label: 'Show my reminders', send: 'What are my reminders?' },
      { label: 'Add another', send: 'Remind me to ' }
    ];
    return reply(confirmReminder(r), chips, remCard([r], 'New reminder'), ['Created reminder']);
  }

  function rememberReminder(r) {
    state.pending = null;
    if (r && (r.id || r.text)) {
      state.lastReminder = r;
      state.lastReminderAt = now().getTime();
      state.lastTopic = trim(r.text) || state.lastTopic;
    }
  }

  /* Move an existing reminder rather than creating a second one. */
  function rescheduleReminder(r, due, dueText) {
    if (!r) return false;
    var ok = false;
    if (PB.reminders && isFn(PB.reminders.update)) {
      var res = tryCall(PB.reminders.update, PB.reminders, [r.id, { due: iso(due), dueText: dueText || '' }], null);
      if (res) { ok = true; if (looksLikeReminder(res)) { r.due = res.due; r.dueText = res.dueText; } }
    }
    if (!ok && PB.store && isFn(PB.store.get) && isFn(PB.store.set)) {
      var list = tryCall(PB.store.get, PB.store, ['reminders', []], []);
      if (isArr(list)) {
        for (var i = 0; i < list.length; i++) {
          if (list[i] && list[i].id === r.id) {
            list[i].due = iso(due);
            list[i].dueText = dueText || '';
            list[i].snoozedUntil = null;
            list[i].fired = false;
            tryCall(PB.store.set, PB.store, ['reminders', list], null);
            ok = true;
            break;
          }
        }
      }
    }
    if (ok) {
      r.due = iso(due);
      r.dueText = dueText || '';
      state.lastReminderAt = now().getTime();
    }
    return ok;
  }

  /* "actually make it 4pm" / "no, Friday instead" — edit the thing we just
   * made instead of starting over. Returns a reply or null. */
  function resolveEdit(text, parsed) {
    var r = state.lastReminder;
    if (!r) return null;
    if (now().getTime() - state.lastReminderAt > PENDING_TTL) return null;

    var t = low(trim(text));
    var correcting = /^(actually|no[,.\s]|wait|hold on|scratch that|make it|change it|move it|push it|let'?s say|better make it|sorry)\b/.test(t) ||
      /\b(actually|instead)\b/.test(t);
    if (!correcting) return null;
    if (/\bremind me to\b|\bremember to\b/.test(t)) return null;   // that's a new one

    var e = ents(parsed);
    var due = toDate(e.datetime);
    var dueText = trim(e.datetimeText);
    if (!due) {
      var g = parseWhen(text);
      if (g && g.date) { due = toDate(g.date); dueText = dueText || trim(g.text); }
    }
    // "actually make it 10" — a bare hour, meaningless on its own, obvious in
    // context. Read it against the time we already agreed.
    if (!due && toDate(r.due)) {
      var bare = trim(text).match(/\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\b/i);
      if (bare) {
        var base = toDate(r.due);
        var hh = parseInt(bare[1], 10);
        var mm2 = bare[2] ? parseInt(bare[2], 10) : 0;
        if (hh >= 0 && hh <= 23 && mm2 >= 0 && mm2 < 60) {
          if (bare[3]) {
            hh = hh % 12;
            if (/pm/i.test(bare[3])) hh += 12;
          } else if (hh <= 12) {
            // No am/pm — take whichever reading sits closest to the old time.
            var alt = hh + 12;
            if (alt <= 23 && Math.abs(alt - base.getHours()) < Math.abs(hh - base.getHours())) hh = alt;
          }
          due = new Date(base.getTime());
          due.setHours(hh, mm2, 0, 0);
          dueText = dueText || trim(text);
        }
      }
    }
    if (!due) return null;

    // "make it 4pm" changes the *time*, not the day. Keep the day we agreed.
    var old = toDate(r.due);
    var saysDay = /\b(today|tonight|tomorrow|tmrw|monday|tuesday|wednesday|thursday|friday|saturday|sunday|mon|tue|tues|wed|thu|thur|thurs|fri|sat|sun|next week|weekend|the \d+)/i.test(text);
    if (old && !saysDay) {
      var moved = new Date(old.getTime());
      moved.setHours(due.getHours(), due.getMinutes(), 0, 0);
      due = moved;
    }

    var ok = rescheduleReminder(r, due, dueText || trim(text));
    if (!ok) return null;

    return reply(
      'Moved it — ' + trim(r.text) + ', ' + fmtDay(due) + ' at ' + fmtTime(due) + '.',
      [
        { label: 'My reminders', send: 'What are my reminders?' },
        { label: 'Actually, drop it', send: 'done with ' + r.text }
      ],
      remCard([r], 'Updated'),
      ['Rescheduled reminder']
    );
  }

  function remCard(list, title) {
    list = arr(list);
    return { type: 'reminder', data: { title: title || 'Reminders', reminders: list, items: list, count: list.length } };
  }

  /* --- reminder.list ------------------------------------------------ */

  function hReminderList() {
    var over = overdueReminders();
    var up = upcomingReminders();
    var open = over.concat(up);

    if (!open.length) {
      return reply(
        'Nothing on the list. Clean slate.',
        [
          { label: 'Add one', send: 'Remind me to ' },
          { label: 'What\'s next?', send: 'What\'s next today?' }
        ],
        remCard([], 'Reminders'),
        []
      );
    }

    var lines = [];
    if (over.length) {
      lines.push(over.length === 1 ? 'One slipped past its time:' : over.length + ' slipped past their time:');
      over.slice(0, 3).forEach(function (r) {
        lines.push('· ' + r.text + ' — was ' + fmtRelative(toDate(r.due)));
      });
      if (up.length) lines.push('');
    }
    if (up.length) {
      lines.push(over.length ? 'Coming up:' : (up.length === 1 ? 'One thing on the list:' : up.length + ' things on the list:'));
      up.slice(0, 4).forEach(function (r) {
        var d = toDate(r.due);
        lines.push('· ' + r.text + (d ? ' — ' + fmtDay(d) + ' ' + fmtTime(d) : ''));
      });
      if (up.length > 4) lines.push('…and ' + (up.length - 4) + ' more.');
    }

    var chips = [];
    if (over.length) chips.push({ label: 'Done: ' + shortLabel(over[0].text), send: 'done with ' + over[0].text });
    if (over.length) chips.push({ label: 'Snooze 20 min', send: 'snooze ' + over[0].text + ' 20 minutes' });
    chips.push({ label: 'Add one', send: 'Remind me to ' });

    return reply(lines.join('\n'), chips, remCard(open, 'Reminders'), []);
  }

  function shortLabel(s) {
    s = trim(s);
    if (s.length <= 18) return s;
    return s.slice(0, 17) + '…';
  }

  /* --- reminder.complete -------------------------------------------- */

  function matchReminder(text, parsed) {
    var open = openReminders();
    if (!open.length) return { hit: null, candidates: [] };

    var e = ents(parsed);
    var q = trim(e.task) || text;
    var toks = tokens(q);

    var scored = open.map(function (r) {
      return { r: r, s: scoreText(low(r.text) + ' ' + low(arr(r.tags).join(' ')), toks) };
    }).filter(function (x) { return x.s > 0; }).sort(function (a, b) { return b.s - a.s; });

    if (!scored.length) {
      var over = overdueReminders();
      return { hit: over.length === 1 ? over[0] : null, candidates: over.length ? over : open };
    }
    if (scored.length > 1 && scored[1].s >= scored[0].s) {
      return { hit: null, candidates: scored.map(function (x) { return x.r; }).slice(0, 3) };
    }
    return { hit: scored[0].r, candidates: scored.map(function (x) { return x.r; }).slice(0, 3) };
  }

  function hReminderComplete(text, parsed) {
    var open = openReminders();
    if (!open.length) {
      return reply('Nothing open to check off — the list is empty.',
        [{ label: 'Add one', send: 'Remind me to ' }], null, []);
    }

    var m = matchReminder(text, parsed);
    if (!m.hit) {
      var cands = m.candidates.slice(0, 3);
      return reply(
        'Which one?',
        cands.map(function (r) { return { label: shortLabel(r.text), send: 'done with ' + r.text }; }),
        remCard(cands, 'Which one?'),
        []
      );
    }

    var ok = completeReminder(m.hit);
    if (!ok) {
      return reply('I couldn\'t mark that one off from here — it\'s on the Reminders screen.',
        [{ label: 'Open reminders', send: 'Show my reminders' }], remCard([m.hit], 'Reminder'), []);
    }
    var left = openReminders().length;
    var tail = left ? (' ' + left + ' left.') : ' That\'s everything.';
    return reply(
      'Done — ' + m.hit.text + '.' + tail,
      [
        { label: 'What\'s left?', send: 'What are my reminders?' },
        { label: 'What\'s next?', send: 'What\'s next today?' }
      ],
      remCard(openReminders(), 'Reminders'),
      ['Completed reminder']
    );
  }

  /* --- reminder.snooze ---------------------------------------------- */

  function hReminderSnooze(text, parsed) {
    var open = openReminders();
    if (!open.length) {
      return reply('Nothing to push — the list is empty.',
        [{ label: 'Add one', send: 'Remind me to ' }], null, []);
    }

    var minutes = 20;
    var e = ents(parsed);
    var mm = low(text).match(/(\d+)\s*(min|mins|minute|minutes|hour|hours|hr|hrs|day|days)/);
    if (mm) {
      var n = parseInt(mm[1], 10);
      if (/hour|hr/.test(mm[2])) minutes = n * 60;
      else if (/day/.test(mm[2])) minutes = n * 60 * 24;
      else minutes = n;
    } else if (e.datetime) {
      var d = toDate(e.datetime);
      if (d) minutes = Math.max(1, Math.round((d.getTime() - now().getTime()) / 60000));
    } else if (/tonight/.test(low(text))) {
      minutes = Math.max(20, Math.round((startOfDay(now()).getTime() + 20 * 3600000 - now().getTime()) / 60000));
    }

    var m = matchReminder(text, parsed);
    var target = m.hit || overdueReminders()[0] || open.sort(byDue)[0];
    if (!target) {
      return reply('I\'m not sure which one to push. Which is it?',
        open.slice(0, 3).map(function (r) { return { label: shortLabel(r.text), send: 'snooze ' + r.text }; }),
        remCard(open.slice(0, 3), 'Which one?'), []);
    }

    snoozeReminder(target, minutes);
    var until = addMinutes(now(), minutes);
    return reply(
      'Pushed — ' + target.text + ', back at ' + fmtTime(until) + '.',
      [
        { label: 'Push again', send: 'snooze ' + target.text + ' 20 minutes' },
        { label: 'Actually, done', send: 'done with ' + target.text }
      ],
      remCard([target], 'Snoozed'),
      ['Snoozed reminder']
    );
  }

  /* --- schedule.query ----------------------------------------------- */

  function schedCard(label, date, events) {
    events = arr(events);
    return {
      type: 'schedule',
      data: { label: label, date: iso(date), events: events, items: events, count: events.length }
    };
  }

  function hScheduleQuery(text, parsed) {
    var e = ents(parsed);
    var target = toDate(e.datetime);
    if (!target) {
      var g = parseWhen(text);
      if (g && g.date) target = toDate(g.date);
    }
    if (!target) target = now();

    var label = fmtDay(target);
    var evs = eventsOn(target);

    if (!evs.length) {
      var nxt = nextEvent(now());
      var txt = label + ' is clear — nothing on the calendar.';
      if (nxt && !sameDay(toDate(nxt.start), target)) {
        txt += '\nNext thing after that: ' + eventLine(nxt, true) + '.';
      }
      return reply(txt, [
        { label: 'What\'s next?', send: 'What\'s next?' },
        { label: 'My reminders', send: 'What are my reminders?' }
      ], schedCard(label, target, []), []);
    }

    var lines = [];
    var n = now();
    var isToday = sameDay(target, n);
    lines.push(isToday
      ? (evs.length === 1 ? 'One thing today:' : evs.length + ' things today:')
      : (label + ': ' + evs.length + (evs.length === 1 ? ' thing.' : ' things.')));
    evs.slice(0, 5).forEach(function (ev) { lines.push('· ' + eventLine(ev, false)); });
    if (evs.length > 5) lines.push('…and ' + (evs.length - 5) + ' more.');

    if (isToday) {
      var up = evs.filter(function (ev) { var s = toDate(ev.start); return s && s.getTime() > n.getTime(); });
      if (up.length) lines.push('\nNext up is ' + (trim(up[0].title) || 'that first one') + ', ' + fmtRelative(toDate(up[0].start)) + '.');
    }

    var chips = [{ label: 'Who\'s that with?', send: 'Who am I seeing ' + low(label) + '?' }];
    if (isToday) chips.push({ label: 'Tomorrow', send: 'What\'s on tomorrow?' });
    chips.push({ label: 'Remind me about it', send: 'Remind me to prep for ' + (trim(evs[0].title) || 'that') });

    return reply(lines.join('\n'), chips, schedCard(label, target, evs), []);
  }

  /* --- schedule.next ------------------------------------------------ */

  function hScheduleNext() {
    var ev = nextEvent(now());
    if (!ev) {
      var over = overdueReminders();
      var txt = 'Nothing else on the calendar.';
      if (over.length) txt += ' You do have ' + over.length + ' reminder' + (over.length === 1 ? '' : 's') + ' sitting past their time, though.';
      return reply(txt, [
        { label: 'My reminders', send: 'What are my reminders?' },
        { label: 'What\'s tomorrow?', send: 'What\'s on tomorrow?' }
      ], schedCard('Next', now(), []), []);
    }

    var s = toDate(ev.start);
    var who = withNames(ev);
    var lines = [];
    var lead = sameDay(s, now()) ? '' : (fmtDay(s) + ' — ');
    lines.push(lead + (trim(ev.title) || 'Next thing') + ' at ' + fmtTime(s) + ', ' + fmtRelative(s) + '.');
    var detail = [];
    if (who.length) detail.push('With ' + joinList(who) + '.');
    if (ev.location) detail.push(ev.location + '.');
    if (ev.notes) detail.push(trim(ev.notes));
    if (detail.length) lines.push(detail.join(' '));

    return reply(lines.join('\n'), [
      { label: 'Rest of the day', send: 'What\'s on today?' },
      who.length ? { label: 'Who is ' + who[0] + '?', send: 'Who is ' + who[0] + '?' } : null,
      { label: 'Remind me to prep', send: 'Remind me to prep for ' + (trim(ev.title) || 'that') }
    ], schedCard('Next', s, [ev]), []);
  }

  /* --- contact.find -------------------------------------------------- */

  function contactCard(query, cands, note) {
    var list = arr(cands).map(function (c) { return c.contact || c; });
    return {
      type: 'contact',
      data: { query: query, candidates: list, contacts: list, items: list, note: note || '' }
    };
  }

  function hContactFind(text, parsed) {
    var e = ents(parsed);
    var person = isGenericPerson(e.person) ? '' : trim(e.person);
    var extra = [e.topic, e.place].filter(Boolean).join(' ');
    var query = trim(person + ' ' + extra);

    var ranked = rankContacts(query, text);
    state.lastContacts = ranked;

    if (!ranked.length) {
      return reply(
        'I don\'t have anyone who fits that. I only know the people who\'ve come up on your phone since I started — if you tell me a name I\'ll hold onto it.',
        [
          { label: 'Who do you know?', send: 'Who do you know?' },
          { label: 'What can you do?', send: 'What can you do?' }
        ],
        contactCard(query, [], 'no match'),
        []
      );
    }

    var top = ranked[0];
    var second = ranked[1];
    var clear = !second || (top.score - second.score) >= 1.5;

    if (clear) {
      state.lastPerson = firstName(top.contact.name) || top.contact.name;
      return describeContact(top.contact, ranked.slice(0, 3), 'match', top.score < 3, !!second);
    }

    // Honest ambiguity — and remember that we asked, so "the second one" works.
    var cands = ranked.slice(0, 3);
    state.pending = { kind: 'contact.which', candidates: cands, askedAt: now().getTime() };
    var head = cands.length === 2 ? 'Two people fit. Is it one of these?' : cands.length + ' people fit. Any of these?';
    var body = cands.map(function (x) { return '· ' + contactLine(x.contact); });
    return reply(
      [head].concat(body).join('\n'),
      cands.map(function (x) { return { label: firstName(x.contact.name), send: 'Tell me about ' + x.contact.name }; }),
      contactCard(query, cands, 'ambiguous'),
      []
    );
  }

  function describeContact(c, ranked, note, hedge, hasOthers) {
    if (!c) return null;
    var lines = [];
    var head = trim(c.name);
    if (c.nickname && low(c.nickname) !== low(c.name) && low(c.nickname) !== low(firstName(c.name))) {
      head += ' — goes by ' + trim(c.nickname);
    }
    if (c.relationship) head += (head.indexOf('—') === -1 ? ' — ' : ', ') + c.relationship;
    lines.push(head + '.');
    if (c.vibe) lines.push(cap(trim(c.vibe)).replace(/[.\s]*$/, '') + '.');
    if (c.howTheyMet) {
      // howTheyMet is written as a whole sentence ("Slid into Maya's DMs after…"), so
      // prefixing "You met " produces "You met Slid into Maya's DMs". Only prefix when
      // the note reads as a place or occasion rather than a sentence about them.
      var how = trim(c.howTheyMet).replace(/[.\s]*$/, '');
      var isSentence = /^[A-Z]/.test(how) && /\s(is|was|were|had|has|does|did|slid|cut|hired|met|referred|born|taught|lives|works)\s/i.test(how);
      lines.push(isSentence ? how + '.' : 'You met ' + how + '.');
    }
    if (c.lastSeen) {
      var ls = toDate(c.lastSeen);
      if (ls) lines.push('Last time you saw them: ' + fmtRelative(ls) + '.');
    }
    if (c.notes) lines.push(trim(c.notes));

    // Anything she has told BEE about this person herself outranks the KB.
    var mine = memAbout(firstName(c.name) || c.name);
    if (mine.length) {
      lines.push('You also told me: ' + trim(mine[0].text).replace(/\.$/, '') + '.');
    }

    if (hedge) lines.push('That\'s my best read on it — say the word if it\'s the wrong person.');

    var chips = [];
    if (c.phone) chips.push({ label: 'Show number', send: 'What\'s ' + firstName(c.name) + '\'s number?' });
    chips.push({ label: 'Remind me to reach out', send: 'Remind me to message ' + firstName(c.name) + ' tomorrow' });
    if (hasOthers) chips.push({ label: 'Not them', send: 'Not ' + firstName(c.name) + ' — who else?' });

    return reply(lines.join('\n'), chips, contactCard(trim(c.name), arr(ranked), note || 'match'), []);
  }

  /* --- brand.query --------------------------------------------------- */

  function hBrandQuery(text, parsed) {
    var e = ents(parsed);
    var brands = (kb() && isArr(kb().brands)) ? kb().brands : [];
    if (!brands.length) {
      return reply('I don\'t have any brand work on file yet.',
        [{ label: 'What\'s next?', send: 'What\'s next today?' }], null, []);
    }

    var q = trim(e.brand) || trim(e.topic) || '';
    var one = q ? call(kb(), ['brandFor'], [q], null) : null;
    if (!one && q) {
      var toks = tokens(q);
      var scored = brands.map(function (b) {
        return { b: b, s: scoreText(low(b.name) + ' ' + low(b.notes), toks) };
      }).filter(function (x) { return x.s > 0; }).sort(function (a, b) { return b.s - a.s; });
      if (scored.length) one = scored[0].b;
    }

    var n = now();

    function deliverableLines(b) {
      var open = arr(b.deliverables).filter(function (d) { return d && !d.done; });
      open.sort(function (a, b2) { return (toDate(a.dueDate) || 0) - (toDate(b2.dueDate) || 0); });
      return open.map(function (d) {
        var dd = toDate(d.dueDate);
        var late = dd && dd.getTime() < n.getTime();
        return '· ' + d.what + (dd ? ' — ' + (late ? 'was due ' + fmtDay(dd) : 'due ' + fmtDay(dd)) : '');
      });
    }

    if (one) {
      var lines = [];
      var open = arr(one.deliverables).filter(function (d) { return d && !d.done; });
      var done = arr(one.deliverables).filter(function (d) { return d && d.done; });
      lines.push(one.name + ' — ' + (one.status || 'active') + (one.fee ? ', ' + one.fee : '') + '.');
      if (open.length) {
        lines.push(open.length === 1 ? 'One thing outstanding:' : open.length + ' outstanding:');
        lines = lines.concat(deliverableLines(one));
      } else {
        lines.push('Nothing outstanding — all ' + done.length + ' delivered.');
      }
      if (one.notes) lines.push(trim(one.notes));

      var chips = [];
      if (open.length) chips.push({ label: 'Remind me', send: 'Remind me to ' + open[0].what + ' tomorrow at 10am' });
      chips.push({ label: 'All brand work', send: 'What brand work is outstanding?' });
      return reply(lines.join('\n'), chips, null, []);
    }

    // Everything outstanding, across brands.
    var active = brands.filter(function (b) { return b && b.status !== 'delivered' && b.status !== 'paused'; });
    var rows = [];
    var total = 0;
    active.forEach(function (b) {
      var openD = arr(b.deliverables).filter(function (d) { return d && !d.done; });
      if (!openD.length) return;
      total += openD.length;
      openD.sort(function (a, b2) { return (toDate(a.dueDate) || 0) - (toDate(b2.dueDate) || 0); });
      var d0 = openD[0];
      var dd = toDate(d0.dueDate);
      rows.push('· ' + b.name + ' — ' + d0.what + (dd ? ', due ' + fmtDay(dd) : '') +
        (openD.length > 1 ? ' (+' + (openD.length - 1) + ' more)' : ''));
    });

    if (!rows.length) {
      return reply('Nothing outstanding on the brand side. Everything\'s delivered.',
        [{ label: 'What\'s next?', send: 'What\'s next today?' }], null, []);
    }

    var head = total + ' thing' + (total === 1 ? '' : 's') + ' outstanding across ' +
      rows.length + ' brand' + (rows.length === 1 ? '' : 's') + ':';
    return reply([head].concat(rows).join('\n'),
      [
        { label: 'Remind me about the first', send: 'Remind me to finish the ' + active[0].name + ' deliverable tomorrow at 10am' },
        { label: 'What\'s next?', send: 'What\'s next today?' }
      ], null, []);
  }

  /* ------------------------------------------------------------------ *
   * advice.priority — "what should I do today?"
   *
   * The question a personal assistant actually exists for. Reading the
   * calendar back is not an answer to it, and neither is a clarifying
   * question. Everything here is computed from what BEE already holds and
   * ranked by consequence: late and owed to another person beats not-yet-due
   * beats routine beats fixed-time. The reasoning is the value, so every
   * item carries its own "why" and the copy says it out loud.
   * ------------------------------------------------------------------ */

  var DAY_MS = 86400000;

  /* Whole calendar days apart. A deliverable due at 23:59 tonight is "today",
   * not "in 0.6 days" — the clock is the wrong unit for a deadline. */
  function daysBetween(from, to) {
    var a = startOfDay(from), b = startOfDay(to);
    return Math.round((b.getTime() - a.getTime()) / DAY_MS);
  }

  var NUM_WORD = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven',
    'eight', 'nine', 'ten'];

  function spell(n) {
    n = Math.abs(Math.round(n));
    return n < NUM_WORD.length ? NUM_WORD[n] : String(n);
  }

  function daysAgoPhrase(n) {
    if (n <= 0) return 'earlier today';
    if (n === 1) return 'yesterday';
    return spell(n) + ' days ago';
  }

  /* "due Sunday" reads better than "due Sun 16 Aug" inside a sentence. */
  function dueWords(days, d) {
    if (days < 0) return 'was due ' + daysAgoPhrase(-days);
    if (days === 0) return 'due today';
    if (days === 1) return 'due tomorrow';
    if (days <= 6) return 'due ' + DAY_NAMES[d.getDay()];
    return 'due ' + fmtDay(d);
  }

  function whenWords(days, d) {
    if (days === 0) return 'today at ' + fmtTime(d);
    if (days === 1) return 'tomorrow at ' + fmtTime(d);
    if (days <= 6) return DAY_NAMES[d.getDay()] + ' at ' + fmtTime(d);
    return fmtDay(d) + ' at ' + fmtTime(d);
  }

  /* "1 long-form GRWM featuring the Rewind serum" -> "long-form GRWM".
   * A deliverable line in a contract is not a sentence; trim it to the thing. */
  function deliverableCore(what) {
    var s = trim(what);
    if (!s) return '';
    s = s.replace(/^1\s+(?=[A-Za-z])/, '');
    s = s.split(/\s+(?:featuring|using|with|for|from|about)\s+/i)[0];
    s = s.split(/\s*[:(]/)[0];
    s = trim(s).replace(/[\s,;.]+$/, '');
    if (s.length > 54) s = trim(s.slice(0, 54)).replace(/\s+\S*$/, '') + '…';
    return trim(s);
  }

  function deliverablePhrase(brandName, what) {
    var core = deliverableCore(what);
    var b = trim(brandName);
    if (!core) return b ? 'the ' + b + ' deliverable' : 'that deliverable';
    if (/^\d/.test(core)) return core + (b ? ' for ' + b : '');
    return (b ? 'the ' + b + ' ' : 'the ') + deCap(core);
  }

  function contactNameById(id) {
    if (!id) return '';
    var contacts = (kb() && isArr(kb().contacts)) ? kb().contacts : [];
    for (var i = 0; i < contacts.length; i++) {
      if (contacts[i] && contacts[i].id === id) {
        return firstName(contacts[i].name) || trim(contacts[i].name);
      }
    }
    return '';
  }

  /* A routine that hands something to a named person is an obligation, not a
   * habit. If it slips, it slips for them too — that's what makes it rank. */
  /* Deliberately case-sensitive on the name: "to Tomás" is an obligation,
   * "to bed" is not. The verbs carry both cases instead of an /i flag. */
  var OBLIGATION_RE =
    /\b(?:[Ss]ends?|[Dd]elivers?|[Dd]rops?\s+off|[Gg]ives?|[Ss]ubmits?|[Hh]ands?\s+(?:off|over))\s+(?:the\s+|her\s+|his\s+|my\s+)?([\w'’-]+(?:\s+[\w'’-]+){0,2}?)\s+(?:off\s+to|over\s+to|to)\s+([A-Z][\wÀ-ÿ'’-]+)/;

  function nextRoutineDate(r) {
    var days = arr(r && r.days).filter(function (d) {
      return typeof d === 'number' && d >= 0 && d <= 6;
    });
    if (!days.length) return null;
    var m = trim(r && r.time).match(/^(\d{1,2}):(\d{2})/);
    var hh = m ? parseInt(m[1], 10) : 9;
    var mm = m ? parseInt(m[2], 10) : 0;
    if (isNaN(hh)) hh = 9;
    if (isNaN(mm)) mm = 0;
    var n = now();
    for (var i = 0; i < 8; i++) {
      var d = new Date(startOfDay(n).getTime() + i * DAY_MS);
      d.setHours(hh, mm, 0, 0);
      if (days.indexOf(d.getDay()) === -1) continue;
      if (d.getTime() <= n.getTime()) continue;
      return d;
    }
    return null;
  }

  /* "Sable & Ash — sample pickup" -> "Sable & Ash sample pickup", without
   * eating the hyphen out of "drop-off". */
  function cleanTitle(s) {
    return trim(String(s || '').replace(/\s+[—–-]\s+/g, ' ')).replace(/\s{2,}/g, ' ');
  }

  /* Signed, paid work outranks an unanswered pitch or a deal the brand has
   * put on ice. Same date, different consequence. */
  function statusWeight(status) {
    if (status === 'pitched') return -6;
    if (status === 'paused') return -4;
    if (status === 'delivered') return -8;
    return 6;                                   // active, or unlabelled
  }

  /* Everything BEE could reasonably think she should be doing, scored. */
  function gatherPriorities() {
    var out = [];
    var n = now();
    var k = kb();

    /* 1. Brand deliverables — the only work here with someone else's name on it. */
    var brands = (k && isArr(k.brands)) ? k.brands : [];
    brands.forEach(function (b) {
      if (!b) return;
      var status = low(b.status);
      var owedTo = contactNameById(b.contactId);
      arr(b.deliverables).forEach(function (d) {
        if (!d || d.done) return;
        var phrase = deliverablePhrase(b.name, d.what);
        var label = trim(b.name) + ' — ' + (deliverableCore(d.what) || trim(d.what));
        var due = toDate(d.dueDate);

        var w = statusWeight(status);

        if (!due) {
          out.push({
            kind: 'deliverable', severity: 'open', score: 30 + w,
            what: label, phrase: phrase, when: 'no date on it',
            why: 'Still open for ' + trim(b.name) + ', with no date on it — which is usually how a thing gets forgotten.',
            due: null, owedTo: owedTo, status: status, id: b.id
          });
          return;
        }

        var dd = daysBetween(n, due);
        if (due.getTime() < n.getTime()) {
          var late = Math.max(0, -dd);
          out.push({
            kind: 'deliverable', severity: 'late', score: 120 + Math.min(late, 40) + w,
            what: label, phrase: phrase, when: 'was due ' + daysAgoPhrase(late),
            why: (owedTo ? owedTo + ' is on the other end of it, and it\'s already past.'
              : 'It\'s owed to a brand, and it\'s already past.') +
              ' Late and owed to someone else is the worst combination on this list.',
            due: due, lateDays: late, owedTo: owedTo, status: status, id: b.id
          });
          return;
        }

        if (dd > 21) return;                       // too far out to be today's problem
        out.push({
          kind: 'deliverable', severity: dd === 0 ? 'today' : 'soon',
          score: (dd === 0 ? 82 : (74 - Math.min(dd, 21) * 2)) + w,
          what: label, phrase: phrase, when: dueWords(dd, due),
          why: (dd === 0 ? 'It lands tonight and it isn\'t marked done. '
            : (status === 'pitched' ? 'It\'s a pitch, not signed work, so it costs you least if it moves. '
              : (status === 'paused' ? 'That deal is paused on their side, so it may not be as urgent as the date. ' : ''))) +
            (owedTo ? owedTo + ' is the one waiting on it.' : 'Nobody\'s chasing you for it yet.'),
          due: due, daysOut: dd, owedTo: owedTo, status: status, id: b.id
        });
      });
    });

    /* 2. Her own reminders. Overdue first, then anything landing this week. */
    overdueReminders().forEach(function (r, i) {
      if (!r || !trim(r.text)) return;
      var due = toDate(r.due);
      var late = due ? Math.max(0, -daysBetween(n, due)) : 0;
      out.push({
        kind: 'reminder', severity: 'late', score: 95 + Math.min(late, 20) - i * 0.1,
        what: cap(trim(r.text)), phrase: deCap(trim(r.text)),
        when: due ? (late >= 1 ? 'was due ' + daysAgoPhrase(late) : 'was due ' + fmtRelative(due)) : 'has no time on it',
        why: 'You asked me to hold that one, and its time has already gone.',
        due: due, id: r.id
      });
    });

    upcomingReminders().forEach(function (r, i) {
      if (!r || !trim(r.text)) return;
      var due = toDate(r.due);
      if (!due) return;
      var dd = daysBetween(n, due);
      if (dd > 7) return;
      out.push({
        kind: 'reminder', severity: dd === 0 ? 'today' : 'soon',
        score: (dd === 0 ? 78 : 62 - dd * 4) - i * 0.1,
        what: cap(trim(r.text)), phrase: deCap(trim(r.text)),
        when: dd === 0 ? 'due at ' + fmtTime(due) : dueWords(dd, due),
        why: dd === 0 ? 'It\'s on your own list for today.' : 'You put that one on the list yourself.',
        due: due, id: r.id
      });
    });

    openReminders().forEach(function (r) {
      if (!r || !trim(r.text) || r.due) return;
      out.push({
        kind: 'reminder', severity: 'open', score: 26,
        what: cap(trim(r.text)), phrase: deCap(trim(r.text)), when: 'no time set',
        why: 'Sitting on your list with no date, which is usually how things get lost.',
        due: null, id: r.id
      });
    });

    /* 3. Standing hand-offs to other people, from the routines BEE has noticed. */
    var routines = (k && isArr(k.routines)) ? k.routines : [];
    routines.forEach(function (r) {
      if (!r || !trim(r.label)) return;
      var m = OBLIGATION_RE.exec(trim(r.label));
      if (!m) return;
      var thing = trim(m[1]);
      var who = trim(m[2]);
      var when = nextRoutineDate(r);
      if (!when || !thing || !who) return;
      var dd = daysBetween(n, when);
      if (dd > 7) return;
      var soft = typeof r.confidence === 'number' && r.confidence < 0.7;
      out.push({
        kind: 'obligation', severity: 'standing', score: 58 - dd * 3,
        what: cap(thing) + ' to ' + who,
        phrase: thing + ' to ' + who,
        when: whenWords(dd, when).replace(' at 12:00 PM', ' around noon'),
        why: 'It\'s a hand-off — if it slips, it slips for them too, not just you.' +
          (soft ? ' I\'ve only seen that pattern a handful of times, so treat the timing as a guess.' : ''),
        due: when, person: who, id: r.id
      });
    });

    /* 4. What's actually pinned to the clock today. */
    var todays = eventsOn(n).filter(function (e) {
      var s = toDate(e && e.start);
      return s && s.getTime() >= n.getTime();
    });
    var plan = null;
    try { plan = departurePlan(); } catch (e) { plan = null; }
    todays.forEach(function (ev, i) {
      var s = toDate(ev.start);
      var leaving = plan && plan.event && plan.event === ev;
      out.push({
        kind: 'event', severity: 'fixed', score: (leaving ? 46 : 34) - i * 2,
        what: cleanTitle(ev.title) || 'Something on the calendar',
        phrase: cleanTitle(ev.title) || 'that',
        when: 'at ' + fmtTime(s),
        why: leaving ? 'Fixed time, and you\'d need to leave by ' + fmtTime(plan.leaveAt) + ' to make it.'
          : (trim(ev.location) ? 'Fixed time, and it\'s at ' + trim(ev.location) + '.'
            : 'Fixed time — nothing to decide, just be there.'),
        due: s, id: ev.id, event: ev
      });
    });

    out.sort(function (a, b) { return b.score - a.score; });
    return out;
  }

  function countBy(items, fn) {
    var c = 0;
    arr(items).forEach(function (x) { if (fn(x)) c++; });
    return c;
  }

  /* The one-sentence recommendation. It always commits. */
  function priorityLead(top, items) {
    var lateCount = countBy(items, function (x) { return x.severity === 'late'; });
    var owedCount = countBy(items, function (x) {
      return (x.kind === 'deliverable' || x.kind === 'obligation') && x.severity !== 'fixed';
    });

    if (top.kind === 'deliverable' && top.severity === 'late') {
      var s = 'Honestly? ' + cap(top.phrase) + '. It ' + top.when +
        (lateCount === 1
          ? ', and it\'s the only thing here that\'s actually late.'
          : ', and of the ' + spell(lateCount) + ' things past their date it\'s the furthest gone.');
      if (top.status === 'paused' || top.status === 'pitched') {
        s += ' Their side is ' + (top.status === 'paused' ? 'paused' : 'still unsigned') +
          ', so it may not be as loud as the date makes it look' +
          (top.owedTo ? ' — one message to ' + top.owedTo + ' settles whether it still lands.' : '.');
      } else if (top.owedTo) {
        s += ' ' + top.owedTo + ' is waiting on it.';
      }
      return s;
    }

    if (top.kind === 'reminder' && top.severity === 'late') {
      return 'Honestly? ' + cap(top.phrase) + '. It ' + top.when +
        ', and it\'s the oldest thing you asked me to hold.' +
        (lateCount > 1 ? ' It\'s not the only one past its time, but it\'s the one I\'d clear first.' : '');
    }

    if (top.kind === 'deliverable') {
      return 'Start with ' + top.phrase + '. It\'s ' + top.when +
        (owedCount === 1 ? ', and it\'s the only thing on here someone else is waiting on.'
          : (top.owedTo ? ', and ' + top.owedTo + ' is the one waiting.' : ', and it\'s the closest real deadline you have.')) +
        ' Nothing\'s actually late yet, which is worth keeping true.';
    }

    if (top.kind === 'obligation') {
      return 'Start with ' + top.phrase + '. ' + top.person + ' needs it ' + top.when +
        ', and it\'s the only thing here that holds someone else up.';
    }

    if (top.kind === 'reminder') {
      return 'Do ' + top.phrase + ' first — it\'s ' + top.when +
        ', and nothing else on here has a real deadline against it.';
    }

    // Only fixed calendar time left.
    return 'Nothing\'s late and nothing\'s due, so the honest answer is: be ready for ' +
      top.phrase + ' ' + top.when + '. ' + top.why;
  }

  /* Three rows of the same brand table is a report, not advice. Prefer a
   * different kind of thing for each runner-up, then fill by score. */
  function pickRunners(pool, want, lead) {
    var out = [];
    var seenKind = {}, seenId = {};
    if (lead) { seenKind[lead.kind] = 1; seenId[lead.kind + ':' + lead.id] = 1; }

    function key(it) { return it.kind + ':' + (it.id || it.what); }

    pool.forEach(function (it) {
      if (out.length >= want) return;
      if (seenKind[it.kind] || seenId[key(it)]) return;
      out.push(it);
      seenKind[it.kind] = 1;
      seenId[key(it)] = 1;
    });
    pool.forEach(function (it) {
      if (out.length >= want) return;
      if (seenId[key(it)] || out.indexOf(it) !== -1) return;
      out.push(it);
      seenId[key(it)] = 1;
    });
    out.sort(function (a, b) { return b.score - a.score; });
    return out;
  }

  /* The runners-up, each carrying the reason it ranks where it does. */
  function priorityRunners(rest) {
    if (!rest.length) return '';
    var lines = ['After that:'];
    rest.forEach(function (it) {
      lines.push('· ' + cap(it.phrase) + ' — ' + it.when + '. ' + trim(it.why));
    });
    return lines.join('\n');
  }

  function priorityTodayLine(events, plan) {
    if (!events.length) {
      return 'Today itself is empty — nothing fixed on the calendar, so the time is yours.';
    }
    var bits = events.slice(0, 3).map(function (it) {
      return it.phrase + ' ' + it.when;
    });
    var line;
    if (events.length === 1) {
      line = 'Today itself is light — ' + bits[0] + ' is the only fixed thing.';
    } else {
      line = 'Today itself: ' + joinList(bits, 'and') + '.';
      if (events.length > 3) line = line.replace(/\.$/, ', plus ' + (events.length - 3) + ' more.');
    }
    if (plan) {
      line += plan.leaveIn <= 0
        ? ' Which means leaving about now to make the ' +
          fmtTime(plan.start).replace(/:00(?=\s?[AP]M)/, '').replace(/\s?[AP]M$/, '') +
          ' — flat travel estimate, no live traffic.'
        : ' You\'d want to be out of the door by ' + fmtTime(plan.leaveAt) + ' for that one.';
    }
    return line;
  }

  function priorityChips(top) {
    var chips = [];
    if (top && (top.kind === 'deliverable' || top.kind === 'obligation')) {
      chips.push({ label: 'Remind me about it', send: 'Remind me to finish ' + top.phrase + ' tomorrow at 10am' });
    } else if (top && top.kind === 'reminder') {
      chips.push({ label: 'Mark it done', send: 'done with ' + top.what });
    }
    chips.push({ label: 'What\'s outstanding?', send: 'What brand work is outstanding?' });
    chips.push({ label: 'What\'s on today?', send: 'What\'s on today?' });
    return chips;
  }

  function priorityEmpty() {
    var hasKB = !!(kb() && (arr(kb().calendar).length || arr(kb().brands).length));
    if (hasKB) {
      return reply(
        'Genuinely nothing pressing. Nothing late, nothing due in the next few days, and your list is clear.\n' +
        'That\'s not me missing something — it\'s a rare clean day. I\'d spend it on the thing you keep putting off, ' +
        'or on nothing at all.',
        [
          { label: 'What\'s on today?', send: 'What\'s on today?' },
          { label: 'What\'s outstanding?', send: 'What brand work is outstanding?' }
        ],
        null, []
      );
    }
    return reply(
      'I\'ll be straight with you: I have nothing to go on yet. No calendar, no deadlines, nothing on your list — ' +
      'so anything I picked would be me guessing at your life.\n' +
      'Tell me one thing that\'s hanging over you and I\'ll hold it. From there I can actually rank them.',
      [
        { label: 'Hold something for me', send: 'Remind me to ' },
        { label: 'What can you do?', send: 'What can you do?' }
      ],
      null, []
    );
  }

  function hPriority(text, parsed) {
    var items = [];
    try { items = gatherPriorities(); } catch (e) { items = []; }
    if (!items.length) return priorityEmpty();

    var events = items.filter(function (x) { return x.severity === 'fixed'; });
    var work = items.filter(function (x) { return x.severity !== 'fixed'; });

    var plan = null;
    try { plan = departurePlan(); } catch (e) { plan = null; }

    // Nothing but calendar time left is still an answer — just a warmer one.
    if (!work.length) {
      var only = events[0];
      var lines = [
        'Nothing\'s late and nothing\'s due, so today isn\'t about catching up. ' +
        'The useful thing is being ready for ' + only.phrase + ' ' + only.when + '.',
        priorityTodayLine(events, plan)
      ];
      return reply(lines.join('\n\n'), priorityChips(only), schedCard('Today', now(), events.map(function (e) { return e.event; })), []);
    }

    var top = work[0];
    var rest = pickRunners(work.slice(1), 2, top);
    var out = [priorityLead(top, work)];

    var runners = priorityRunners(rest);
    if (runners) out.push(runners);

    out.push(priorityTodayLine(events, plan));

    // Honest about a thin picture rather than dressing it up as a plan.
    if (work.length === 1 && !events.length) {
      out.push('That\'s the whole picture I have, which is thin — if something bigger is hanging over you, tell me and I\'ll hold it.');
    }

    return reply(
      out.join('\n\n'),
      priorityChips(top),
      events.length ? schedCard('Today', now(), events.map(function (e) { return e.event; })) : null,
      []
    );
  }

  /* --- memory.recall / forget ---------------------------------------- */

  function memCard(items, note) {
    items = arr(items);
    return { type: 'memory', data: { items: items, memories: items, note: note || '', count: items.length } };
  }

  function hMemoryRecall(text, parsed) {
    var e = ents(parsed);
    var topic = trim(e.topic) || trim(e.person);
    var general = !topic && /(about me|know about|noticed|remember|memor|patterns?|learn(ed)? about)/i.test(text);
    var q = general ? '' : (topic || text);

    var hits = memoryRecall(q);
    var narrowed = !general && !!q;

    if (!hits.length && narrowed) {
      // Observed memory has nothing — but the knowledge base very often does.
      // Dumping four unrelated memories is the worst of both: not an answer,
      // and it buries the fact that BEE didn't have one.
      var fromKB = null;
      try { fromKB = answerFromKB(text, parsed); } catch (e0) { fromKB = null; }
      if (fromKB) return fromKB;

      hits = memoryRecall('');           // fall back to everything, honestly framed
      if (hits.length) {
        var lines0 = ['Nothing specifically on that. Here\'s what I do have:'];
        hits.slice(0, 4).forEach(function (m) { lines0.push('· ' + trim(m.text)); });
        return reply(lines0.join('\n'),
          [{ label: 'Forget one', send: 'Forget that ' + shortLabel(hits[0].text) },
          { label: 'What do you store?', send: 'What do you store about me?' }],
          memCard(hits, 'fallback'), [], true);
      }
    }

    if (!hits.length) {
      return reply(
        'Nothing yet. I only keep what I\'ve actually seen you do a few times — I don\'t fill in blanks.',
        [
          { label: 'What can you do?', send: 'What can you do?' },
          { label: 'What do you store?', send: 'What do you store about me?' }
        ],
        memCard([], 'empty'),
        []
      );
    }

    var lines = [];
    lines.push(hits.length === 1 ? 'Here\'s what I have:' : 'A few things I\'ve noticed:');
    hits.slice(0, 4).forEach(function (m) {
      var conf = (typeof m.confidence === 'number') ? m.confidence : null;
      var hedge = '';
      if (conf !== null && conf < 0.5) hedge = ' (still a guess)';
      else if (conf !== null && conf < 0.75) hedge = ' (fairly sure)';
      lines.push('· ' + clip(trim(m.text), 130) + hedge);
    });
    var lowest = hits.reduce(function (acc, m) {
      return (typeof m.confidence === 'number' && m.confidence < acc) ? m.confidence : acc;
    }, 1);
    if (lowest < 0.6) lines.push('\nI\'ve only been watching a few weeks, so some of that is a guess.');

    return reply(lines.join('\n'),
      [
        { label: 'Forget the first one', send: 'Forget that ' + shortLabel(hits[0].text) },
        { label: 'What else?', send: 'What else have you noticed?' }
      ],
      memCard(hits, 'recall'), []);
  }

  function hMemoryForget(text, parsed) {
    var e = ents(parsed);

    // "forget about Sara" / "forget everything about my sister" / "forget what
    // you know about Sara" — a subject-scoped wipe, not a single item.
    var scoped = trim(text).match(/\bforget\s+(?:everything|all|anything|what)?\s*(?:you\s+(?:know|have|remember)\s+)?about\s+(.+)$/i);
    if (scoped) {
      var subject = trim(scoped[1]).replace(/[.?!]+$/, '').replace(/^(that|the|my)\s+/i, '');
      if (subject && subject.split(/\s+/).length <= 4) {
        var about = memAbout(subject);
        if (!about.length) {
          return reply('I don\'t have anything on ' + subject + ', so there\'s nothing to drop.',
            [{ label: 'What do you have?', send: 'What have you noticed about me?' }], memCard([], 'empty'), []);
        }
        if (about.length === 1) {
          var gone = memForgetAbout(subject);
          return reply(
            gone
              ? ('Dropped — "' + trim(about[0].text).replace(/\.$/, '') + '". Gone from this phone, not archived anywhere.')
              : 'I couldn\'t drop that from here — you can delete it on the Memory screen, and it\'ll go for good.',
            [{ label: 'What else do you have?', send: 'What have you noticed about me?' }],
            memCard(memRecall(''), gone ? 'forgot' : 'manual'),
            gone ? ['Forgot a memory'] : []);
        }
        state.pending = { kind: 'forget.confirm', subject: subject, askedAt: now().getTime() };
        return reply(
          'I have ' + about.length + ' things on ' + subject + '. Drop all of them?',
          [{ label: 'Yes, all of it', send: 'yes' }, { label: 'Never mind', send: 'never mind' }],
          memCard(about, 'which'), []);
      }
    }

    var q = trim(e.topic) || stripLead(text).replace(/^forget\s+(that\s+)?/i, '');
    var hits = memRecall(q);

    if (!hits.length) {
      return reply('I don\'t have anything matching that, so there\'s nothing to drop.',
        [{ label: 'What do you have?', send: 'What have you noticed about me?' }], memCard([], 'empty'), []);
    }
    if (hits.length > 1 && trim(q)) {
      var s0 = scoreText(low(hits[0].text), tokens(q));
      var s1 = scoreText(low(hits[1].text), tokens(q));
      if (s1 >= s0) {
        return reply('Which one should I drop?',
          hits.slice(0, 3).map(function (m) { return { label: shortLabel(m.text), send: 'Forget that ' + m.text }; }),
          memCard(hits.slice(0, 3), 'which'), []);
      }
    }

    var target = hits[0];
    var ok = memoryForget(target);
    if (!ok) {
      return reply(
        'I couldn\'t drop that from here — you can delete it on the BEE screen, and it\'ll go for good.',
        [{ label: 'Open memories', send: 'Show what you remember' }],
        memCard([target], 'manual'), []);
    }
    return reply(
      'Dropped — "' + trim(target.text) + '". Gone from this phone, not archived anywhere.',
      [
        { label: 'What else do you have?', send: 'What have you noticed about me?' },
        { label: 'What do you store?', send: 'What do you store about me?' }
      ],
      memCard(memoryRecall(''), 'forgot'),
      ['Forgot a memory']);
  }

  function momentCard(items, query) {

  function hPhotoRecall(text, parsed) {

      if (ok !== null && ok !== undefined) {

      }

    return reply(
      'Snap it in Moments and type the note there — whatever you write is what I go by. My own guess only ever shows up labelled as a guess.',
      [
        { label: 'Open moments', send: 'Show my moments' },
        { label: 'Find an old one', send: 'Find the photo of ' }

      momentCard(last ? [last] : [], note), []);
  }
