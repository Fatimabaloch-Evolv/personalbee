      return compact(out);
    }

    /* a person I already know, spoken about by name: "Sara works at Google" */
    m = c.match(rx('^(' + NAME_RE + ")(?:'s)?\\s+(is|was|works|lives|likes|loves|hates|prefers|has|studies|teaches|moved|birthday|number|email)\\b\\s*(.*)$"));
    if (m && !isPronoun(m[1])) {
      var known = subjectInText(m[1]);
      if (known) {
        out.push(mkFact({
          kind: 'person', subject: known, label: labelFor(known), relation: relationFor(known),
          slot: verbSlot(m[2] + ' ' + m[3]), tags: words(m[3]),
          text: (labelFor(known) || titleName(known)) + ' ' + m[2] + (m[3] ? ' ' + m[3] : '')
        }));
        return compact(out);
      }
    }

    /* --- identity --------------------------------------------------------- */

    m = c.match(rx("\\b(?:my name is|my name's|call me|i go by|people call me|everyone calls me)\\s+(" + NAME_RE + '(?:\\s+' + NAME_RE + ')?)'));
    if (m) {
      out.push(mkFact({ kind: 'fact', subject: 'you', slot: 'name', tags: ['name'],
        text: 'Your name is ' + titleName(m[1]) }));
      return compact(out);
    }

    m = c.match(/\bi work (?:at|for)\s+(.+)$/i);
    if (m) {
      out.push(mkFact({ kind: 'fact', subject: 'work', slot: 'employer',
        tags: ['work', 'job', 'company', 'employer'],
        text: 'You work at ' + tidyName(m[1]) }));
      return compact(out);
    }

    m = c.match(/\bi(?:'m| am)?\s*(?:work|working) as (?:an?\s+)?(.+)$/i);
    if (m) {
      out.push(mkFact({ kind: 'fact', subject: 'work', slot: 'occupation', tags: ['work', 'job', 'role'],
        text: 'You work as ' + article(m[1]) + stripEnd(m[1]) }));
      return compact(out);
    }

    m = c.match(/\bi(?:'m| am) allergic to\s+(.+)$/i);
    if (m) {
      out.push(mkFact({ kind: 'fact', subject: 'health', slot: 'allergy',
        tags: ['allergy', 'allergic', 'allergies', 'health', 'medical'].concat(words(m[1])),
        confidence: 0.9,
        text: "You're allergic to " + stripEnd(m[1]) }));
      return compact(out);
    }

    m = c.match(/\bi(?:'m| am|'ve got| have got| have)\s+(asthma|diabetes|adhd|dyslexia|coeliac|celiac|migraines?|eczema|anxiety|high blood pressure)\b/i);
    if (m) {
      out.push(mkFact({ kind: 'fact', subject: 'health', slot: 'condition',
        tags: ['health', 'medical', 'condition'].concat(words(m[1])),
        text: 'You have ' + stripEnd(m[1]) }));
      return compact(out);
    }

    m = c.match(/\bi (?:live|stay)\s+in\s+(.+)$/i) || c.match(/\bi(?:'m| am) based in\s+(.+)$/i);
    if (m) {
      out.push(mkFact({ kind: 'fact', subject: 'home', slot: 'location',
        tags: ['home', 'live', 'city', 'location', 'address', 'based'],
        text: 'You live in ' + tidyName(m[1]) }));
      return compact(out);
    }

    m = c.match(/\bi(?:'ve| have)?\s*(?:just\s+)?moved to\s+(.+)$/i);
    if (m) {
      out.push(mkFact({ kind: 'fact', subject: 'home', slot: 'location',
        tags: ['home', 'live', 'city', 'location', 'moved'],
        text: 'You live in ' + tidyName(m[1]) + ' now' }));
      return compact(out);
    }

    m = c.match(/\bi(?:'m| am) from\s+(.+)$/i);
    if (m) {
      out.push(mkFact({ kind: 'fact', subject: 'home', slot: 'origin',
        tags: ['home', 'from', 'origin', 'city'],
        text: "You're from " + tidyName(m[1]) }));
      return compact(out);
    }

    /* --- preferences ------------------------------------------------------ */

    m = c.match(/\bi(?:'m| am)\s+(vegetarian|vegan|pescatarian|gluten[- ]free|dairy[- ]free|lactose intolerant|teetotal|sober|left[- ]handed|right[- ]handed)\b/i);
    if (m) {
      out.push(mkFact({ kind: 'preference', subject: 'you', slot: 'diet',
        tags: ['food', 'diet', 'eat'].concat(words(m[1])),
        text: "You're " + relWord(m[1]) }));
      return compact(out);
    }

    m = c.match(/\bi(?:'m| am)\s+(?:an?\s+)?(morning person|night owl|introvert|extrovert|early riser|homebody)\b/i);
    if (m) {
      out.push(mkFact({ kind: 'preference', subject: 'you', slot: 'temperament', tags: words(m[1]),
        text: "You're " + article(m[1]) + relWord(m[1]) }));
      return compact(out);
    }

    m = c.match(/\bi (?:take|drink|have|like)\s+my\s+(coffee|tea|eggs|steak|matcha|toast)\s+(.+)$/i);
    if (m) {
      out.push(mkFact({ kind: 'preference', subject: relWord(m[1]), slot: 'value',
        tags: [relWord(m[1])].concat(words(m[2])),
        text: 'You take your ' + relWord(m[1]) + ' ' + stripEnd(m[2]) }));
      return compact(out);
    }

    m = c.match(/\bi (?:really |absolutely |kind of |kinda |genuinely )?(love|like|enjoy|adore|prefer)\s+(.+)$/i);
    if (m) {
      var pos = relWord(m[1]), pobj = flipPerson(stripEnd(m[2]));
      out.push(mkFact({ kind: 'preference', subject: topicOf(m[2]), slot: 'gen', tags: words(m[2]),
        text: 'You ' + pos + ' ' + pobj }));
      return compact(out);
    }

    m = c.match(/\bi(?:'m| am) (?:really |quite )?(?:obsessed with|into)\s+(.+)$/i);
    if (m) {
      out.push(mkFact({ kind: 'preference', subject: topicOf(m[1]), slot: 'gen', tags: words(m[1]),
        text: "You're into " + flipPerson(stripEnd(m[1])) }));
      return compact(out);
    }

    m = c.match(/\bi (?:really |absolutely )?(hate|dislike|loathe|can't stand|cannot stand|cant stand|avoid)\s+(.+)$/i);
    if (m) {
      var neg = relWord(m[1]).replace(/^cant stand$/, "can't stand").replace(/^cannot stand$/, "can't stand");
      if (neg === 'dislike') neg = "don't like";
      if (neg === 'loathe') neg = 'hate';
      out.push(mkFact({ kind: 'preference', subject: topicOf(m[2]), slot: 'gen', tags: words(m[2]),
        text: 'You ' + neg + ' ' + flipPerson(stripEnd(m[2])) }));
      return compact(out);
    }

    m = c.match(/\bi (?:don't|dont|do not|never)\s+(like|enjoy|eat|drink|use|do|watch|wear|take)\s+(.+)$/i);
    if (m) {
      out.push(mkFact({ kind: 'preference', subject: topicOf(m[2]), slot: 'gen', tags: words(m[2]),
        text: "You don't " + relWord(m[1]) + ' ' + flipPerson(stripEnd(m[2])) }));
      return compact(out);
    }

    m = c.match(/\bi(?:'d| would)? ?(?:'d )?rather\s+(.+)$/i);
    if (m) {
      out.push(mkFact({ kind: 'preference', subject: topicOf(m[1]), slot: 'gen', tags: words(m[1]),
        text: "You'd rather " + flipPerson(stripEnd(m[1])) }));
      return compact(out);
    }

    /* --- routines ---------------------------------------------------------- */

    m = c.match(rx('\\bi (?:usually |normally |always |often )?(go to|go|hit|attend|do|have|take|start|finish|train at)\\s+(.+?)\\s+(?:on|every)\\s+(' + DAY_RE + ')\\b'));
    if (m) {
      out.push(mkFact({ kind: 'routine', subject: topicOf(m[2]), slot: 'gen',
        tags: words(m[2]).concat([norm(dayPlural(m[3]))]),
        text: 'You ' + relWord(m[1]) + ' ' + flipPerson(stripEnd(m[2])) + ' on ' + dayPlural(m[3]) }));
      return compact(out);
    }

    m = c.match(rx('\\b(?:every|each)\\s+(' + DAY_RE + '|morning|evening|night|day|weekend|week|month)\\s+i\\s+(.+)$'));
    if (m) {
      out.push(mkFact({ kind: 'routine', subject: topicOf(m[2]), slot: 'gen',
        tags: words(m[2]).concat([norm(m[1])]),
        text: 'Every ' + unitLabel(m[1]) + ' you ' + flipPerson(stripEnd(m[2])) }));
      return compact(out);
    }

    m = c.match(rx('\\bi\\s+(.+?)\\s+every\\s+(' + DAY_RE + '|morning|evening|night|day|weekend|week|month)\\b'));
    if (m) {
      out.push(mkFact({ kind: 'routine', subject: topicOf(m[1]), slot: 'gen',
        tags: words(m[1]).concat([norm(m[2])]),
        text: 'You ' + flipPerson(stripEnd(m[1])) + ' every ' + unitLabel(m[2]) }));
      return compact(out);
    }

    m = c.match(rx("\\bi(?:'m| am)\\s+(" + ADVERB_RE + ')\\s+(.+)$'));
    if (m) {
      out.push(mkFact({ kind: 'routine', subject: topicOf(m[2]), slot: 'gen', tags: words(m[2]),
        text: "You're " + relWord(m[1]) + ' ' + flipPerson(stripEnd(m[2])) }));
      return compact(out);
    }

    m = c.match(rx('\\bi\\s+(' + ADVERB_RE + ')\\s+(.+)$'));
    if (m) {
      out.push(mkFact({ kind: 'routine', subject: topicOf(m[2]), slot: 'gen', tags: words(m[2]),
        text: 'You ' + relWord(m[1]) + ' ' + flipPerson(stripEnd(m[2])) }));
      return compact(out);
    }

    m = c.match(rx('\\bi (?:go to|hit|attend|have)\\s+(.+?)\\s+(?:at|from)\\s+(\\d{1,2}(?::\\d{2})?\\s*(?:am|pm)?)\\b'));
    if (m) {
      out.push(mkFact({ kind: 'routine', subject: topicOf(m[1]), slot: 'gen', tags: words(m[1]),
        text: 'You go to ' + flipPerson(stripEnd(m[1])) + ' at ' + relWord(m[2]) }));
      return compact(out);
    }

    m = c.match(/^my (gym|standup|stand-up|class|shift|therapy|session|yoga|pilates|team meeting|stand up)\s+is\s+(.+)$/i);
    if (m) {
      out.push(mkFact({ kind: 'routine', subject: relWord(m[1]), slot: 'value',
        tags: [relWord(m[1])].concat(words(m[2])),
        text: 'Your ' + relWord(m[1]) + ' is ' + flipPerson(stripEnd(m[2])) }));
      return compact(out);
    }

    /* --- "my X is Y" ------------------------------------------------------- */

    m = c.match(rx('^my ([' + LETTER + "][" + LETTER + "' -]{1,28}?)\\s+(?:is|are)\\s+(.+)$"));
    if (m) {
      var noun = stripEnd(m[1]);                 // keep her capitalisation: "flight to Dubai"
      out.push(mkFact({ kind: 'fact', subject: norm(noun), label: null, slot: 'value',
        tags: words(noun).concat(words(m[2])),
        text: 'Your ' + noun + ' is ' + flipPerson(stripEnd(m[2])) }));
      return compact(out);
    }

    /* --- the catch-all, only when it looks durable ------------------------- */

    if (ctx.explicit || looksDurable(c)) {
      var subj = subjectInText(c);
      out.push(mkFact({
        kind: 'fact', subject: subj || 'you', relation: subj ? relationFor(subj) : null,
        slot: 'gen', tags: words(c, 8),
        text: flipPerson(c)
      }));
    }
    return compact(out);
  }

  function compact(a) {
    var out = [];
    for (var i = 0; i < a.length; i++) if (a[i]) out.push(a[i]);
    return out;
  }

  function looksDurable(c) {
    if (/^my\s+[a-z']+\s/i.test(c) && /\b(is|are|was|has|works|lives)\b/i.test(c)) return true;
    if (/\bi(?:'m| am)\s+(?:an?|the)\b/i.test(c)) return true;
    if (/\bi (live|work|own|drive|study|studied|speak|play|teach|grew up|was born|use|prefer|take|hate|love)\b/i.test(c)) return true;
    if (/\bi have (?:an?|two|three|four|five|\d+)\b/i.test(c)) return true;
    return false;
  }

  /* --- clause splitting --------------------------------------------------- */

  function clauseSplit(text) {
    var parts = String(text || '').split(/[.!;\n]+/);
    var out = [];
    for (var i = 0; i < parts.length; i++) {
      var p = tidyText(parts[i]);
      if (!p) continue;
      var subs = p.split(/\s*,?\s*\b(?:and also|and|but|also)\b\s+(?=(?:i|i'm|im|my|we|she|he|they)\b)/i);
      for (var j = 0; j < subs.length; j++) {
        var s = tidyText(subs[j]);
        if (s) out.push(s);
      }
    }
    return out;
  }

  function isQuestionish(s) {
    var t = tidyText(s);
    if (/\?$/.test(t)) return true;
    return /^(what|who|whose|when|where|why|how|which|do|does|did|is|are|am|was|were|can|could|will|would|should|have|has|had|any)\b/i.test(t);
  }

  /* --- storage ------------------------------------------------------------ */

  function toldItems() {
    var out = [];
    for (var i = 0; i < items.length; i++) if (items[i].source === 'told') out.push(items[i]);
    return out;
  }

  function storeTold(f, ctx) {
    var key = SINGLE_SLOTS[f.slot]
      ? f.subject + '|' + f.slot
      : f.subject + '|' + f.slot + '|' + norm(f.text).slice(0, 44);
    var id = 't:' + slug(key);
    var when = iso(ctx.at || now());
    var said = clip(ctx.raw, 140);

    var existing = byId(id);
    if (!existing) {
      var n = norm(f.text);
      var told = toldItems();
      for (var i = 0; i < told.length; i++) if (norm(told[i].text) === n) { existing = told[i]; break; }
    }

    if (existing) {
      // One message is one telling. Whoever calls learn() first wins; a second
      // pass over the same sentence must not become "you told me again".
      if (norm(existing.utterance || '') === norm(said)) {
        return { item: existing, isNew: false, corrected: false, repeat: true };
      }
      var corrected = norm(existing.text) !== norm(f.text);
      existing.text = f.text;
      existing.kind = f.kind || existing.kind;
      existing.subject = f.subject;
      if (f.label) existing.label = f.label;
      if (f.relation) existing.relation = f.relation;
      existing.tags = mergeTags(existing.tags, f.tags);
      existing.hits = (existing.hits || 1) + 1;
      existing.lastSeen = when;
      existing.statedAt = when;
      existing.saved = true;
      existing.source = 'told';
      existing.utterance = said;
      existing.confidence = clamp(Math.max(existing.confidence || 0, f.confidence || 0), 0, 0.95);
      pushEvidence(existing, (corrected ? 'You corrected this ' : 'You told me again ') + dayPhrase(when) +
        ': “' + clip(ctx.raw, 90) + '”', ctx.raw);
      return { item: existing, isNew: false, corrected: corrected };
    }

    var it = makeItem({
      id: id, kind: f.kind, text: f.text, confidence: f.confidence,
      source: 'told', saved: true,           // she said it — it does not expire
      firstSeen: when, lastSeen: when,
      evidence: ['You told me ' + dayPhrase(when) + ': “' + clip(ctx.raw, 90) + '”']
    });
    it.subject = f.subject;
    it.label = f.label || null;
    it.relation = f.relation || null;
    it.slot = f.slot;
    it.tags = f.tags || [];
    it.statedAt = when;
    it.utterance = said;
    delete meta.suppressed[id];              // telling me again overrides an old forget
    items.push(it);
    return { item: it, isNew: true, corrected: false };
  }

  function mergeTags(a, b) {
    var out = isArr(a) ? a.slice() : [];
    var add = isArr(b) ? b : [];
    for (var i = 0; i < add.length; i++) if (out.indexOf(add[i]) === -1) out.push(add[i]);
    return out.slice(0, 12);
  }

  // Evidence is keyed by the sentence it came from — one message, one line,
  // however many times something re-reads it.
  function pushEvidence(it, line, utterance) {
    if (!isArr(it.evidence)) it.evidence = [];
    var q = utterance ? norm(clip(utterance, 90)) : null;
    if (q) {
      for (var i = it.evidence.length - 1; i >= 0; i--) {
        if (norm(it.evidence[i]).indexOf(q) !== -1) it.evidence.splice(i, 1);
      }
    }
    if (it.evidence.indexOf(line) === -1) it.evidence.push(line);
    if (it.evidence.length > 6) it.evidence = it.evidence.slice(-6);
  }

  /* --- learn() ------------------------------------------------------------- */

  // The bus and the brain both hand me the same message. Learning is therefore
  // idempotent per utterance: the second caller gets the first caller's answer.
  var lastLearn = { sig: null, at: 0, payload: [] };

  function learn(text, opts) {
    opts = opts || {};
    var raw = tidyText(text);
    if (!raw || raw.length < 4) return [];

    var sig2 = norm(raw);
    if (sig2 && sig2 === lastLearn.sig && ((+now()) - lastLearn.at) < 20000) {
      return lastLearn.payload.slice();
    }

    var at = safe(function () {
      var d = opts.at ? new Date(opts.at) : now();
      return isNaN(+d) ? now() : d;
    }, now());

    var ctx = { at: at, raw: raw, last: null, explicit: false, hedged: HEDGE_RE.test(raw) };

    var body = raw;
    var mx = raw.match(EXPLICIT_RE);
    if (mx && mx.index <= 26) {
      ctx.explicit = true;
      body = tidyText(raw.slice(mx.index + mx[0].length));
    }
    if (!body) return [];

    // Requests are not facts. "Remind me to call mum" is a job, not a memory.
    if (!ctx.explicit && SKIP_RE.test(raw)) return [];
    if (ctx.explicit && /^(what|who|when|where|why|how)\b/i.test(body)) return [];

    var stored = [], seen = {};
    var cls = clauseSplit(body);

    for (var i = 0; i < cls.length; i++) {
      var cl = cls[i];
      if (!cl) continue;
      if (isQuestionish(cl) && !ctx.explicit) continue;
      if (/\?$/.test(cl)) continue;
      if (!ctx.explicit && TRANSIENT_RE.test(cl)) continue;   // that's a mood, not a fact

      var facts = safe(function () { return extractFacts(cl, ctx); }, []) || [];
      for (var j = 0; j < facts.length; j++) {
        var f = facts[j];
        if (!f || !f.text) continue;
        var k = norm(f.text);
        if (!k || seen[k]) continue;
        seen[k] = true;
        f.confidence = confidenceFor(f, ctx);
        var res = safe(function () { return storeTold(f, ctx); }, null);
        if (!res) continue;
        stored.push(res);
        ctx.last = { subject: f.subject, label: f.label, relation: f.relation };
      }
    }

    if (!stored.length) { lastLearn = { sig: sig2, at: +now(), payload: [] }; return []; }

    persistNow();
    repaint();
    var payload = [];
    for (var s = 0; s < stored.length; s++) {
      var c = clone(stored[s].item);
      c.isNew = stored[s].isNew;
      c.corrected = stored[s].corrected;
      payload.push(c);
    }
    lastLearn = { sig: sig2, at: +now(), payload: payload.slice() };
    safe(function () { bus().emit('memory:learned', { items: payload }); });
    return payload;
  }

  /* --- recall() ------------------------------------------------------------ *
   * Fuzzy over fact text, subject, tags and kind. Told facts outrank guesses.
   * ------------------------------------------------------------------------ */

  var QUERY_STOP = (' what who whose when where why how which do does did you your yours know knows ' +
    'about tell me my mine i am is are was were the a an any anything something everything remember ' +
    'recall told said say saying have has had of to and for on in at it that this we us think stuff ' +
    'thing things much ever again please just get got there here been be being can could would should ' +
    'know anymore else more most only really very so if but or as with from up out over under').split(/\s+/);
  var QSTOPSET = {};
  for (var _q = 0; _q < QUERY_STOP.length; _q++) if (QUERY_STOP[_q]) QSTOPSET[QUERY_STOP[_q]] = true;

  var SYN_GROUPS = [
    ['allergy', 'allergic', 'allergies', 'allergen'],
    ['work', 'job', 'career', 'employer', 'company', 'occupation', 'profession', 'working', 'office'],
    ['home', 'live', 'lives', 'living', 'city', 'address', 'based', 'location', 'moved'],
    ['name', 'called', 'named'],
    ['partner', 'wife', 'husband', 'spouse', 'girlfriend', 'boyfriend', 'fiance', 'fiancee'],
    ['kid', 'kids', 'child', 'children', 'daughter', 'son'],
    ['mum', 'mom', 'mother'], ['dad', 'father'],
    ['boss', 'manager', 'lead', 'supervisor'],
    ['gym', 'workout', 'exercise', 'training', 'fitness', 'pilates', 'yoga'],
    ['food', 'eat', 'eating', 'diet', 'vegetarian', 'vegan', 'meal', 'dinner', 'lunch'],
    ['coffee', 'latte', 'espresso', 'caffeine', 'matcha', 'drink', 'drinks', 'tea'],
    ['health', 'medical', 'medicine', 'doctor', 'condition'],
    ['routine', 'schedule', 'habit', 'usually', 'always', 'weekly', 'weekday'],
    ['like', 'likes', 'love', 'loves', 'prefer', 'prefers', 'favourite', 'favorite', 'preference', 'preferences'],
    ['hate', 'hates', 'dislike', 'dislikes', 'avoid'],
    ['birthday', 'born', 'bday', 'birthdate'],
    ['wifi', 'password', 'network'],
    ['phone', 'number', 'mobile', 'cell']
  ];
  var SYN_MAP = null;
  function synGroup(w) {
    if (!SYN_MAP) {
      SYN_MAP = {};
      for (var i = 0; i < SYN_GROUPS.length; i++) {
        for (var j = 0; j < SYN_GROUPS[i].length; j++) SYN_MAP[SYN_GROUPS[i][j]] = i;
      }

    return SYN_MAP.hasOwnProperty(w) ? SYN_GROUPS[SYN_MAP[w]] : null;
  }

  function stemWord(w) {
    w = String(w || '');
    if (w.length > 5 && /ies$/.test(w)) return w.slice(0, -3) + 'y';
    if (w.length > 4 && /(ing|ed)$/.test(w)) return w.replace(/(ing|ed)$/, '');
    if (w.length > 3 && /s$/.test(w) && !/ss$/.test(w)) return w.slice(0, -1);
    return w;
  }

  function contentTokens(q) {
    var toks = norm(q).split(' ');
    var out = [];
    for (var i = 0; i < toks.length; i++) {
      var w = toks[i];
      if (!w || w.length < 2 || QSTOPSET[w]) continue;
      if (out.indexOf(w) === -1) out.push(w);
    }
    return out;
  }

  function tokenHit(hay, tok) {
    if (!hay || !tok) return 0;
    var s = stemWord(tok);
    var parts = hay.split(' ');
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      if (p === tok) return 1;
      if (s.length > 3 && stemWord(p) === s) return 1;
      // Prefix overlap, but only between two real words — "a" must not match
      // "allergic", which is how you end up recalling nonsense.
      if (s.length > 4 && p.length > 3 && (p.indexOf(s) === 0 || s.indexOf(p) === 0)) return 0.7;
    }
    return 0;
  }

  var KIND_WORDS = {
    preference: 'preference', preferences: 'preference', like: 'preference', likes: 'preference',
    hate: 'preference', prefer: 'preference', favourite: 'preference', favorite: 'preference',
    person: 'person', people: 'person', who: 'person', family: 'person',
    routine: 'routine', schedule: 'routine', habit: 'routine', weekly: 'routine'
  };

  function recall(query, opts) {
    expireUnsaved();
    opts = opts || {};
    var q = tidyText(query);
    var toks = contentTokens(q);
    var nq = norm(q);
    var results = [];

    // "Where do I live" is about her; "where does Sara live" is not. If she
    // didn't name anyone, facts about her come first.
    var namesPerson = false;
    for (var n0 = 0; n0 < toks.length && !namesPerson; n0++) {
      for (var n1 = 0; n1 < items.length; n1++) {
        var pit = items[n1];
        if (pit.kind !== 'person' && !pit.relation) continue;
        if (norm(pit.subject || '') === toks[n0] || (pit.relation && norm(pit.relation) === toks[n0])) {
