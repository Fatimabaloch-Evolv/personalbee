          // asleep: two soft closed lids
          '<g class="pb-eyes-closed">' +
            '<path d="M20 36 q6 6 12 0"/><path d="M32 36 q6 6 12 0"/>' +
          '</g>' +
          // awake: big open eyes
          '<g class="pb-eyes-open">' +
            '<g class="pb-eye pb-eye-l">' +
              '<circle class="pb-eye-white" cx="25" cy="36" r="7"/>' +
              '<circle class="pb-pupil" cx="26.5" cy="37" r="3.4"/>' +
              '<circle class="pb-glint" cx="27.6" cy="35.6" r="1.1"/>' +
            '</g>' +
            '<g class="pb-eye pb-eye-r">' +
              '<circle class="pb-eye-white" cx="39" cy="36" r="7"/>' +
              '<circle class="pb-pupil" cx="40.5" cy="37" r="3.4"/>' +
              '<circle class="pb-glint" cx="41.6" cy="35.6" r="1.1"/>' +
            '</g>' +
          '</g>' +
        '</g>' +
      '</svg>';
  }

  var MIC_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
    '<rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/>' +
    '<path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round"/></svg>';

  var SEND_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
    '<path d="M12 20V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" ' +
    'stroke-linecap="round" stroke-linejoin="round"/></svg>';

  // one control to reach everything else BEE holds
  var MORE_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
    '<rect x="3.5" y="3.5" width="7" height="7" rx="2.2" fill="currentColor"/>' +
    '<rect x="13.5" y="3.5" width="7" height="7" rx="2.2" fill="currentColor" opacity=".55"/>' +
    '<rect x="3.5" y="13.5" width="7" height="7" rx="2.2" fill="currentColor" opacity=".55"/>' +
    '<rect x="13.5" y="13.5" width="7" height="7" rx="2.2" fill="currentColor" opacity=".3"/></svg>';

  var DOWN_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
    '<path d="M12 5v14M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" ' +
    'stroke-linecap="round" stroke-linejoin="round"/></svg>';

  var SKELETON = '' +
    '<header class="pb-topbar">' +
      '<button class="pb-beebtn" data-pb="beebtn" type="button" aria-label="BEE is asleep. Nothing is listening.">' +
        '<span class="pb-ring" aria-hidden="true"></span>' +
        '<span class="pb-ring pb-ring-2" aria-hidden="true"></span>' +
        '<span class="pb-beebtn-face">' + beeSvg('') + '</span>' +
        '<span class="pb-zzz" aria-hidden="true">z</span>' +
      '</button>' +
      '<div class="pb-id">' +
        '<div class="pb-id-name">BEE</div>' +
        '<div class="pb-id-sub" data-pb="sub">Asleep — nothing is listening</div>' +
      '</div>' +
      '<button class="pb-more" data-pb="more" type="button" aria-label="Everything BEE holds">' + MORE_SVG + '</button>' +
    '</header>' +
    '<div class="pb-banner" data-pb="offline" hidden>' +
      '<span class="pb-banner-dot" aria-hidden="true"></span>' +
      '<span>Offline — running entirely on this phone.</span>' +
    '</div>' +
    '<div class="pb-hotbar" data-pb="hotbar" hidden>' +
      '<span class="pb-hotdot" aria-hidden="true"></span>' +
      '<span>Listening — the mic is live</span>' +
    '</div>' +
    '<div class="pb-transcript" data-pb="transcript" role="log" aria-live="polite"></div>' +
    '<button class="pb-jump" data-pb="jump" type="button" aria-label="Jump to the latest message" hidden>' +
      DOWN_SVG +
    '</button>' +
    '<form class="pb-composer" data-pb="form" autocomplete="off">' +
      '<div class="pb-field">' +
        '<textarea class="pb-input" data-pb="input" rows="1" enterkeyhint="send" ' +
          'autocomplete="off" autocorrect="on" autocapitalize="sentences" spellcheck="true" ' +
          'placeholder="Message BEE" aria-label="Message BEE"></textarea>' +
      '</div>' +
      '<button class="pb-mic" data-pb="mic" type="button" aria-label="Talk to BEE">' + MIC_SVG + '</button>' +
      '<button class="pb-send" data-pb="send" type="submit" aria-label="Send">' + SEND_SVG + '</button>' +
    '</form>';

  /* ---------------------------------------------------------
     mount — re-entrant on purpose.
     The router empties #screen and calls mount() again every
     time she comes home, so this has to re-attach the same
     living conversation rather than build a second one.
     --------------------------------------------------------- */
  function mount(rootEl) {
    var host = (rootEl && rootEl.appendChild) ? rootEl : (document.getElementById('screen') || document.body);
    if (!host) return null;

    if (!built) build();
    if (!root) return null;

    if (root.parentNode !== host) host.appendChild(root);

    syncOffline();
    setState(curState);
    resizeInput();
    stick = true;
    scrollToEnd(false, true);
    // the viewport can still be settling (PWA chrome, rotation, late layout)
    if (window.requestAnimationFrame) window.requestAnimationFrame(function () { scrollToEnd(false, true); });
    setTimeout(function () { scrollToEnd(false, true); }, 220);

    return root;
  }

  function build() {
    root = node('div', 'pb-beeui');
    root.setAttribute('data-state', 'asleep');
    root.innerHTML = SKELETON;

    el.topbar = root.querySelector('.pb-topbar');
    el.beebtn = root.querySelector('[data-pb="beebtn"]');
    el.sub = root.querySelector('[data-pb="sub"]');
    el.more = root.querySelector('[data-pb="more"]');
    el.offline = root.querySelector('[data-pb="offline"]');
    el.hotbar = root.querySelector('[data-pb="hotbar"]');
    el.transcript = root.querySelector('[data-pb="transcript"]');
    el.jump = root.querySelector('[data-pb="jump"]');
    el.form = root.querySelector('[data-pb="form"]');
    el.input = root.querySelector('[data-pb="input"]');
    el.mic = root.querySelector('[data-pb="mic"]');
    el.send = root.querySelector('[data-pb="send"]');

    built = true;

    loadTranscript();
    renderAll();
    wire();
    syncOffline();
    setState('asleep');
    greetIfEmpty();
  }

  function wire() {
    // the bee explains itself — it is the privacy indicator, not decoration
    el.beebtn.addEventListener('click', function (e) {
      e.preventDefault();
      haptic();
      explainBee();
    });

    // the one control to everything else BEE holds
    el.more.addEventListener('click', function (e) {
      e.preventDefault();
      haptic();
      if (!goScreen('more')) toast('That part of the app isn’t wired up in this build.');
    });

    el.form.addEventListener('submit', function (e) {
      e.preventDefault();
      submitComposer();
    });

    el.input.addEventListener('input', function () { resizeInput(); syncComposer(); nudgeAwake(); });
    el.input.addEventListener('focus', function () {
      nudgeAwake();
      setTimeout(function () { scrollToEnd(true, true); }, 260);
    });
    el.input.addEventListener('keydown', function (e) {
      // Enter sends, Shift+Enter makes a new line. Never swallow an IME composition.
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
        e.preventDefault();
        submitComposer();
      }
    });

    el.mic.addEventListener('click', function (e) {
      e.preventDefault();
      haptic();
      micTap();
    });

    el.jump.addEventListener('click', function (e) {
      e.preventDefault();
      stick = true;
      scrollToEnd(true, true);
    });

    // only follow the conversation down if she was already at the bottom
    el.transcript.addEventListener('scroll', function () {
      var t = el.transcript;
      stick = (t.scrollHeight - t.scrollTop - t.clientHeight) < STICK_SLOP;
      syncJump();
    });

    // bus
    on('data:erased', function () { wipe(); });
    on('airplane:changed', function () { syncOffline(); });

    // keep the composer above the software keyboard
    if (window.visualViewport && window.visualViewport.addEventListener) {
      window.visualViewport.addEventListener('resize', syncViewport);
      window.visualViewport.addEventListener('scroll', syncViewport);
    }
    window.addEventListener('resize', function () { syncViewport(); resizeInput(); });
    window.addEventListener('orientationchange', function () {
      setTimeout(function () { syncViewport(); scrollToEnd(false, true); }, 260);
    });
  }

  function submitComposer() {
    var t = el.input.value;
    el.input.value = '';
    resizeInput();
    syncComposer();
    send(t, 'chat');
  }

  function syncComposer() {
    if (!el.form) return;
    var has = !!(el.input.value && el.input.value.trim());
    el.form.classList.toggle('has-text', has);
  }

  function resizeInput() {
    if (!el.input) return;
    el.input.style.height = 'auto';
    var h = Math.min(el.input.scrollHeight, INPUT_MAX_H);
    el.input.style.height = (h > 0 ? h : 24) + 'px';
    el.input.style.overflowY = (el.input.scrollHeight > INPUT_MAX_H) ? 'auto' : 'hidden';
  }

  function syncJump() {
    if (!el.jump) return;
    el.jump.hidden = stick;
  }

  // The keyboard covers the bottom of the window, not the layout. Lift the whole
  // conversation by exactly the amount it steals so the composer stays reachable.
  function syncViewport() {
    if (!root) return;
    var vv = window.visualViewport;
    if (!vv) return;
    var kb = Math.max(0, (window.innerHeight || 0) - vv.height - vv.offsetTop);
    if (kb > 40) {
      root.style.bottom = kb + 'px';
      root.classList.add('kb-up');
      scrollToEnd(false, true);
    } else {
      root.style.bottom = '';
      root.classList.remove('kb-up');
    }
  }

  /* ---------------------------------------------------------
     state — the honest part
     --------------------------------------------------------- */
  var SUBTITLE = {
    asleep: 'Asleep — nothing is listening',
    awake: 'Awake — nothing is recording',
    listening: 'Listening — the mic is live',
    thinking: 'Thinking…'
  };
  var ARIA = {
    asleep: 'BEE is asleep. Nothing is listening.',
    awake: 'BEE is awake. Nothing is recording.',
    listening: 'BEE is listening. The microphone is live.',
    thinking: 'BEE is thinking.'
  };
  var STATE_LINES = [
    ['asleep', '😴', 'Asleep', 'Eyes shut. Nothing is listening, nothing is being recorded.'],
    ['awake', '👀', 'Awake', 'I’m following the conversation. Still no microphone.'],
    ['listening', '🎙', 'Listening', 'The mic is live right now. You’ll see me pulse, and the bar says so.'],
    ['thinking', '💭', 'Thinking', 'I’m working on what you just said — on this phone.']
  ];

  function state() { return curState; }

  function setState(s) {
    if (STATES.indexOf(s) === -1) return curState;
    curState = s;
    if (!built) return curState;

    root.setAttribute('data-state', s);
    el.beebtn.setAttribute('aria-label', ARIA[s]);
    el.sub.textContent = SUBTITLE[s];
    if (el.hotbar) {
      var wasHot = !el.hotbar.hidden;
      el.hotbar.hidden = (s !== 'listening');
      // the bar steals height from the transcript, so follow the conversation down
      if (wasHot !== !el.hotbar.hidden) scrollToEnd(false);
    }
    if (el.mic) {
      el.mic.classList.toggle('is-hot', s === 'listening');
      el.mic.setAttribute('aria-label', s === 'listening' ? 'Stop listening' : 'Talk to BEE');
    }

    clearTimeout(sleepTimer);
    if (s === 'awake') {
      sleepTimer = setTimeout(function () {
        if (curState === 'awake' && !busy && !recognizing) setState('asleep');
      }, IDLE_SLEEP_MS);
    }
    return curState;
  }

  function nudgeAwake() {
    if (curState === 'asleep') setState('awake');
  }

  function explainBee() {
    var wrap = node('div', 'pb-explain');
    wrap.appendChild(node('p', 'pb-explain-lead',
      'The bee in the corner reports what I am actually doing. It is the one thing on this screen that never flatters me.'));
    for (var i = 0; i < STATE_LINES.length; i++) {
      var line = STATE_LINES[i];
      var row = node('div', 'pb-explain-row' + (line[0] === curState ? ' is-now' : ''));
      row.appendChild(node('span', 'pb-explain-ico', line[1]));
      var mid = node('span', 'pb-explain-mid');
      mid.appendChild(node('span', 'pb-explain-name', line[2] + (line[0] === curState ? ' — right now' : '')));
      mid.appendChild(node('span', 'pb-explain-line', line[3]));
      row.appendChild(mid);
      wrap.appendChild(row);
    }
    try {
      if (PB.ui && typeof PB.ui.sheet === 'function') { PB.ui.sheet('What the bee is doing', wrap); return; }
    } catch (e) { /* ignore */ }
    toast(SUBTITLE[curState]);
  }

  /* ---------------------------------------------------------
     open / close.
     The conversation is the home screen, so "open" means bring
     it forward and put the cursor in the composer, and "close"
     means put it down — never hide the app's own home.
     --------------------------------------------------------- */
  function isHome() { return true; }

  function ensureAttached() {
    if (!built) build();
    if (!root) return;
    if (document.body && document.body.contains(root)) return;
    // we've been swapped out for a sub-screen — ask the router to come home
    goScreen('chat');
    if (document.body && !document.body.contains(root)) {
      var host = document.getElementById('screen') || document.getElementById('app') || document.body;
      if (host && host.appendChild) mount(host);
    }
  }

  function open() {
    ensureAttached();
    if (!built) return;
    nudgeAwake();
    stick = true;
    scrollToEnd(true, true);
    setTimeout(function () { try { el.input.focus(); } catch (e) { /* ignore */ } }, 120);
  }

  function close() {
    if (!built) return;
    try { el.input.blur(); } catch (e) { /* ignore */ }
    stopMic(true);
    if (!busy) setState('asleep');
  }

  function syncOffline() {
    if (!el.offline) return;
    var was = !el.offline.hidden;
    el.offline.hidden = !isAirplane();
    if (was !== !el.offline.hidden) scrollToEnd(false);
  }

  /* ---------------------------------------------------------
     transcript store
     --------------------------------------------------------- */
  function loadTranscript() {
    var raw = getStore(CHAT_KEY, []);
    if (!Array.isArray(raw)) raw = [];
    msgs = [];
    for (var i = 0; i < raw.length; i++) {
      var m = raw[i];
      if (!m || typeof m !== 'object') continue;
      if (typeof m.text !== 'string') continue;
      msgs.push({
        id: m.id || uid(),
        role: m.role === 'user' ? 'user' : 'bee',
        text: m.text,
        at: m.at || nowDate().toISOString(),
        meta: m.meta || null,
        chips: Array.isArray(m.chips) ? m.chips : null,
        card: (m.card && typeof m.card === 'object') ? m.card : null,
        did: Array.isArray(m.did) ? m.did : null
      });
    }
    if (msgs.length > MAX_MSGS) msgs = msgs.slice(-MAX_MSGS);
  }
  function persist() {
    var trimmed = false;
    if (msgs.length > MAX_MSGS) { msgs = msgs.slice(-MAX_MSGS); trimmed = true; }
    setStore(CHAT_KEY, msgs);
    return trimmed;
  }
  function wipe() {
    msgs = [];
    delStore(CHAT_KEY);
    if (!built) return;
    removeTyping();
    el.transcript.innerHTML = '';
    if (!busy) setState('asleep');
    // an erased app should still feel like someone is home
    setTimeout(function () { greetIfEmpty(); }, 260);
  }

  /* ---------------------------------------------------------
     the opener — an empty conversation is an unfriendly one
     --------------------------------------------------------- */
  function greetIfEmpty() {
    if (!built || msgs.length) return;
    var text = '';
    try {
      if (PB.brain && typeof PB.brain.greeting === 'function') text = String(PB.brain.greeting() || '');
    } catch (e) { text = ''; }
    if (!text.trim()) {
      text = 'I’m here. Ask me about your day, tell me something to remember, ' +
             'or give me something to hold onto for later.';
    }
    pushBee(text, { source: 'greeting' }, { chips: starters() });
    renderEmptyStateIfNeeded();
  }

  /* ---------------------------------------------------------
     rendering
     --------------------------------------------------------- */
  function renderAll() {
    el.transcript.innerHTML = '';
    typingNode = null;
    var lastDay = '';
    for (var i = 0; i < msgs.length; i++) {
      var d = toDate(msgs[i].at) || nowDate();
      var key = d.toDateString();
      if (key !== lastDay) { el.transcript.appendChild(dayNode(d)); lastDay = key; }
      el.transcript.appendChild(renderMsg(msgs[i], i === msgs.length - 1));
    }
    renderEmptyStateIfNeeded();
    syncJump();
  }

  function dayNode(d) {
    var w = node('div', 'pb-day');
    w.appendChild(node('span', 'pb-day-label', fmtDay(d)));
    return w;
  }

  function removeEmptyState() {
    if (!el.transcript) return;
    var existing = el.transcript.querySelector('.pb-empty');
    if (existing && existing.parentNode) existing.parentNode.removeChild(existing);
  }

  // Only ever seen if the greeting itself failed — but it must still read as an invitation.
  function renderEmptyStateIfNeeded() {
    if (!el.transcript) return;
    if (msgs.length) { removeEmptyState(); return; }
    if (el.transcript.querySelector('.pb-empty')) return;
    var wrap = node('div', 'pb-empty');
    var av = node('div', 'pb-empty-bee');
    av.innerHTML = beeSvg('pb-portrait');
    wrap.appendChild(av);
    wrap.appendChild(node('p', 'pb-empty-title', 'I’m here.'));
    wrap.appendChild(node('p', 'pb-empty-sub',
      'Type, or tap the mic and talk. Everything you say stays on this phone.'));
    var chips = renderChips(starters());
    if (chips) { chips.className = 'pb-chips pb-chips-center'; wrap.appendChild(chips); }
    el.transcript.appendChild(wrap);
  }

  function renderMsg(m, isLast) {
    var wrap = node('div', 'pb-msg pb-msg-' + (m.role === 'user' ? 'user' : 'bee'));
    wrap.setAttribute('data-id', m.id);

    if (m.role !== 'user') {
      var av = node('div', 'pb-avatar');
      av.innerHTML = beeSvg('pb-portrait');
      wrap.appendChild(av);
    }

    var col = node('div', 'pb-col');
    var bubble = node('div', 'pb-bubble');
    bubble.textContent = m.text;                        // pre-wrap in CSS; never innerHTML
    col.appendChild(bubble);

    if (m.card) {
      var card = renderCard(m.card);
      if (card) col.appendChild(card);
    }

    if (Array.isArray(m.did) && m.did.length) {
      var didRow = node('div', 'pb-did');
      for (var d = 0; d < m.did.length && d < 4; d++) {
        var one = node('span', 'pb-did-item');
        one.textContent = '✓ ' + String(m.did[d]);
        didRow.appendChild(one);
      }
      col.appendChild(didRow);
    }

    col.appendChild(node('div', 'pb-stamp', fmtTime(toDate(m.at) || nowDate())));

    if (isLast && m.role === 'bee' && Array.isArray(m.chips) && m.chips.length) {
      var chips = renderChips(m.chips);
      if (chips) col.appendChild(chips);
    }

    wrap.appendChild(col);
    return wrap;
  }

  function renderChips(list) {
    var row = node('div', 'pb-chips');
    var count = 0;
    for (var i = 0; i < list.length && count < 6; i++) {
      var c = list[i];
      if (!c) continue;
      var label = (typeof c === 'string') ? c : (c.label || c.send || '');
      var sendText = (typeof c === 'string') ? c : (c.send || c.label || '');
      if (!label || !sendText) continue;
      var b = node('button', 'pb-chip', String(label));
      b.type = 'button';
      b.setAttribute('data-send', String(sendText));
      b.addEventListener('click', function (e) {
        e.preventDefault();
        var txt = this.getAttribute('data-send');
        haptic();
        send(txt, 'chat');
      });
      row.appendChild(b);
      count++;
    }
    return count ? row : null;
  }

  function clearChipRows() {
    if (!el.transcript) return;
    var rows = el.transcript.querySelectorAll('.pb-chips');
    for (var i = 0; i < rows.length; i++) rows[i].remove();
  }

  function appendMsg(m, prev) {
    clearChipRows();
    removeEmptyState();
    var d = toDate(m.at) || nowDate();
    var p = prev ? toDate(prev.at) : null;
    if (!p || p.toDateString() !== d.toDateString()) el.transcript.appendChild(dayNode(d));
    el.transcript.appendChild(renderMsg(m, true));
    scrollToEnd(true);
  }

  function scrollToEnd(smooth, force) {
    if (!el.transcript) return;
    if (!force && !stick) { syncJump(); return; }
    stick = true;
    syncJump();
    var run = function () {
      try {
        if (smooth && el.transcript.scrollTo) {
          el.transcript.scrollTo({ top: el.transcript.scrollHeight, behavior: 'smooth' });
        } else {
          el.transcript.scrollTop = el.transcript.scrollHeight;
        }
      } catch (e) {
        el.transcript.scrollTop = el.transcript.scrollHeight;
      }
    };
    if (window.requestAnimationFrame) window.requestAnimationFrame(run); else run();
  }

  /* ---------------------------------------------------------
     cards — rich but restrained, generic, and defensive.
     An unknown type must never break the transcript.
     --------------------------------------------------------- */
  var CARD_META = {
    reminder: { icon: '⏰', label: 'Reminder' },
    moment: { icon: '📷', label: 'Moment' },
    contact: { icon: '👤', label: 'Contact' },
    schedule: { icon: '📅', label: 'Schedule' },
    memory: { icon: '🧠', label: 'What I noticed' },
    trust: { icon: '🔒', label: 'Trust' }
  };
  var SCREEN_FOR = {
    reminder: { id: 'reminders', label: 'Open reminders' },
    moment: { id: 'moments', label: 'Open moments' },
    memory: { id: 'bee', label: 'Open memory' },
    trust: { id: 'trust', label: 'Open privacy' }
  };

  function renderCard(card) {
    try {
      if (!card || typeof card !== 'object') return null;
      var type = String(card.type || '').toLowerCase();
      var data = (card.data && typeof card.data === 'object') ? card.data : {};
      var known = Object.prototype.hasOwnProperty.call(CARD_META, type);
      var meta = known ? CARD_META[type] : { icon: '🐝', label: type ? title(type) : 'Detail' };

      var box = node('div', 'pb-card pb-card-' + (known ? type : 'generic'));
      var head = node('div', 'pb-card-head');
      head.appendChild(node('span', 'pb-card-icon', meta.icon));
      head.appendChild(node('span', 'pb-card-label', meta.label));
      box.appendChild(head);

      var body = node('div', 'pb-card-body');
      var built2 = false;
      try { built2 = buildCardBody(type, data, body); } catch (e) { built2 = false; }
      if (!built2) genericRows(data, body);
      box.appendChild(body);

      var dest = SCREEN_FOR[type];
      if (dest) {
        var go = node('button', 'pb-card-go', dest.label);
        go.type = 'button';
        go.addEventListener('click', function (e) {
          e.preventDefault();
          haptic();
          goScreen(dest.id);
        });
        box.appendChild(go);
      }
      return box;
    } catch (e) {
      return null;
    }
  }

  // Some `note` fields carry a machine tag ("match", "recall") rather than a sentence.
  // Only show one when it reads as something a person wrote.
  function isProse(s) {
    var t = str(s).trim();
    return t.length > 0 && /\s/.test(t);
  }

  // The brain hands back either a single entity or a collection of them, depending on
  // the intent. Pull out the collection when there is one so both shapes render.
  function cardList(data, keys) {
    for (var i = 0; i < keys.length; i++) {
      var v = data[keys[i]];
      if (Array.isArray(v) && v.length) return v;
    }
    return null;
  }

  // title + subtitle rows, used whenever a card is showing several things at once
  function listRows(body, items, max, getTitle, getSub) {
    var n = Math.min(items.length, max);
    for (var i = 0; i < n; i++) {
      var it = items[i] || {};
      var row = node('div', 'pb-card-row');
      var mid = node('span', 'pb-card-what');
      mid.appendChild(node('span', 'pb-card-what-title', getTitle(it) || '—'));
      var sub = getSub ? getSub(it) : '';
      if (sub) mid.appendChild(node('span', 'pb-card-what-sub', sub));
      row.appendChild(mid);
      body.appendChild(row);
    }
    if (items.length > n) {
      body.appendChild(node('div', 'pb-card-note', '+ ' + (items.length - n) + ' more'));
    }
  }

  function buildCardBody(type, data, body) {
    if (type === 'reminder') {
      var rList = cardList(data, ['reminders', 'items', 'list']);
      if (rList && rList.length === 1) data = rList[0];
      else if (rList) {
        if (str(data.title)) body.appendChild(node('div', 'pb-card-title', str(data.title)));
        listRows(body, rList, 4,
          function (r) { return str(r.text) || 'Reminder'; },
          function (r) { return whenText(r); });
        return true;
      }
      body.appendChild(node('div', 'pb-card-title', str(data.text) || 'Reminder'));
      var when = whenText(data);
      if (when) body.appendChild(node('div', 'pb-card-line', when));
      if (data.recurrence) {
        var r = data.recurrence;
        var rt = (typeof r === 'string') ? r : [str(r.freq), Array.isArray(r.days) ? dayNames(r.days) : '', str(r.time)]
          .filter(Boolean).join(' · ');
        if (rt) body.appendChild(node('div', 'pb-card-line', 'Repeats: ' + rt));
      }
      if (data.confirmed === false) {
        body.appendChild(node('div', 'pb-card-note', 'Not confirmed yet — tell me if I got it wrong.'));
      }
      return true;
    }

    if (type === 'moment') {
      var moList = cardList(data, ['moments', 'items']);
      if (moList && moList.length === 1) data = moList[0];
      else if (moList) {
        listRows(body, moList, 4,
          function (m) { return str(m.userNote) || 'Untitled moment'; },
          function (m) { var d = toDate(m.createdAt); return d ? fmtDay(d) : ''; });
        return true;
      }
      if (typeof data.dataUrl === 'string' && data.dataUrl.indexOf('data:image') === 0) {
        var img = node('img', 'pb-card-thumb');
        img.src = data.dataUrl;
        img.alt = str(data.userNote) || 'Saved moment';
        body.appendChild(img);
      }
      if (str(data.userNote)) body.appendChild(node('div', 'pb-card-title', str(data.userNote)));
      if (str(data.aiGuess)) {
        body.appendChild(node('div', 'pb-card-note',
          'My guess: ' + str(data.aiGuess) + confidenceTail(data.aiConfidence)));
      }
      var madeAt = toDate(data.createdAt);
      if (madeAt) body.appendChild(node('div', 'pb-card-line', fmtDay(madeAt) + ', ' + fmtTime(madeAt)));
      return true;
    }

    if (type === 'contact') {
      var cList = cardList(data, ['candidates', 'contacts', 'items']);
      if (cList && cList.length === 1) data = cList[0].contact || cList[0];
      else if (cList) {
        if (isProse(data.note)) body.appendChild(node('div', 'pb-card-note', str(data.note)));
        listRows(body, cList.map(function (c) { return c.contact || c; }), 4,
          function (c) { return str(c.name); },
          function (c) { return [str(c.nickname), str(c.relationship)].filter(Boolean).join(' · '); });
        return true;
      }
      body.appendChild(node('div', 'pb-card-title', str(data.name) || 'Someone'));
      var sub = [str(data.nickname), str(data.relationship)].filter(Boolean).join(' · ');
      if (sub) body.appendChild(node('div', 'pb-card-line', sub));
      if (str(data.vibe)) body.appendChild(node('div', 'pb-card-line', str(data.vibe)));
      var seen = toDate(data.lastSeen);
      if (seen) body.appendChild(node('div', 'pb-card-note', 'Last seen ' + relative(seen)));
      if (str(data.phone)) body.appendChild(node('div', 'pb-card-line', str(data.phone)));
      return true;
    }

    if (type === 'schedule') {
      var events = Array.isArray(data) ? data
        : (Array.isArray(data.events) ? data.events
          : (Array.isArray(data.items) ? data.items : (data.title ? [data] : [])));
      if (!events.length) { body.appendChild(node('div', 'pb-card-line', 'Nothing on the calendar.')); return true; }
      for (var i = 0; i < events.length && i < 5; i++) {
        var ev = events[i] || {};
        var row = node('div', 'pb-card-row');
        var start = toDate(ev.start);
        row.appendChild(node('span', 'pb-card-when', start ? fmtTime(start) : '—'));
        var mid = node('span', 'pb-card-what');
        mid.appendChild(node('span', 'pb-card-what-title', str(ev.title) || 'Untitled'));
        var bits = [str(ev.location), str(ev.kind)].filter(Boolean).join(' · ');
        if (bits) mid.appendChild(node('span', 'pb-card-what-sub', bits));
        row.appendChild(mid);
        body.appendChild(row);
      }
      return true;
    }

    if (type === 'memory') {
      var mList = cardList(data, ['memories', 'items']);
      if (mList && mList.length === 1) data = mList[0];
      else if (mList) {
        if (isProse(data.note)) body.appendChild(node('div', 'pb-card-note', str(data.note)));
        listRows(body, mList, 4,
          function (m) { return str(m.text); },
          function (m) { return isFinite(m.confidence) ? confidenceWord(+m.confidence) : ''; });
        return true;
      }
      body.appendChild(node('div', 'pb-card-title', str(data.text) || 'Something I noticed'));
      if (str(data.kind)) body.appendChild(node('div', 'pb-card-line', title(str(data.kind))));
      if (isFinite(data.confidence)) body.appendChild(confidenceBar(+data.confidence));
      if (Array.isArray(data.evidence) && data.evidence.length) {
        body.appendChild(node('div', 'pb-card-note', 'Because: ' + data.evidence.slice(0, 2).map(str).join('; ')));
      }
      if (data.saved === false) {
        body.appendChild(node('div', 'pb-card-note', 'Not saved — this fades unless you keep it.'));
      }
      return true;
    }

    if (type === 'trust') {
      if (typeof data.airplane === 'boolean') {
        body.appendChild(node('div', 'pb-card-line',
          data.airplane ? 'Airplane mode is on. Nothing leaves this phone.'
                        : 'Airplane mode is off.'));
      }
      var perms = (data.permissions && typeof data.permissions === 'object') ? data.permissions : null;
      if (perms) {
        for (var k in perms) {
          if (!Object.prototype.hasOwnProperty.call(perms, k)) continue;
          var row2 = node('div', 'pb-card-row');
          row2.appendChild(node('span', 'pb-card-when', title(k)));
          row2.appendChild(node('span', 'pb-card-what', str(perms[k])));
          body.appendChild(row2);
        }
      }
      if (str(data.text)) body.appendChild(node('div', 'pb-card-line', str(data.text)));
      return body.childNodes.length > 0;
    }

    return false;
  }

  function genericRows(data, body) {
    try {
      if (Array.isArray(data)) {
        for (var i = 0; i < data.length && i < 6; i++) {
          body.appendChild(node('div', 'pb-card-line', shallow(data[i])));
        }
        return;
      }
      var keys = Object.keys(data || {}), shown = 0;
      for (var j = 0; j < keys.length && shown < 8; j++) {
        var k = keys[j];
        if (k === 'id' || k === 'dataUrl') continue;
        var v = shallow(data[k]);
        if (!v) continue;
        var row = node('div', 'pb-card-row');
        row.appendChild(node('span', 'pb-card-when', title(k)));
        row.appendChild(node('span', 'pb-card-what', v));
        body.appendChild(row);
        shown++;
      }
      if (!shown) body.appendChild(node('div', 'pb-card-line', 'Nothing to show here.'));
    } catch (e) {
      body.appendChild(node('div', 'pb-card-line', 'Nothing to show here.'));
    }
  }

  function confidenceBar(c) {
    var pct = Math.round(clamp(c, 0, 1) * 100);
    var wrap = node('div', 'pb-conf');
    var track = node('div', 'pb-conf-track');
    var fill = node('div', 'pb-conf-fill');
    fill.style.width = pct + '%';
    track.appendChild(fill);
    wrap.appendChild(track);
    wrap.appendChild(node('span', 'pb-conf-text', pct >= 75 ? 'Fairly sure (' + pct + '%)'
      : pct >= 45 ? 'A guess (' + pct + '%)' : 'A hunch (' + pct + '%)'));
    return wrap;
  }
  function confidenceTail(c) {
    if (!isFinite(c)) return '';
    var pct = Math.round(clamp(+c, 0, 1) * 100);
    return ' — about ' + pct + '% sure';
  }
  // plain-language strength, for list rows where a bar would be too heavy
  function confidenceWord(c) {
    if (!isFinite(c)) return '';
    var pct = Math.round(clamp(+c, 0, 1) * 100);
    return (pct >= 75 ? 'Fairly sure' : pct >= 45 ? 'A guess' : 'A hunch') + ' · ' + pct + '%';
  }
  function whenText(data) {
    var d = toDate(data.due);
    if (d) return fmtDay(d) + ', ' + fmtTime(d);
    if (str(data.dueText)) return str(data.dueText);
    return 'No time set';
  }
  function relative(d) {
    try {
      if (PB.util && typeof PB.util.fmtRelative === 'function') return String(PB.util.fmtRelative(d));
    } catch (e) { /* ignore */ }
    return fmtDay(d);
  }
  function dayNames(days) {
    var N = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    return days.map(function (n) { return N[n] || ''; }).filter(Boolean).join(', ');
  }
  function str(v) { return (typeof v === 'string' && v.trim()) ? v.trim() : (typeof v === 'number' ? String(v) : ''); }
  function title(s) {
    s = String(s || '').replace(/[_.-]+/g, ' ');
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function shallow(v) {
    if (v == null) return '';
    if (typeof v === 'string') return v.length > 140 ? v.slice(0, 137) + '…' : v;
    if (typeof v === 'number' || typeof v === 'boolean') return String(v);
    if (Array.isArray(v)) return v.slice(0, 4).map(shallow).filter(Boolean).join(', ');
    if (typeof v === 'object') {
      var name = v.name || v.title || v.text || v.label;
      return typeof name === 'string' ? name : '';
    }
    return '';
  }

  /* ---------------------------------------------------------
     typing indicator
     --------------------------------------------------------- */
  function showTyping() {
    if (typingNode || !el.transcript) return;
    removeEmptyState();
    typingNode = node('div', 'pb-msg pb-msg-bee pb-typing-msg');
    var av = node('div', 'pb-avatar');
    av.innerHTML = beeSvg('pb-portrait');
    typingNode.appendChild(av);
    var col = node('div', 'pb-col');
    var b = node('div', 'pb-bubble pb-typing');
    b.setAttribute('aria-label', 'BEE is thinking');
    b.innerHTML = '<span></span><span></span><span></span>';
    col.appendChild(b);
    typingNode.appendChild(col);
    el.transcript.appendChild(typingNode);
    scrollToEnd(true);
  }
  function removeTyping() {
    if (typingNode && typingNode.parentNode) typingNode.parentNode.removeChild(typingNode);
    typingNode = null;
  }

  /* ---------------------------------------------------------
     message pushes
     --------------------------------------------------------- */
  function pushUser(text) {
    var at = nowDate().toISOString();
    var prev = msgs.length ? msgs[msgs.length - 1] : null;
    var m = { id: uid(), role: 'user', text: text, at: at, meta: null, chips: null, card: null, did: null };
    msgs.push(m);
    var trimmed = persist();
    if (built) { if (trimmed) renderAll(); else appendMsg(m, prev); }
    emit('chat:user', { text: text, at: at });
    return m;
  }

  function pushBee(text, meta, extras) {
    extras = extras || {};
    var at = nowDate().toISOString();
    var prev = msgs.length ? msgs[msgs.length - 1] : null;
    var m = {
      id: uid(), role: 'bee', text: String(text == null ? '' : text), at: at,
      meta: meta || null,
      chips: Array.isArray(extras.chips) ? extras.chips : null,
      card: (extras.card && typeof extras.card === 'object') ? extras.card : null,
      did: Array.isArray(extras.did) && extras.did.length ? extras.did : null
    };
    msgs.push(m);
    var trimmed = persist();
    if (built) { if (trimmed) renderAll(); else appendMsg(m, prev); }
    emit('chat:bee', { text: m.text, at: at, meta: m.meta });
    return m;
  }

  // public: say()
  function say(text, meta) {
    if (!built) build();
    if (typeof text !== 'string' || !text.trim()) return null;
    var extras = {};
    if (meta && typeof meta === 'object') {
      if (Array.isArray(meta.chips)) extras.chips = meta.chips;
      if (meta.card && typeof meta.card === 'object') extras.card = meta.card;
      if (Array.isArray(meta.did)) extras.did = meta.did;
    }
    nudgeAwake();
    return pushBee(text, meta || null, extras);
  }

  /* ---------------------------------------------------------
     the send pipeline (contract order, each step guarded)
       chat:user -> nlu.parse -> 'thinking' -> brain.respond
       -> render -> chat:bee -> 'awake'
     --------------------------------------------------------- */
  function history() {
    var slice = msgs.slice(-HISTORY_TURNS);
    var out = [];
    for (var i = 0; i < slice.length; i++) {
      out.push({ role: slice[i].role, text: slice[i].text, at: slice[i].at });
    }
    return out;
  }

  function send(text, source) {
    text = (typeof text === 'string') ? text.trim() : '';
    if (!text || busy) return Promise.resolve(null);
    if (!built) build();
    ensureAttached();

    busy = true;
    stopMic(true);
    stick = true;

    var priorHistory = history();     // conversation before this turn
    pushUser(text);

    var parsed = null;
    try {
      if (PB.nlu && typeof PB.nlu.parse === 'function') {
        parsed = PB.nlu.parse(text, { source: source || 'chat', history: priorHistory });
      }
    } catch (e) { parsed = null; }

    setState('thinking');
    showTyping();

    var p;
    if (PB.brain && typeof PB.brain.respond === 'function') {
      try {
        p = Promise.resolve(PB.brain.respond({ text: text, parsed: parsed, history: priorHistory }));
      } catch (e) {
        p = Promise.reject(e);
      }
    } else {
      p = Promise.resolve({
        text: 'I heard you: “' + text + '”\n' +
              'My thinking isn’t wired up in this build yet, so I can’t act on it. ' +
              'Nothing left this phone.',
        chips: null, card: null, did: []
      });
    }

    return p.then(function (resp) {
      finish(resp);
    })['catch'](function (err) {
      try { console.warn('[beeui] brain error', err); } catch (e) { /* ignore */ }
      finish({
        text: 'Something went wrong on my end just now — that’s on me, not you. ' +
              'Nothing left this phone. Want to try again?',
        chips: [{ label: 'Try again', send: text }],
        card: null,
        did: []
      });
    });
  }

  function finish(resp) {
    removeTyping();
    resp = (resp && typeof resp === 'object') ? resp : {};
    var replyText = (typeof resp.text === 'string' && resp.text.trim())
      ? resp.text
      : 'I don’t have an answer for that one yet.';
    pushBee(replyText, { source: 'brain' }, {
      chips: Array.isArray(resp.chips) ? resp.chips : null,
      card: (resp.card && typeof resp.card === 'object') ? resp.card : null,
      did: Array.isArray(resp.did) ? resp.did : null
    });
    busy = false;
    setState('awake');
  }

  /* ---------------------------------------------------------
     microphone — just-in-time permission, honest degradation
     --------------------------------------------------------- */
  var MIC_WHY = 'So you can talk to me instead of typing. ' +
    'The mic only runs while this screen is open, I keep the words and not the audio, ' +
    'and you can turn it off any time in Privacy.';

  function micTap() {
    if (recognizing) { stopMic(); return; }
    if (!SR) {
      toast('Voice isn’t available on this device — typing works just the same.');
      try { el.input.focus(); } catch (e) { /* ignore */ }
      return;
    }
    if (isAirplane()) {
      toast('Airplane mode is on. Speech-to-text would have to leave the phone, so it’s off — typing still works.');
      try { el.input.focus(); } catch (e) { /* ignore */ }
      return;
    }
    askMic().then(function (ok) {
      if (!ok) { toast('No problem — typing works too.'); return; }
      startMic();
    })['catch'](function () {
      toast('Couldn’t get to the mic. Typing works too.');
    });
  }

  function askMic() {
    try {
      if (PB.trust && typeof PB.trust.permission === 'function' && PB.trust.permission('mic') === 'granted') {
        return Promise.resolve(true);
      }
      if (PB.trust && typeof PB.trust.request === 'function') {
        return Promise.resolve(PB.trust.request('mic', MIC_WHY)).then(function (v) { return !!v; });
      }
    } catch (e) { /* ignore */ }
    return Promise.resolve(true);   // no trust module yet: don't block the user
  }

  function startMic() {
    if (recognizing) return;
    try {
      recog = new SR();
    } catch (e) {
      recog = null;
      toast('Voice isn’t available on this device — typing works just the same.');
      return;
    }
    micFinal = '';
    try {
      recog.lang = (navigator && navigator.language) ? navigator.language : 'en-US';
      recog.continuous = false;
      recog.interimResults = true;
      recog.maxAlternatives = 1;
    } catch (e) { /* ignore */ }

    recog.onstart = function () {
      recognizing = true;
      setState('listening');
      haptic();
    };
    recog.onresult = function (ev) {
      var interim = '';
      try {
        for (var i = ev.resultIndex; i < ev.results.length; i++) {
          var r = ev.results[i];
          var t = (r[0] && r[0].transcript) ? r[0].transcript : '';
          if (r.isFinal) micFinal += t; else interim += t;
        }
      } catch (e) { /* ignore */ }
      el.input.value = (micFinal + interim).replace(/\s+/g, ' ').trim();
      resizeInput();
      syncComposer();
    };
    recog.onerror = function (ev) {
      var code = ev && ev.error ? String(ev.error) : '';
      recognizing = false;
      if (code === 'not-allowed' || code === 'service-not-allowed') {
        toast('The phone didn’t give me the mic. You can type instead.');
      } else if (code === 'no-speech') {
        toast('I didn’t catch that.');
      } else if (code === 'network') {
        toast('Speech-to-text needs the network and couldn’t reach it. Typing still works.');
      } else if (code && code !== 'aborted') {
        toast('The mic stopped unexpectedly. Typing still works.');
      }
      setState(busy ? 'thinking' : 'awake');
    };
    recog.onend = function () {
      var had = recognizing;
      recognizing = false;
      if (curState === 'listening') setState(busy ? 'thinking' : 'awake');
      var finalText = (micFinal || '').trim();
      micFinal = '';
      if (had && finalText) {
        el.input.value = '';
        resizeInput();
        syncComposer();
        send(finalText, 'voice');
      }
    };

    try {
      recog.start();
    } catch (e) {
      recognizing = false;
      toast('Couldn’t start the mic. Typing works too.');
      setState('awake');
    }
  }

  function stopMic(silent) {
    if (!recog) return;
    try { if (recognizing) recog.stop(); } catch (e) { /* ignore */ }
    if (silent) {
      try { recog.onresult = null; recog.onend = null; recog.onerror = null; } catch (e) { /* ignore */ }
      try { if (recognizing) recog.abort(); } catch (e2) { /* ignore */ }
      recognizing = false;
      if (curState === 'listening') setState(busy ? 'thinking' : 'awake');
    }
  }

  /* ---------------------------------------------------------
     public API
     --------------------------------------------------------- */
  PB.beeui = {

  function hedged(text, cf) {

  /* ============================================================
   * 9. today(el)
   * ========================================================== */

  var state = { id: null, el: null, pending: 0 };

  function today(root) {
    if (!root) return;
    state.id = 'today';
    state.el = root;

    var pageScroll = (window.pageYOffset || 0);

    root.innerHTML = '';
    root.classList.add('tdy-root');

    var wrap = el('div', 'tdy');

    /* Build everything first, then decide what the screen actually is. A section
       that came back empty is never given a heading and never given a card. */
    var nudge    = safeBuild(buildNudgeCard);
    var next     = safeBuild(buildNextUp);
    var schedule = safeBuild(buildSchedule);
    var rems     = safeBuild(buildReminders);
    var work     = safeBuild(buildOutstanding);
    var noticed  = safeBuild(buildNoticed);
    var moments  = safeBuild(buildMoments);

    var hasContent = !!(nudge || next || schedule || rems || work || noticed || moments);

    safeAppend(wrap, function () { return buildHero(hasContent); });

    if (!hasContent) {
      safeAppend(wrap, buildEmptyCard);
    } else {
      /* Lead with what matters: the clock nudge, then anything already late,
         then the next thing happening. */
      var late = 0;
      try { late = overdueReminders().length; } catch (e) {}

      if (nudge) wrap.appendChild(nudge);
      if (late && rems) section(wrap, 'Reminders', 'All', function () { go('reminders'); }, rems);
      section(wrap, 'Next up', 'Ask BEE', function () { askBee('What\'s next today?'); }, next);
      section(wrap, 'Your day', null, null, schedule);
      if (!late) section(wrap, 'Reminders', 'All', function () { go('reminders'); }, rems);
      section(wrap, 'Brand work', null, null, work);
      section(wrap, 'BEE noticed', 'Memory', function () { go('bee'); }, noticed);
      section(wrap, 'Moments', 'All', function () { go('moments'); }, moments);
    }

    safeAppend(wrap, buildActionBar);
    safeAppend(wrap, buildFooter);

    root.appendChild(wrap);

    try {
      if (keepScroll) root.scrollTop = keepScroll;
      if (pageScroll) window.scrollTo(0, pageScroll);
    } catch (e) {}
  }

  function safeBuild(build) {
    try { return build() || null; } catch (e) { return null; }
  }

  function safeAppend(root, build) {
    var node = safeBuild(build);
    if (node) root.appendChild(node);
  }

   * 10. Router + delegation
   * ========================================================== */

  var PLACEHOLDER = {
    reminders: { emoji: '⏰', title: 'Reminders', line: 'Your reminders will land here as soon as you make one.' },
    moments: { emoji: '📷', title: 'Moments', line: 'Photos you save — with your own note as the truth of them.' },
    bee: { emoji: '🐝', title: 'What BEE knows', line: 'Everything BEE has picked up, in plain sight and erasable.' },
    trust: { emoji: '🔒', title: 'Trust & data', line: 'Permissions, airplane mode, and the button that erases it all.' }
  };

  function placeholder(rootEl, id) {
    var info = PLACEHOLDER[id] || { emoji: '🐝', title: 'Coming up', line: 'This part of the hive is still being built.' };
    rootEl.innerHTML = '';
    var wrap = el('div', 'scr-coming');
    wrap.appendChild(el('div', 'scr-coming-emoji', info.emoji));
    wrap.appendChild(el('h2', 'scr-coming-title', info.title));
    wrap.appendChild(el('p', 'scr-coming-line', info.line));
    var b = el('button', 'tdy-btn tdy-btn-ghost', 'Back to today');
    b.type = 'button';
    tap(b, function () { go('today'); }, { silentRole: true });
    wrap.appendChild(b);
    rootEl.appendChild(wrap);
  }

  function delegate(rootEl, mod, id) {
    if (!mod || typeof mod.renderScreen !== 'function') {
      placeholder(rootEl, id);
      return;
    }
    try {
      mod.renderScreen(rootEl);
      /* If the module painted nothing at all, don't leave a blank page. */
      if (!rootEl.childNodes.length) placeholder(rootEl, id);
    } catch (e) {
      placeholder(rootEl, id);
    }
  }

  function render(id, rootEl) {
    if (!rootEl) return;
    id = String(id || 'today');
    state.id = id;
    state.el = rootEl;
    try { rootEl.setAttribute('data-screen', id); } catch (e) {}
    if (id !== 'today') { try { rootEl.classList.remove('tdy-root'); } catch (e) {} }

    switch (id) {
      case 'today': today(rootEl); return;
      case 'reminders': rootEl.innerHTML = ''; delegate(rootEl, PB.reminders, 'reminders'); return;
      case 'moments': rootEl.innerHTML = ''; delegate(rootEl, PB.photo, 'moments'); return;
      case 'bee': rootEl.innerHTML = ''; delegate(rootEl, PB.memory, 'bee'); return;
      case 'trust': rootEl.innerHTML = ''; delegate(rootEl, PB.trust, 'trust'); return;
      default: rootEl.innerHTML = ''; placeholder(rootEl, id); return;
    }
  }

  /* Coalesced re-render of Today, only when Today is on screen. */
  function refresh() {
    if (state.id !== 'today' || !state.el) return;
    if (state.el.isConnected === false) return;
    if (state.pending) return;
    state.pending = window.setTimeout(function () {
      state.pending = 0;
      if (state.id === 'today' && state.el) {
        try { today(state.el); } catch (e) {}
      }
    }, 30);
  }

  if (PB.bus && typeof PB.bus.on === 'function') {
    ['reminder:created', 'reminder:completed', 'reminder:fired', 'photo:added', 'data:erased', 'memory:noticed']
      .forEach(function (evt) {
        try { PB.bus.on(evt, refresh); } catch (e) {}
      });
    try {
      PB.bus.on('screen:changed', function (p) {
        if (p && p.id) state.id = p.id;
      });
    } catch (e) {}
  }

  PB.screens = {
    render: render,
    today: today,
    refresh: refresh
  };
})();

} catch (e) { console.error('[PB] module failed: js/screens.js', e); }

    b.appendChild(PB.ui.el('span', 'navbar-title', title));
    b.appendChild(PB.ui.el('span', 'navbar-spacer'));
    return b;
  }

  function renderSub(id) {
    var meta = SUB[id] || { title: 'BEE' };
    screenEl.appendChild(bar(meta.title, function () { go('more'); }));
    var body = PB.ui.el('div', 'navbody');
    screenEl.appendChild(body);
    if (PB.screens && typeof PB.screens.render === 'function') {
      PB.screens.render(id, body);
    } else {
      body.appendChild(PB.ui.el('p', 'empty', 'Not available.'));
    }
  }

  function renderHub(root) {
    root.appendChild(bar('Everything BEE holds', function () { go(HOME); }));
    var body = PB.ui.el('div', 'navbody hub');
    var name = (PB.profile && PB.profile.name && PB.profile.name()) || '';

    var intro = PB.ui.el('p', 'hub-intro',
      name ? 'All of this is on this phone, ' + String(name).split(' ')[0] + '. Nothing syncs.'
           : 'All of this is on this phone. Nothing syncs.');
    body.appendChild(intro);

    Object.keys(SUB).forEach(function (id) {
      var meta = SUB[id];
      var row = PB.ui.el('button', 'hub-row');
      var ico = PB.ui.el('span', 'hub-ico', meta.icon);
      var mid = PB.ui.el('span', 'hub-mid');
      mid.appendChild(PB.ui.el('span', 'hub-title', meta.title));
      mid.appendChild(PB.ui.el('span', 'hub-line', meta.line));
      var count = countFor(id);
      row.appendChild(ico);
      row.appendChild(mid);
      if (count) row.appendChild(PB.ui.el('span', 'hub-count', count));
      row.addEventListener('click', function () { go(id); });
      body.appendChild(row);
    });

    var who = PB.ui.el('button', 'hub-row hub-row-quiet');
    who.appendChild(PB.ui.el('span', 'hub-ico', '👤'));
    var wmid = PB.ui.el('span', 'hub-mid');
    wmid.appendChild(PB.ui.el('span', 'hub-title', 'You'));
    wmid.appendChild(PB.ui.el('span', 'hub-line', name ? 'Signed in as ' + name + ' — change or start over.' : 'Set your name.'));
    who.appendChild(wmid);
    who.addEventListener('click', function () {
      if (PB.profile && PB.profile.openSettings) PB.profile.openSettings();
    });
    body.appendChild(who);

    // Open-ended questions ("what should I focus on?") are where the on-device rules
    // engine runs out. This is the switch that sends only those to Claude; reminders,
    // memory and anything privacy-critical stay local either way.
    var brainRow = PB.ui.el('button', 'hub-row hub-row-quiet');
    brainRow.appendChild(PB.ui.el('span', 'hub-ico', '💬'));
    var bmid = PB.ui.el('span', 'hub-mid');
    bmid.appendChild(PB.ui.el('span', 'hub-title', 'How BEE thinks'));
    var st = { cloud: false, reason: '' };
    try { if (PB.brain && PB.brain.status) st = PB.brain.status() || st; } catch (e) {}
    bmid.appendChild(PB.ui.el('span', 'hub-line', st.cloud
      ? 'Open questions go to Claude. Reminders and memory stay on this phone.'
      : 'Running entirely on this phone. Add a Claude key for open-ended conversation.'));
    brainRow.appendChild(bmid);
    brainRow.addEventListener('click', openBrainSheet);
    body.appendChild(brainRow);

    // Which build is this phone actually running? Without this, "is it fixed yet?" is
    // unanswerable — a home-screen app can sit on a cached copy without saying so.
    if (window.PB_BUILD) {
      var stamp = PB.ui.el('p', 'hub-build', 'Build ' + window.PB_BUILD);
      var tapped = 0;
      stamp.addEventListener('click', function () {
        if (++tapped < 3) return;
        tapped = 0;
        reloadFresh();
      });
      body.appendChild(stamp);
    }

    root.appendChild(body);
  }

  function openBrainSheet() {
    if (!PB.brain || typeof PB.brain.setKey !== 'function') {
      PB.ui.toast('Not available in this build.');
      return;
    }
    var has = false;
    try { has = !!PB.brain.hasKey(); } catch (e) {}

    var wrap = PB.ui.el('div');
    wrap.appendChild(PB.ui.el('p', 'dim small',
      'Reminders, memory, your photos and everything on the Privacy screen are worked out ' +
      'on this phone and never leave it. That does not change.'));
    var p2 = PB.ui.el('p', 'dim small',
      'What a key changes: open-ended questions — "what should I focus on?", "help me think ' +
      'this through" — get answered by Claude instead of by rules. Only the question and the ' +
      'relevant context are sent, and only for those turns.');
    p2.style.marginTop = '10px';
    wrap.appendChild(p2);

    var input = PB.ui.el('input');
    input.type = 'password';
    input.placeholder = has ? 'A key is saved — paste a new one to replace it' : 'sk-ant-…';
    input.setAttribute('autocapitalize', 'off');
    input.setAttribute('autocorrect', 'off');
    input.style.cssText = 'width:100%;background:var(--bg-sunken);border:1px solid var(--line);' +
      'border-radius:var(--radius);padding:13px 15px;font-size:15px;margin:18px 0 12px;';
    wrap.appendChild(input);

    var row = PB.ui.el('div', 'row'); row.style.gap = '10px';
    var save = PB.ui.el('button', 'btn btn-primary grow', 'Save key');
    row.appendChild(save);
    if (has) {
      var clear = PB.ui.el('button', 'btn btn-ghost grow', 'Remove key');
      clear.addEventListener('click', function () {
        try { PB.brain.clearKey(); } catch (e) {}
        sheet.close();
        PB.ui.toast('Key removed. Fully on-device again.');
        go('more');
      });
      row.appendChild(clear);
    }
    wrap.appendChild(row);

    var note = PB.ui.el('p', 'tiny faint',
      'The key is stored on this phone only, the same as everything else. Airplane mode still blocks it.');
    note.style.marginTop = '12px';
    wrap.appendChild(note);

    var sheet = PB.ui.sheet('How BEE thinks', wrap);
    save.addEventListener('click', function () {
      var v = String(input.value || '').trim();
      if (!v) return;
      try { PB.brain.setKey(v); } catch (e) {}
      sheet.close();
      PB.ui.toast('Saved. Open questions will go to Claude now.');
      go('more');
    });
  }

  // Drop the service-worker caches and reload. The escape hatch for when a phone is
  // holding an old copy of the app.
  function reloadFresh() {
    var done = function () { location.reload(); };
    try {
      if (!window.caches || !navigator.serviceWorker) return done();
      PB.ui.toast('Fetching the latest build…');
      Promise.all([
        caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }),
        navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) { return r.unregister(); }));
        })
      ]).then(done, done);
    } catch (e) { done(); }
  }

  function countFor(id) {
    try {
      if (id === 'reminders' && PB.reminders) {
        var open = (PB.reminders.list({ status: 'open' }) || []).length;
        return open ? String(open) : '';
      }
      if (id === 'moments' && PB.photo) {
        var n = (PB.photo.list() || []).length;
        return n ? String(n) : '';
      }
      if (id === 'bee' && PB.memory) {
        var m = (PB.memory.items() || []).length;
        return m ? String(m) : '';
      }
    } catch (e) {}
    return '';
  }

  /* -------------------------------------------------------------------- boot */

  function boot() {
    screenEl = document.getElementById('screen');

    var h = health();
    var bad = Object.keys(h).filter(function (k) { return h[k] !== 'ok'; });
    console.log(bad.length ? '[PB] module problems: ' + bad.map(function (k) { return k + ' → ' + h[k]; }).join(' | ')
                           : '[PB] all modules ok');

    if (PB.memory && typeof PB.memory.observe === 'function') {
      PB.bus.on('*', function (payload, evt) {
        try { PB.memory.observe(evt, payload); } catch (e) {}
      });
    }

    if (PB.reminders && typeof PB.reminders.tick === 'function') {
      var tick = function () { try { PB.reminders.tick(); } catch (e) {} };
      tick();
      setInterval(tick, 15000);
      document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); });
    }

    if (PB.memory && typeof PB.memory.expireUnsaved === 'function') {
      var sweep = function () { try { PB.memory.expireUnsaved(); } catch (e) {} };
      sweep();
      setInterval(sweep, 60000);
    }

    PB.bus.on('data:erased', function () { go(HOME); });

    if (PB.profile && typeof PB.profile.isSetUp === 'function' && !PB.profile.isSetUp()) {
      try { PB.profile.showOnboarding(function () { go(HOME); }); }
      catch (e) { console.error('[PB] onboarding failed', e); }
    }

    // Always open in the conversation. Landing someone back on a settings sub-screen
    // because that's where they were last is not what an assistant should do.
    go(HOME);

    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (e) {
          console.log('[PB] no service worker (app still works):', e.message);
        });
      });
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

} catch (e) { console.error('[PB] module failed: js/app.js', e); }
</script>
</body>
</html>
