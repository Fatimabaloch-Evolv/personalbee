  /* ------------------------------------------------------------------ *
   * Knowledge-base retrieval — the general answer path
   *
   * PB.kb.search() has always ranked the whole of her life — contacts, events,
   * brands, routines, places, preferences, profile — against a free-text
   * query. Nothing in here ever called it. So BEE answered the phrasings that
   * happened to collide with a hand-written keyword and shrugged at everything
   * else, with the answer sitting right there in the KB. Every "I'm not sure"
   * path now comes through here first.
   * ------------------------------------------------------------------ */

  var DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  var KB_MIN = 1.0;          // below this, retrieval is noise, not an answer
  var KB_FOLLOW = 0.72;      // follow-ons must be close to the winner

  function daysPhrase(days) {
    var d = arr(days).filter(function (x) { return typeof x === 'number' && x >= 0 && x <= 6; });
    var uniq = [];
    d.forEach(function (x) { if (uniq.indexOf(x) === -1) uniq.push(x); });
    uniq.sort(function (a, b) { return a - b; });
    if (!uniq.length) return '';
    if (uniq.length === 7) return 'every day';
    if (uniq.join(',') === '1,2,3,4,5') return 'weekdays';
    if (uniq.join(',') === '0,6') return 'weekends';
    return joinList(uniq.map(function (x) { return DAY_NAMES[x] + 's'; }), 'and');
  }

  function timePhrase(hhmm) {
    var m = trim(hhmm).match(/^(\d{1,2}):(\d{2})/);
    if (!m) return '';
    var h = parseInt(m[1], 10), mi = m[2];
    if (isNaN(h)) return '';
    var ap = (h >= 12 && h < 24) ? 'pm' : 'am';
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    return h12 + (mi === '00' ? '' : ':' + mi) + ap;
  }

  /* "Reformer class Tuesday and Thursday mornings" -> "reformer class".
   * The days and the time are being said in the lead already; repeating them
   * is what made the old answers read like a data dump. */
  function labelCore(label) {
    var s = trim(label);
    if (!s) return '';
    s = s.replace(/\b(sun|mon|tues|tuesd|wednes|thurs|thursd|fri|satur)days?\b/gi, '');
    s = s.replace(/\b(mornings?|afternoons?|evenings?|nights?|weekdays?|weekends?)\b/gi, '');
    s = s.replace(/\s{2,}/g, ' ');
    // Removing the days leaves the words that joined them: "Posts main videos
    // Wednesday and Saturday" must not become "posts main videos and".
    s = s.replace(/\s*\b(and|or|&)\b\s*(?=[,;:–—-]|$)/gi, '');
    s = s.replace(/\b(usually|around|about|every|on|at|in)\b\s*$/gi, '');
    // A run of punctuation left behind by the removals collapses to one mark.
    s = s.replace(/[\s,;:]*[–—-][\s,;:–—-]*/g, ' — ').replace(/[\s,;:]{2,}/g, ', ');
    s = s.replace(/^[\s,;:–—-]+/, '').replace(/[\s,;:–—-]+$/, '');
    s = s.replace(/\s+([,;:])/g, '$1').replace(/\s{2,}/g, ' ');
    return trim(s);
  }

  /* labelCore output is a fragment inside a sentence, so it starts lowercase —
   * except when the first word is a name. */
  function deCap(s) {
    s = trim(s);
    if (!s) return s;
    var first = s.split(/\s+/)[0];
    if (/^[A-Z]{2,}$/.test(first)) return s;
    if (/^[A-Z][a-z]+$/.test(first) && /^[A-Z]/.test((s.split(/\s+/)[1] || ''))) return s;
    return s.charAt(0).toLowerCase() + s.slice(1);
  }

  function firstSentence(s) {
    var t = trim(s);
    if (!t) return '';
    var m = t.match(/^[^.!?]{4,140}[.!?]/);
    return trim(m ? m[0] : (t.length > 140 ? t.slice(0, 137) + '…' : t));
  }

  function endStop(s) {
    var t = trim(s);
    if (!t) return '';
    return /[.!?:…]$/.test(t) ? t : t + '.';
  }

  /* What kind of answer is she after? Retrieval alone puts "Coil Pilates" at
   * the top of "when do I go to pilates" — the right subject, the wrong fact. */
  function askShape(text) {
    var t = low(text);
    return {
      who: /\bwho\b|\bwhose\b/.test(t),
      where: /\bwhere\b/.test(t) ||
        /\b(?:what|which)\s+(?:gym|cafe|caf|coffee shop|studio|salon|place|spot|restaurant|store|shop|clinic|bar|market)\b/.test(t),
      howMany: /\bhow (?:many|much|big)\b/.test(t),
      when: /\bwhen\b|\bwhat time\b|\bwhat days?\b|\bwhich days?\b|\bhow often\b|\bschedule\b|\broutine\b|\bwhat.{0,12}\btime\b/.test(t)
    };
  }

  var SHAPE_BOOST = {
    who: { contact: 1.9, event: 0.9, place: 0.7, routine: 0.7, preference: 0.7, profile: 0.8, brand: 0.9, memory: 0.9 },
    where: { place: 1.9, event: 1.1, profile: 1.0, routine: 0.85, preference: 0.8, brand: 0.8, memory: 0.9, contact: 0.6 },
    howMany: { profile: 1.7, brand: 1.1, preference: 1.0, memory: 1.0, routine: 0.8, event: 0.8, place: 0.7, contact: 0.6 },
    when: { routine: 1.8, event: 1.25, preference: 1.15, profile: 1.1, memory: 1.0, brand: 0.9, place: 0.7, contact: 0.45 },
    none: { contact: 0.85, event: 0.95, brand: 1.0, routine: 1.0, place: 1.0, preference: 1.0, profile: 1.0, memory: 1.0 }
  };

  function shapeKey(shape) {
    if (shape.who) return 'who';
    if (shape.where) return 'where';
    if (shape.howMany) return 'howMany';
    if (shape.when) return 'when';
    return 'none';
  }

  function hitKey(h) {
    var it = h.item || {};
    return h.type + '::' + low(it.key || it.label || it.name || it.title || it.text || it.id || '');
  }

  function kbRank(text) {
    var raw = [];
    try { raw = arr(call(kb(), ['search'], [text], [])); } catch (e) { raw = []; }
    var shape = askShape(text);
    var boost = SHAPE_BOOST[shapeKey(shape)];
    var seen = {}, out = [];
    for (var i = 0; i < raw.length; i++) {
      var h = raw[i];
      if (!h || !h.item || typeof h.score !== 'number') continue;
      var k = hitKey(h);
      if (seen[k]) continue;              // recurring events repeat verbatim
      seen[k] = 1;
      out.push({ type: h.type, item: h.item, score: h.score * (boost[h.type] || 1) });
    }
    out.sort(function (a, b) { return b.score - a.score; });
    return { hits: out, shape: shape };
  }

  /* --- turning one hit into a sentence that answers, not a record dump --- */

  function prefValueText(v) {
    if (isArr(v)) return joinList(v.map(trim).filter(Boolean), 'and');
    if (v && typeof v === 'object') {
      var parts = [];
      for (var k in v) {
        if (!Object.prototype.hasOwnProperty.call(v, k)) continue;
        parts.push(k.replace(/([A-Z])/g, ' $1').toLowerCase() + ' ' + (isArr(v[k]) ? joinList(v[k]) : v[k]));
      }
      return joinList(parts, 'and');
    }
    return trim(v);
  }

  /* postingDays and postingTime are two rows answering one question. */
  function prefSibling(key) {
    var prefs = (kb() && kb().preferences) ? kb().preferences : null;
    if (!prefs || !/Days$/.test(key)) return '';
    var t = prefs[key.replace(/Days$/, 'Time')];
    return t ? trim(prefValueText(t)) : '';
  }

  function routineLead(it, shape) {
    var dp = daysPhrase(it.days), tp = timePhrase(it.time), core = labelCore(it.label);
    var hedge = (typeof it.confidence === 'number' && it.confidence < 0.55)
      ? ' That one\'s a pattern I think I see, not something you\'ve told me.' : '';
    if (shape.when && (dp || tp)) {
      var when = dp ? cap(dp) : '';
      if (tp) when += (when ? ', usually around ' + tp : 'Usually around ' + tp);
      if (core && core.split(/\s+/).length >= 2) when += ' — ' + deCap(core);
      return { lead: endStop(when) + hedge, extra: '' };
    }
    var lead = endStop(cap(trim(it.label)));
    var tail = [];
    if (dp) tail.push(dp);
    if (tp) tail.push('around ' + tp);
    return { lead: lead + (tail.length ? ' ' + endStop(cap(tail.join(', '))) : ''), extra: hedge ? trim(hedge) : '' };
  }

  function placeLead(it) {
    var head = trim(it.name) || 'A place';
    if (it.area) head += ', in ' + trim(it.area);
    return { lead: endStop(head), extra: firstSentence(it.notes) };
  }

  function preferenceLead(it) {
    var label = trim(it.label) || trim(it.key);
    var v = it.value;
    if (isArr(v) && v.length > 3) {
      return { lead: cap(label) + ':', bullets: v.slice(0, 6).map(trim) };
    }
    var val = prefValueText(v);
    if (!val) return null;
    var sib = prefSibling(it.key);
    if (sib) val += ', usually ' + (/^\d/.test(sib) ? 'around ' : '') + sib;
    if (val.length <= 80) return { lead: endStop(cap(val) + ' — your ' + label), extra: '' };
    return { lead: cap('your ' + label) + ': ' + endStop(val), extra: '' };
  }

  function profileLead(it) {
    var v = trim(it.value), k = it.key;
    if (!v) return null;
    if (k === 'wakeTime') return { lead: endStop('Usually up around ' + (timePhrase(v) || v)), extra: '' };
    if (k === 'sleepTime') return { lead: endStop('You\'re usually down around ' + (timePhrase(v) || v)), extra: '' };
    if (k === 'followers') return { lead: endStop('About ' + v.replace(/^[~≈]\s*/, '') + ' followers'), extra: '' };
    if (k === 'occupation') return { lead: endStop(cap(v)), extra: '' };
    if (k === 'city') return { lead: endStop('You\'re in ' + v), extra: '' };
    if (k === 'handle') return { lead: endStop(v + ' — that\'s your handle'), extra: '' };
    if (k === 'age') return { lead: endStop(v + ' — that\'s your age'), extra: '' };
    if (k === 'bio') return { lead: endStop(cap(firstSentence(v) || v)), extra: '' };
    return { lead: endStop(cap(trim(it.label) || k) + ': ' + v), extra: '' };
  }

  function brandLead(it) {
    var bits = [trim(it.name)];
    if (it.status) bits.push(it.status);
    var open = arr(it.deliverables).filter(function (d) { return d && !d.done; });
    var lead = endStop(bits.join(' — '));
    var extra = '';
    if (open.length) {
      var d = open[0];
      extra = endStop('Still open: ' + trim(d.what) + (d.dueDate ? ' (' + fmtDay(toDate(d.dueDate)) + ')' : ''));
    }
    return { lead: lead, extra: extra };
  }

  /* -> { lead, extra, bullets } or null */
  function kbLead(hit, shape) {
    if (!hit || !hit.item) return null;
    var it = hit.item;
    switch (hit.type) {
      case 'routine': return routineLead(it, shape);
      case 'place': return placeLead(it);
      case 'preference': return preferenceLead(it);
      case 'profile': return profileLead(it);
      case 'brand': return brandLead(it);
      case 'event': return { lead: endStop(cap(eventLine(it, true))), extra: firstSentence(it.notes) };
      case 'memory': return { lead: memoryLine(it), extra: '' };
      default: return null;
    }
  }

  /* One-liners for the "also matched" bullets. */
  function kbBullet(hit) {
    var it = hit.item;
    switch (hit.type) {
      case 'routine':
        var dp = daysPhrase(it.days), tp = timePhrase(it.time);
        return endStop(trim(it.label) + (dp || tp ? ' — ' + [dp, tp ? 'around ' + tp : ''].filter(Boolean).join(', ') : ''));
      case 'place': return endStop(trim(it.name) + (it.area ? ', ' + trim(it.area) : ''));
      case 'preference':
        var pv = prefValueText(it.value);
        return endStop(cap(trim(it.label) || it.key) + ': ' + (pv.length > 110 ? pv.slice(0, 107) + '…' : pv));
      case 'profile': return endStop(cap(trim(it.label)) + ': ' + trim(it.value));
      case 'event': return endStop(eventLine(it, true));
      case 'contact': return endStop(contactLine(it));
      case 'brand': return endStop(trim(it.name) + (it.status ? ' — ' + it.status : ''));
      case 'memory': return memoryLine(it);
      default: return '';
    }
  }

  var OVERLAP_STOP = { the: 1, a: 1, an: 1, and: 1, or: 1, of: 1, to: 1, in: 1, on: 1, at: 1, your: 1,
    you: 1, my: 1, is: 1, it: 1, that: 1, usually: 1, around: 1, about: 1 };

  function contentWords(s) {
    return low(s).replace(/[^a-z0-9\s]/g, ' ').split(/\s+/)
      .filter(function (w) { return w.length > 2 && !OVERLAP_STOP[w]; })
      .map(function (w) {
        // "posting"/"posts"/"post" have to count as the same word, or a
        // follow-on that only repeats the lead sneaks through.
        if (/ing$/.test(w) && w.length > 5) return w.slice(0, -3);
        if (/s$/.test(w) && !/ss$/.test(w)) return w.slice(0, -1);
        return w;
      });
  }

  /* Is this follow-on just the lead said again? */
  function saysTheSame(a, b) {
    var A = contentWords(a), B = contentWords(b);
    if (!A.length || !B.length) return false;
    var set = {}, i, hit = 0;
    for (i = 0; i < A.length; i++) set[A[i]] = 1;
    for (i = 0; i < B.length; i++) if (set[B[i]]) hit++;
    return (hit / Math.min(A.length, B.length)) >= 0.5;
  }

  function kbChips(type) {
    if (type === 'routine' || type === 'preference' || type === 'profile') {
      return [
        { label: 'What else do you know?', send: 'What do you know about me?' },
        { label: 'What\'s next?', send: 'What\'s next today?' }
      ];
    }
    return [{ label: 'What\'s next?', send: 'What\'s next today?' }];
  }

  function kbCard(hit) {
    if (!hit) return null;
    if (hit.type === 'event') return schedCard(fmtDay(toDate(hit.item.start)), toDate(hit.item.start), [hit.item]);
    if (hit.type === 'memory') return memCard([hit.item], 'recall');
    return null;
  }

  /* The whole point: answer the question from the knowledge base.
   * Returns a reply, or null when the KB genuinely has nothing. */
  function answerFromKB(text, parsed) {
    if (!trim(text) || !kb()) return null;

    var shape = askShape(text);
    var ranked = kbRank(text);
    var hits = ranked.hits;
    if (!hits.length) return null;

    // Role-shaped "who" questions — "who does my hair", "who edits my videos".
    // findContact already scores relationship/vibe/tags; it just was not asked.
    // Ranked search has to agree, so a stray word in someone's notes can't
    // put a random person's card up.
    if (shape.who && hits[0].type === 'contact' && hits[0].score >= KB_MIN) {
      var byRole = arr(call(kb(), ['findContact'], [text], []));
      for (var w = 0; w < byRole.length && w < 3; w++) {
        if (byRole[w] && byRole[w].id === hits[0].item.id) {
          state.lastPerson = firstName(byRole[w].name) || byRole[w].name;
          return describeContact(byRole[w], byRole.slice(0, 3), 'match', false, byRole.length > 1);
        }
      }
    }

    // A contact winning any other question shape is nearly always a stray
    // keyword in someone's notes. Let the next hit answer instead.
    var best = null, i;
    for (i = 0; i < hits.length; i++) {
      if (hits[i].type === 'contact' && !shape.who) continue;
      best = hits[i];
      break;
    }
    if (!best || best.score < KB_MIN) return null;

    var head = kbLead(best, shape);
    if (!head || !trim(head.lead)) return null;

    var lines = [trim(head.lead)];
    if (head.bullets) {
      head.bullets.forEach(function (b) { if (trim(b)) lines.push('· ' + endStop(cap(trim(b)))); });
    }
    if (trim(head.extra)) lines.push(trim(head.extra));

    // Follow-ons, only when something else genuinely matched too.
    if (!head.bullets) {
      var extras = [];
      for (i = 0; i < hits.length && extras.length < 2; i++) {
        var h = hits[i];
        if (h === best || h.score < best.score * KB_FOLLOW) continue;
        if (h.type === 'contact' && !shape.who) continue;
        var b = trim(kbBullet(h));
        if (!b || saysTheSame(lines.join(' '), b)) continue;
        extras.push(b);
      }
      if (extras.length) {
        lines.push('Also:');
        extras.forEach(function (x) { lines.push('· ' + x); });
      }
    }

    return reply(lines.join('\n'), kbChips(best.type), kbCard(best), []);
  }

  /* Just the headline fact, for prefixing an answer that would otherwise open
   * with a list. Returns '' unless retrieval is confident and specific. */
  function kbHeadline(text) {
    if (!trim(text) || !kb()) return '';
    var ranked = kbRank(text);
    var hits = ranked.hits;
    if (!hits.length) return '';
    var best = hits[0];
    if (best.type === 'contact' || best.type === 'memory' || best.type === 'event') return '';
    if (best.score < 1.8) return '';
    var head = kbLead(best, ranked.shape);
    if (!head || head.bullets || !trim(head.lead)) return '';
    return trim(head.lead);
  }

  /* Never a dead end. Every reply either does something, answers something,
   * or moves the conversation forward with a real question. No shrugs. */
  function hOpen(text, parsed) {
    var t = low(text);

    // 1. Is it actually a question we can answer from what she's told us?
    var fromMemory = answerFromMemory(text, parsed);
    if (fromMemory) return fromMemory;

    // 2. Is she telling me how she is? Offer to take something off, not add.
    if (/\b(tired|exhausted|long day|weird day|rough day|bad day|stressed|overwhelmed|burnt out|burned out|drained|knackered|wiped|fried|over it|can'?t sleep|anxious)\b/.test(t)) {
      var open = openReminders();
      var lines = ['Sounds like a lot.'];
      var chips = [];
      if (open.length) {
        lines.push('Want me to push ' + (open.length === 1 ? trim(open[0].text) : 'today\'s list') + ' to tomorrow, or leave you alone for a bit?');
        chips.push({ label: 'Push it to tomorrow', send: 'snooze ' + open[0].text + ' until tomorrow' });
        chips.push({ label: 'Leave it', send: 'leave it for now' });
      } else {
        lines.push('Nothing on your list is chasing you, at least. Anything you want off tomorrow before it gets here?');
        chips.push({ label: 'What\'s tomorrow?', send: 'What\'s on tomorrow?' });
      }
      return reply(lines.join(' '), chips, null, [], true);
    }

    // 2.5 Does her own knowledge base answer it? This has to run before the
    // keyword branches below — "who does my hair?" is a question with an
    // answer, not a prompt to explain how contact search works.
    if (isQuestion(text)) {
      var fromKB = answerFromKB(text, parsed);
      if (fromKB) return fromKB;
    }

    // 3. Is it near a capability? Say the useful thing, then ask something real.
    if (/remind|remember to|forget|don'?t let me|todo|to-do|task/.test(t)) {
      return reply(
        'I can put that on the list. What is it, and when do you want me to nudge you?',
        [{ label: 'Tonight', send: 'Remind me to ' }, { label: 'My reminders', send: 'What are my reminders?' }],
        null, [], true);
    }
    if (/today|tomorrow|tonight|schedule|calendar|free|busy|shoot|meeting/.test(t)) {
      var ev0 = nextEvent(now());
      return reply(
        ev0
          ? ('Next on the calendar is ' + (trim(ev0.title) || 'something') + ' — ' + fmtDay(toDate(ev0.start)) + ' at ' + fmtTime(toDate(ev0.start)) + '. Want the whole day, or just what\'s left?')
          : 'Your calendar is clear from here. Want me to check a specific day?',
        [{ label: 'Rest of today', send: 'What\'s on today?' }, { label: 'Tomorrow', send: 'What\'s on tomorrow?' }],
        null, [], true);
    }
    if (/who|him|her|guy|girl|met|number|contact|person/.test(t)) {
      return reply(
        'Describe them however you actually remember them — where you met, what they do, what they were wearing. I\'ll look.',
        [{ label: 'Who do you know?', send: 'Who do you know?' }],
        null, [], true);
    }
    if (/photo|picture|pic|shot|selfie|moment/.test(t)) {
      return reply(
        'I find photos by the note you wrote on them, not by looking at them. What did you call it?',
        [{ label: 'Open moments', send: 'Show my moments' }],
        null, [], true);
    }
    if (/brand|deal|deliverable|invoice|paid|due|client|rate|money/.test(t)) {
      return reply(
        'I can tell you what\'s outstanding on the brand side and when it\'s due. Want that now?',
        [{ label: 'What\'s outstanding?', send: 'What brand work is outstanding?' }],
        null, [], true);
    }
    if (/private|data|secure|leave|cloud|track|listening|spying/.test(t)) {
      return hTrustQuery();
    }

    // 3. Genuinely open-ended. Say something true about right now and ask.
    return openEnded(text);
  }

  var OPENERS = [
    'Not sure what you\'re after there.',
    'I don\'t have a read on that one.',
    'That one\'s past me.',
    'You\'ll have to give me a bit more.'
  ];
  var openerAt = 0;

  function nextOpener() {
    var s = OPENERS[openerAt % OPENERS.length];
    openerAt++;
    return s;
  }

  /* The honest fallback. Anchored in something real when there is something
   * real; plainly empty-handed when there isn't. */
  function openEnded(text) {
    var name = userName();
    var over = overdueReminders();

    var lines = [];
    var chips = [];

    // Barely any signal at all — don't pretend to interpret it.
    if (trim(text).replace(/[^a-z0-9]/gi, '').length < 3) {
      var evNow = nextEvent(now());
      return reply(
        evNow && sameDay(toDate(evNow.start), now())
          ? ('Say more? Meanwhile: ' + (trim(evNow.title) || 'your next thing') + ' is ' + fmtRelative(toDate(evNow.start)) + '.')
          : 'Say more? I\'m listening.',
        [
          { label: 'What\'s next?', send: 'What\'s next today?' },
          { label: 'My reminders', send: 'What are my reminders?' }
        ], null, [], true);
    }

    // A question BEE cannot answer gets said plainly. Pivoting to whatever is
    // next on the calendar reads as evasion — it answers a question she did
    // not ask, and it hides the fact that BEE came up empty.
    if (isQuestion(text)) {
      lines.push('I don\'t have anything on that. You could tell me and I\'ll keep it.');
      chips.push({ label: 'What do you know about me?', send: 'What do you know about me?' });
      chips.push({ label: 'What can you do?', send: 'What can you do?' });
      return reply(lines.join('\n'), chips, null, [], true);
    }

    if (over.length) {
      lines.push(nextOpener() + ' But ' + trim(over[0].text) + ' is still sitting past its time — want to knock it out, or push it?');
      chips.push({ label: 'Done with it', send: 'done with ' + over[0].text });
      chips.push({ label: 'Push it an hour', send: 'snooze ' + over[0].text + ' 60 minutes' });
    } else {
      var mem = memRecall('');
      if (mem.length) {
        lines.push(nextOpener() + ' Ask me about your day, your list, or anyone you\'ve mentioned — I\'ve got ' +
          mem.length + ' thing' + (mem.length === 1 ? '' : 's') + ' on you so far. What\'s on your mind' + (name ? ', ' + name : '') + '?');
        chips.push({ label: 'What do you know about me?', send: 'What do you know about me?' });
      } else {
        lines.push(nextOpener() + ' Tell me something — a name, a plan, a thing you keep forgetting — and I\'ll hold onto it.');
        chips.push({ label: 'What can you do?', send: 'What can you do?' });
      }
      chips.push({ label: 'What\'s next?', send: 'What\'s next today?' });
    }

    return reply(lines.join('\n'), chips, null, [], true);
  }

  /* ------------------------------------------------------------------ *
   * Pending-reminder follow-up ("when?" -> "tonight")
   * ------------------------------------------------------------------ */

  function resolvePending(text, parsed) {
    var p = state.pending;
    if (!p) return null;
    if (now().getTime() - p.askedAt > PENDING_TTL) { state.pending = null; return null; }

    var t = low(trim(text));

    if (/^(never ?mind|nevermind|cancel|forget it|drop it|no thanks|nope)\b/.test(t)) {
      state.pending = null;
      return reply('Dropped it. Nothing saved.', DEFAULT_CHIPS.slice(), null, []);
    }

    if (p.kind === 'reminder.time') return resolveReminderTime(p, text, parsed, t);
    if (p.kind === 'contact.which') return resolveWhichContact(p, text, t);
    if (p.kind === 'forget.confirm') return resolveForgetConfirm(p, text, t);
    return null;
  }

  function resolveReminderTime(p, text, parsed, t) {
    if (/no time|whenever|no rush|just remember|someday|doesn'?t matter/.test(t)) {
      var r0 = createReminder(p.task, null, 'no time set', null);
      rememberReminder(r0);
      return reply('Saved without a time — ' + p.task + '. It\'ll sit on the list until you want it.',
        [{ label: 'Give it a time', send: 'Remind me to ' + p.task + ' tomorrow at 10am' },
        { label: 'My reminders', send: 'What are my reminders?' }],
        remCard([r0], 'New reminder'), ['Created reminder']);
    }

    var e = ents(parsed);
    var due = toDate(e.datetime);
    var dueText = trim(e.datetimeText);
    var rec = e.recurrence || null;

    if (!due && !rec) {
      var g = parseWhen(text);
      if (g) { due = toDate(g.date); dueText = dueText || trim(g.text); rec = rec || g.recurrence || null; }
    }
    if (!due && !rec) return null;   // not a time answer — fall through to normal routing

    // Long messages are probably a new request, not just a time.
    if (trim(text).split(/\s+/).length > 8 && parsed && parsed.intent && parsed.intent !== 'reminder.create' &&
      parsed.intent !== 'unknown' && parsed.intent !== 'smalltalk') {
      return null;
    }

    var r = createReminder(p.task, due, dueText || trim(text), rec);
    rememberReminder(r);
    return reply(confirmReminder(r),
      [{ label: 'Show my reminders', send: 'What are my reminders?' }, { label: 'Add another', send: 'Remind me to ' }],
      remCard([r], 'New reminder'), ['Created reminder']);
  }

  /* "the second one" / "Elena" — answering a which-person question. */
  function resolveWhichContact(p, text, t) {
    var cands = arr(p.candidates);
    if (!cands.length) { state.pending = null; return null; }

    var pick = null;
    if (/\b(first|1st|one)\b/.test(t)) pick = cands[0];
    else if (/\b(second|2nd|two)\b/.test(t)) pick = cands[1];
    else if (/\b(third|3rd|three)\b/.test(t)) pick = cands[2];
    if (!pick) {
      for (var i = 0; i < cands.length; i++) {
        var c = cands[i].contact || cands[i];
        if (!c) continue;
        if (low(text).indexOf(low(firstName(c.name))) !== -1) { pick = cands[i]; break; }
      }
    }
    if (!pick) return null;
    state.pending = null;
    var chosen = pick.contact || pick;
    state.lastPerson = firstName(chosen.name) || chosen.name;
    return describeContact(chosen, cands, 'match');
  }

  function resolveForgetConfirm(p, text, t) {
    if (/^(yes|yep|yeah|do it|go ahead|please|sure|ok|okay)\b/.test(t)) {
      state.pending = null;
      var n = memForgetAbout(p.subject);
      if (!n) {
        return reply('Nothing left to drop on that.', DEFAULT_CHIPS.slice(), memCard([], 'empty'), []);
      }
      return reply(
        'Gone — ' + n + ' thing' + (n === 1 ? '' : 's') + ' about ' + p.subject + '. Off this phone, not archived anywhere.',
        [{ label: 'What else do you have?', send: 'What have you noticed about me?' }],
        memCard(memRecall(''), 'forgot'),
        ['Forgot ' + n + ' memories']
      );
    }
    return null;
  }

  /* ------------------------------------------------------------------ *
   * Local router
   * ------------------------------------------------------------------ */

  /* The NLU is good but not perfect. When it lands on 'unknown', try a cheap
   * keyword rescue before falling back to the catch-all — a demo should not
   * shrug at "what do you store about me?". */
  function rescueIntent(text) {
    var t = low(text);
    if (/(what|which|anything).*(store|storing|keep|keeping|save|saved|hold|holding).*(me|my|about)/.test(t) ||
      /\b(privacy|private|data|secure|security)\b/.test(t) ||
      /(leave|leaves|leaving|sent|send|goes|go).*(phone|device|here|cloud|server|internet)/.test(t) ||
      /are you (tracking|watching|listening|recording|spying)/.test(t) ||
      /(delete|erase|wipe) (everything|it all|my data)/.test(t) ||
      /(offline|airplane mode)/.test(t)) return 'trust.query';

    // A request for judgement. Answering it with a list is the failure this
    // path exists to stop, so it gets rescued before the list intents do.
    if (/(what|which).{0,24}(should|shall) i (do|start|tackle|focus|work|prioriti[sz]e)/.test(t) ||
      /most (productive|important|urgent|pressing)/.test(t) ||
      /what (would|should) you do\b/.test(t) ||
      /where (should|do) i (start|begin)/.test(t) ||
      /what (matters|needs doing|needs my attention)/.test(t) ||
      /\b(top |biggest |first )?priorit(y|ies|ise|ize)\b/.test(t) ||
      /help me (plan|prioriti[sz]e|organi[sz]e) (my|the)/.test(t) ||
      /(am i|are we) forgetting (anything|something)/.test(t) ||
      /best use of my (time|day)/.test(t)) return 'advice.priority';

    if (/what can you (do|help)|what are you (for|good at)|how do i use you|what do you do\b|help me out|your (features|abilities)/.test(t)) return 'capability.query';
    if (/^(remind|remember to)\b|don'?t let me forget/.test(t)) return 'reminder.create';
    if (/(what|anything).*(reminder|on my list|to do|todo)/.test(t)) return 'reminder.list';
    if (/what('?s| is) (on|up|next|happening)|my (day|schedule|calendar)|am i (free|busy)|what do i have/.test(t)) {
      return /next\b/.test(t) ? 'schedule.next' : 'schedule.query';
    }
    if (/(who|what)('?s| is| was| were)? ?(that|the)? ?(guy|girl|person|man|woman|one)\b|who('?s| is| was) [a-z]/.test(t)) return 'contact.find';
    if (/(brand|deal|deliverable|client|invoice|outstanding|due)\b/.test(t)) return 'brand.query';
    if (/(photo|picture|pic|shot|moment)\b/.test(t)) return 'photo.recall';
    if (/(what have you|what do you) (noticed|notice|learned|learnt|know|remember)/.test(t)) return 'memory.recall';
    if (/^forget (that|about)?\b/.test(t)) return 'memory.forget';
    // "what's my sister's name" / "when is mom's birthday" — a question about
    // something she told us, which the NLU has no reason to recognise.
    if (isQuestion(text) && (REL_RE.test(t) || /\bmy [a-z' -]{2,24}\b/.test(t))) return 'memory.recall';
    return null;
  }

  function routeLocal(text, parsed) {
    var intent = (parsed && parsed.intent) ? parsed.intent : 'unknown';

    var rescued = false;
    if (intent === 'unknown') {
      var r = rescueIntent(text);
      if (r) { intent = r; rescued = true; }
    }

    // Honour NLU's own clarify question only when it's a *specific* one about
    // an intent it recognised. Its generic "I didn't quite catch that" is the
    // exact shrug this brain exists to avoid — that goes to hOpen instead.
    if (!rescued && parsed && parsed.needsClarification && trim(parsed.clarifyQuestion) &&
      intent !== 'unknown' && intent !== 'smalltalk' && intent !== 'reminder.create' &&
      !/didn'?t (quite )?catch|not sure what you mean|say that again/i.test(parsed.clarifyQuestion) &&
      (parsed.confidence === undefined || parsed.confidence < 0.6)) {
      return reply(trim(parsed.clarifyQuestion), DEFAULT_CHIPS.slice(), null, [], true);
    }

    var out = dispatch(intent, text, parsed);

    // A thin reply to a real question, when the KB holds the answer, is the
    // failure the whole retrieval path exists to stop. Every handler gets the
    // same safety net, not just the catch-all.
    if (isQuestion(text) && (!out || out._soft === true)) {
      var kbAns = null;
      try { kbAns = answerFromKB(text, parsed); } catch (e) { kbAns = null; }
      if (kbAns) return kbAns;
    }
    return out;
  }

  function dispatch(intent, text, parsed) {
    switch (intent) {
      case 'reminder.create': return hReminderCreate(text, parsed);
      case 'reminder.list': return hReminderList(text, parsed);
      case 'reminder.complete': return hReminderComplete(text, parsed);
      case 'reminder.snooze': return hReminderSnooze(text, parsed);
      case 'schedule.query': return hScheduleQuery(text, parsed);
      case 'schedule.next': return hScheduleNext(text, parsed);
      case 'advice.priority': return hPriority(text, parsed);
      case 'contact.find': return hContactFind(text, parsed);
      case 'brand.query': return hBrandQuery(text, parsed);
      case 'memory.recall': return answerFromMemory(text, parsed) || hMemoryRecall(text, parsed);
      case 'memory.forget': return hMemoryForget(text, parsed);
      case 'photo.recall': return hPhotoRecall(text, parsed);
      case 'photo.note': return hPhotoNote(text, parsed);
      case 'trust.query': return hTrustQuery(text, parsed);
      case 'capability.query': return hCapabilityQuery(text, parsed);
      case 'gratitude': return hGratitude(text, parsed);
      case 'smalltalk': return hSmalltalk(text, parsed);
      default:
        // A question about her that the NLU didn't recognise is still a
        // question. Try memory before falling through to open conversation.
        if (isQuestion(text)) {
          var fromMem = answerFromMemory(text, parsed);
          if (fromMem) return fromMem;
        }
        return hOpen(text, parsed);
    }
  }

  /* ------------------------------------------------------------------ *
   * Claude API path (optional)
   * ------------------------------------------------------------------ */

  function cloudAvailable() {
    return !!getKey() && !isAirplane();
  }

  function statusOf() {
    var key = !!getKey();
    var air = isAirplane();
    if (!key) {
      return { cloud: false, reason: 'No API key saved — every reply is written on this phone.', hasKey: false, airplane: air };
    }
    if (air) {
      return { cloud: false, reason: 'Airplane mode is on — nothing leaves this phone, so replies are local.', hasKey: true, airplane: true };
    }
    return { cloud: true, reason: 'Claude is on. Open-ended replies leave this phone; reminders and privacy stay local.', hasKey: true, airplane: false };
  }

  /* Anything conversational or open-ended goes to Claude when it's available.
   * Anything with a side effect, or anything privacy-critical, stays local and
   * deterministic — the model never gets to invent those. */

    'reminder.create': 1, 'reminder.list': 1, 'reminder.complete': 1, 'reminder.snooze': 1,
    'memory.forget': 1, 'trust.query': 1, 'photo.note': 1
  };

  function shouldAskClaude(parsed, local) {
    if (!cloudAvailable()) return false;
    if (!local || typeof local !== 'object') return false;
    if (arr(local.did).length) return false;              // something actually happened — don't paraphrase it
    if (state.pending) return false;                       // mid-slot-fill: stay deterministic

    var intent = (parsed && parsed.intent) ? parsed.intent : 'unknown';
    if (LOCAL_ONLY[intent]) return false;

    // A thin local reply always wants help.
    if (local._soft === true) return true;

    // So does anything genuinely conversational, even when local had an answer.
    if (intent === 'smalltalk' || intent === 'gratitude' || intent === 'unknown') return true;

    return false;
  }

  function clip(s, n) {
    s = trim(s);
    if (s.length <= n) return s;
    return s.slice(0, n - 1) + '…';
  }

  /* Compact serialization of the relevant slice of Maya's life. */
  function buildContext(intent) {
    var out = [];
    var p = profile();

    var who = [];
    if (p.name) who.push(p.name);
    if (p.age) who.push(p.age);
    if (p.pronouns) who.push(p.pronouns);
    if (p.occupation) who.push(p.occupation);
    if (p.city) who.push(p.city);
    if (who.length) out.push('USER: ' + who.join(', ') + '.');
    if (p.voice && (p.voice.addressAs || p.voice.tone)) {
      out.push('ADDRESS HER AS: ' + (p.voice.addressAs || firstName(p.name)) +
        (p.voice.tone ? ('. Tone she likes: ' + p.voice.tone) : '') + '.');
    }

    var n = now();
    out.push('RIGHT NOW: ' + fmtDay(n) + ', ' + fmtTime(n) + '.');

    // Schedule
    var today = eventsOn(n);
    if (today.length) {
      out.push('TODAY: ' + today.slice(0, 5).map(function (e) {
        return fmtTime(toDate(e.start)) + ' ' + trim(e.title) + (e.location ? ' @ ' + e.location : '');
      }).join(' | '));
    } else {
      out.push('TODAY: nothing on the calendar.');
    }
    var nxt = nextEvent(n);
    if (nxt && !today.length) out.push('NEXT EVENT: ' + eventLine(nxt, true));

    // Reminders
    var open = openReminders().sort(byDue).slice(0, 6);
    if (open.length) {
      out.push('OPEN REMINDERS: ' + open.map(function (r) {
        var d = toDate(r.due);
        return r.text + (d ? ' (' + fmtDay(d) + ' ' + fmtTime(d) + ')' : ' (no time)');
      }).join(' | '));
    } else {
      out.push('OPEN REMINDERS: none.');
    }

    // Contacts (short)
    var contacts = (kb() && isArr(kb().contacts)) ? kb().contacts : [];
    if (contacts.length && (intent === 'contact.find' || intent === 'unknown' || intent === 'smalltalk')) {
      out.push('PEOPLE: ' + contacts.slice(0, 10).map(function (c) {
        return c.name + (c.relationship ? ' (' + c.relationship + ')' : '') + (c.vibe ? ' — ' + clip(c.vibe, 60) : '');
      }).join(' | '));
    }

    // Brands
    var brands = (kb() && isArr(kb().brands)) ? kb().brands : [];
    if (brands.length) {
      var rows = brands.filter(function (b) { return b && b.status !== 'delivered'; }).slice(0, 5).map(function (b) {
        var openD = arr(b.deliverables).filter(function (d) { return d && !d.done; });
        return b.name + ' [' + (b.status || 'active') + ']' +
          (openD.length ? ' outstanding: ' + openD.slice(0, 3).map(function (d) {
            var dd = toDate(d.dueDate);
            return d.what + (dd ? ' due ' + fmtDay(dd) : '');
          }).join('; ') : ' nothing outstanding');
      });
      if (rows.length) out.push('BRAND WORK: ' + rows.join(' | '));
    }

    // The local ranking. If this ever goes to Claude, it must not re-derive the
    // order — the deterministic answer is the one that has to be right.
    if (intent === 'advice.priority') {
      var ranked = [];
      try { ranked = gatherPriorities(); } catch (e) { ranked = []; }
      if (ranked.length) {
        out.push('BEE\'S RANKING (already worked out locally — keep this order and these reasons):\n' +
          ranked.slice(0, 6).map(function (it, i) {
            return (i + 1) + '. ' + it.what + ' — ' + it.when + ' [' + it.severity + '] — ' + it.why;
          }).join('\n'));
      } else {
        out.push('BEE\'S RANKING: nothing to rank. Say so plainly and offer to start holding things.');
      }
    }

    // Preferences
    var prefs = (kb() && kb().preferences) ? kb().preferences : null;
    if (prefs) {
      var pbits = [];
      for (var k in prefs) {
        if (!Object.prototype.hasOwnProperty.call(prefs, k)) continue;
        var v = prefs[k];
        if (v == null) continue;
        if (isArr(v)) { if (v.length) pbits.push(k + ': ' + v.slice(0, 4).join(', ')); }
        else if (typeof v === 'object') { pbits.push(k + ': ' + JSON.stringify(v)); }
        else pbits.push(k + ': ' + v);
        if (pbits.length >= 8) break;
      }
      if (pbits.length) out.push('PREFERENCES: ' + pbits.join(' | '));
    }

    // Memory — treat anything flagged as a guess as a guess.
    var memText = memoryContextText(intent);
    if (!memText) {
      var mem = memoryItems().slice(0, 6);
      if (mem.length) {
        memText = mem.map(function (m) {
          var c = (typeof m.confidence === 'number') ? (' [' + Math.round(m.confidence * 100) + '%]') : '';
          return '- ' + clip(m.text, 100) + c;
        }).join('\n');
      }
    }
    if (memText) {
      out.push('WHAT BEE HAS NOTICED (confidence labels are real — never state a guess as fact):\n' + clip(memText, 1400));
    }

    // Things she said out loud. These outrank anything inferred.
    var told = call(PB.memory, ['told'], [12], null);
    if (!isArr(told)) {
      told = memoryItems().filter(function (m) {
        return m && (low(m.source) === 'told' || low(m.source) === 'user' || low(m.source) === 'chat');
      });
    }
    told = arr(told).filter(function (m) { return m && m.text; });
    if (told.length) {
      out.push('SHE TOLD ME THIS HERSELF (treat as fact, quote it back accurately):\n' +
        told.slice(0, 12).map(function (m) { return '- ' + clip(trim(m.text), 120); }).join('\n'));
    }

    // Routines
    var routines = (kb() && isArr(kb().routines)) ? kb().routines : [];
    if (routines.length) {
      out.push('ROUTINES: ' + routines.slice(0, 5).map(function (r) {
        var c = (typeof r.confidence === 'number') ? (' [' + Math.round(r.confidence * 100) + '%]') : '';
        return r.label + (r.time ? ' @' + r.time : '') + c;
      }).join(' | '));
    }

    return out.join('\n');
  }

  function systemPrompt(intent, learned) {
    var name = userName() || 'her';
    var extra = [];

    learned = arr(learned).filter(function (m) { return m && m.text; });
    if (learned.length) {
      extra.push('');
      extra.push('SHE JUST TOLD YOU THIS AND IT IS ALREADY SAVED AND ALREADY CONFIRMED BACK TO HER:');
      learned.forEach(function (m) { extra.push('- ' + trim(m.text)); });
      extra.push('Do NOT say you have saved or noted it — that line is already in the reply above yours. ' +

    if (state.lastPerson) extra.push('', 'LAST PERSON SHE MENTIONED: ' + state.lastPerson + ' — "he/she/they" almost certainly means them.');
    if (state.lastReminder && trim(state.lastReminder.text)) {
      extra.push('LAST REMINDER SHE MADE: ' + trim(state.lastReminder.text) +
        (state.lastReminder.due ? (' — ' + fmtDay(toDate(state.lastReminder.due)) + ' ' + fmtTime(toDate(state.lastReminder.due))) : ' — no time') +

      'You have been watching her phone for a few weeks — you know her the way an attentive friend would after a short while, not the way a database would.',
      '',
      'VOICE — follow this exactly:',
      '- Warm and brief. Short sentences. Two or three at most, unless she asked for a list.',
      '- Confirm back what you heard before acting or answering.',
      '- Honest about uncertainty. If something is a guess, say it is a guess. Never claim certainty you have not earned.',
      '- Never bubbly-fake, never a cheerleader, no exclamation marks stacked up.',
      '- At most one emoji in a reply, and only when it genuinely earns its place. Usually zero.',
      '- Use her name (' + name + ') sparingly — at most once, and not in every message.',
      '- Plain text only. No markdown headers, no bold, no code fences. A "· " bullet line is fine for lists.',
      '- Do not include internal or system XML tags in your response.',
      '',
      'HARD RULES — the important one first:',
      '- NEVER invent a fact about her. Every person, event, brand, deadline, habit, preference and name you state must appear verbatim in the CONTEXT below.',
      '- If the context does not cover it, say plainly that you do not have it, and ask her. That is a good answer, not a failure.',
      '- Never state a guess as a fact. Anything marked [guess] or with a low confidence is a guess — say so.',
      '- You cannot send messages, post, email, browse, or take any action in the world. You can only answer, and the app itself handles reminders, memory and privacy.',
      '- Do not promise to do anything later. You do not run in the background.',
      '- End with a real question or a real next step when the conversation is open — never a menu of features.',
      '',
      'CONTEXT (everything you know about her — nothing else is real):',

  function historyMessages(history) {
    var out = [];
    arr(history).slice(-8).forEach(function (h) {
      if (!h) return;
      var role = low(h.role || h.from || h.who || h.speaker);
      var t = trim(h.text || h.content || h.message);
      if (!t) return;
      var r = (role === 'bee' || role === 'assistant' || role === 'bot') ? 'assistant' : 'user';
      if (out.length && out[out.length - 1].role === r) {
        out[out.length - 1].content += '\n' + t;
      } else {
        out.push({ role: r, content: clip(t, 600) });
      }
    });
    // Conversation must start on a user turn.
    while (out.length && out[0].role !== 'user') out.shift();
    return out;
  }

  function postMessages(body) {
    return new Promise(function (resolve) {
      var key = getKey();
      if (!key || isAirplane()) { resolve(null); return; }
      if (typeof fetch !== 'function') { resolve(null); return; }

      var ctrl = null, timer = null;
      try { if (typeof AbortController === 'function') ctrl = new AbortController(); } catch (e) { ctrl = null; }
      var settled = false;
      function done(v) {
        if (settled) return;
        settled = true;
        if (timer) { try { clearTimeout(timer); } catch (e) { } }
        resolve(v);
      }
      if (ctrl) {
        timer = setTimeout(function () {
          try { ctrl.abort(); } catch (e) { }
          done(null);
        }, TIMEOUT_MS);
      } else {
        timer = setTimeout(function () { done(null); }, TIMEOUT_MS);
      }

      var opts = {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'x-api-key': key,
          'anthropic-version': API_VERSION,
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify(body)
      };
      if (ctrl) opts.signal = ctrl.signal;

      try {
        fetch(API_URL, opts).then(function (res) {
          if (!res || !res.ok) { done(null); return null; }
          return res.json();
        }).then(function (data) {
          if (!data) { done(null); return; }
          // A classifier decline comes back HTTP 200 — check before reading content.
          if (data.stop_reason === 'refusal') { done(null); return; }
          var parts = arr(data.content).filter(function (b) { return b && b.type === 'text' && b.text; })
            .map(function (b) { return b.text; });
          var t = trim(parts.join('\n'));
          done(t ? t : null);
        })['catch'](function () { done(null); });
      } catch (e) { done(null); }
    });

  function askClaude(text, parsed, history, learned) {
    var msgs = historyMessages(history);
    msgs.push({ role: 'user', content: clip(text, 2000) });
    if (!msgs.length) return Promise.resolve(null);

    return postMessages({
      model: MODEL,
      max_tokens: MAX_TOKENS,
      system: systemPrompt(parsed && parsed.intent, learned),
      // Thinking is on by default on this model and shares the max_tokens
      // budget, which truncates the reply. Off, at low effort, keeps it snappy.
      thinking: { type: 'disabled' },
      output_config: { effort: 'low' },
      messages: msgs

  /* ------------------------------------------------------------------ *
   * Vision
   * ------------------------------------------------------------------ */

  function splitDataUrl(dataUrl) {

    var media = m[1].toLowerCase();

    var allowed = { 'image/jpeg': 1, 'image/png': 1, 'image/gif': 1, 'image/webp': 1 };
    if (!allowed[media]) return null;
    if (!m[2]) return null;
    return { media_type: media, data: m[2] };
  }

      'You label photos for a personal assistant called BEE.',
      'Reply with exactly one line in this format and nothing else:',
      '<short phrase, 2 to 6 words, lowercase> :: <confidence between 0 and 1>',
